<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logo 3D</title>
  <!-- Logo in 3D (WebGL, three.js r128): Das Logo wird beim Laden automatisch in Teile zerlegt – Streifenbild nach
       zusammenhängenden Flächen, Textbild nach Buchstaben-Spalten – und jedes Teil bekommt Dicke.
       Ablauf wie logo.html: Streifen wirbeln einzeln herein und stellen sich auf, Buchstaben fallen beim Start mit
       Salto herein, wippen, Glanz; Streifen kippen einzeln weg, Lauflicht, springen wieder auf, Glanz, wieder weg,
       Pause `pause` s, von vorn. Bei Alerts startet alles neu.
       URL: lines, text (Dateien in assets/, wie logo.html), pause (s, Standard 10), speed (ms je Streifen, Standard 200),
       idle (loop|off – off: nach dem ersten Aufbau stehen bleiben),
       intro (1|0), alerts (1|0), glow (off|theme|purple|gold|Hex, Standard off). Größe = Browser-Source, das Logo passt sich ein. -->
  <link rel="stylesheet" href="_theme.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <script src="../js/vendor/three-r128.min.js"></script>
  <script src="../js/vendor/three-r128-RoomEnvironment.js"></script>
  <script>
    (function () {
      'use strict';
      var P = new URLSearchParams(location.search);
      var LINES = P.get('lines') || 'logo_lines_blue_t.png', TEXT = P.get('text') || 'logo_text_luckor_hd.png';
      var PAUSE = Math.max(3, parseFloat(P.get('pause')) || 10), IDLE = P.get('idle') === 'off' ? 'off' : 'loop';
      var INTRO = P.get('intro') !== '0', AT = parseFloat(P.get('at'));
      var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

      var ACC = col('--theme-accent', '#f2b705'), PRI = col('--theme-primary', '#5e2a79');
      var glowP = (P.get('glow') || 'off').replace(/^#?([0-9a-f]{6})$/i, '#$1');
      var GLOW_A = glowP === 'gold' ? new THREE.Color('#f2b705') : glowP === 'purple' ? new THREE.Color('#5e2a79') : /^#/.test(glowP) ? new THREE.Color(glowP) : PRI;
      var GLOW_B = glowP === 'theme' ? ACC : GLOW_A;

      var canvas = document.getElementById('gl'), r;
      try { r = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true, preserveDrawingBuffer: !isNaN(AT) }); } catch (e) { console.error('logo-3d: no WebGL'); return; }
      r.setPixelRatio(1); r.setClearColor(0x000000, 0); r.autoClear = false;
      var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, 10, 50000);
      if (THREE.RoomEnvironment) scene.environment = new THREE.PMREMGenerator(r).fromScene(new THREE.RoomEnvironment(), 0.04).texture;
      var amb = new THREE.AmbientLight(0xffffff, 0.35); amb.layers.enableAll(); scene.add(amb);
      var keyL = new THREE.DirectionalLight(0xffffff, 1.2); keyL.position.set(-400, 600, 900); keyL.layers.enableAll(); scene.add(keyL);

          im.onerror = function () { console.error('logo-3d: image not loaded', f); ok(null); };
          im.src = '../assets/' + f;

      // Arbeitsauflösung: längste Seite höchstens 2048 px

          // Farbe = Mittel der Kernpixel (ohne Glanzlichter/Schatten)

          var med = 0, acc = 0; for (var hv = 0; hv < 256; hv++) { acc += hist[hv]; if (acc >= hn / 2) { med = hv; break; } }
          var amax = med, thr = 60, ty = -1, by = -1, rs = 0, gs = 0, bs = 0, cn = 0, as = 0;
          for (y = y0; y <= y1; y++) for (x = x0; x <= x1; x++) {
            var q = y * w + x; if (lab[q] !== id || a[q * 4 + 3] < thr) continue;
            as += a[q * 4 + 3];
            if (ty < 0) ty = y; by = y;
            var L = a[q * 4] + a[q * 4 + 1] + a[q * 4 + 2];
            if (L > 60 && L < 660) { rs += a[q * 4]; gs += a[q * 4 + 1]; bs += a[q * 4 + 2]; cn++; }
          }
          function span(yy) { var mn = w, mx = -1; for (var xq = x0; xq <= x1; xq++) { var qq = yy * w + xq; if (lab[qq] === id && a[qq * 4 + 3] >= thr) { if (xq < mn) mn = xq; if (xq > mx) mx = xq; } } return [mn, mx]; }

      }

      /* Textbild: Buchstaben über Spalten mit hellen, deckenden Pixeln (volle Auflösung); jede Spalte bekommt alles zwischen

          var c = document.createElement('canvas'); c.width = cuts[i + 1] - cuts[i]; c.height = bot - top + 1;
          c.getContext('2d').drawImage(px.c, cuts[i], top, c.width, c.height, 0, 0, c.width, c.height);
          return { c: c, x0: cuts[i], y0: top };
        });

      // Schatten je Buchstabe, aus dem Buchstaben selbst gebaut: seine Form schwarz, weichgezeichnet und um den Versatz

      }
      function letterShadow(p, look) {
        var blur = Math.max(2, p.c.height * 0.035), pad = Math.ceil(blur * 3 + Math.max(Math.abs(look.dx), Math.abs(look.dy)));
        var c = document.createElement('canvas'); c.width = p.c.width + pad * 2; c.height = p.c.height + pad * 2;
        var x = c.getContext('2d'); x.filter = 'blur(' + blur.toFixed(1) + 'px)';

      // ── Buchstaben als echte 3D-Körper ──

        p.sides.forEach(function (m) { m.material.opacity = fade; m.visible = fade > 0.02; });
        p.front.visible = fade > 0.002;
      }
      function frame() {
        var t = now();
        nS = 0; nT = 0; parts.forEach(function (p) { if (p.kind === 1) nT++; else if (p.kind === 0) nS++; });
        var o = plan(), c = cycleTime(t - tIntro), sh = shineAt(c, o);
        parts.forEach(function (p) { pose(p, t, c, o, sh); });
        if (halo) {
          var on = ease((t - tIntro - 0.3) / 1.2);
          halo.material.uniforms.uK.value = on * (0.35 + 0.15 * Math.sin(t * 2.5));
          halo.material.uniforms.uMix.value = 0.5 + 0.5 * Math.sin(t * 2.5);
        }
        // fest leicht von oben und schräg: so sieht man Ober- und Seitenflächen (kein Hin- und Herwippen)
        root.rotation.x = -0.12; root.rotation.y = 0.08;
        // zwei Durchgänge: erst Streifen, dann Tiefenpuffer leeren und die Buchstaben-Körper – so liegen die Buchstaben
        // immer vorn (auch wenn Streifen sich drehen), haben aber unter sich korrekte Tiefe (Fase, Flanken)
        r.clear(); cam.layers.set(0); r.render(scene, cam); r.clearDepth(); cam.layers.set(1); r.render(scene, cam);
        tLast = t;
        if (isNaN(AT)) requestAnimationFrame(frame);
      }
      if (isNaN(AT)) requestAnimationFrame(frame);

      // Alerts: Intro neu abspielen (gleiche Befehle wie die Alert-Sources), nur über die Token-URL
      var m = location.pathname.match(/^\/s\/([A-Za-z0-9_]+)\//);
      if (!m || P.get('alerts') === '0' || !isNaN(AT)) return;
      var url = '/s/' + m[1] + '/api/fx/alert/poll', seq = null, epoch = null;
      (function poll() {
        var delay = 1000;
        fetch(url + (seq === null ? '' : '?since=' + seq), { cache: 'no-store' })
          .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
          .then(function (d) {
            if (epoch !== null && d.epoch !== epoch) { epoch = d.epoch; seq = 0; delay = 0; return; }
            epoch = d.epoch;
            if (seq !== null && (d.commands || []).length && tLast - tIntro > introLen()) start(tLast);
            seq = d.seq;
          })
          .catch(function () { delay = 4000; })
          .then(function () { setTimeout(poll, delay); });
      })();
    })();
  </script>
