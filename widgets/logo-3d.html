<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logo 3D</title>
  <!-- Logo in 3D (WebGL, three.js r128): Das Logo wird beim Laden automatisch in Teile zerlegt – Streifenbild nach
       zusammenhängenden Flächen, Textbild nach Buchstaben-Spalten – und jedes Teil bekommt Dicke.
       Ablauf: Streifen stellen sich einzeln von links nach rechts auf, Buchstaben fallen beim Start mit Salto herein,
       wippen, Glanz; Streifen kippen einzeln von rechts nach links weg, Pause `pause` s, von vorn. Bei Alerts startet alles neu.
       URL: lines, text (Dateien in assets/, wie logo.html), pause (s, Standard 10), speed (ms je Streifen, Standard 200),
       idle (loop|off – off: nach dem ersten Aufbau stehen bleiben),
       intro (1|0), alerts (1|0), glow (off|theme|purple|gold|Hex, Standard off). Größe = Browser-Source, das Logo passt sich ein. -->
  <link rel="stylesheet" href="_theme.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <script src="../js/vendor/three-r128.min.js"></script>
  <script src="../js/vendor/three-r128-RoomEnvironment.js"></script>
  <script src="../js/logo-split.js"></script>
  <script>
    (function () {
      'use strict';
      var P = new URLSearchParams(location.search);
      var LINES = P.get('lines') || 'logo_lines_blue_t.png', TEXT = P.get('text') || 'logo_text_luckor_hd.png';
      var PAUSE = Math.max(3, parseFloat(P.get('pause')) || 10), IDLE = P.get('idle') === 'off' ? 'off' : 'loop';
      var INTRO = P.get('intro') !== '0', AT = parseFloat(P.get('at'));
      var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      function safeFile(f) { return /^[\w.-]+\.(png|webp|jpg)$/i.test(f) ? f : null; }

      function col(n, fb, into) { var v = (getComputedStyle(document.documentElement).getPropertyValue(n) || '').trim(), c = into || new THREE.Color(); c.set(fb); try { if (v) c.set(v); } catch (e) {} return c; }
      var ACC = col('--theme-accent', '#f2b705'), PRI = col('--theme-primary', '#5e2a79');
      var glowP = (P.get('glow') || 'off').replace(/^#?([0-9a-f]{6})$/i, '#$1');
      var GLOW_A = glowP === 'gold' ? new THREE.Color('#f2b705') : glowP === 'purple' ? new THREE.Color('#5e2a79') : /^#/.test(glowP) ? new THREE.Color(glowP) : PRI;
      var GLOW_B = glowP === 'theme' ? ACC : GLOW_A;

      var canvas = document.getElementById('gl'), r;
      try { r = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true, preserveDrawingBuffer: !isNaN(AT) }); } catch (e) { console.error('logo-3d: no WebGL'); return; }
      r.setPixelRatio(1); r.setClearColor(0x000000, 0); r.autoClear = false;
      var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, 10, 50000);
      if (THREE.RoomEnvironment) scene.environment = new THREE.PMREMGenerator(r).fromScene(new THREE.RoomEnvironment(), 0.04).texture;
      var amb = new THREE.AmbientLight(0xffffff, 0.35); amb.layers.enableAll(); scene.add(amb);
      var keyL = new THREE.DirectionalLight(0xffffff, 1.2); keyL.position.set(-400, 600, 900); keyL.layers.enableAll(); scene.add(keyL);
      var W = 0, H = 0;
      function resize() {
        W = window.innerWidth || 400; H = window.innerHeight || 152;
        r.setSize(W, H, false); cam.aspect = W / H; cam.position.z = (H / 2) / Math.tan(15 * Math.PI / 180); cam.updateProjectionMatrix();
        layout();
      }

      function loadImg(f) {
        return new Promise(function (ok) {
          if (!f) return ok(null);
          var im = new Image(); im.onload = function () { ok(im); };
          im.onerror = function () { console.error('logo-3d: image not loaded', f); ok(null); };
          im.src = '../assets/' + f;
        });
      }
      // Zerlegen (Streifen, Buchstaben, Umrisse) steckt in js/logo-split.js – dasselbe nutzt der Logo-Cut-Editor
      var LS = window.LogoSplit, pixels = LS.pixels, splitBlobs = LS.splitBlobs, splitColumns = LS.splitColumns, separateShadow = LS.separateShadow,
        splitLetters = LS.splitLetters, contours = LS.contours, area = LS.area, whole = LS.whole;
      // Schatten je Buchstabe, aus dem Buchstaben selbst gebaut: seine Form schwarz, weichgezeichnet und um den Versatz
      // des Original-Schattens verschoben. Hängt am Buchstaben und dreht und hüpft deckungsgleich mit.
      function shadowLook(sh, face) {
        function cen(px) { var w = px.d.width, h = px.d.height, a = px.d.data, sx = 0, sy = 0, n = 0;
          for (var i = 0; i < w * h; i++) { var v = a[i * 4 + 3]; if (v) { var x = i % w; sx += x * v; sy += (i - x) / w * v; n += v; } }
          return n ? [sx / n, sy / n] : [0, 0]; }
        var c1 = cen(sh), c0 = cen(face), a = sh.d.data, sum = 0, n = 0;
        for (var i = 3; i < a.length; i += 4) if (a[i]) { sum += a[i]; n++; }
        return { dx: c1[0] - c0[0], dy: c1[1] - c0[1], alpha: n ? Math.min(1, sum / n / 255 * 1.6) : 0.6 };
      }
      function letterShadow(p, look) {
        var blur = Math.max(2, p.c.height * 0.035), pad = Math.ceil(blur * 3 + Math.max(Math.abs(look.dx), Math.abs(look.dy)));
        var c = document.createElement('canvas'); c.width = p.c.width + pad * 2; c.height = p.c.height + pad * 2;
        var x = c.getContext('2d'); x.filter = 'blur(' + blur.toFixed(1) + 'px)';
        x.drawImage(p.c, pad + look.dx, pad + look.dy); x.filter = 'none';
        x.globalCompositeOperation = 'source-in'; x.fillStyle = 'rgba(0,0,0,' + look.alpha.toFixed(2) + ')'; x.fillRect(0, 0, c.width, c.height);
        return { c: c, x0: p.x0 - pad, y0: p.y0 - pad };
      }
      // weiche Normalen über flache Knicke (< 40°), harte Kanten bleiben – ExtrudeGeometry liefert nur Facetten
      function creaseNormals(geo) {
        var P = geo.attributes.position.array, N = new Float32Array(P.length), fn = [], map = {}, i, j, cosT = Math.cos(40 * Math.PI / 180);
        var a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
        for (i = 0; i < P.length / 9; i++) {
          a.fromArray(P, i * 9); b.fromArray(P, i * 9 + 3); c.fromArray(P, i * 9 + 6);
          var f = new THREE.Vector3().subVectors(c, b).cross(b.clone().sub(a)).normalize(); fn.push(f);
          for (j = 0; j < 3; j++) { var v = i * 3 + j, key = Math.round(P[v * 3] * 100) + ',' + Math.round(P[v * 3 + 1] * 100) + ',' + Math.round(P[v * 3 + 2] * 1000); (map[key] = map[key] || []).push(v); }
        }
        Object.keys(map).forEach(function (key) {
          var vs = map[key];
          vs.forEach(function (v) {
            var own = fn[(v / 3) | 0], sum = new THREE.Vector3();
            vs.forEach(function (u) { var o = fn[(u / 3) | 0]; if (own.dot(o) > cosT) sum.add(o); });
            sum.normalize(); N[v * 3] = sum.x; N[v * 3 + 1] = sum.y; N[v * 3 + 2] = sum.z;
          });
        });
        geo.setAttribute('normal', new THREE.BufferAttribute(N, 3));
      }
      var CHROME = new THREE.MeshStandardMaterial({ color: 0x9da3ae, metalness: 1, roughness: 0.28, envMapIntensity: 1.0, transparent: true });
      var CAP = new THREE.MeshStandardMaterial({ color: 0x6d727c, metalness: 1, roughness: 0.35, transparent: true });   // Rückseite
      function addLetterSolid(p, s, i) {
        var own = !!p.loops, loops = own ? p.loops.slice() : contours(p.mask, p.mw, p.mh); if (!loops.length) return false;
        if (!own) loops.sort(function (a, b) { return Math.abs(area(b)) - Math.abs(area(a)); });
        var cw = p.mw, ch = p.mh, toV = function (q) { return new THREE.Vector2(q[0] - cw / 2, ch / 2 - q[1]); };
        var outer = loops[0], shape = new THREE.Shape(outer.map(toV)), so = Math.sign(area(outer));
        loops.slice(1).forEach(function (l) { if ((own || Math.sign(area(l)) !== so) && Math.abs(area(l)) > 4) shape.holes.push(new THREE.Path(l.map(toV))); });
        // Körper ohne Fase direkt hinter der Vorderseite (z −1..0); von vorn sieht man nur das Originalbild
        var geo = new THREE.ExtrudeGeometry(shape, { depth: 1, bevelEnabled: false, curveSegments: 1 });
        geo.translate(0, 0, -1); creaseNormals(geo); geo.scale(1 / s, 1 / s, 1);
        var body = new THREE.Mesh(geo, [CAP.clone(), CHROME.clone()]); body.layers.set(1); body.renderOrder = 20;
        // Vorderseite: exakt das Originalbild (Schrift, Kontur, Verlauf), mit Glanz und Blitz; Tiefentest an, damit sie
        // beim Drehen hinter dem eigenen Körper verschwindet
        var tex = new THREE.CanvasTexture(p.c); tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
        var face = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), frontMat(tex));
        face.material.depthTest = true; face.layers.set(1); face.renderOrder = 22;
        var g = new THREE.Group(); g.add(body); g.add(face); root.add(g);
        parts.push({ g: g, front: body, face: face, sides: [], kind: 1, i: i, solid: true, letter: true, x0: p.x0 / s, y0: p.y0 / s, w: cw / s, h: ch / s });
        return true;
      }

      // Buchstaben und Schatten ohne Tiefentest: sie liegen immer vor den Streifen, auch wenn die sich drehen.
      // Teil mit Dicke: Vorderseite mit Glanz/Blitz, dahinter abgedunkelte Lagen (wirken beim Drehen wie eine Kante)
      var LAYERS = 7, root = new THREE.Group(); scene.add(root);
      var parts = [], halo, box = { x0: 0, y0: 0, x1: 1, y1: 1 }, SC = 1;
      function frontMat(tex) {
        return new THREE.ShaderMaterial({ transparent: true, side: THREE.DoubleSide, depthWrite: false, depthTest: false,
          uniforms: { uTex: { value: tex }, uShine: { value: -9 }, uFlash: { value: 0 }, uFade: { value: 1 }, uAcc: { value: ACC },
            uOff: { value: new THREE.Vector2() }, uSize: { value: new THREE.Vector2(1, 1) }, uBold: { value: 0.6 } },
          vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
          fragmentShader: [
            'uniform sampler2D uTex; uniform float uShine, uFlash, uFade, uBold; uniform vec3 uAcc; uniform vec2 uOff, uSize; varying vec2 vUv;',
            'void main(){',
            '  vec4 c = texture2D(uTex, vUv); if (c.a < 0.004) discard;',
            '  if (!gl_FrontFacing) c.rgb *= 0.62;',
            // Glanzband in Logo-Koordinaten (0..1), läuft schräg von links nach rechts
            '  vec2 g = uOff + vec2(vUv.x, 1.0 - vUv.y) * uSize;',
            '  float band = exp(-pow(g.x + g.y * 0.35 - uShine, 2.0) * 160.0);',
            '  c.rgb += vec3(1.0) * band * uBold * c.a;',
            '  c.rgb = mix(c.rgb, mix(uAcc, vec3(1.0), 0.55), uFlash * 0.75);',
            '  gl_FragColor = vec4(c.rgb, c.a * uFade);',
            '}'].join('\n') });
      }
      function addSolid(p, s, i) {
        var cx = (p.x0 + p.c.width / 2), cy = (p.y0 + p.c.height / 2), sh = new THREE.Shape();
        var pc = p.poly.map(function (v) { return [(v[0] - cx) / s, -(v[1] - cy) / s]; });
        var mx = 0, my = 0; pc.forEach(function (v) { mx += v[0] / pc.length; my += v[1] / pc.length; });
        var inset = 6 / s * (2048 / 4200) * 2;
        pc.forEach(function (v, k) { var dx = v[0] - mx, dy = v[1] - my, L = Math.hypot(dx, dy) || 1, X = v[0] - dx / L * inset, Y = v[1] - dy / L * inset; if (k) sh.lineTo(X, Y); else sh.moveTo(X, Y); });
        var bev = 6 / s * (2048 / 4200) * 2;   // feine Fase (≈ 6 px im Bild), wächst nicht mit dem schrägen Umriss
        var geo = new THREE.ExtrudeGeometry(sh, { depth: 1, bevelEnabled: true, bevelThickness: 0.12, bevelSize: bev, bevelSegments: 3 });
        geo.translate(0, 0, -0.5);
        var colr = p.col ? new THREE.Color(p.col[0], p.col[1], p.col[2]).convertSRGBToLinear() : new THREE.Color(0x2f6fff);
        var mat = new THREE.MeshStandardMaterial({ color: colr, metalness: 0.45, roughness: 0.3, envMapIntensity: 1.0, transparent: true, emissive: new THREE.Color(0) });
        mat.userData.base = Math.max(0.35, p.alpha || 1);   // halbtransparente Streifen bleiben es
        var mesh = new THREE.Mesh(geo, mat), g = new THREE.Group(); g.add(mesh); mesh.renderOrder = 2; root.add(g);
        parts.push({ g: g, front: mesh, sides: [], kind: 0, i: i, solid: true, x0: p.x0 / s, y0: p.y0 / s, w: p.c.width / s, h: p.c.height / s });
      }
      function addPart(p, s, kind, i) {
        if (kind === 0 && p.poly) return addSolid(p, s, i);
        var tex = new THREE.CanvasTexture(p.c); tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
        var g = new THREE.Group(), front = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), frontMat(tex));
        front.renderOrder = [2, 22, 12][kind]; g.add(front);
        var sides = [];
        for (var k = 1; k <= (kind === 2 ? 0 : LAYERS); k++) {
          var m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.45,
            side: THREE.DoubleSide, color: new THREE.Color().setScalar(0.78 - k * 0.03), depthWrite: false, depthTest: false }));
          m.renderOrder = [1, 21, 11][kind]; g.add(m); sides.push(m);
        }
        root.add(g);
        parts.push({ g: g, front: front, sides: sides, kind: kind, i: i, x0: p.x0 / s, y0: p.y0 / s, w: p.c.width / s, h: p.c.height / s });
      }
      function addShadow(p, q, s) {
        if (!p || p.kind !== 1) return;
        var tex = new THREE.CanvasTexture(q.c); tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
        var m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), frontMat(tex)); m.renderOrder = 12;
        m.material.uniforms.uBold.value = 0; p.g.add(m); if (p.letter) m.layers.set(1);
        p.shadow = { m: m, x0: q.x0 / s, y0: q.y0 / s, w: q.c.width / s, h: q.c.height / s };
      }
      function placeShadow(p, th, lz) {   // relativ zum Buchstaben, dahinter
        if (!p.shadow) return; var d = p.shadow;
        d.m.scale.set(d.w * SC, d.h * SC, 1);
        d.m.position.set((d.x0 + d.w / 2 - p.x0 - p.w / 2) * SC, (p.y0 + p.h / 2 - d.y0 - d.h / 2) * SC, lz ? -lz * 1.05 : -th * 1.2);
        if (lz) d.m.scale.z = 1;
      }
      function layout() {
        if (!parts.length) return;
        var bw = box.x1 - box.x0, bh = box.y1 - box.y0;
        SC = Math.min(W * 0.86 / bw, H * 0.7 / bh);
        var th = Math.max(2, bh * SC * 0.018);   // Dicke ≈ 2 % der Logohöhe
        parts.forEach(function (p) {
          p.home = new THREE.Vector3((p.x0 + p.w / 2 - (box.x0 + box.x1) / 2) * SC, ((box.y0 + box.y1) / 2 - (p.y0 + p.h / 2)) * SC, [0, th * 1.6, th * 0.4][p.kind]);
          if (p.solid && p.letter) {   // Buchstabe: Tiefe ≈ 12 % seiner Höhe, Vorderseite vorn wie bisher die flachen Buchstaben
            var lz = Math.max(4, p.h * SC * 0.12); p.front.scale.set(SC, SC, lz); p.home.z = th * 1.6;
            p.face.scale.set(p.w * SC, p.h * SC, 1); p.face.position.z = 0.6;
            var fu = p.face.material.uniforms; fu.uOff.value.set((p.x0 - box.x0) / bw, (p.y0 - box.y0) / bh); fu.uSize.value.set(p.w / bw, p.h / bh); fu.uBold.value = 0.85;
            placeShadow(p, th, lz); return;
          }
          if (p.solid) { var dz = Math.max(8, bh * SC * 0.16); p.front.scale.set(SC, SC, dz); p.home.z = -dz * 0.8; return; }   // hinter der Schrift
          p.front.scale.set(p.w * SC, p.h * SC, 1);
          p.sides.forEach(function (m, k) { m.scale.copy(p.front.scale); m.position.z = -(k + 1) * th / LAYERS; });
          var u = p.front.material.uniforms; u.uOff.value.set((p.x0 - box.x0) / bw, (p.y0 - box.y0) / bh); u.uSize.value.set(p.w / bw, p.h / bh);
          u.uBold.value = [0.45, 0.85, 0][p.kind];
          placeShadow(p, th, 0);
        });
        if (halo) halo.scale.set(bw * SC * 1.25, bh * SC * 1.6, 1);
      }

      // Von Hand ausgeschnittene Teile (Logo-Cut-Editor) – nur über die Token-URL, ?cuts=0 nimmt die Automatik
      function loadCuts() {
        var m = location.pathname.match(/^\/s\/([A-Za-z0-9_]+)\//);
        if (!m || P.get('cuts') === '0') return Promise.resolve({});
        return fetch('/s/' + m[1] + '/api/fx/logo/cuts.json', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : {}; }).then(function (d) { return d.cuts || {}; }).catch(function () { return {}; });
      }
      Promise.all([loadImg(safeFile(LINES)), loadImg(safeFile(TEXT)), loadCuts()]).then(function (ims) {
        var ref = ims[0] || ims[1], CUTS = ims[2]; if (!ref) return;
        [0, 1].forEach(function (kind) {
          var im = ims[kind]; if (!im) return;
          var px = pixels(im, Math.min(1, 2048 / Math.max(im.naturalWidth, im.naturalHeight)));
          var ks = px.c.width / ref.naturalWidth;   // Teile in Koordinaten des ersten Bilds
          var sep = kind ? separateShadow(px) : { face: px, shadow: null }, k0 = px.c.width / im.naturalWidth;
          var cut = CUTS[kind ? TEXT : LINES], letters = null, list;
          if (cut && !kind) { list = LS.stripesFromCuts(px, cut, k0); list.forEach(function (p, i) { addPart(p, ks, 0, i); }); return; }
          letters = kind ? (cut ? LS.lettersFromCuts(sep.face, cut, k0) : splitLetters(sep.face)) : null;
          if (letters) { list = letters; letters.forEach(function (p, i) { if (!addLetterSolid(p, ks, i)) addPart(p, ks, 1, i); }); }
          else {
            list = (kind ? splitColumns(sep.face, im.naturalWidth > px.c.width ? pixels(im, 1) : px) : splitBlobs(px)) || whole(sep.face);
            list.forEach(function (p, i) { addPart(p, ks, kind, i); });
          }
          if (sep.shadow && kind && list.length > 1) { var look = shadowLook(sep.shadow, sep.face);
            list.forEach(function (q, i) { addShadow(parts[parts.length - list.length + i], letterShadow(q, look), ks); }); }
          else if (sep.shadow) whole(sep.shadow).forEach(function (p) { addPart(p, ks, 2, 0); });
        });
        if (!parts.length) return;
        box = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
        parts.forEach(function (p) { if (p.kind === 2) return; box.x0 = Math.min(box.x0, p.x0); box.y0 = Math.min(box.y0, p.y0); box.x1 = Math.max(box.x1, p.x0 + p.w); box.y1 = Math.max(box.y1, p.y0 + p.h); });
        // weicher Schein hinter dem Logo, pulsiert zwischen zwei Farben
        if (glowP !== 'off') {
          halo = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
            uniforms: { uA: { value: GLOW_A }, uB: { value: GLOW_B }, uK: { value: 0 }, uMix: { value: 0 } },
            vertexShader: 'varying vec2 v; void main(){ v = uv - 0.5; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
            fragmentShader: 'uniform vec3 uA, uB; uniform float uK, uMix; varying vec2 v; void main(){ float d = length(v * vec2(1.0, 1.6)); float a = smoothstep(0.5, 0.0, d) * uK; gl_FragColor = vec4(mix(uA, uB, uMix), a); }' }));
          halo.position.z = -40; halo.renderOrder = 0; root.add(halo);
        }
        resize(); window.addEventListener('resize', resize);
        // Theme-Wechsel ohne Neuladen: Akzent und Schein nachziehen (die Logo-Bilder selbst bleiben)
        new MutationObserver(function () {
          col('--theme-accent', '#f2b705', ACC); col('--theme-primary', '#5e2a79', PRI);
          if (glowP === 'theme') { GLOW_A.copy(PRI); GLOW_B.copy(ACC); }
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
        start(0);
        if (!isNaN(AT)) frame();   // ?at=: ein Standbild
      });

      // ── Zeitplan ──
      // Ablauf: Streifen stellen sich einzeln von links nach rechts auf → Buchstaben wippen, Glanz → halten → Streifen
      // kippen einzeln von rechts nach links nach hinten weg → Pause (nur Schrift) → von vorn.
      // Die Buchstaben fallen nur beim Start (und bei Alerts) mit Salto herein und bleiben dann stehen.
      var tIntro = INTRO ? 0 : -100, nS = 0, nT = 0, tLast = 0;
      var STEP = Math.min(0.6, Math.max(0.05, (parseFloat(P.get('speed')) || 200) / 1000)), W_IN = 0.75, W_OUT = 0.55;
      function ease(x) { x = Math.min(1, Math.max(0, x)); return 1 - Math.pow(1 - x, 3); }
      function easeIn(x) { x = Math.min(1, Math.max(0, x)); return x * x * x; }
      function back(x) { x = Math.min(1, Math.max(0, x)); return 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2); }
      function sT() { return Math.min(0.1, 0.9 / Math.max(1, nT)); }
      function lettersEnd() { return 0.45 + sT() * nT + 0.55; }
      function introLen() { return Math.max(lettersEnd(), plan().endA); }
      function plan() {   // Zeitpunkte einer Runde (s ab Rundenbeginn)
        var n = Math.max(1, nS), run = (n - 1) * STEP, o = {};
        o.tA = 0.15; o.endA = o.tA + run + W_IN;
        o.tH = Math.max(o.endA, lettersEnd()) + 3.0; o.endH = o.tH + run + W_OUT;
        o.len = o.endH + PAUSE;
        return o;
      }
      var T0 = performance.now() / 1000;
      function now() { return isNaN(AT) ? performance.now() / 1000 - T0 : AT; }
      function start(t) { tIntro = INTRO || t > 0 ? t : -100; }
      function cycleTime(a) {   // Zeit in der aktuellen Runde; idle=off: nach dem ersten Aufbau stehen bleiben
        var o = plan(); if (a < 0) return a;
        if (IDLE === 'off') return Math.min(a, o.tH - 0.01);
        return a % o.len;
      }

      // Streifen i zur Rundenzeit c: null = unsichtbar. Rein von links nach rechts (aus dem Liegen aufstellen),
      // raus rückwärts von rechts nach links (nach hinten wegkippen) – ohne Drehen um sich selbst
      function stripeState(i, c, o) {
        var st = { fade: 1, glow: 0, y: 0, z: 0, rx: 0, sc: 1 };
        if (c < o.tA) return null;
        if (c < o.tH) {
          var pr = (c - o.tA - i * STEP) / W_IN; if (pr <= 0) return null;
          if (pr < 1) { var e = back(pr);
            st.fade = Math.min(1, pr * 3); st.rx = (1 - e) * -Math.PI * 0.5; st.y = -(1 - ease(pr)) * 0.5; st.z = -(1 - ease(pr)) * 0.5; }
          st.glow = Math.max(0, 1 - Math.abs(pr - 1) * 5) * 0.6;
          return st;
        }
        var u = (c - o.tH - (nS - 1 - i) * STEP) / W_OUT; if (u >= 1) return null; if (u <= 0) return st;
        var e2 = easeIn(u); st.rx = e2 * Math.PI * 0.5; st.y = -e2 * 0.4; st.z = -e2 * 0.6; st.sc = 1 - 0.4 * e2; st.fade = 1 - e2;
        return st;
      }
      // Glanz: läuft nach jedem Aufbau einmal schräg durch (Logo-Koordinaten 0..1)
      function shineAt(c, o) {
        var s = (c - (o.endA + 0.1)) / 0.9; if (s < 0 || s > 1.2) s = -9;
        return s < -1 ? -9 : s * 1.8 - 0.3;
      }

      function pose(p, t, c, o, sh) {
        var g = p.g, h = p.home, a = t - tIntro, sz = (box.y1 - box.y0) * SC;
        g.position.copy(h); g.rotation.set(0, 0, 0); g.scale.setScalar(1);
        var fade = 1, flash = 0;
        if (p.kind === 2) {   // alter Gesamt-Schatten (nur Rückfall): kommt mit den Buchstaben
          fade = Math.min(1, Math.max(0, (a - lettersEnd() + 0.2) / 0.6));
        } else if (p.kind === 0) {
          var st = stripeState(p.i, c, o);
          if (!st) fade = 0;
          else if (REDUCED) { fade = st.fade; flash = st.glow; }
          else {
            fade = st.fade; flash = st.glow;
            g.position.y += st.y * sz; g.position.z += st.z * sz; g.rotation.set(st.rx, 0, 0); g.scale.setScalar(st.sc);
          }
        } else {
          var q = (a - 0.45 - p.i * sT()) / 0.55;
          if (q < 1) {
            if (REDUCED) { fade = ease(q); }
            else {
              var e2 = ease(q);
              g.position.y += (1 - e2) * p.h * SC * 2.2; g.rotation.x = -(1 - e2) * Math.PI * 2; g.scale.setScalar(0.6 + 0.4 * back(q));
              fade = Math.min(1, q * 3);
            }
          }
          flash = Math.max(0, 1 - Math.abs(q - 1) * 5) * 0.8;
          // kurz wippen, wenn die Streifen stehen (wie beim 2D-Logo)
          if (!REDUCED && a > lettersEnd()) { var w = (c - o.endA - p.i * 0.03) / 0.5; if (w > 0 && w < 1) g.scale.multiplyScalar(1 + Math.sin(w * Math.PI * 3) * 0.06 * (1 - w)); }
          if (p.shadow) p.shadow.m.material.uniforms.uFade.value = Math.min(1, Math.max(0, (q - 0.8) / 0.5));
        }
        // Glanzband an der Teil-Mitte
        var bw0 = box.x1 - box.x0, bh0 = box.y1 - box.y0;
        var xn = (p.x0 + p.w / 2 - box.x0) / bw0, yn = (p.y0 + p.h / 2 - box.y0) / bh0;
        var band = sh < -5 ? 0 : Math.exp(-Math.pow(xn + yn * 0.35 - sh, 2) * 40);
        if (p.face) {
          var fu2 = p.face.material.uniforms; fu2.uFade.value = fade; fu2.uFlash.value = flash; fu2.uShine.value = sh;
          p.face.visible = fade > 0.002; band = 0;
        }
        if (p.solid) {
          p.front.visible = fade > 0.002;
          [].concat(p.front.material).forEach(function (mt) {
            mt.opacity = fade * (mt.userData.base || 1);
            if (mt.userData.em) mt.emissive.copy(mt.userData.em).lerp(ACC, flash * 0.6).addScalar(band * 0.35);
            else if (mt.emissive) mt.emissive.copy(ACC).multiplyScalar(flash * 0.6).addScalar(band * 0.45);
          });
          return;
        }
        p.front.material.uniforms.uFade.value = fade;
        p.front.material.uniforms.uFlash.value = flash;
        p.front.material.uniforms.uShine.value = sh;
        p.sides.forEach(function (m) { m.material.opacity = fade; m.visible = fade > 0.02; });
        p.front.visible = fade > 0.002;
      }
      function frame() {
        var t = now();
        nS = 0; nT = 0; parts.forEach(function (p) { if (p.kind === 1) nT++; else if (p.kind === 0) nS++; });
        var o = plan(), c = cycleTime(t - tIntro), sh = shineAt(c, o);
        parts.forEach(function (p) { pose(p, t, c, o, sh); });
        if (halo) {
          var on = ease((t - tIntro - 0.3) / 1.2);
          halo.material.uniforms.uK.value = on * (0.35 + 0.15 * Math.sin(t * 2.5));
          halo.material.uniforms.uMix.value = 0.5 + 0.5 * Math.sin(t * 2.5);
        }
        // fest leicht von oben und schräg: so sieht man Ober- und Seitenflächen (kein Hin- und Herwippen)
        root.rotation.x = -0.07; root.rotation.y = 0;
        // zwei Durchgänge: erst Streifen, dann Tiefenpuffer leeren und die Buchstaben-Körper – so liegen die Buchstaben
        // immer vorn (auch wenn Streifen sich drehen), haben aber unter sich korrekte Tiefe (Fase, Flanken)
        r.clear(); cam.layers.set(0); r.render(scene, cam); r.clearDepth(); cam.layers.set(1); r.render(scene, cam);
        tLast = t;
        if (isNaN(AT)) requestAnimationFrame(frame);
      }
      if (isNaN(AT)) requestAnimationFrame(frame);

      // Alerts: Intro neu abspielen (gleiche Befehle wie die Alert-Sources), nur über die Token-URL
      var m = location.pathname.match(/^\/s\/([A-Za-z0-9_]+)\//);
      if (!m || P.get('alerts') === '0' || !isNaN(AT)) return;
      var url = '/s/' + m[1] + '/api/fx/alert/poll', seq = null, epoch = null;
      (function poll() {
        var delay = 1000;
        fetch(url + (seq === null ? '' : '?since=' + seq), { cache: 'no-store' })
          .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
          .then(function (d) {
            if (epoch !== null && d.epoch !== epoch) { epoch = d.epoch; seq = 0; delay = 0; return; }
            epoch = d.epoch;
            if (seq !== null && (d.commands || []).length && tLast - tIntro > introLen()) start(tLast);
            seq = d.seq;
          })
          .catch(function () { delay = 4000; })
          .then(function () { setTimeout(poll, delay); });
      })();
    })();
  </script>
</body>
