<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webcam Frame Depth</title>
  <!-- Depth Frame (WebGL, three.js r128): 3D-Rahmen um die Kamera, ein Lichtkomet kreist mal hinter, mal vor dir,
       Emotes aus dem Chat knallen an den Rahmen (Physik), bleiben oben liegen, !shake wirft sie ab, Alerts lassen ihn
       aufleuchten. Vollbild-Quelle (Größe der Szene, z. B. 1920×1080); die Kamera liegt bei x/y/width/height.
       Tiefe: dieselbe URL dreimal mit layer=back | frame | front, in OBS von unten nach oben:
       back → Kamera (aufs Fenster zugeschnitten) → frame → Kamera-Kopie freigestellt (NVIDIA, weniger zugeschnitten) → front.
       Alle Ebenen rechnen mit der Serverzeit und denselben Befehlen und zeigen so dasselbe Bild.
       URL: layer (all|back|frame|front|under = back+frame), frame (1|0 = ohne Rahmen, Emotes landen am Bildboden), x, y, width, height, radius, border, comet (1|0), emotes (1|0), max, stack,
       alerts (1|0), speed, demo (1 = Emotes zum Ausprobieren). Befehle: /s/<token>/api/fx/frame (emotes mit urls/ids/emoji, shake, flash). -->
  <link rel="stylesheet" href="_theme.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <script src="../js/vendor/three-r128.min.js"></script>
  <script src="../js/vendor/three-r128-RoomEnvironment.js"></script>
  <script>
    (function () {
      'use strict';
      var P = new URLSearchParams(location.search);
      function num(k, d, lo, hi) { var v = parseFloat(P.get(k)); return isNaN(v) ? d : Math.max(lo, Math.min(hi, v)); }
      // under = back + frame in einer Quelle (unter der Kamera), wenn nur zwei Quellen möglich sind (z. B. Kamera in einer OBS-Gruppe)
      var LAYER = ({ back: 'back', frame: 'frame', front: 'front', under: 'under' })[P.get('layer')] || 'all';
      function on(l) { return LAYER === 'all' || LAYER === l || (LAYER === 'under' && l !== 'front'); }
      var SPEED = num('speed', 1, 0.2, 3), MAXE = num('max', 40, 5, 80), STACK = num('stack', 14, 0, 60);
      var USE_EMOTES = P.get('emotes') !== '0', USE_COMET = P.get('comet') !== '0', DEMO = P.get('demo') === '1';
      // frame=0: kein Rahmen (z. B. Kamera „am Boden“): Komet kreist um die Kamera, Emotes landen auf dem Bildboden
      var SHOW_FRAME = P.get('frame') !== '0';
      var AT = parseFloat(P.get('at'));
      var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Theme-Farben; bei Theme-Wechsel ohne Neuladen (data-theme am <html>) in place nachgezogen (themeColors unten)
      function col(n, fb, into) { var v = (getComputedStyle(document.documentElement).getPropertyValue(n) || '').trim(), c = into || new THREE.Color(); c.set(fb); try { if (v) c.set(v); } catch (e) {} return c; }
      var PRI = col('--theme-primary', '#5e2a79'), ACC = col('--theme-accent', '#f2b705'), AC2 = col('--theme-accent-2', '#c985ff');

      var canvas = document.getElementById('gl'), r;
      try { r = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true, preserveDrawingBuffer: !isNaN(AT) }); }
      catch (e) { console.error('webcam-frame-depth: no WebGL'); return; }
      r.setPixelRatio(1); r.setClearColor(0x000000, 0); r.outputEncoding = THREE.sRGBEncoding;
      var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, 10, 20000);
      scene.environment = new THREE.PMREMGenerator(r).fromScene(new THREE.RoomEnvironment(), 0.04).texture;
      scene.add(new THREE.AmbientLight(0xffffff, 0.3));
      var key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(-300, 500, 700); scene.add(key);

      // ── Maße: Quelle = Szene, Kamera-Rechteck in Quell-Pixeln ──
      var W = 0, H = 0, CW, CH, CX, CY, FB = num('border', 26, 2, 80), RAD = num('radius', 14, 0, 80);
      var frameRig = new THREE.Group(); scene.add(frameRig);
      var frameMat = new THREE.MeshStandardMaterial({ color: PRI, metalness: 0.8, roughness: 0.32, envMapIntensity: 0.55, emissive: new THREE.Color(0) });
      var edgeMat = new THREE.MeshBasicMaterial({ color: ACC });
      function rr(w, h, rad) {
        var s = new THREE.Shape(), a = -w / 2, b = -h / 2; rad = Math.min(rad, w / 2 - 1, h / 2 - 1);
        s.moveTo(a + rad, b); s.lineTo(a + w - rad, b); s.quadraticCurveTo(a + w, b, a + w, b + rad); s.lineTo(a + w, b + h - rad);
        s.quadraticCurveTo(a + w, b + h, a + w - rad, b + h); s.lineTo(a + rad, b + h); s.quadraticCurveTo(a, b + h, a, b + h - rad);
        s.lineTo(a, b + rad); s.quadraticCurveTo(a, b, a + rad, b); return s;
      }
      function buildFrame() {
        while (frameRig.children.length) { var c = frameRig.children.pop(); c.geometry.dispose(); }
        var sh = rr(CW + 2 * FB, CH + 2 * FB, RAD + FB * 0.7); sh.holes.push(rr(CW, CH, RAD));
        var bev = Math.min(6, FB * 0.25);
        frameRig.add(new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: FB * 0.6, bevelEnabled: true, bevelThickness: bev, bevelSize: bev * 0.8, bevelSegments: 4, curveSegments: 12 }), frameMat));
        var ew = Math.max(1, Math.min(4, FB * 0.5));   // Akzentkante innen: bei filigranen Rahmen schmaler
        var es = rr(CW + 2 * ew, CH + 2 * ew, RAD + ew * 0.75); es.holes.push(rr(CW, CH, RAD));
        var edge = new THREE.Mesh(new THREE.ExtrudeGeometry(es, { depth: FB * 0.6 + bev + 2, bevelEnabled: false, curveSegments: 12 }), edgeMat);
        edge.position.z = -1; frameRig.add(edge);
        frameRig.visible = on('frame') && SHOW_FRAME;
      }
      function resize() {
        W = window.innerWidth || 1920; H = window.innerHeight || 1080;
        r.setSize(W, H, false); cam.aspect = W / H; cam.position.z = (H / 2) / Math.tan(15 * Math.PI / 180); cam.updateProjectionMatrix();
        CW = num('width', Math.round(W * 0.29), 40, W); CH = num('height', Math.round(CW * 9 / 16), 30, H);
        var x = num('x', W - CW - 48, -W, 2 * W), y = num('y', H - CH - 48, -H, 2 * H);
        CX = x + CW / 2 - W / 2; CY = H / 2 - (y + CH / 2);
        frameRig.position.set(CX, CY, 0);
        R = Math.max(H * 0.015, Math.min(21, CW * 0.027));   // Emote-Radius: auch bei kleiner Kamera sichtbar (≈ 16 px bei 1080p)
        buildFrame();
      }

      // ── Leuchtpunkte (additiv) ──
      function glowMat(c, k) {
        return new THREE.ShaderMaterial({ transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
          uniforms: { c: { value: c.clone() }, k: { value: k } },
          vertexShader: 'varying vec2 v; void main(){ v = uv - 0.5; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
          fragmentShader: 'uniform vec3 c; uniform float k; varying vec2 v; void main(){ float d = length(v); float a = exp(-d*10.0) * k; gl_FragColor = vec4(c + vec3(exp(-d*40.0)), min(a, 1.0)); }' });
      }

      // ── Uhr: Serverzeit (alle Ebenen gleich) ──
      var clockOff = 0, bestRtt = 9, bestAt = 0;   // Uhrabgleich mit dem Server (alle Ebenen gleich)
      function now() { return isNaN(AT) ? Date.now() / 1000 + clockOff : AT; }

      // ── Komet: hinter dir (z < 0 → Ebene back), vor dir (z ≥ 0 → Ebene front) ──
      var TRAIL = 22, trail = [];
      if (USE_COMET) for (var i = 0; i < TRAIL; i++) {
        var s = 1 - i / TRAIL, m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), glowMat(i ? AC2 : ACC, 1.3 * s));
        m.userData.s = 0.85 * s + 0.15; m.userData.k = 1.3 * s; m.renderOrder = 5; scene.add(m); trail.push(m);
      }
      function cometPos(t) {
        var a = t * 1.3 * SPEED * (REDUCED ? 0.4 : 1);
        // ohne Rahmen (Kamera am Boden): enger um dich herum statt um den Rahmen
        if (!SHOW_FRAME) return new THREE.Vector3(CX + Math.cos(a) * CW * 0.36, CY - CH * 0.22 - Math.sin(a) * CH * 0.14, Math.sin(a) * CW * 0.3);
        // Bahnbreite: gewünscht etwas außerhalb des Rahmens; reicht der Platz zum Bildrand nicht (Kamera am Rand),
        // läuft er enger, notfalls auf dem Rahmen, statt halb aus dem Bild zu fliegen
        var room = Math.min(CX + W / 2, W / 2 - CX) - 40;
        var rx = Math.min(CW / 2 + FB + CW * 0.14, Math.max(CW / 2 + FB * 0.5, room));
        // gekippter Ring: hinten (z < 0) oben hinter dem Kopf entlang, vorne (z > 0) unten an der Unterkante – so kreist er
        // um dich herum statt quer durchs Gesicht
        var ry = CH / 2 + FB * 0.5;
        return new THREE.Vector3(CX + Math.cos(a) * rx, CY - Math.sin(a) * ry * 0.92, Math.sin(a) * CW * 0.45);
      }

      // ── Emotes ──
      var R = 0, texCache = {}, ETEX_DEMO = [];
      // Emote als Textur. Bewegte Emotes (GIF/WebP von Twitch, 7TV, FFZ) laufen mit: ImageDecoder (WebCodecs, in OBS ab
      // Chromium 94 da) zerlegt sie in Einzelbilder, die im Takt ihrer Bilddauer auf eine Canvas-Textur gemalt werden.
      // Ohne ImageDecoder oder bei Fehlern bleibt es beim Standbild.
      var ANIM = [];
      function emoteTex(url) {
        if (texCache[url]) return texCache[url];
        var c = document.createElement('canvas'); c.width = c.height = 2;
        var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.minFilter = THREE.LinearFilter; t.generateMipmaps = false;
        t._pending = true; texCache[url] = t;
        fetch(url, { mode: 'cors' }).then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          var type = (res.headers.get('content-type') || '').split(';')[0].trim();
          return res.arrayBuffer().then(function (buf) { return decodeFrames(buf, type); });
        }).then(function (fr) {
          if (!fr.length) throw new Error('no frames');
          c.width = fr[0].b.width; c.height = fr[0].b.height;
          t._frames = fr; t._cur = -1; t._total = fr.reduce(function (s, f) { return s + f.d; }, 0);
          drawFrame(t, 0); t._pending = false;
          if (fr.length > 1 && t._total > 0) ANIM.push(t);
        }).catch(function (err) { console.error('webcam-frame-depth: emote not loaded', url, String(err)); t._bad = true; });
        return t;
      }
      async function decodeFrames(buf, type) {
        if (window.ImageDecoder && /^image\/(gif|webp|png|avif|apng)$/.test(type)) {
          try {
            if (await ImageDecoder.isTypeSupported(type)) {
              var d = new ImageDecoder({ data: buf, type: type }); await d.tracks.ready;
              var n = Math.min(120, d.tracks.selectedTrack ? d.tracks.selectedTrack.frameCount : 1), out = [];
              for (var i = 0; i < n; i++) {
                var r = await d.decode({ frameIndex: i }), vf = r.image;
                out.push({ b: await createImageBitmap(vf), d: Math.max(20, (vf.duration || 100000) / 1000) });
                vf.close();
              }
              d.close();
              if (out.length) return out;
            }
          } catch (e) { /* Standbild */ }
        }
        return [{ b: await createImageBitmap(new Blob([buf], { type: type || 'image/png' })), d: 0 }];
      }
      function drawFrame(t, k) {
        if (t._cur === k) return;
        var c = t.image, x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height); x.drawImage(t._frames[k].b, 0, 0, c.width, c.height);
        t._cur = k; t.needsUpdate = true;
      }
      function tickAnim(ms) {
        for (var i = 0; i < ANIM.length; i++) {
          var t = ANIM[i], f = t._frames, at = ms % t._total, k = 0;
          while (k < f.length - 1 && at >= f[k].d) { at -= f[k].d; k++; }
          drawFrame(t, k);
        }
      }
      // Unicode-Emoji (Windows-Emoji-Leiste) als Textur: Systemschrift für Farb-Emojis
      function emojiTex(e) {
        var k = 'emoji:' + e; if (texCache[k]) return texCache[k];
        var c = document.createElement('canvas'); c.width = c.height = 128; var x = c.getContext('2d');
        x.font = '100px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
        x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(e, 64, 70);
        var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; texCache[k] = t; return t;
      }
      function demoTex(k) {
        if (ETEX_DEMO[k]) return ETEX_DEMO[k];
        var c = document.createElement('canvas'); c.width = c.height = 128; var x = c.getContext('2d');
        x.fillStyle = ['#ffcc33', '#ff6b6b', '#7bd389', '#6ec1ff', '#c38bff'][k]; x.beginPath(); x.arc(64, 64, 58, 0, 7); x.fill();
        x.fillStyle = '#222'; x.beginPath(); x.arc(44, 54, 9, 0, 7); x.arc(84, 54, 9, 0, 7); x.fill();
        x.lineWidth = 7; x.strokeStyle = '#222'; x.beginPath(); x.arc(64, 72, 26, 0.25 + k * 0.1, Math.PI - 0.25 - k * 0.1); x.stroke();
        var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; ETEX_DEMO[k] = t; return t;
      }
      // deterministischer Zufall je Befehl (alle Ebenen gleich)
      function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; }

      var DT = 1 / 120, GRAV = -1500, LAG = 1.3;   // Befehle starten LAG s nach Serverzeit: alle Ebenen haben sie dann sicher
      var simT = null, E = [], hits = [], queue = [], shakeAt = -99;
      function spawn(item, k, t) {
        var h = function (j) { return hash(item.seq * 97 + k * 13 + j); };
        var side = h(1) < 0.5 ? -1 : 1, T = 0.55 + h(2) * 0.35;
        var hx = CW / 2 + FB, hy = CH / 2 + FB, tgt;
        if (!SHOW_FRAME) {   // Boden: neben der Kamera auf den unteren Bildrand
          var off = (h(4) < 0.5 ? -1 : 1) * (CW / 2 + R * 2 + h(8) * W * 0.18);
          tgt = new THREE.Vector2(Math.max(-W / 2 + R * 2, Math.min(W / 2 - R * 2, CX + off)), -H / 2 + R + 2);
          side = tgt.x < CX ? -1 : 1; if (h(6) < 0.3) side = -side;
        } else if (H / 2 - (CY + hy) > R * 4) tgt = new THREE.Vector2(CX + (h(4) - 0.5) * 2 * (hx - R), CY + hy + R + 2);   // Oberkante
        else {
          // oben kein Platz (Kamera reicht bis an den Bildrand): seitlich an den Rahmen, dann fallen sie herunter
          var roomL = CX - hx + W / 2, roomR = W / 2 - (CX + hx);
          side = roomR >= roomL ? 1 : -1; if (Math.min(roomL, roomR) > R * 4 && h(6) < 0.4) side = -side;
          tgt = new THREE.Vector2(CX + side * (hx + R * 0.6), CY + (h(4) - 0.3) * CH * 0.7);
          T = 0.45 + h(2) * 0.25;
        }
        var p = new THREE.Vector2(side * (W / 2 + 70), -H * 0.3 + h(3) * H * 0.7);
        // weiter Weg → längerer, höherer Bogen statt Querschuss (sonst rutschen sie über eine kleine Oberkante weg)
        T = Math.max(T, Math.min(1.7, Math.abs(tgt.x - p.x) / 1000 + h(7) * 0.2));
        var v = tgt.clone().sub(p).sub(new THREE.Vector2(0, 0.5 * GRAV * T * T)).divideScalar(T);
        E.push({ p: p, v: v, a: 0, w: (h(5) - 0.5) * 14, tex: item.tex[k], born: t, id: item.seq * 10 + k });
      }
      function step(t) {
        // fällige Befehle
        for (var qi = 0; qi < queue.length; qi++) {
          var it = queue[qi]; if (it.done || it.at > t) continue; it.done = true;
          if (it.cmd === 'emotes') it.tex.forEach(function (tx, k) { spawn(it, k, t); });
          if (it.cmd === 'shake') { shakeAt = t; E.forEach(function (e, j) { var g = hash(it.seq * 31 + j); e.v.set(Math.sign(e.p.x - CX || 1) * (350 + g * 450), 500 + hash(it.seq * 37 + j) * 500); e.w = (g - 0.5) * 30; }); }
        }
        queue = queue.filter(function (it) { return !it.done || t - it.at < 2; });
        // Grenzen: zu viele → die ältesten fallen weg, zu hoher Stapel → das älteste liegende rutscht ab
        while (E.length > MAXE) E.shift();
        var hx = CW / 2 + FB, hy = CH / 2 + FB, top = CY + hy;
        var restY = SHOW_FRAME ? top : -H / 2;
        var resting = E.filter(function (e) { return e.p.y > restY && e.p.y < restY + R * 3 && e.v.lengthSq() < 900; });
        if (resting.length > STACK) { var o = resting[0]; o.v.set(Math.sign(o.p.x - CX || 1) * 420, 380); }
        E.forEach(function (e) {
          e.v.y += GRAV * DT; e.p.addScaledVector(e.v, DT); e.a += e.w * DT;
          var qx = Math.max(CX - hx, Math.min(CX + hx, e.p.x)), qy = Math.max(CY - hy, Math.min(CY + hy, e.p.y));
          if (!SHOW_FRAME) { qx = e.p.x; qy = Math.min(e.p.y, -H / 2); }   // Bildboden als Fläche
          var dx = e.p.x - qx, dy = e.p.y - qy, d = Math.hypot(dx, dy);
          if (d < R && d > 1e-4) {
            var nx = dx / d, ny = dy / d, vn = e.v.x * nx + e.v.y * ny;
            e.p.x = qx + nx * R; e.p.y = qy + ny * R;
            if (vn < 0) {
              if (-vn > 380) hits.push({ t: t, x: qx, y: qy, k: Math.min(1, -vn / 1400), nx: nx, ny: ny });
              var tx = -ny, ty = nx, vt = e.v.x * tx + e.v.y * ty, fr = ny > 0.7 ? 0.5 : 0.86;   // oben bremst es stärker
              e.v.set(-vn * 0.42 * nx + vt * fr * tx, -vn * 0.42 * ny + vt * fr * ty);
              e.w = e.w * 0.6 - vt / R * 0.4;
            }
          }
        });
        for (var i = 0; i < E.length; i++) for (var j = i + 1; j < E.length; j++) {
          var A = E[i], B = E[j], ddx = B.p.x - A.p.x, ddy = B.p.y - A.p.y, dd = Math.hypot(ddx, ddy);
          if (dd < 2 * R && dd > 1e-4) {
            var ux = ddx / dd, uy = ddy / dd, ov = (2 * R - dd) / 2;
            A.p.x -= ux * ov; A.p.y -= uy * ov; B.p.x += ux * ov; B.p.y += uy * ov;
            var rv = (B.v.x - A.v.x) * ux + (B.v.y - A.v.y) * uy;
            if (rv < 0) { var im = -rv * 0.7; A.v.x -= ux * im; A.v.y -= uy * im; B.v.x += ux * im; B.v.y += uy * im; }
          }
        }
        E = E.filter(function (e) { return e.p.y > -H / 2 - 150 && Math.abs(e.p.x) < W / 2 + 220; });
        if (!SHOW_FRAME) E.forEach(function (e) { if (e.p.x < -W / 2 + R) { e.p.x = -W / 2 + R; e.v.x = Math.abs(e.v.x) * 0.4; } if (e.p.x > W / 2 - R) { e.p.x = W / 2 - R; e.v.x = -Math.abs(e.v.x) * 0.4; } });
        hits = hits.filter(function (h) { return t - h.t < 0.7; });
      }
      function advance(t) {
        if (simT === null || t - simT > 3 || t < simT) simT = Math.floor(t / DT) * DT;
        while (simT + DT <= t) { simT += DT; step(simT); }
      }
      function enqueue(c) {
        if (!USE_EMOTES && c.cmd === 'emotes') return;
        var it = { seq: c.seq, cmd: c.cmd, at: c.ts + LAG, tex: [] };
        if (c.cmd === 'emotes') it.tex = (c.params.urls || c.params.ids || []).map(emoteTex).concat((c.params.emoji || []).map(emojiTex)).slice(0, 5);
        if (c.cmd === 'flash') { flashAt = c.ts + LAG; return; }
        queue.push(it);
      }
      // Demo: Emotes nach Zeitplan (Serverzeit), damit auch mehrere Ebenen gleich sind
      var demoSlot = null;
      function demo(t) {
        var slot = Math.floor(t / 0.45);
        if (demoSlot === null) demoSlot = slot;
        while (demoSlot < slot) {
          demoSlot++;
          if (demoSlot % 30 === 0) { queue.push({ seq: demoSlot, cmd: 'shake', at: demoSlot * 0.45, tex: [] }); continue; }
          queue.push({ seq: demoSlot, cmd: 'emotes', at: demoSlot * 0.45, tex: [demoTex(demoSlot % 5)] });
        }
      }

      // Meshes für Emotes, Treffer-Blitze, Funken (Ebene front)
      var emoteMeshes = [], hitMeshes = [], SPK = 16 * 14;
      for (i = 0; i < 80; i++) {
        var em = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ transparent: true, depthTest: false }));
        em.visible = false; em.renderOrder = 8; scene.add(em); emoteMeshes.push(em);
      }
      for (i = 0; i < 16; i++) { var hm = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), glowMat(ACC, 1)); hm.visible = false; hm.renderOrder = 9; scene.add(hm); hitMeshes.push(hm); }
      var sparkG = new THREE.BufferGeometry(), spPos = new Float32Array(SPK * 3), spA = new Float32Array(SPK);
      sparkG.setAttribute('position', new THREE.BufferAttribute(spPos, 3)); sparkG.setAttribute('a', new THREE.BufferAttribute(spA, 1));
      var sparks = new THREE.Points(sparkG, new THREE.ShaderMaterial({ transparent: true, depthTest: false, blending: THREE.AdditiveBlending, uniforms: { c: { value: ACC } },
        vertexShader: 'attribute float a; varying float va; void main(){ va = a; gl_PointSize = 6.0 * a + 1.0; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
        fragmentShader: 'uniform vec3 c; varying float va; void main(){ float r = length(gl_PointCoord - 0.5); if (r > 0.5) discard; gl_FragColor = vec4(c + 0.4, va * (1.0 - r*2.0)); }' }));
      sparks.frustumCulled = false; sparks.renderOrder = 9; scene.add(sparks);
      // Alert-Schein um den Rahmen
      var aura = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), glowMat(ACC, 0)); aura.renderOrder = 1; scene.add(aura);
      var flashAt = -99;

      function frame() {
        var t = now();
        if (DEMO) demo(t);
        advance(t);
        // Rahmen federt bei Treffern, kräftig bei !shake (nur der Rahmen; die Kamera ist eine eigene OBS-Quelle)
        var wob = 0, kick = 0;
        hits.forEach(function (h) { var a = t - h.t; if (a >= 0 && a < 0.6) { wob += h.k * Math.sin(a * 40) * Math.exp(-a * 8) * (h.nx >= 0 ? 1 : -1); kick += h.k * Math.exp(-a * 10); } });
        var sa = t - shakeAt; if (sa >= 0 && sa < 1.2) wob += Math.sin(sa * 34) * Math.exp(-sa * 3) * 2;
        if (REDUCED) wob *= 0.2;
        frameRig.rotation.z = wob * 0.006; frameRig.position.set(CX + wob * 2, CY - Math.min(kick, 1.5) * 2, 0);
        var fl = t - flashAt, flash = fl >= 0 && fl < 1.6 ? Math.exp(-fl * 2.2) : 0;
        frameMat.emissive.copy(ACC).multiplyScalar(Math.min(0.7, kick * 0.5 + flash * 0.6));
        // Aura (Ebene back): Alert-Schein hinter dem Rahmen
        aura.visible = on('back') && flash > 0.01;
        aura.position.set(CX, CY, -20); aura.scale.set((CW + 2 * FB) * 1.6, (CH + 2 * FB) * 1.9, 1); aura.material.uniforms.k.value = flash * 1.2;
        // Komet
        trail.forEach(function (m, i) {
          var p = cometPos(t - i * 0.022), sc = (1 + p.z / 1600) * Math.max(H * 0.06, Math.min(90, Math.min(CW, CH) * 0.17)) * m.userData.s;
          // Wechsel hinten ↔ vorn weich über ein z-Band: weichen die Uhren zweier Ebenen minimal ab, überlappt der Komet
          // kurz statt zu verschwinden
          var band = CW * 0.12, wf = Math.min(1, Math.max(0, (p.z + band) / (2 * band)));
          var wl = (LAYER === 'all') ? 1 : (LAYER === 'front' ? wf : (on('back') ? 1 - wf : 0));
          m.visible = wl > 0.01; m.position.copy(p); m.scale.set(sc, sc, 1);
          // Rand-Fade: nie hart über die Bildkante
          var ef = Math.min(1, Math.max(0, (W / 2 - Math.abs(p.x) - sc * 0.2) / 90)) * Math.min(1, Math.max(0, (H / 2 - Math.abs(p.y) - sc * 0.2) / 90));
          m.material.uniforms.k.value = m.userData.k * ef * wl;
        });
        // Emotes
        var showFront = on('front'), sp = 0;
        emoteMeshes.forEach(function (m, i) {
          var e = E[i]; m.visible = !!e && showFront && !!e.tex && !e.tex._bad && !e.tex._pending && !!e.tex.image; if (!m.visible) return;
          m.material.map = e.tex; m.material.needsUpdate = m.material.userData.t !== e.tex; m.material.userData.t = e.tex;
          m.position.set(e.p.x, e.p.y, 30); m.rotation.z = e.a;
          var age = t - e.born; m.scale.setScalar((2 * R + 4) * (0.4 + 0.6 * Math.min(1, age * 6)));
          // Rand-Fade statt hartem Verschwinden an der Bildkante
          m.material.opacity = Math.min(1, Math.max(0, (W / 2 + 40 - Math.abs(e.p.x)) / 80)) * Math.min(1, Math.max(0, (e.p.y + H / 2 + 40) / 80));
        });
        var hs = hits.filter(function (h) { return t - h.t < 0.35; }).slice(-16);
        hitMeshes.forEach(function (m, i) {
          var h = hs[i]; m.visible = !!h && showFront; if (!m.visible) return; var a = (t - h.t) / 0.35;
          m.position.set(h.x, h.y, 40); var sc = R * 6 * (0.5 + a * 1.2 * (0.5 + h.k)); m.scale.set(sc, sc, 1);
          m.material.uniforms.k.value = (1 - a) * 1.6 * (0.4 + h.k);
          for (var q = 0; q < 14; q++) {
            var ang = Math.atan2(h.ny, h.nx) + (q / 13 - 0.5) * 2.4, sd = (220 + (q * 37 % 9) * 40) * (t - h.t);
            spPos[sp * 3] = h.x + Math.cos(ang) * sd; spPos[sp * 3 + 1] = h.y + Math.sin(ang) * sd - 900 * (t - h.t) * (t - h.t); spPos[sp * 3 + 2] = 40; spA[sp++] = 1 - a;
          }
        });
        for (; sp < SPK; sp++) spA[sp] = 0;
        sparkG.attributes.position.needsUpdate = sparkG.attributes.a.needsUpdate = true;
        sparks.visible = showFront;
        if (ANIM.length) tickAnim(performance.now());
        r.render(scene, cam);
        if (isNaN(AT)) requestAnimationFrame(frame);
      }

      function themeColors() {
        col('--theme-primary', '#5e2a79', PRI); col('--theme-accent', '#f2b705', ACC); col('--theme-accent-2', '#c985ff', AC2);
        frameMat.color.copy(PRI); edgeMat.color.copy(ACC);
        trail.forEach(function (m, i) { m.material.uniforms.c.value.copy(i ? AC2 : ACC); });
        hitMeshes.forEach(function (m) { m.material.uniforms.c.value.copy(ACC); });
        aura.material.uniforms.c.value.copy(ACC);
      }
      new MutationObserver(themeColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      resize(); window.addEventListener('resize', resize);
      if (!isNaN(AT)) {   // ?at=: Standbild (Demo-Emotes ab 0)
        simT = 0; demoSlot = 0;
        while (simT + DT <= AT) { simT += DT; if (DEMO) demo(simT); step(simT); }
        frame();
      } else requestAnimationFrame(frame);

      // ── Befehle (Emotes, Shake, Flash) und Alerts, nur über die Token-URL ──
      var m = location.pathname.match(/^\/s\/([A-Za-z0-9_]+)\//);
      if (!m || !isNaN(AT)) return;
      function poller(effect, handle) {
        var url = '/s/' + m[1] + '/api/fx/' + effect + '/poll', seq = null, epoch = null;
        (function poll() {
          var delay = 1000, sent = Date.now() / 1000;
          fetch(url + (seq === null ? '' : '?since=' + seq), { cache: 'no-store' })
            .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
            .then(function (d) {
              if (typeof d.now === 'number') {
                var got = Date.now() / 1000, rtt = got - sent;
                if (rtt < bestRtt || got - bestAt > 60) { bestRtt = rtt; bestAt = got; clockOff = d.now - (sent + got) / 2; }
              }
              if (epoch !== null && d.epoch !== epoch) { epoch = d.epoch; seq = 0; delay = 0; return; }
              epoch = d.epoch;
              if (seq !== null) (d.commands || []).forEach(handle);
              seq = d.seq;
            })
            .catch(function () { delay = 4000; })
            .then(function () { setTimeout(poll, delay); });
        })();
      }
      poller('frame', enqueue);
      if (P.get('alerts') !== '0') poller('alert', function (c) { flashAt = c.ts + LAG * 0.3; });
    })();
  </script>
