<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PUBG After-Session Report</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="_pubg.css">
  <link rel="stylesheet" href="../_theme.css">
  <link rel="stylesheet" href="../_blocks.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      padding: 16px;
      /* Deckend ueber --theme-page-bg. Vorher stand hier ein Gradient mit
         0.6 Deckkraft: als OBS-Overlay gedacht, aber der Report ist ein
         Tool im Browser-Tab, und dort schien der Browser-Default durch —
         das war der graue Eindruck. */
      background: var(--theme-page-bg, #0a0510);
      background-attachment: fixed;
      color: var(--theme-text, #f4f0f8);
    }
    /* .pubg-card traegt Flaeche, Rand, Radius und die Ornament-Ecken —
       hier nur Breite und das weitere Innenmass. */
    .report { max-width: var(--t-page-max, 1280px); margin: 0 auto;
              padding: 22px 32px; }
    .report h1 {
      margin: 0 0 6px;
      color: var(--pubg-gold);
      font-size: 1.6em;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .report .subtitle { color: var(--pubg-muted); font-size: 0.9em; margin-bottom: 18px; }

    .totals {
      display: grid;
      /* auto-FILL, nicht auto-fit: auto-fit kollabiert leere Spuren und
         streckt die vorhandenen auf die volle Breite. Bei 13 Kacheln (ME)
         faellt das nicht auf, bei 3 (TEAM) standen sie mit riesigen
         Luecken quer durch die Zeile. auto-fill haelt die Spurbreite, also
         sind die Kacheln in allen Gruppen gleich gross und beginnen links. */
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }
    /* Nur direkte Kinder — sonst greift die Regel auch in verschachtelte
       Highlight-Wrapper (t-hot) und skaliert dort mehrfach. */
    .totals > .cell { display: flex; flex-direction: column; }
    /* Werte in Textfarbe wie im Phasen-Header — Gold ist hier den
       Gruppen-Ueberschriften ME/TEAM/LOBBY vorbehalten, sonst konkurrieren
       Ueberschrift und Zahl um dieselbe Betonung. */
    .totals > .cell .pubg-stat-value {
      font-size: 1.4em;
      color: var(--pubg-text);
    }

    /* Gruppen ME / TEAM / LOBBY: die Zuordnung soll aus dem Layout
       hervorgehen, nicht erst aus einem Tooltip. */
    .totals-group { margin-bottom: 4px; }
    .totals-group .totals { margin-bottom: 14px; }
    /* Kennzeichnung im Phasen-Kopf: Ranked und Event-Phasen sind eigene
       Phasen, das soll man dort sehen und nicht erst an den Kacheln. */
    .phase-tag {
      display: inline-block;
      font-size: 0.6em;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      /* Ohne Icon: reiner Text in beiden Tags, damit Ranked und Event
         auf derselben Hoehe sitzen. Das Medaillen-Icon zog den
         Ranked-Tag ueber die inline-flex-Baseline nach oben. */
      padding: 1px 6px;
      border-radius: 3px;
      border: 1px solid currentColor;
      color: var(--theme-text-dim, #8a7d99);
      font-weight: 600;
      line-height: 1.5;
      white-space: nowrap;
    }
    .phase-tag--ranked { color: var(--theme-accent-text, #f2b705); }

    .totals-h {
      font-size: 0.68em;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--theme-accent-text, #f2b705);
      margin: 0 0 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid
        color-mix(in srgb, var(--theme-accent, #f2b705) 45%, transparent);
      font-weight: 600;
    }

    .phase {
      margin-bottom: 18px;
      padding: 14px 16px;
      background: rgba(94,42,121,0.12);
      border-left: 3px solid var(--pubg-purple);
      border-radius: 6px;
    }
    /* Flex mit align-items:center richtet alles in der Zeile aneinander
       aus — Nummer, Tags, Datum. Vorher hing die Ausrichtung an einem
       vertical-align-Pixelwert je Element, der bei jedem Inhalt anders
       passte. */
    .phase h2 {
      margin: 0 0 4px;
      font-size: 1em;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0 6px;
    }
    .phase h2 .num { color: var(--pubg-gold); }
    /* Datum als eigenes Element statt loser Textknoten: im Flex-Kontext
       waere der fuehrende Leerraum sonst zusaetzlich zum gap sichtbar. */
    .phase h2 .phase-when { font-weight: 400; }
    .phase .squad {
      color: var(--pubg-muted);
      font-size: 0.85em;
      margin-bottom: 10px;
    }
    .phase .squad b { color: var(--pubg-text); }
    .phase-stats {
      display: grid;
      /* auto-fill wie bei .totals — sonst zieht eine Gruppe mit wenigen
         Kacheln diese ueber die ganze Zeile auseinander. */
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px 14px;
      margin-bottom: 12px;
    }
    /* NUR direkte Kinder: hotLobby() wickelt den Wert bei einem Highlight
       in <span class="t-hot"><span class="pubg-hot">. Als Nachfahren-
       Selektor traf font-size:0.7em auch diese Wrapper und multiplizierte
       sich — die anklickbare K/D stand dann deutlich kleiner da als die
       Werte ohne Highlight. */
    .phase-stats > span {
      display: flex;
      flex-direction: column;
      color: var(--pubg-muted);
      font-size: 0.7em;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.2;
    }
    /* Gruppen-Marker im dichten Raster: eigene volle Zeile, damit ME /
       TEAM / LOBBY die Kacheln sichtbar trennen. */
    .phase-stats > span.ps-group {
      grid-column: 1 / -1;
      display: block;
      font-size: 0.62em;
      letter-spacing: 0.16em;
      color: var(--theme-accent-text, #f2b705);
      border-bottom: 1px solid
        color-mix(in srgb, var(--theme-accent, #f2b705) 45%, transparent);
      padding-bottom: 3px;
      margin-top: 2px;
      font-weight: 600;
    }
    .phase-stats > span.ps-group:first-child { margin-top: 0; }

    .phase-stats > span b {
      color: var(--pubg-text);
      font-variant-numeric: tabular-nums;
      font-size: 1.7em;
      letter-spacing: 0;
      text-transform: none;
      margin-bottom: 2px;
      line-height: 1.05;
    }

    .matches-list {
      display: flex; flex-direction: column;
      gap: 4px;
      font-size: 0.78em;
      font-variant-numeric: tabular-nums;
    }
    /* Match-Row: Spaltenbreiten so dass alles match-übergreifend bündig ist.
       Stats ist Sub-Grid mit fixen Spaltenbreiten — Werte untereinander
       zwischen Zeilen sichtbar. */
    /* Spaltenbreiten in fr statt Pixel: die erste (Zeitspanne + Match-Nummer)
       und die letzte (TopScorer mit Namen) brauchen doppelt so viel wie der
       Rest, und der uebrige Platz verteilt sich gleichmaessig ueber alle
       Zahlenspalten — mit fixen Pixeln sammelte sich die ganze Luft vor der
       Lobby-Spalte. minmax haelt die Zahlen einzeilig. */
    .matches-list .m {
      display: grid;
      grid-template-columns: 2fr repeat(9, minmax(58px, 1fr)) 2fr;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 3px;
      align-items: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .matches-list .m:hover { background: rgba(94, 42, 121, 0.18); }
    .matches-list .m.expanded { background: rgba(94, 42, 121, 0.25); }
    .matches-list .header-row {
      display: grid;
      grid-template-columns: 2fr repeat(9, minmax(58px, 1fr)) 2fr;
      gap: 10px;
      padding: 2px 8px 4px;
      font-size: 0.85em;
      color: var(--pubg-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
      margin-bottom: 4px;
    }
    /* Place-Spalte: # untereinander ausrichten — gold-Marker bei Win */
    .matches-list .m .place {
      font-variant-numeric: tabular-nums;
      position: relative;
      padding-left: 22px;
    }
    .matches-list .m.win .place::before {
      content: "★";
      color: var(--pubg-gold);
      font-weight: 700;
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
    }
    /* Stats-Spalten: rechtsbündig, fixe Breite, tabular-nums  */
    .bot-kills {
      color: var(--pubg-muted);
      font-size: 0.85em;
      font-weight: 400;
    }
    .matches-list .bot-teams {
      color: var(--pubg-muted);
    }
    .matches-list .bot-teams b {
      color: var(--pubg-text);
    }
    .matches-list .stat {
      text-align: right;
      font-size: 0.9em;
      color: var(--pubg-muted);
      font-variant-numeric: tabular-nums;
    }
    .matches-list .stat b {
      color: var(--pubg-text);
    }
    /* TopScorer: Name gedimmt, Score in Textfarbe — der Name ist Kontext,
       die Zahl ist die Aussage. Lange Namen werden gekuerzt statt die
       Spalte zu sprengen. */
    .matches-list .top-scorer {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      align-items: baseline;
      overflow: hidden;
    }
    .matches-list .top-scorer__name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .matches-list .header-row .col-right {
      text-align: right;
    }
    /* Lobby-Stärke: der Wert selbst gedämpft, der Vorsprung des Squads
       farblich UND per Vorzeichen — Farbe allein ist kein Signal. */
    .matches-list .lobby-kd { white-space: nowrap; }
    .matches-list .lobby-kd .dim { opacity: 0.4; }
    /* Noch kein Wert, aber die Lobby ist bekannt: der Sammler holt die
       Alltime-Zahlen der Gegner nach (rund 15 min je frischer Lobby). Ein
       Strich wuerde "does not exist" heissen, der Ring sagt "coming soon". */
    .lobby-pending {
      display: inline-block;
      width: 11px; height: 11px;
      border: 2px solid color-mix(in srgb,
                    var(--theme-text-dim, #8a7d99) 45%, transparent);
      border-top-color: var(--theme-accent, #f2b705);
      border-radius: 50%;
      animation: lobby-spin 0.9s linear infinite;
      vertical-align: -1px;
    }
    @keyframes lobby-spin { to { transform: rotate(360deg); } }
    /* Neben einer bereits sichtbaren Zahl: kleiner und zurueckhaltender —
       er sagt "wird noch genauer", nicht "gibt es noch nicht". */
    .lobby-pending--inline {
      width: 8px; height: 8px;
      border-width: 1.5px;
      opacity: 0.75;
      margin-left: 3px;
      vertical-align: 0;
    }

    /* Lobby-Werte sind anklickbar: dahinter steckt die Aufschluesselung.
       Button statt div, damit Tastatur und Screenreader mitkommen.
       Farben durchgaengig aus den Theme-Tokens mit ECHTEN Literal-Defaults —
       ein Fallback auf eine andere Variable waere zirkulaer und faellt in
       OBS auf ungestylt zurueck. */
    /* Fliesst wie Text: kein Kasten, kein eigenes Padding, keine Mindest-
       hoehe — sonst verschiebt der Button die Ausrichtung der Zahl in der
       Spalte. Als inline-Element im Textfluss greift die Ausnahme von
       WCAG 2.5.3, die Zielgroesse muss nicht 24 px sein. */
    .lobby-open {
      display: inline;
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
      color: inherit;
      font: inherit;
      line-height: inherit;
      vertical-align: baseline;
      cursor: pointer;
      /* Buttons erben vom UA-Stylesheet text-align:center. In den
         Phase-Stats ist der Container ein flex-column, der Button wird
         dadurch block-level und fuellt die Spalte — der Wert stand
         zentriert statt buendig, und zentrierter Text springt bei
         minimaler Breitenaenderung (Hover) um 1px. Beides faellt weg
         wenn der Button linksbuendig und nur inhaltsbreit ist. */
      text-align: left;
      align-self: start;
      /* border statt text-decoration: der Highlight-Wrapper (.t-hot) ist
         inline-FLEX, und ein Flex-Container malt die text-decoration seines
         Elternteils nicht auf die Kinder. Genau die hervorgehobenen Werte
         verloren dadurch die gepunktete Linie. Eine Border haengt an der
         Button-Box selbst und ist davon unabhaengig. */
      border-bottom: 1px dotted
        color-mix(in srgb, var(--theme-accent, #f2b705) 55%, transparent);
      padding-bottom: 1px;
    }
    .lobby-open:hover {
      color: var(--theme-accent-text, #f2b705);
      border-bottom-color: var(--theme-accent, #f2b705);
    }
    .lobby-open:focus-visible {
      outline: 2px solid var(--theme-accent, #f2b705);
      outline-offset: 1px;
      border-radius: 2px;
    }

    .lobby-modal {
      border: var(--theme-border-width, 1px) solid
              var(--theme-border, rgba(94, 42, 121, 0.6));
      border-radius: var(--theme-radius, 8px);
      background: var(--theme-surface-2, #1f1430);
      color: var(--theme-text, #e8e0f0);
      font-family: var(--theme-font-body, "DM Sans", system-ui, sans-serif);
      padding: 0;
      width: min(560px, 94vw);
      max-height: 86vh;
      box-shadow: var(--theme-shadow, 0 14px 40px rgba(0, 0, 0, 0.4));
    }
    .lobby-modal::backdrop {
      background: color-mix(in srgb, var(--theme-bg, #0a0510) 78%, transparent);
    }
    .lobby-modal__head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--theme-border, rgba(94, 42, 121, 0.6));
    }
    .lobby-modal__title {
      margin: 0;
      font-size: 1.05em;
      font-family: var(--theme-font-display, "DM Sans", system-ui, sans-serif);
      color: var(--theme-accent-text, #f2b705);
    }
    .lobby-modal__sub {
      margin: 3px 0 0;
      font-size: 0.85em;
      color: var(--theme-text-dim, #8a7d99);
    }
    .lobby-modal__close {
      margin-left: auto;
      min-width: 32px;
      min-height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--theme-border, rgba(94, 42, 121, 0.6));
      border-radius: calc(var(--theme-radius, 8px) / 2);
      background: transparent;
      color: var(--theme-text, #e8e0f0);
      cursor: pointer;
    }
    .lobby-modal__close:hover {
      background: color-mix(in srgb, var(--theme-text, #e8e0f0) 10%, transparent);
    }
    .lobby-modal__close:focus-visible {
      outline: 2px solid var(--theme-accent, #f2b705);
      outline-offset: 2px;
    }
    .lobby-modal__body { padding: 12px 16px 18px; overflow-y: auto; max-height: 68vh; }
    .lobby-kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }
    .lobby-kpi {
      background: color-mix(in srgb, var(--theme-primary, #5e2a79) 22%, transparent);
      border-radius: calc(var(--theme-radius, 8px) * 0.65);
      padding: 8px 10px;
    }
    .lobby-kpi b {
      display: block;
      font-size: 1.3em;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }
    /* NUR das direkte Label-span: hotKd() wickelt den Wert in
       <span class="t-hot"><span class="pubg-hot">, und als
       Nachfahren-Selektor traf 0.78em auch diese Wrapper — die Zahl
       schrumpfte auf 61 % (0.78 x 0.78), sobald sie hervorgehoben war. */
    .lobby-kpi > span { font-size: 0.78em; color: var(--theme-text-dim, #8a7d99); }
    .lobby-side + .lobby-side { margin-top: 14px; }
    .lobby-side h3 {
      margin: 0 0 6px;
      font-size: 0.88em;
      font-weight: 600;
      display: flex;
      gap: 8px;
      align-items: baseline;
      font-family: var(--theme-font-display, "DM Sans", system-ui, sans-serif);
    }
    .lobby-side h3 em {
      font-style: normal;
      color: var(--theme-text-dim, #8a7d99);
      font-weight: 400;
    }
    .lobby-list { list-style: none; margin: 0; padding: 0; }
    .lobby-list li {
      /* Drei Spalten: Name links, Herkunft rechtsbuendig davor, K/D rechts.
         Vorher klebten Modus, Season und Runden direkt am Namen und die
         Zeilen liefen unterschiedlich weit — nichts war untereinander
         lesbar. */
      display: grid;
      grid-template-columns: minmax(0, auto) 1fr max-content;
      align-items: baseline;
      gap: 4px 14px;
      padding: 4px 6px;
      border-radius: 3px;
      font-variant-numeric: tabular-nums;
    }
    .lobby-list li:nth-child(odd) {
      background: color-mix(in srgb, var(--theme-text, #e8e0f0) 5%, transparent);
    }
    .lobby-list .kd { font-weight: 600; }
    /* Highlight im Modal: Glow und Icon ja, schwirrende Partikel nein —
       die Spalte ist schmal und sie wuerden ueber die Kante in die
       Nachbarspalte fliegen (Rand-Regel). */
    .lobby-list .kd .t-hot-mark i,
    .lobby-kpi .t-hot-mark i { display: none; }
    .lobby-list .kd .t-hot-mark,
    .lobby-kpi .t-hot-mark { font-size: 0.8em; margin-left: 2px; }
    .lobby-list--top .kd { color: var(--theme-accent-text, #f2b705); }
    .lobby-list--low .kd { color: var(--theme-text-dim, #8a7d99); }
    .lobby-list .where { color: var(--theme-text-dim, #8a7d99); font-size: 0.82em; }
    /* Herkunfts-Spalte: rechtsbuendig an die K/D geschoben, damit die
       Zahlenspalte frei steht. */
    .lobby-list .li-basis {
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lobby-list .li-name { min-width: 0; overflow-wrap: anywhere; }
    /* Eigener Eintrag: sichtbar abgesetzt, weil er NICHT in den Schnitt
       eingeht. Nicht nur blasser — der Text sagt es auch, Farbe allein
       traegt die Bedeutung nicht. */
    .lobby-list li.is-me { opacity: 0.62; }
    .lobby-list .where--fallback {
      border: 1px solid currentColor;
      border-radius: 3px;
      padding: 0 4px;
      font-size: 0.72em;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      color: var(--theme-accent-2-text, var(--theme-text-dim, #8a7d99));
    }
    .lobby-list .where--me {
      border: 1px solid currentColor;
      border-radius: 3px;
      padding: 0 4px;
      text-transform: uppercase;
      font-size: 0.72em;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .lobby-modal__note {
      margin: 14px 0 0;
      font-size: 0.8em;
      color: var(--theme-text-dim, #8a7d99);
      line-height: 1.5;
    }
    .lobby-modal__empty { color: var(--theme-text-dim, #8a7d99); }

    /* Scheitert der Report, muss das jemand sehen — vorher landete der
       Fehler nur in der Konsole und der Platzhalter blieb ewig stehen. */
    .report-error p { margin: 0 0 10px; }
    .report-retry {
      min-height: 32px;
      padding: 6px 14px;
      border: 1px solid var(--theme-accent, #f2b705);
      border-radius: calc(var(--theme-radius, 8px) / 2);
      background: transparent;
      color: var(--theme-accent-text, #f2b705);
      font: inherit;
      cursor: pointer;
    }
    .report-retry:hover {
      background: color-mix(in srgb, var(--theme-accent, #f2b705) 14%, transparent);
    }
    .report-retry:focus-visible {
      outline: 2px solid var(--theme-accent, #f2b705);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      .lobby-pending {
        animation: none;
        border-top-color: var(--theme-text-dim, #8a7d99);
      }
    }
    .matches-list .lobby-diff { font-size: 0.85em; }
    .matches-list .lobby-diff.up { color: var(--pubg-good, #3cb44b); }
    .matches-list .lobby-diff.down { color: var(--pubg-warn, #e6194b); }
    .squad-detail {
      padding: 8px 14px 12px 28px;
      margin-bottom: 4px;
      background: rgba(94, 42, 121, 0.10);
      border-radius: 0 0 4px 4px;
      font-size: 0.95em;
      display: none;
    }
    .squad-detail.show { display: block; animation: pubg-fade-in 0.25s; }
    .squad-detail .detail-row {
      display: flex;
      flex-direction: row;
      gap: 16px;
      align-items: flex-start;
    }
    .squad-detail .detail-row > .squad-table-wrap { flex: 1; min-width: 0; }
    /* Event-Detail-Panel (PAYDAY/Heist) — ersetzt die Mini-Map in Events */
    .event-detail {
      width: 260px;
      flex: none;
      background: rgba(13,6,26,0.6);
      border: 1px solid rgba(216,180,255,0.35);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .event-detail-empty {
      color: var(--pubg-muted);
      font-size: 0.8em;
      text-align: center;
      padding: 14px;
      font-style: italic;
    }
    .event-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }
    .event-stat {
      padding: 5px 7px;
      background: rgba(216,180,255,0.10);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      text-align: center;
    }
    .event-stat .v {
      color: var(--theme-text, #e0c8ff);
      font-size: 1.1em;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .event-stat .l {
      color: var(--pubg-muted);
      font-size: 0.66em;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .event-detail-loot {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .squad-detail table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }
    .squad-detail th, .squad-detail td {
      padding: 4px 8px;
      text-align: right;
    }
    .squad-detail th:first-child, .squad-detail td:first-child {
      text-align: left;
    }
    .squad-detail th {
      color: var(--pubg-muted);
      font-weight: 400;
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .squad-detail .self {
      color: var(--pubg-gold);
      font-weight: 700;
    }
    .squad-detail tr.win td { color: var(--pubg-gold); }
    /* Special-Event-Badges (Vehicle-Kill etc.) — aufklappbar */
    .squad-detail .name-cell { white-space: nowrap; vertical-align: top; }
    .sd-row-wrap { display: inline-flex; gap: 4px; margin-left: 6px; }
    details.sd { display: inline-block; vertical-align: middle; }
    details.sd > summary {
      list-style: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 3px;
      padding: 1px 5px;
      background: rgba(13,6,26,0.45);
      border: 1px solid var(--pubg-border);
      border-radius: 3px;
      font-size: 0.78em;
      color: var(--pubg-muted);
    }
    details.sd[open] > summary {
      border-color: var(--pubg-gold);
      color: var(--pubg-gold);
    }
    details.sd > summary::-webkit-details-marker { display: none; }
    details.sd .sd-icon.veh { height: 16px; max-width: 24px; object-fit: contain; }
    details.sd .sd-emoji { font-size: 0.95em; line-height: 1; }
    details.sd .sd-cnt { font-variant-numeric: tabular-nums; }
    details.sd .sd-body {
      display: block;
      margin-top: 4px;
      padding: 6px 8px;
      background: rgba(13,6,26,0.7);
      border: 1px solid var(--pubg-border);
      border-radius: 4px;
      font-size: 0.85em;
      min-width: 220px;
    }
    details.sd .sd-row {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    details.sd .sd-row:last-child { border-bottom: 0; }
    details.sd .sd-w { color: var(--pubg-text); font-weight: 600; }
    details.sd .sd-opp { color: var(--pubg-muted); }
    details.sd .sd-opp b { color: var(--pubg-text); }
    details.sd .sd-poi { color: var(--pubg-gold); }
    details.sd .sd-dist {
      color: var(--pubg-muted);
      font-variant-numeric: tabular-nums;
      margin-left: auto;
    }
    /* Match-Detail v2 — Two-Canvas 300x300 + Scrub-Bar + Cards-Col */
    .md-host {
      flex: 1;
      min-width: 0;
    }
    .md-grid {
      display: grid;
      /* Linke Spalte = Map-Breite (360px) + ~14px Border/Padding */
      grid-template-columns: 374px 1fr;
      gap: 14px;
      align-items: start;
    }
    .md-mapcol { display: flex; flex-direction: column; gap: 6px; }
    .md-rightcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .md-rightcol .squad-table-wrap {
      max-height: 220px;
      overflow-x: auto;  /* horizontal scroll bei vielen Spalten / schmalem Viewport */
      overflow-y: auto;
    }
    /* Mobile/Tablet: Map oben, Squad-Tabelle + Cards darunter (Stack) */
    @media (max-width: 900px) {
      .md-grid { grid-template-columns: 1fr; }
      .md-mapwrap { width: 100%; height: auto; aspect-ratio: 1/1; max-width: 360px; }
      .md-mapwrap canvas { width: 100%; height: 100%; }
      .md-rightcol .squad-table-wrap { max-height: 280px; }
    }
    /* Sehr kleine Viewports: Tabelle eng aber lesbar */
    @media (max-width: 480px) {
      .md-squad-table { font-size: 0.82em; }
      .md-squad-table th, .md-squad-table td { padding: 4px 4px; }
    }
    .md-matchid {
      font-family: var(--theme-font-mono, ui-monospace, "Cascadia Mono", monospace);
      font-size: 0.72em;
      color: var(--pubg-muted, #8a7d99);
      background: rgba(94,42,121,0.15);
      border: 1px solid rgba(94,42,121,0.35);
      border-radius: 3px;
      padding: 4px 8px;
      cursor: pointer;
      user-select: all;
      word-break: break-all;
    }
    .md-matchid:hover { background: rgba(94,42,121,0.25); }
    .md-mapwrap {
      position: relative;
      width: 360px; height: 360px;
      margin: 0;
      background: #0d061a;
      border: 1px solid var(--pubg-border);
      border-radius: 6px;
      overflow: hidden;
      user-select: none;
    }
    .md-mapwrap canvas {
      position: absolute; inset: 0;
      width: 360px; height: 360px; display: block;
    }
    .md-mapwrap canvas.md-overlay { pointer-events: none; }
    .md-mapwrap .md-zoombtns {
      position: absolute; top: 6px; right: 6px;
      display: flex; flex-direction: column; gap: 3px;
      z-index: 5;
    }
    .md-zoombtns button {
      width: 22px; height: 22px;
      background: rgba(13,6,26,0.85);
      border: 1px solid var(--pubg-border);
      color: var(--pubg-gold);
      font-size: 13px; line-height: 18px; text-align: center;
      border-radius: 3px; cursor: pointer; padding: 0;
    }
    .md-zoombtns button:hover { border-color: var(--pubg-gold); }
    .md-mapwrap .md-hover-label {
      position: absolute;
      background: rgba(13,6,26,0.92);
      color: var(--pubg-gold);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.78em;
      pointer-events: none;
      white-space: nowrap;
      z-index: 6;
      display: none;
    }
    .md-mapwrap .md-hover-label.show { display: block; }
    /* Scrub-Bar */
    .md-scrub {
      display: flex; gap: 6px; align-items: center;
      padding: 4px 6px;
      background: rgba(13,6,26,0.55);
      border: 1px solid var(--pubg-border);
      border-radius: 4px;
      font-size: 0.8em;
      color: var(--pubg-muted);
    }
    .md-scrub button {
      background: rgba(242,183,5,0.12);
      border: 1px solid rgba(242,183,5,0.4);
      color: var(--pubg-gold);
      padding: 2px 8px;
      border-radius: 3px;
      font-family: inherit; cursor: pointer; font-size: 0.95em;
    }
    .md-scrub button:hover { background: rgba(242,183,5,0.22); }
    .md-scrub input[type=range] {
      flex: 1; cursor: pointer;
      accent-color: var(--pubg-gold);
    }
    .md-scrub .md-time {
      font-variant-numeric: tabular-nums;
      min-width: 90px; text-align: right;
      color: var(--pubg-text);
    }
    .md-speedbar { display: flex; gap: 4px; }
    .md-speedbtn {
      flex: 1;
      background: rgba(13,6,26,0.5);
      border: 1px solid var(--pubg-border);
      color: var(--pubg-muted);
      padding: 2px 0;
      border-radius: 3px;
      font-family: inherit; cursor: pointer; font-size: 0.78em;
      font-variant-numeric: tabular-nums;
    }
    .md-speedbtn:hover { color: var(--pubg-text); border-color: var(--pubg-gold); }
    .md-speedbtn.active {
      background: rgba(242,183,5,0.18);
      border-color: var(--pubg-gold);
      color: var(--pubg-gold);
    }
    /* Cards-Col */
    .md-cardcol { display: flex; flex-direction: column; gap: 8px; }
    .md-allebar {
      display: flex; align-items: center; gap: 8px;
    }
    .md-allebtn {
      background: rgba(242,183,5,0.16);
      border: 1px solid var(--pubg-gold);
      color: var(--pubg-gold);
      padding: 5px 14px;
      border-radius: 4px;
      font-family: inherit; font-weight: 700;
      font-size: 0.9em; cursor: pointer;
    }
    .md-allebtn:hover { background: var(--pubg-gold); color: #1a0d2a; }
    .md-allebtn.solo-active { background: var(--pubg-gold); color: #1a0d2a; }
    .md-cards { display: flex; flex-direction: column; gap: 6px; }
    .md-card {
      background: rgba(94,42,121,0.18);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 5px;
      padding: 8px 10px;
      font-size: 0.9em;
      line-height: 1.45;
      color: var(--pubg-text);
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .md-card:hover { background: rgba(255,255,255,0.04); }
    .md-card.hidden {
      opacity: 0.35;
      filter: grayscale(0.5);
    }
    .md-card.hidden .md-name { text-decoration: line-through; }
    .md-card .md-head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 4px;
    }
    .md-card .md-dot {
      width: 11px; height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.4);
      flex-shrink: 0;
    }
    .md-card .md-name { font-weight: 700; }
    .md-card.md-self .md-name { color: var(--pubg-gold); }
    .md-card .md-badge {
      margin-left: auto; padding: 1px 6px;
      background: rgba(0,0,0,0.3);
      font-size: 0.82em; border-radius: 3px;
      color: var(--pubg-muted);
    }
    .md-card .md-badge.alive { color: var(--pubg-gold); }
    .md-card .md-badge.died  { color: var(--theme-danger-text, #e57b7b); }
    .md-card .md-life { padding-left: 4px; font-size: 0.93em; color: var(--pubg-muted); }
    .md-card .md-life b { color: var(--pubg-text); }
    .md-card .md-life .md-died { color: var(--theme-danger-text, #e57b7b); }
    .md-card .md-life .md-veh {
      color: var(--pubg-muted);
      font-size: 0.92em;
    }
    .md-card .md-life .md-veh b { color: var(--pubg-gold); font-weight: 700; }
    .md-card .md-life .md-veh .material-symbols-outlined {
      color: var(--pubg-gold);
      vertical-align: -3px;
    }
    .md-card .md-empty { font-style: italic; opacity: 0.6; }
    .md-warning {
      background: rgba(229,123,123,0.12);
      border: 1px solid rgba(229,123,123,0.4);
      color: var(--theme-danger-text, #e57b7b);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.82em;
      line-height: 1.45;
    }
    .matches-list .time-range { color: var(--pubg-muted); }
    .matches-list .time-range b { color: var(--pubg-text); font-weight: 400; }
    .matches-list .m:hover { background: rgba(255,255,255,0.04); }
    .matches-list .m.is-event {
      opacity: 0.6;
      background: rgba(50, 50, 60, 0.18);
    }
    .matches-list .m.is-event .stat b,
    .matches-list .m.is-event .map { color: var(--pubg-muted); }
    /* Event-Badge MUSS nach .m .place stehen (Specificity-Tie, last
       wins). Sonst zieht die globale .place { color:gold } und der
       EVENT-Text ist gold-auf-lila → unlesbar. */
    .matches-list .m.win {
      background: rgba(242,183,5,0.15);
      border-left: 2px solid var(--pubg-gold);
    }
    .matches-list .m .num {
      color: var(--pubg-muted);
      font-size: 0.78em;
      opacity: 0.55;
      font-variant-numeric: tabular-nums;
    }
    .matches-list .m .time { color: var(--pubg-muted); }
    .matches-list .m .place { color: var(--pubg-gold); font-weight: 700; }
    /* Event-Badge ueberschreibt die gold-Farbe (nach .m .place damit
       Specificity-Tie hier last-wins gewinnt). */
    .matches-list .m .place.event-badge {
      color: #1a0d2a;
      background: #d8b4ff;
      padding: 0 5px;
      border-radius: 3px;
      font-weight: 700;
      font-size: 0.78em;
      letter-spacing: 0.08em;
      text-align: center;
      padding-left: 5px;
    }
    /* Map + Hot-Drop-Badge in einer 1fr-Spur: ohne nowrap brach der
       Badge in eine zweite Zeile und schob die ganze Match-Zeile auf.
       Das Ranked-Icon sitzt deshalb in der breiteren Zeit-Spalte. */
    .matches-list .m .map {
      color: var(--pubg-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .matches-list .m .stats { color: var(--pubg-muted); text-align: right; }
    .matches-list .m .stats b { color: var(--pubg-text); }
    /* Ranked: nur wenn es zutrifft. Ein "Normal"-Label an jedem zweiten
       Match waere Rauschen — die Abwesenheit des Abzeichens ist die Aussage. */
    .ranked-badge {
      display: inline-block;
      margin-left: 5px;
      vertical-align: -2px;
      color: var(--theme-accent-text, #f2b705);
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    .hot-drop-badge {
      display: inline-block;
      margin-left: 6px;
      font-size: 0.9em;
      line-height: 1;
      vertical-align: middle;
    }
    .hot-drop-badge:empty { display: none; }
    .hot-drop-badge.hot {
      filter: none;
    }
    .hot-drop-badge.died {
      filter: grayscale(1);
      opacity: 0.55;
    }
    .hot-drop-badge.hot[title],
    .hot-drop-badge.died[title] {
      cursor: help;
    }

    /* Trend / Streaks / Achievements im Report */
    /* Reserviert Platz waehrend async-Fetch laeuft — verhindert dass
       Phases/Maps/Highlights nach unten springen wenn der Extras-Content
       (Trend, Streaks, Achievements, Vehicle) reinpoppt. Wert deckt die
       typische Hoehe (~Trend 150 + Streaks 100 + Achievements 200) ab.
       Sobald echter Content drin ist, ueberschreibt der seinen Platz. */
    .extras-placeholder {
      min-height: 450px;
    }
    .extras-placeholder--filled {
      min-height: 0;
    }
    /* Skeleton-Boxen waehrend Lade-Phase (CSS-only, kein JS-State). */
    .extras-skeleton {
      display: grid;
      gap: 16px;
      padding: 16px 0;
    }
    .extras-skel-box {
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.03) 0%,
        rgba(255, 255, 255, 0.08) 50%,
        rgba(255, 255, 255, 0.03) 100%);
      background-size: 200% 100%;
      animation: extras-shimmer 1.4s linear infinite;
      border-radius: 6px;
    }
    @keyframes extras-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .extras-skel-box { animation: none; }
    }
    .extras-skel-trend { height: 140px; }
    .extras-skel-streak { height: 90px; }
    .extras-skel-ach { height: 180px; }

    .extras-h {
      margin: 24px 0 8px;
      color: var(--pubg-muted);
      font-size: 0.8em;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .vehicle-events { font-size: 0.9em; }
    .special-ach-list { font-size: 0.9em; display: flex; flex-direction: column; gap: 6px; }
    .special-ach-item {
      display: flex; align-items: center; gap: 10px;
      background: rgba(242,183,5,.06); border: 1px solid rgba(242,183,5,.2);
      border-radius: 6px; padding: 7px 10px;
    }
    .special-ach-icon { font-size: 1.5em; line-height: 1; flex-shrink: 0; }
    .special-ach-icon img { width: 32px; height: 32px; object-fit: contain; }
    .special-ach-text { flex: 1; display: flex; flex-direction: column; gap: 1px; }
    .special-ach-label { font-weight: 700; color: var(--pubg-gold); }
    .special-ach-ctx {
      font-size: 0.82em; color: var(--pubg-muted, #9aa0aa);
      letter-spacing: 0.02em;
    }
    .special-ach-ctx b { color: var(--pubg-text, #e6e8ec); font-weight: 600; }
    .special-ach-desc { font-size: 0.85em; color: var(--pubg-muted); }
    .special-ach-when { color: var(--pubg-muted); font-size: 0.82em; white-space: nowrap; }
    .ve-member { margin-bottom: 8px; }
    .ve-name { color: var(--pubg-text); font-weight: 700; margin-bottom: 3px; }
    details.ve { margin-left: 8px; }
    details.ve > summary {
      cursor: pointer; list-style: none;
      padding: 3px 6px;
      color: var(--pubg-muted);
      border-left: 2px solid var(--pubg-border);
      transition: border-color 0.12s;
    }
    details.ve[open] > summary { border-left-color: var(--pubg-gold); color: var(--pubg-gold); }
    details.ve > summary::-webkit-details-marker { display: none; }
    .ve-row {
      display: grid;
      grid-template-columns: 110px 130px 1fr auto auto;
      gap: 8px;
      padding: 3px 6px 3px 22px;
      font-size: 0.92em;
      color: var(--pubg-muted);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .ve-row:last-child { border-bottom: 0; }
    .ve-t { color: var(--pubg-text); font-variant-numeric: tabular-nums; }
    .ve-tsub {
      color: var(--pubg-muted); font-size: 0.82em;
      font-variant-numeric: tabular-nums;
      margin-left: 3px;
    }
    .ve-match-head {
      margin: 8px 0 4px;
      padding: 4px 10px 4px 22px;
      color: var(--pubg-gold);
      font-size: 0.82em;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 700;
      border-left: 2px solid var(--pubg-gold);
      background: rgba(242, 183, 5, 0.06);
    }
    .ve-match-head:first-child { margin-top: 2px; }
    .ve-veh { color: var(--pubg-text); }
    .ve-poi { color: var(--pubg-gold); }
    .ve-act b { color: var(--pubg-text); }
    .ve-kind {
      color: var(--pubg-muted);
      font-size: 0.78em;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .trend-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }
    .trend-cell {
      padding: 10px 12px;
      border-radius: 6px;
      background: rgba(94, 42, 121, 0.18);
      border: 1px solid var(--pubg-border);
    }
    .trend-label {
      color: var(--pubg-muted);
      font-size: 0.75em;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .trend-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 4px;
    }
    .trend-val {
      font-size: 1.4em;
      font-weight: 700;
      color: var(--pubg-text);
      font-variant-numeric: tabular-nums;
    }
    .trend-delta {
      font-weight: 700;
      font-size: 0.95em;
      font-variant-numeric: tabular-nums;
    }
    /* Die Deltas standen auf festem Hell-Gruen und Hell-Rot — auf einem
       hellen Theme wie editorial war das Kontrast 1,50 und damit
       unlesbar. --theme-ok und --theme-danger wandern mit: editorial
       liefert dort ein dunkles Gruen (4,50). */
    .delta-pos { color: var(--theme-ok-text, #7be57b); font-weight: 600; }
    .delta-neg { color: var(--theme-danger-text, #e57b7b); font-weight: 600; }
    .delta-zero { color: var(--theme-text-dim, #8a7d99); }
    .streaks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    .streak-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 6px;
      background: rgba(94, 42, 121, 0.18);
      border: 1px solid var(--pubg-border);
    }
    .streak-cell.cold { opacity: 0.55; }
    .streak-icon { font-size: 1.5em; }
    .streak-num {
      font-size: 1.6em;
      font-weight: 700;
      color: var(--pubg-gold);
      font-variant-numeric: tabular-nums;
    }
    .streak-label {
      color: var(--pubg-muted);
      font-size: 0.85em;
      margin-left: auto;
      text-align: right;
    }
    .ach-details {
      margin-top: 8px;
    }
    .ach-summary {
      cursor: pointer;
      list-style: none;
      user-select: none;
    }
    .ach-summary::-webkit-details-marker { display: none; }
    .ach-summary::before {
      content: "▸ ";
      display: inline-block;
      transition: transform 120ms ease;
    }
    .ach-details[open] > .ach-summary::before {
      transform: rotate(90deg);
    }
    .ach-count {
      color: var(--pubg-muted);
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      margin-left: 6px;
    }
    .ach-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
    }
    .ach-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 10px;
      border-radius: 3px;
      background: rgba(255,255,255,0.04);
      font-size: 0.9em;
    }
    .ach-icon {
      font-size: 1.2em;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }
    .ach-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 4px;
    }
    .ach-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .ach-canonical {
      color: var(--pubg-gold, #f2b705);
      font-size: 0.7em;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .ach-label { color: var(--pubg-text); font-weight: 700; }
    .ach-when { color: var(--pubg-muted); font-size: 0.85em; }

    /* PAYDAY / Event Stats */
    .payday-totals {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .payday-cell {
      padding: 8px 10px;
      background: rgba(216,180,255, 0.12);
      border: 1px solid rgba(216,180,255, 0.35);
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .payday-cell .pubg-stat-value { color: var(--theme-text, #e0c8ff); font-size: 1.4em; font-weight: 700; }
    .payday-cell .pubg-stat-label {
      color: var(--pubg-muted); font-size: 0.7em;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .payday-loot-total {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .loot-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      background: rgba(216,180,255, 0.15);
      border: 1px solid rgba(216,180,255, 0.4);
      border-radius: 12px;
      font-size: 0.82em;
    }
    .loot-badge b { color: var(--theme-text, #e0c8ff); }
    .payday-matches {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85em;
    }
    .payday-matches th {
      text-align: left;
      color: var(--pubg-muted);
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 0.78em;
      padding: 4px 6px;
      border-bottom: 1px solid var(--pubg-border);
    }
    .payday-matches td {
      padding: 5px 6px;
      border-bottom: 1px solid rgba(94,42,121,0.18);
    }
    .payday-matches .loot-cell {
      display: flex; flex-wrap: wrap; gap: 4px;
    }

    .highlights {
      margin-top: 22px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .highlights .col h3 {
      margin: 0 0 8px;
      color: var(--pubg-muted);
      font-size: 0.8em;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .highlight-item {
      padding: 6px 10px;
      margin-bottom: 4px;
      font-size: 0.85em;
      border-radius: 3px;
      background: rgba(255,255,255,0.04);
    }
    .empty {
      text-align: center;
      color: var(--pubg-muted);
      padding: 40px;
      font-style: italic;
    }
    /* Tab-Switch zwischen Session-Picker und Custom-Range. Nur einer
       von beiden ist sichtbar. Persistenz via URL-Param `view`. */
    /* ── Auswahl-Leiste ──────────────────────────────────────────────
       Eine Leiste statt zwei Tabs. Die Elemente sind bewusst dieselben
       wie in shot-quality und landing-spots: wer das eine Tool kennt,
       muss das andere nicht neu lernen. */
    /* Nur Layout. Flaeche, Textur, Rand, Radius und die Ornament-Ecken
       kommen aus .pubg-card — derselbe Container wie der Report selbst,
       damit beide dieselbe Eckengroesse und Textur tragen. Ein
       handgemachter Nachbau sah in Gothic-Themes anders aus als die
       Karte darunter. */
    /* Bündig mit dem Report darunter, nicht mit dem Fenster: die Leiste
       lief ueber die Kante der Karte hinaus. Die anderen Tools loesen das
       ueber ein max-width am body und merken es deshalb nicht — hier
       traegt die Karte selbst die Breite. */
    .pick-bar { display: flex; flex-direction: column; gap: 8px;
                max-width: var(--t-page-max, 1280px); margin: 0 auto 14px;
                padding: 12px 14px; }
    .pick-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .pick-label {
      min-width: 58px; font-size: 0.78rem; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--theme-text-dim, #a99cb8);
    }
    .pick-bar .switch {
      display: inline-flex; border-radius: 5px; overflow: hidden;
      border: 1px solid var(--theme-border, #3a2c48);
    }
    .pick-bar .switch button {
      font: inherit; font-size: 0.86rem; min-height: 28px; padding: 4px 11px;
      background: transparent; color: var(--theme-text-dim, #a99cb8);
      border: 0; border-right: 1px solid var(--theme-border, #3a2c48);
      cursor: pointer;
    }
    .pick-bar .switch button:last-child { border-right: 0; }
    .pick-bar .switch button[aria-pressed="true"] {
      background: var(--theme-primary, #5e2a79);
      /* on-primary, nicht text: auf einem hellen Theme ist die
         Textfarbe dunkel und stand auf dunklem primary (Kontrast 1,03). */
      color: var(--theme-on-primary, #fff); font-weight: 600;
    }
    .pick-bar .switch button:hover { color: var(--theme-text, #f4f0f8); }
    .pick-step {
      font: inherit; min-width: 30px; min-height: 28px; cursor: pointer;
      background: transparent; color: var(--theme-text-dim, #a99cb8);
      border: 1px solid var(--theme-border, #3a2c48); border-radius: 5px;
    }
    .pick-step:hover:not(:disabled) { color: var(--theme-text, #f4f0f8); }
    .pick-step:disabled { color: var(--theme-text-faint, #6b5f7a); cursor: default; }
    .pick-combo {
      font: inherit; font-size: 0.9rem; min-height: 28px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; text-align: left;
      padding: 3px 10px;
      background: var(--theme-bg, #140d1c); color: var(--theme-text, #f4f0f8);
      border: 1px solid var(--theme-border, #3a2c48); border-radius: 5px;
    }
    .pick-combo .pick-meta { color: var(--theme-text-dim, #a99cb8); font-size: 0.86em; }
    .pick-combo .pick-chev { color: var(--theme-text-faint, #6b5f7a); }
    .pick-count { font-size: 0.8rem; color: var(--theme-text-faint, #6b5f7a); }
    .pick-live { color: var(--theme-accent-text, #f2b705); font-size: 0.8em; }
    .pick-custom { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .pick-custom[hidden] { display: none; }
    .pick-custom label {
      font-size: 0.78rem; color: var(--theme-text-dim, #a99cb8);
    }
    .pick-custom input {
      font: inherit; font-size: 0.84rem; min-height: 28px; padding: 3px 7px;
      background: var(--theme-bg, #140d1c); color: var(--theme-text, #f4f0f8);
      border: 1px solid var(--theme-border, #3a2c48); border-radius: 4px;
    }
    .pick-apply {
      font: inherit; font-size: 0.84rem; min-height: 28px; padding: 3px 12px;
      cursor: pointer;
      background: var(--theme-primary, #5e2a79);
      color: var(--theme-on-primary, #fff);
      border: 1px solid var(--theme-border, #3a2c48); border-radius: 4px;
    }
    .pick-pop {
      max-height: 260px; overflow-y: auto;
      background: var(--theme-bg, #140d1c);
      border: 1px solid var(--theme-border, #3a2c48); border-radius: 6px;
    }
    .pick-pop[hidden] { display: none; }
    .pick-mhead {
      position: sticky; top: 0; padding: 5px 10px;
      font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--theme-text-faint, #6b5f7a);
      background: var(--theme-surface, #241a2e);
    }
    .pick-opt {
      display: flex; gap: 10px; align-items: baseline; width: 100%;
      font: inherit; font-size: 0.87rem; text-align: left; cursor: pointer;
      padding: 5px 10px; border: 0; background: transparent;
      color: var(--theme-text, #f4f0f8);
    }
    .pick-opt:hover { background: var(--theme-primary, #5e2a79); }
    .pick-opt[aria-selected="true"] {
      background: var(--theme-primary, #5e2a79); font-weight: 600;
    }
    .pick-opt .pick-day { min-width: 116px; }
    .pick-opt .pick-num { min-width: 74px; color: var(--theme-text-dim, #a99cb8); }
    .pick-opt .pick-win { min-width: 46px; color: var(--theme-accent-text, #f2b705); }
    .pick-empty {
      padding: 10px; font-size: 0.87rem; color: var(--theme-text-faint, #6b5f7a);
    }
    /* Fokus sichtbar auf allen neuen Bedienelementen (WCAG 2.4.11). */
    .pick-bar .switch button:focus-visible,
    .pick-step:focus-visible, .pick-combo:focus-visible,
    .pick-opt:focus-visible, .pick-apply:focus-visible,
    .pick-custom input:focus-visible {
      outline: 2px solid var(--theme-accent, #f2b705);
      outline-offset: 2px;
    }
    [role="tabpanel"][hidden] { display: none !important; }

    /* ─── Slide-In Match-Detail Panel ───────────────────────────────────── */
    .md-panel {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; justify-content: flex-end;
    }
    .md-panel[hidden] { display: none; }
    .md-panel__backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(2px);
      opacity: 0;
      transition: opacity 220ms ease;
    }
    .md-panel.is-open .md-panel__backdrop { opacity: 1; }
    .md-panel__sheet {
      position: relative;
      width: 90vw; max-width: 1600px;
      height: 100vh;
      background: var(--pubg-purple-bg);
      border-left: 1px solid var(--pubg-border);
      transform: translateX(100%);
      transition: transform 220ms ease;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .md-panel.is-open .md-panel__sheet { transform: translateX(0); }
    .md-panel__header {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px;
      background: rgba(20, 12, 30, 0.95);
      border-bottom: 1px solid var(--pubg-border);
    }
    .md-panel__title {
      margin: 0;
      color: var(--pubg-gold);
      font-size: 1.05em; font-weight: 700;
      letter-spacing: 0.04em;
    }
    .md-panel__close {
      background: transparent; border: 0;
      color: var(--pubg-text);
      cursor: pointer;
      padding: 6px; border-radius: 6px;
      min-width: 44px; min-height: 44px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .md-panel__close:hover { background: rgba(255,255,255,0.08); }
    .md-panel__close:focus-visible {
      outline: 2px solid var(--pubg-gold);
      outline-offset: 2px;
    }
    .md-panel__body {
      flex: 1; min-height: 0;
      overflow-y: auto;
      padding: 16px 18px 32px;
    }
    @media (max-width: 767px) {
      .md-panel__sheet { width: 100vw; max-width: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .md-panel__backdrop, .md-panel__sheet { transition: none; }
    }
    /* Slide-In: Squad-Tabelle (clientseitig aus md.detail.members gerendert) */
    .md-squad-table {
      width: 100%; border-collapse: collapse;
      margin-bottom: 12px;
      font-size: 0.9em;
      font-variant-numeric: tabular-nums;
    }
    .md-squad-table th {
      text-align: right; padding: 6px 6px;
      color: var(--pubg-muted);
      font-size: 0.75em; text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      white-space: nowrap;
    }
    .md-squad-table th:first-child { text-align: left; }
    .md-squad-table td {
      padding: 6px 6px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      text-align: right;
      white-space: nowrap;
    }
    .md-squad-table td.md-st-name { text-align: left; }
    /* Self-Row: dezent hervorgehoben via Background-Tint statt Color —
       sonst frisst color hier die Slot-Farben am Spielernamen (Slot 2
       rot, Slot 4 gruen etc.). Font-weight bleibt fuer leichten Akzent. */
    .md-squad-table tr.self td { font-weight: 700; background: rgba(242,183,5,0.06); }
    /* Slot-Farben (1..4) statisch — JS-Inject ist unzuverlaessig
       wenn CSS-Cascade-Reihenfolge eine Rolle spielt. */
    /* Squad-Plate-Farben aus dem Spiel: Slot 1 gelb, 2 rot, 3 blau,
       4 gruen. Die Zuordnung ist Bedeutung und darf nicht mit dem Theme
       wechseln — auf hellem Grund waren die Originaltoene aber
       unlesbar (Kontrast 1,7 bis 2,9). Darum dieselben Farbtoene,
       abgedunkelt bis 4,6:1. */
    :root {
      --md-slot-1: #f2b705;  /* gelb  */
      --md-slot-2: #ff5a3d;  /* rot   */
      --md-slot-3: #4ec9ff;  /* blau  */
      --md-slot-4: #3dd668;  /* gruen */
    }
    html[data-theme="editorial"] {
      --md-slot-1: #8f6c03; --md-slot-2: #dd2100;
      --md-slot-3: #0078ad; --md-slot-4: #1b8138;
    }
    html[data-theme="swiss"] {
      --md-slot-1: #916e03; --md-slot-2: #e42200;
      --md-slot-3: #007bb0; --md-slot-4: #1c863a;
    }
    /* Zeilen der Karten-Tabelle. Der frueher feste Lila-Ton (#c8b3e3)
       hatte auf editorial Kontrast 1,81. --theme-accent-2 waere dort mit
       3,80 noch unter der Grenze fuer normalen Text; --theme-text-dim
       liegt in JEDEM Theme ueber 5,2 und sagt zudem das Richtige:
       Event-Zeilen sind nachrangig, keine Hervorhebung. */
    .map-row--win { color: var(--theme-accent-text, #f2b705); }
    .map-row--event { color: var(--theme-text-dim, #c8b3e3); }
    .map-perfect { color: var(--theme-accent-text, #f2b705); }
    .md-slot-1 { color: var(--md-slot-1) !important; }
    .md-slot-2 { color: var(--md-slot-2) !important; }
    .md-slot-3 { color: var(--md-slot-3) !important; }
    .md-slot-4 { color: var(--md-slot-4) !important; }
    .md-muted-color { color: var(--pubg-muted); }
    .md-squad-table .md-dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; margin-right: 6px;
      vertical-align: -1px;
      background: currentColor;
    }
    .md-squad-table .bot-kills {
      color: var(--pubg-muted); font-size: 0.85em;
    }
    /* ─── Match-Detail Timeline ─────────────────────────────────────────── */
    .md-timeline {
      margin-top: 18px;
      border-top: 1px solid var(--pubg-border);
      padding-top: 12px;
    }
    .md-timeline__head {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
      margin: 6px 0 14px;
    }
    .md-timeline__title {
      color: var(--pubg-gold);
      font-size: 1em; font-weight: 700;
      margin: 0;
      cursor: pointer;
      list-style: none;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      user-select: none;
    }
    .md-timeline__title:hover { background: rgba(255,255,255,0.04); }
    .md-timeline__title::-webkit-details-marker { display: none; }
    .md-tl-chev { transition: transform 180ms ease; color: var(--pubg-muted); }
    .md-timeline-details[open] > .md-timeline__title .md-tl-chev {
      transform: rotate(180deg);
    }
    .md-timeline__filters {
      display: inline-flex; gap: 6px; flex-wrap: wrap;
    }
    .md-timeline__chip {
      background: transparent;
      color: var(--pubg-muted);
      border: 1px solid var(--pubg-border);
      border-radius: 100px;
      padding: 4px 12px;
      font: inherit; font-size: 12px;
      cursor: pointer;
      min-height: 32px;
    }
    .md-timeline__chip:hover { color: var(--pubg-text); }
    .md-timeline__chip.is-active {
      background: var(--pubg-purple);
      color: var(--theme-on-primary, #fff);
      border-color: var(--pubg-purple);
    }
    .md-timeline__chip:focus-visible {
      outline: 2px solid var(--pubg-gold); outline-offset: 2px;
    }
    .md-timeline__list {
      display: flex; flex-direction: column;
      gap: 2px;
      font-size: 0.92em;
      font-variant-numeric: tabular-nums;
    }
    .md-tl-row {
      display: grid;
      grid-template-columns: 70px minmax(220px, 320px) 1fr;
      gap: 10px;
      padding: 4px 6px;
      align-items: baseline;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .md-tl-row.md-tl-header {
      color: var(--pubg-muted);
      font-size: 0.72em;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      border-bottom: 1px solid var(--pubg-border);
      padding-bottom: 6px;
      margin-bottom: 4px;
    }
    .md-tl-row.md-tl-header .md-tl-t,
    .md-tl-row.md-tl-header .md-tl-poi,
    .md-tl-row.md-tl-header .md-tl-text {
      color: var(--pubg-muted);
    }
    /* Lobby-Rows (vor Plane-Takeoff): zarter rendern, kursiv. */
    .md-tl-row--lobby {
      opacity: 0.65;
      font-style: italic;
    }
    .md-tl-row--lobby .md-tl-t { color: var(--pubg-muted); }
    .md-tl-t   { color: var(--pubg-text); }
    .md-tl-poi {
      color: var(--pubg-gold); font-size: 0.9em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* Sekundaerer POI (Victim-Standort bei langen Schuessen) — dezenter */
    .md-tl-target-poi {
      color: var(--pubg-muted);
      font-size: 0.85em;
      font-weight: 400;
    }
    .md-tl-text {
      color: var(--pubg-text);
    }
    .md-tl-text b { font-weight: 700; }
    .md-tl-clantag {
      display: inline-block;
      font-weight: 700;
      /* color + size inherit aus Klasse (md-slot-N / md-team-N) bzw.
         vom Eltern-Element. Bewusst KEINE Hardcoded-Gold/Size. */
      margin-right: 2px;
    }
    .md-survived { color: var(--pubg-gold); }
    .md-dim { color: var(--pubg-muted); font-size: 0.88em; }
    .md-tl-multifight {
      color: var(--pubg-red, #e05c5c);
      font-size: 0.85em;
      font-weight: 600;
      margin-left: 0.3em;
    }
    .md-tl-name[data-kd-tip] {
      cursor: default;
      position: relative;
    }
    .md-tl-name[data-kd-tip]::after {
      content: attr(data-kd-tip);
      display: none;
      position: absolute;
      bottom: calc(100% + 5px);
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      background: var(--theme-surface-2, #1f1430);
      color: var(--theme-text, #e0daf5);
      border: 1px solid var(--theme-accent, #5e2a79);
      border-radius: 5px;
      padding: 3px 9px;
      font-size: 0.82em;
      font-weight: 400;
      pointer-events: none;
      z-index: 100;
    }
    .md-tl-name[data-kd-tip]:hover::after { display: block; }
    .md-tl-text .md-tl-teamtag {
      display: inline-block;
      margin-left: 3px;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid currentColor;
      font-size: 0.78em;
      font-weight: 700;
      letter-spacing: 0.03em;
      background: rgba(255,255,255,0.03);
      vertical-align: 1px;
    }
    .md-tl-empty {
      color: var(--pubg-muted);
      font-style: italic;
      padding: 12px 0;
    }
    @media (max-width: 600px) {
      .md-tl-row {
        grid-template-columns: 64px 1fr;
      }
      .md-tl-poi { grid-column: 1 / -1; padding-left: 74px; font-size: 0.82em; }
      .md-tl-text { grid-column: 1 / -1; padding-left: 74px; }
    }
    .month-group__name {
      flex: 1;
      color: var(--pubg-gold);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .month-group__count {
      color: var(--pubg-muted);
      font-size: 0.85em;
      font-variant-numeric: tabular-nums;
    }
    .month-group__chev {
      color: var(--pubg-muted);
      transition: transform 180ms ease;
    }
    .month-group__body {
      padding: 0 10px 10px;
    }
    @media (prefers-reduced-motion: reduce) {
      .month-group__chev { transition: none; }
    }
  </style>
</head>
<body>
  <!-- Eine Leiste statt zwei Tabs: derselbe switch wie in shot-quality
       und landing-spots, darunter die Session mit Pfeilen zu den
       Nachbarn. Der Sprung zur Session davor war die haeufigste Aktion
       und kostete vorher Monat-aufklappen plus Scrollen. -->
  <div class="pubg-card pick-bar">
    <div class="pick-row">
      <span class="pick-label" id="lblRange">Range</span>
      <span class="switch" role="group" aria-labelledby="lblRange" id="rangeSwitch">
        <button type="button" data-r="current" aria-pressed="true">Current</button>
        <button type="button" data-r="today" aria-pressed="false">Today</button>
        <button type="button" data-r="7" aria-pressed="false">7 days</button>
        <button type="button" data-r="30" aria-pressed="false">30 days</button>
        <button type="button" data-r="all" aria-pressed="false">All</button>
        <button type="button" data-r="custom" aria-pressed="false">Custom&hellip;</button>
      </span>
    </div>
    <div class="pick-row" id="sessionRow">
      <span class="pick-label" id="lblSession">Session</span>
      <button type="button" class="pick-step" id="sessPrev"
              aria-label="Previous session">&#9664;</button>
      <button type="button" class="pick-combo" id="sessCombo"
              aria-expanded="false" aria-haspopup="listbox"
              aria-controls="sessPop">&mdash;</button>
      <button type="button" class="pick-step" id="sessNext"
              aria-label="Next session">&#9654;</button>
      <span class="pick-count" id="sessCount"></span>
    </div>
    <div class="pick-custom" id="customRow" hidden>
      <label for="dateFrom">From</label>
      <input type="date" id="dateFrom">
      <input type="time" id="timeFrom" value="00:00" step="60"
             aria-label="From time">
      <label for="dateTo">To</label>
      <input type="date" id="dateTo">
      <input type="time" id="timeTo" value="23:59" step="60"
             aria-label="To time">
      <button type="button" class="pick-apply" id="applyRange">Apply</button>
    </div>
    <div class="pick-pop" id="sessPop" role="listbox"
         aria-label="Sessions" hidden></div>
  </div>
  <div class="pubg-card report pubg-fade-in" id="report">
    <div class="empty">— loading —</div>
  </div>

  <script src="_pubg.js"></script>
  <script src="_pubg_pois.js"></script>
  <script>
    const FROM = PubgUI.qs("from", "");
    const TO = PubgUI.qs("to", "");

    // ── Match-Detail v2 Globals ──────────────────────────────────────────
    // Fallback-Palette wenn kein Slot bekannt ist (alte Matches vor der
    // Slot-Capture-Migration). Reihenfolge irrelevant fuer Lesbarkeit.
    const MD_COLORS = [
      "#f2b705", "#e74c3c", "#3498db", "#2ecc71",
      "#ff7a1f", "#9b59b6", "#1abc9c", "#ec407a",
    ];
    // PUBG-In-Game Squad-Plate-Farben — index = slot-1 (Roster-Slot 1..4).
    // Reihenfolge per User-Vorgabe: Slot 1 gelb, 2 rot/orange, 3 blau, 4 grün.
    //: Aus den CSS-Tokens gelesen, damit Karte und Text dieselbe Farbe
    //: tragen — auf hellen Themes sind das die abgedunkelten Varianten.
    //: Fallback auf die Originaltoene, falls das Stylesheet fehlt.
    const MD_SLOT_FALLBACK = ["#f2b705", "#ff5a3d", "#4ec9ff", "#3dd668"];
    const MD_SLOT_COLORS = (() => {
      try {
        const cs = getComputedStyle(document.documentElement);
        return MD_SLOT_FALLBACK.map((def, i) =>
          (cs.getPropertyValue(`--md-slot-${i + 1}`) || "").trim() || def);
      } catch (e) {
        return MD_SLOT_FALLBACK.slice();
      }
    })();
    // Canvas-Display-Size (px). devicePixelRatio wird in mdRenderBasemap
    // separat angewendet, damit das Bitmap-Buffer hoeher aufgeloest ist
    // als die CSS-Box — fuer scharfe HD-Maps auch auf Retina-Screens.
    const MD_MAP_PX = 360;
    const MD_PAD_500M_CM = 50000;   // 500m padding fuer Default-Bbox
    const MD_MIN_ZOOM_CM = 5000;    // 50m minimal sichtbarer Radius
    const MD_MAX_ZOOM_CM = 800000;  // 8km — ganze Map default Erangel-Range
    // 1x = 1 Match-Sekunde pro Real-Sekunde. 4x = 4 Match-Sekunden pro Real-Sekunde.
    // (frueher: ganzes Match in 60s — match-laengen-abhaengig, verwirrend.)
    const MD_SPEEDS = [1, 2, 4, 8, 16];
    const MD_DEFAULT_SPEED = 4;

    // Cache fuer match-detail responses
    const _mdCache = new Map();
    async function mdLoad(matchId) {
      if (!matchId) return null;
      if (_mdCache.has(matchId)) {
        const c = _mdCache.get(matchId);
        // Stale-Check: Eintraege ohne playerKds stammen von vor dem
        // Feature-Deploy und werden einmalig neu abgerufen.
        if ('playerKds' in c) return c;
        _mdCache.delete(matchId);
      }
      let d = null;
      try {
        d = await PubgUI.fetchJson(
          (window.__SERVE_BASE__||"/") + `api/pubg/match-detail?matchId=${encodeURIComponent(matchId)}`,
          60000);
      } catch (e) { console.warn("mdLoad failed", matchId, e); }
      // Wenn die Anfrage fehlschlug, NICHT cachen — sonst friert ein
      // einmaliger Timeout das Match permanent ein.
      if (!d) return { detail: null, colorByAcc: {} };
      const colorByAcc = {};
      if (d.members) {
        d.members.forEach((m, i) => {
          // Slot-basierte PUBG-Plate-Farbe wenn verfuegbar (neue Matches),
          // sonst MD_COLORS-Fallback (alte Matches ohne slot).
          const slot = m.slot;
          colorByAcc[m.accountId] = (slot >= 1 && slot <= MD_SLOT_COLORS.length)
            ? MD_SLOT_COLORS[slot - 1]
            : MD_COLORS[i % MD_COLORS.length];
        });
      }
      const cached = { detail: d, colorByAcc, playerKds: d.playerKds ?? {} };
      // playerKds: immer als eigenes Feld speichern — 'playerKds' in cached
      // dient als Frische-Marker fuer den Stale-Check oben.
      _mdCache.set(matchId, cached);
      return cached;
    }

    // Map-Image-Cache: _hd.webp zuerst (8192px webp, ~6-13MB) — gleiche
    // Aufloesung wie das High_Res-PNG aber 10x kleiner. .png als Fallback
    // wenn _hd.webp fuer eine Map noch nicht erzeugt wurde.
    const _mdImgCache = new Map();
    function mdMapImage(mapName) {
      if (!mapName) return Promise.resolve(null);
      if (_mdImgCache.has(mapName)) return _mdImgCache.get(mapName);
      const p = new Promise((res) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = () => {
          const img2 = new Image();
          img2.onload = () => res(img2);
          img2.onerror = () => res(null);
          img2.src = `${window.__STATIC_BASE__||"/widgets/"}pubg/maps/${mapName}.png`;
        };
        img.src = `${window.__STATIC_BASE__||"/widgets/"}pubg/maps/${mapName}_hd.webp`;
      });
      _mdImgCache.set(mapName, p);
      return p;
    }

    // Pin-Calibration (identisch poi-editor.html)
    function mdApplyPinCal(xCm, yCm, mapKm, cal) {
      if (!cal) return [xCm, yCm];
      const mc = mapKm * 100000 / 2;
      let x = xCm, y = yCm;
      if (cal.flipX) x = 2 * mc - x;
      if (cal.flipY) y = 2 * mc - y;
      const rot = ((cal.rotate || 0) % 360 + 360) % 360;
      if (rot !== 0) {
        const dx = x - mc, dy = y - mc;
        if (rot === 90)  { x = mc - dy; y = mc + dx; }
        if (rot === 180) { x = mc - dx; y = mc - dy; }
        if (rot === 270) { x = mc + dy; y = mc - dx; }
      }
      const ex = (x - mc) * (cal.scaleX || 1) + mc + (cal.offsetX || 0);
      const ey = (y - mc) * (cal.scaleY || 1) + mc + (cal.offsetY || 0);
      return [ex, ey];
    }

    // State pro Host (DOM-Element) als WeakMap
    const _mdState = new WeakMap();
    function mdGetState(host) {
      let s = _mdState.get(host);
      if (!s) {
        s = {
          detail: null,           // match-detail-response
          colorByAcc: {},
          hiddenAccs: new Set(),   // accountIds die ausgeblendet sind
          viewport: null,          // {centerX, centerY, zoom, autoFollow}
          playSpeed: MD_DEFAULT_SPEED,  // Multiplikator (siehe MD_SPEEDS)
          zeitraffer: {            // cursorTs in ms relativ zu matchStart
            cursorTs: 0, playing: false,
            playStartWallTs: 0, playStartCursor: 0,
            matchStart: 0, matchEnd: 0,
          },
          hoveredMarker: null,
          playToken: 0,
          dragPan: null,            // {startX, startY, startCenterX, startCenterY}
        };
        _mdState.set(host, s);
      }
      return s;
    }

    // Cm-zu-Canvas-Pixel umrechnen anhand Viewport + Calibration
    function mdCmToCanvas(host, xCm, yCm) {
      const s = mdGetState(host);
      const vp = s.viewport;
      if (!vp) return [0, 0];
      const mapKm = parseFloat(host.dataset.mapKm) || 8;
      let cal = {};
      try { cal = JSON.parse(host.dataset.cal || "{}"); } catch (e) {}
      const [ex, ey] = mdApplyPinCal(xCm, yCm, mapKm, cal);
      // Viewport.zoom = Pixel pro cm
      const px = (MD_MAP_PX / 2) + (ex - vp.centerX) * vp.zoom;
      const py = (MD_MAP_PX / 2) + (ey - vp.centerY) * vp.zoom;
      return [px, py];
    }

    // Inverse: Canvas-Pixel → cm (fuer Click-Hit-Testing)
    function mdCanvasToCm(host, px, py) {
      const s = mdGetState(host);
      const vp = s.viewport;
      if (!vp) return [0, 0];
      return [
        vp.centerX + (px - MD_MAP_PX / 2) / vp.zoom,
        vp.centerY + (py - MD_MAP_PX / 2) / vp.zoom,
      ];
    }

    // Bbox aus Liste von [x, y] cm-Coords + Padding
    function mdBboxFitViewport(coords, paddingCm) {
      if (!coords.length) {
        return { centerX: 400000, centerY: 400000, zoom: MD_MAP_PX / 800000,
                  autoFollow: true };
      }
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const [x, y] of coords) {
        if (x < x0) x0 = x; if (y < y0) y0 = y;
        if (x > x1) x1 = x; if (y > y1) y1 = y;
      }
      const cx = (x0 + x1) / 2;
      const cy = (y0 + y1) / 2;
      const w = Math.max(MD_PAD_500M_CM * 2,
                          (x1 - x0) + 2 * paddingCm,
                          (y1 - y0) + 2 * paddingCm);
      return {
        centerX: cx, centerY: cy,
        zoom: MD_MAP_PX / w,
        autoFollow: true,
      };
    }

    async function mdRenderBasemap(host) {
      const canvas = host.querySelector("canvas.md-basemap");
      if (!canvas) return;
      const mapName = host.getAttribute("data-map");
      const blob = (window._poiData || {})[mapName] || {};
      const mapKm = blob.mapKm || 8;
      const cal = blob.pinCalibration || {};
      host.dataset.mapKm = mapKm;
      host.dataset.cal = JSON.stringify(cal);

      // Bitmap-Buffer immer 2x CSS-Size (mit DPR-Boost auf Retina) →
      // HD-Webp Source nutzt Aufloesung, statt downscaled darzustellen.
      const dpr = Math.max(2, Math.min(3, window.devicePixelRatio || 1));
      const BUF = Math.round(MD_MAP_PX * dpr);
      canvas.width = BUF; canvas.height = BUF;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.fillStyle = "#0d061a";
      ctx.fillRect(0, 0, BUF, BUF);

      const img = await mdMapImage(mapName);
      if (!img || !img.naturalWidth) return;

      const s = mdGetState(host);
      const vp = s.viewport;
      if (!vp) return;

      // Quell-Region berechnen: Viewport in Map-cm → in Bild-pixel
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const cropOffX = (img.naturalWidth  - side) / 2;
      const cropOffY = (img.naturalHeight - side) / 2;
      const mapCm = mapKm * 100000;

      // Welche cm-Region wollen wir zeichnen? Viewport: centerX +/- (150/zoom) cm
      const halfVisibleCm = (MD_MAP_PX / 2) / vp.zoom;
      let cmX0 = vp.centerX - halfVisibleCm;
      let cmY0 = vp.centerY - halfVisibleCm;
      let cmX1 = vp.centerX + halfVisibleCm;
      let cmY1 = vp.centerY + halfVisibleCm;

      // cm → Bild-Pixel: (cm / mapCm) * side + cropOff
      function cmToImg(cm, axis) {
        return (cm / mapCm) * side + (axis === "x" ? cropOffX : cropOffY);
      }
      const sx = cmToImg(cmX0, "x");
      const sy = cmToImg(cmY0, "y");
      const sw = ((cmX1 - cmX0) / mapCm) * side;
      const sh = ((cmY1 - cmY0) / mapCm) * side;

      // Clamping wenn Viewport ueber Karten-Rand geht — pad mit Hintergrund
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, BUF, BUF);
    }

    function mdRenderOverlay(host) {
      const canvas = host.querySelector("canvas.md-overlay");
      if (!canvas) return;
      // Buffer auf DPR skalieren + ctx.scale damit unsere Zeichen-
      // koordinaten weiter in CSS-Pixeln (0..MD_MAP_PX) liegen.
      const dpr = Math.max(2, Math.min(3, window.devicePixelRatio || 1));
      const BUF = Math.round(MD_MAP_PX * dpr);
      canvas.width = BUF; canvas.height = BUF;
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, MD_MAP_PX, MD_MAP_PX);

      const s = mdGetState(host);
      if (!s.detail || !s.detail.members) return;
      const cursorTs = s.zeitraffer.cursorTs;
      const matchStart = s.zeitraffer.matchStart;
      const absTs = matchStart + cursorTs;
      const inDefault = (cursorTs === 0);
      const visibleMembers = s.detail.members.filter(
        m => !s.hiddenAccs.has(m.accountId));

      for (const m of visibleMembers) {
        const color = s.colorByAcc[m.accountId] || "#999";
        if (!m.lives) continue;
        for (const life of m.lives) {
          const planeStartTs = life.planeRoute.length
            ? life.planeRoute[0][2] : null;
          const landingTs = life.landing ? life.landing.tsMs : null;
          const showPlaneRoute = inDefault
            || (landingTs && absTs <= landingTs && planeStartTs && absTs >= planeStartTs);
          if (showPlaneRoute && life.planeRoute.length >= 2) {
            ctx.strokeStyle = color;
            ctx.globalAlpha = 0.6;
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            life.planeRoute.forEach(([xCm, yCm], i) => {
              const [cx, cy] = mdCmToCanvas(host, xCm, yCm);
              if (i === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
            });
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 1;
          }

          // Landing-Pin (sobald cursor >= landing-ts oder im Default)
          const showLanding = inDefault
            || (landingTs && absTs >= landingTs);
          if (showLanding && life.landing) {
            const [cx, cy] = mdCmToCanvas(host, life.landing.x, life.landing.y);
            ctx.beginPath();
            ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.9)";
            ctx.lineWidth = 0.75;
            ctx.stroke();
          }

          // groundPath als Trail bis cursor (nicht im Default-View) —
          // interpoliert das letzte Segment damit das Wegende GLEICHMAESSIG
          // mit dem Pin mitwandert (sonst springt der Weg in 10s-Stufen).
          if (!inDefault && landingTs && life.groundPath.length >= 2) {
            const trailEnd = life.death
              ? Math.min(absTs, life.death.tsMs)
              : absTs;
            if (trailEnd > landingTs) {
              ctx.strokeStyle = color;
              ctx.globalAlpha = 0.7;
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              let started = false;
              let lastDrawnIdx = -1;
              for (let i = 0; i < life.groundPath.length; i++) {
                const [xCm, yCm, ts] = life.groundPath[i];
                if (ts > trailEnd) break;
                const [cx, cy] = mdCmToCanvas(host, xCm, yCm);
                if (!started) { ctx.moveTo(cx, cy); started = true; }
                else { ctx.lineTo(cx, cy); }
                lastDrawnIdx = i;
              }
              // Interpoliertes letztes Segment: zwischen lastDrawn und naechstem Sample
              if (started && lastDrawnIdx >= 0
                  && lastDrawnIdx < life.groundPath.length - 1) {
                const [, , tsA] = life.groundPath[lastDrawnIdx];
                const [xB, yB, tsB] = life.groundPath[lastDrawnIdx + 1];
                if (tsB > tsA && trailEnd > tsA) {
                  const f = Math.min(1, (trailEnd - tsA) / (tsB - tsA));
                  const [xA, yA] = life.groundPath[lastDrawnIdx];
                  const ix = xA + (xB - xA) * f;
                  const iy = yA + (yB - yA) * f;
                  const [icx, icy] = mdCmToCanvas(host, ix, iy);
                  ctx.lineTo(icx, icy);
                }
              }
              ctx.stroke();
              ctx.globalAlpha = 1;
            }
          }

          // Crawl-Path nach Knock (gekrochener Weg zwischen DBNO und Tod) —
          // gestrichelt in heller Member-Farbe. Letztes Segment interpoliert.
          if (!inDefault && life.death && life.death.knockTsMs
              && life.death.crawl && life.death.crawl.length >= 2) {
            const knockTs = life.death.knockTsMs;
            const trailEnd = Math.min(absTs, life.death.tsMs);
            if (trailEnd > knockTs) {
              ctx.strokeStyle = color;
              ctx.globalAlpha = 0.55;
              ctx.lineWidth = 1.5;
              ctx.setLineDash([3, 3]);
              ctx.beginPath();
              let started = false;
              let lastIdx = -1;
              for (let i = 0; i < life.death.crawl.length; i++) {
                const [xCm, yCm, ts] = life.death.crawl[i];
                if (ts > trailEnd) break;
                const [cx, cy] = mdCmToCanvas(host, xCm, yCm);
                if (!started) { ctx.moveTo(cx, cy); started = true; }
                else { ctx.lineTo(cx, cy); }
                lastIdx = i;
              }
              if (started && lastIdx >= 0 && lastIdx < life.death.crawl.length - 1) {
                const [xA, yA, tsA] = life.death.crawl[lastIdx];
                const [xB, yB, tsB] = life.death.crawl[lastIdx + 1];
                if (tsB > tsA && trailEnd > tsA) {
                  const f = Math.min(1, (trailEnd - tsA) / (tsB - tsA));
                  const ix = xA + (xB - xA) * f;
                  const iy = yA + (yB - yA) * f;
                  const [icx, icy] = mdCmToCanvas(host, ix, iy);
                  ctx.lineTo(icx, icy);
                }
              }
              ctx.stroke();
              ctx.setLineDash([]);
              ctx.globalAlpha = 1;
            }
          }

          // Death-Pin (sobald cursor >= death-ts)
          if (!inDefault && life.death && absTs >= life.death.tsMs) {
            const [cx, cy] = mdCmToCanvas(host, life.death.x, life.death.y);
            ctx.beginPath();
            ctx.arc(cx, cy, 5, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 1;
            ctx.stroke();
            // Knock-Pin: kleiner offener Ring am Anfang des Crawls
            if (life.death.knockTsMs && life.death.crawl && life.death.crawl.length) {
              const [kx, ky] = life.death.crawl[0];
              const [kcx, kcy] = mdCmToCanvas(host, kx, ky);
              ctx.beginPath();
              ctx.arc(kcx, kcy, 4.5, 0, Math.PI * 2);
              ctx.strokeStyle = color;
              ctx.lineWidth = 1.2;
              ctx.stroke();
            }
          }

          // Kill-Marker (sobald cursor >= kill-ts) — nur das Opfer-X.
          // Kein Schuetze-Pin, keine Schusslinie (Userwunsch: weniger
          // Cluttering, Distanz steht im Hover-Label).
          if (!inDefault) {
            for (const k of life.kills) {
              if (absTs < k.tsMs) continue;
