              if (k.victimX == null) continue;
              const [vx, vy] = mdCmToCanvas(host, k.victimX, k.victimY);
              ctx.strokeStyle = color;
              ctx.lineWidth = 2;
              const xs = 4.5;
              ctx.beginPath();
              ctx.moveTo(vx - xs, vy - xs); ctx.lineTo(vx + xs, vy + xs);
              ctx.moveTo(vx - xs, vy + xs); ctx.lineTo(vx + xs, vy - xs);
              ctx.stroke();
            }
          }
        }

        // Revive-Pins (nur bis cursor erreicht)
        if (m.revivePts) {
          for (const [xCm, yCm, ts] of m.revivePts) {
            if (!inDefault && absTs < ts) continue;
            const [cx, cy] = mdCmToCanvas(host, xCm, yCm);
            ctx.beginPath();
            ctx.arc(cx, cy, 3, 0, Math.PI * 2);
            ctx.fillStyle = "#2ecc71";
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.85)";
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }
        }

        // Aktiver Zeitraffer-Pin (interpolated Position)
        if (!inDefault && s.zeitraffer.playing || (!inDefault && cursorTs > 0)) {
          const activePin = mdInterpolatePin(m, absTs);
          if (activePin) {
            const [cx, cy] = mdCmToCanvas(host, activePin.x, activePin.y);
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
    }

    // Liefert {x, y} fuer Member m zum Absolut-Timestamp absTs
    // durch Interpolation im aktuellen Leben.
    function mdInterpolatePin(m, absTs) {
      if (!m.lives) return null;
      for (const life of m.lives) {
        if (!life.landing) continue;
        if (life.death && absTs > life.death.tsMs) continue;
        const fullPath = [...(life.planeRoute || []), ...(life.groundPath || [])];
        if (fullPath.length < 2) {
          if (life.landing) return { x: life.landing.x, y: life.landing.y };
          continue;
        }
        if (absTs < fullPath[0][2]) return null;
        // Bisect
        for (let i = 0; i < fullPath.length - 1; i++) {
          const [x0, y0, t0] = fullPath[i];
          const [x1, y1, t1] = fullPath[i + 1];
          if (absTs >= t0 && absTs <= t1) {
            const f = (absTs - t0) / Math.max(1, (t1 - t0));
            return { x: x0 + (x1 - x0) * f, y: y0 + (y1 - y0) * f };
          }
        }
        const last = fullPath[fullPath.length - 1];
        return { x: last[0], y: last[1] };
      }
      return null;
    }

    function mdRenderCards(host) {
      const wrap = host.querySelector(".md-cards");
      if (!wrap) return;
      const s = mdGetState(host);
      if (!s.detail || !s.detail.members) {
        wrap.innerHTML = "";
        return;
      }
      function fmtMinSec(sec) {
        if (sec == null) return "?";
        const m = Math.floor(sec / 60);
        const ss = sec % 60;
        return `${m}:${String(ss).padStart(2, "0")}`;
      }
      function poi(x, y, mapName) {
        if (x == null || y == null) return null;
        if (PubgUI.POI && PubgUI.POI.fromCoords)
          return PubgUI.POI.fromCoords(mapName, x, y);
        return null;
      }
      const mapName = host.getAttribute("data-map");
      const html = s.detail.members.map((m) => {
        const color = s.colorByAcc[m.accountId] || "#999";
        const active = s.hiddenAccs.has(m.accountId) ? " hidden" : "";
        const selfCls = m.isSelf ? " md-self" : "";
        const who = m.name;
        // Overall-Badge: alive falls letztes Leben ohne Death, sonst der letzte Death
        let badge = '<span class="md-badge alive">ueberlebt</span>';
        if (m.lives && m.lives.length) {
          const last = m.lives[m.lives.length - 1];
          if (last.death) {
            const sec = Math.floor(
              (last.death.tsMs - (s.zeitraffer.matchStart || 0)) / 1000);
            badge = `<span class="md-badge died">† ${fmtMinSec(sec)}</span>`;
          }
        }
        // Lives-Detail (eine Zeile pro Leben)
        const livesHtml = (m.lives || []).map((life, idx) => {
          const prefix = m.lives.length > 1 ? `Life ${life.lifeIndex}: ` : "";
          const landP = life.landing
            ? poi(life.landing.x, life.landing.y, mapName) : null;
          let row = `${prefix}landed at <b>${landP || "?"}</b>`;
          if (life.death) {
            const deathP = poi(life.death.x, life.death.y, mapName);
            const killer = life.death.killerName || "an opponent";
            const wn = life.death.weaponName || "?";
            const dist = life.death.distanceM
              ? ` at <b>${life.death.distanceM.toFixed(0)}m</b>` : "";
            // Cause-Label-Prioritaet: death > knock > Standard
            const causeLbl = life.death.causeLabel || life.death.knockCauseLabel;
            // Fahrzeug-Kontext: war Opfer beim Tod (oder beim Knock) im Fahrzeug
            const vehLbl = life.death.victimVehicleLabel
                        || life.death.knockVictimVehicleLabel;
            const vehTag = vehLbl
              ? ` <span class="md-veh">from <b>${vehLbl}</b> <span class="material-symbols-outlined icon-sm" aria-hidden="true">directions_bus</span></span>`
              : "";
            if (causeLbl) {
              const verb = life.death.causeLabel ? "died" : "knocked + died";
              row += ` <span class="md-died">— ${verb} in <b>${deathP || "?"}</b> — <b>${causeLbl}</b>${vehTag}</span>`;
            } else {
              row += ` <span class="md-died">— died in <b>${deathP || "?"}</b>, killed by <b>${killer}</b> with <b>${wn}</b>${dist}${vehTag}</span>`;
            }
          } else if (m.lives.length > 1) {
            row += ` <span class="md-survived">— survived</span>`;
          }
          return `<div class="md-life">${row}</div>`;
        }).join("");
        return `<div class="md-card${active}${selfCls}" data-acc="${m.accountId}">
          <div class="md-head">
            <span class="md-dot" style="background:${color}"></span>
            <span class="md-name">${who}</span>
            ${badge}
          </div>
          ${livesHtml}
        </div>`;
      }).join("");
      wrap.innerHTML = html;
    }

    function mdRenderState(host) {
      const s = mdGetState(host);
      if (!s.detail) return;
      mdRenderBasemap(host);
      mdRenderOverlay(host);
      mdRenderCards(host);
      mdUpdateScrubBar(host);
      mdUpdateAlleBar(host);
    }

    function mdUpdateScrubBar(host) {
      const s = mdGetState(host);
      const z = s.zeitraffer;
      const slider = host.querySelector("input.md-scrub-slider");
      const timeEl = host.querySelector(".md-scrub .md-time");
      const playBtn = host.querySelector(".md-scrub .md-play-btn");
      if (!slider || !timeEl) return;
      const dur = z.matchEnd - z.matchStart;
      slider.min = 0; slider.max = dur; slider.step = 1000;
      slider.value = z.cursorTs;
      function fmt(ms) {
        const sec = Math.floor(ms / 1000);
        return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
      }
      timeEl.textContent = `${fmt(z.cursorTs)} / ${fmt(dur)}`;
      if (playBtn) playBtn.textContent = z.playing ? "⏸" : "▶";
      host.querySelectorAll(".md-speedbtn").forEach(btn => {
        btn.classList.toggle("active",
          parseFloat(btn.dataset.speed) === (s.playSpeed || MD_DEFAULT_SPEED));
      });
    }

    function mdUpdateAlleBar(host) {
      const s = mdGetState(host);
      const btn = host.querySelector(".md-allebtn");
      if (!btn) return;
      const anyHidden = s.hiddenAccs && s.hiddenAccs.size > 0;
      btn.classList.toggle("solo-active", anyHidden);
      btn.textContent = anyHidden ? "↺ Show all" : "● All visible";
    }

    function _fmtSurvSec(secs) {
      const m = Math.floor((secs||0)/60);
      const s = (secs||0) % 60;
      return `${m}:${String(s).padStart(2,"0")}`;
    }
    // Echter Todeszeitpunkt aus der Telemetrie (letztes life.death.tsMs).
    // PUBG's time_survived stoppt beim Knock (DBNO), nicht beim Bleed-Out/
    // Finisher → wir nehmen lieber den Telemetrie-Wert fuer Konsistenz
    // mit der Timeline. Bezugspunkt = Plane-Takeoff (fallback: Lobby-Start).
    function _mdMemberDeathSec(m, zeroMs) {
      const lives = m.lives || [];
      let lastDeath = null;
      for (const l of lives) {
        if (l.death && l.death.tsMs != null) lastDeath = l.death.tsMs;
      }
      if (lastDeath == null || zeroMs == null) return null;
      return Math.max(0, Math.floor((lastDeath - zeroMs) / 1000));
    }
    function renderMdSquadTable(members, colorByAcc, zeroMs) {
      const rows = members.map(m => {
        const color = colorByAcc[m.accountId] || "#999";
        const place = (m.place != null) ? `#${m.place}` : "—";
        const kills = m.kills || 0;
        const bk    = m.botKills || 0;
        const killsCell = bk
          ? `${kills} <span class="bot-kills" title="${bk} davon Bot-Kills">(${bk})</span>`
          : `${kills}`;
        // Echte Todeszeit aus Telemetrie; falls keine (Survivor): time_survived
        const deathSec = _mdMemberDeathSec(m, zeroMs);
        const survCell = (deathSec != null)
          ? _fmtSurvSec(deathSec)
          : _fmtSurvSec(m.timeSurvived);
        // Klassen-basiert: Slot 1..4 → md-slot-N, sonst Team-Hue
        const cls = (m.slot >= 1 && m.slot <= 4)
          ? `md-slot-${m.slot}`
          : "md-muted-color";
        return `<tr${m.isSelf ? ' class="self"' : ""}>
          <td class="md-st-name"><span class="md-dot ${cls}"></span>
              ${(m.clan && m.clan.tag) ? `<span class="md-tl-clantag ${cls}" title="${(m.clan.name || "").replace(/"/g, "&quot;")}">[${m.clan.tag}]</span> ` : ""}<b class="${cls}">${m.name}${m.isSelf ? " (du)" : ""}</b></td>
          <td>${place}</td>
          <td>${killsCell}</td>
          <td>${m.headshotKills || 0}</td>
          <td>${m.assists || 0}</td>
          <td>${m.dbnos || 0}</td>
          <td title="How often this player was revived">${m.revivesReceived || 0}</td>
          <td title="How often this player revived squadmates">${m.revivesGiven || 0}</td>
          <td>${Math.round(m.damageDealt || 0)}</td>
          <td title="Match time until the actual death (bleed-out/finisher); for survivors PUBG's time_survived">${survCell}</td>
        </tr>`;
      }).join("");
      return `<table class="md-squad-table">
        <thead><tr>
          <th>Member</th>
          <th title="Placement">#</th>
          <th>K</th>
          <th title="Headshot Kills">HS</th>
          <th title="Assists">Ass</th>
          <th title="DBNOs dealt (knocks on opponents)">DBNO</th>
          <th title="How often this player was knocked and revived without dying in between">KO</th>
          <th title="How often this player revived squadmates">REV</th>
          <th>DMG</th>
          <th>Surv</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    // ── Match-Detail Timeline (englisch, natuerlichsprachlich) ────────
    // Filter-Chips: All / Me / Knocks / Kills / Revives
    const _MD_TIMELINE_FILTERS = [
      ["all",     "All",     null],
      ["me",      "Me",      null],
      ["lobby",   "Lobby",   ["join"]],
      ["knocks",  "Knocks",  ["knock"]],
      ["kills",   "Kills",   ["kill", "kill_finish", "kill_steal", "kill_bleedout",
                              "kill_self_eject", "kill_fall", "kill_bluezone",
                              "kill_redzone", "kill_drown", "kill_self"]],
      ["revives", "Revives", ["revive", "revive_inferred", "redeploy",
                                "comeback", "chip_pickup", "chip_drop",
                                "chip_upload", "chip_upload_comeback",
                                "chip_upload_carepackage"]],
    ];

    // Enemy-Team-Farben: HSL-Generativ. Multiplikator 67 (prim) gibt
    // schoenen Spread ueber den Farbkreis — Team 18 (126°) vs Team 26
    // (302°) sind klar unterscheidbar. Funktioniert kollisionsfrei fuer
    // Team-IDs 1..30+ (cycle: 360/gcd(67,360) = 360).
    // CSS-Klassen-Generator. Slots haben fixe PUBG-Farben (gelb/rot/
    // blau/gruen). Teams werden 1..100 via HSL-Rotation generiert mit
    // 2 Lightness-Baendern + niedrigerer Saturation als Slots — so dass
    // selbst bei aehnlichem Hue (z.B. Team mit ~60° Hue) klar von Slot 1
    // (gelb, vollgesaettigt) unterscheidbar bleibt.
    // Team-Farben 1..100 dynamisch injiziert (zu viele fuer statisch).
    // Slot-Klassen sind oben im statischen CSS-Block.
    (function _injectTeamPalette() {
      const css = [];
      for (let i = 1; i <= 100; i++) {
        const hue = (i * 67) % 360;
        const l = (i % 2) ? 72 : 60;
        css.push(`.md-team-${i}{color:hsl(${hue},55%,${l}%);}`);
      }
      const style = document.createElement("style");
      style.textContent = css.join("");
      document.head.appendChild(style);
    })();

    function mdTlActorClass(ev, role) {
      const slot   = ev[role + "Slot"];
      const teamId = ev[role + "TeamId"];
      const isSquad = ev[role + "IsSquad"];
      // Squad → IMMER Slot-Farbe (nie Team-Farbe). Slot 1..4 = PUBG-
      // Plate-Farbe; ohne Slot dezent grau (kein Team-Hue!).
      if (isSquad) {
        return (slot >= 1 && slot <= 4) ? `md-slot-${slot}` : "md-muted-color";
      }
      if (teamId != null) {
        // Enemy → Team-Hue via deterministischer Klasse.
        const n = (Math.abs(teamId | 0) % 100) + 1;
        return `md-team-${n}`;
      }
      return "md-muted-color";
    }

    function mdTlEnemyTeamColor(teamId) {
      if (teamId == null) return "var(--pubg-muted)";
      const hue = (Math.abs(teamId | 0) * 67) % 360;
      return `hsl(${hue}, 55%, 70%)`;
    }

    function mdTlActorColor(ev, role, colorByAcc) {
      // Legacy: liefert inline color-string fuer .md-dot etc.
      const acc  = ev[role + "Account"];
      const slot = ev[role + "Slot"];
      const teamId = ev[role + "TeamId"];
      const isSquad = ev[role + "IsSquad"];
      if (isSquad) {
        if (acc && colorByAcc && colorByAcc[acc]) return colorByAcc[acc];
        if (slot >= 1 && slot <= MD_SLOT_COLORS.length)
          return MD_SLOT_COLORS[slot - 1];
      }
      return mdTlEnemyTeamColor(teamId);
    }

    function mdTlFmtMatchTime(tsMs) {
      // Ingame-Zeit relativ zum Plane-Takeoff (= 0). Werte vor Takeoff
      // (Lobby/Insert) sind negativ und werden als "-M:SS" gerendert.
      if (tsMs == null) return "?";
      const neg = tsMs < 0;
      const sec = Math.floor(Math.abs(tsMs) / 1000);
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${neg ? "-" : ""}${m}:${String(s).padStart(2, "0")}`;
    }

    // Item-ID → Klartextname fuer Carepackage-Inhalt.
    // Reihenfolge wichtig: spezifischer Match vor generischem.
    function _carepkgItemLabel(id) {
      if (!id) return "?";
      const s = id.replace(/^Item_/, "").replace(/_C$/, "");
      // 1) Schutz-Equipment (Head/Armor/Back) — Level extrahieren
      let m = s.match(/^Head_[A-Z]_\d+_Lv(\d+)/);
      if (m) return `Level ${m[1]} Helmet`;
      m = s.match(/^Armor_[A-Z]_\d+_Lv(\d+)/);
      if (m) return `Level ${m[1]} Vest`;
      m = s.match(/^Back_[A-Z]_\d+_Lv(\d+)/);
      if (m) return `Level ${m[1]} Backpack`;
      m = s.match(/^Back_BlueBlocker(?:_Lv(\d+))?/);
      if (m) return `BlueChip Backpack${m[1] ? " Lv" + m[1] : ""}`;
      m = s.match(/^Ghillie/);
      if (m) return "Ghillie Suit";
      // 2) Heals + Boosts
      const HEALS = {
        "Heal_Bandage": "Bandage",
        "Heal_FirstAid": "First Aid",
        "Heal_MedKit": "Med Kit",
        "Boost_EnergyDrink": "Energy Drink",
        "Boost_PainKiller": "Painkiller",
        "Boost_AdrenalineSyringe": "Adrenaline",
      };
      for (const k in HEALS) if (s.startsWith(k)) return HEALS[k];
      // 3) Ammo
      m = s.match(/^Ammo_(\d+)([Gg]uage|mm|ACP|Magnum|Flare|Bolt)/);
      if (m) {
        const cal = m[1] + (m[2].toLowerCase() === "guage" ? " Gauge" :
                            m[2] === "mm" ? " mm" : " " + m[2]);
        return `${cal} Ammo`;
      }
      // 4) Spezial-Items
      const SPECIAL = {
        "EmergencyPickup": "Emergency Pickup",
        "Weapon_FlareGun": "Flare Gun",
        "Weapon_PackageFlare": "Package Flare",
        "Weapon_CoverStructDropHandFlare": "Drop Flare",
        "Weapon_SmokeBomb": "Smoke Grenade",
        "Weapon_Molotov": "Molotov",
        "Weapon_Grenade": "Frag Grenade",
        "Weapon_FlashBang": "Flash Bang",
        "Weapon_BlueChipDetector": "BlueChip Detector",
        "Special_Bluechip": "Personal BlueChip",
        "Bluechip": "BlueChip",
      };
      for (const k in SPECIAL) if (s.includes(k)) return SPECIAL[k];
      // 5) Waffen — kurze Namen
      const WEAPONS = [
        ["HK416", "M416"], ["M16A4", "M16A4"], ["AUG", "AUG"],
        ["AK47", "AKM"], ["Beryl", "Beryl"], ["Groza", "Groza"],
        ["SCAR-L", "SCAR-L"], ["G36C", "G36C"], ["QBZ", "QBZ"],
        ["FAMAS", "FAMAS"], ["M249", "M249"], ["MG3", "MG3"],
        ["DP28", "DP-28"], ["UMP", "UMP45"], ["Vector", "Vector"],
        ["Tommy", "Tommy Gun"], ["UZI", "Uzi"], ["MP5K", "MP5K"],
        ["BizonPP19", "PP-19 Bizon"], ["P90", "P90"], ["Mk47", "Mk47"],
        ["JS9", "JS9"], ["AWM", "AWM"], ["L6", "L6"], ["Kar98k", "Kar98k"],
        ["Mosin", "Mosin"], ["M24", "M24"], ["Win94", "Win94"], ["VSS", "VSS"],
        ["Mk14", "Mk14"], ["Mk12", "Mk12"], ["SLR", "SLR"], ["SKS", "SKS"],
        ["Mini14", "Mini 14"], ["QBU", "QBU"], ["S1897", "S1897"],
        ["S686", "S686"], ["S12K", "S12K"], ["DBS", "DBS"], ["O12", "O12"],
        ["Saiga", "Saiga 12K"], ["R45", "R45"], ["R1895", "R1895"],
        ["P92", "P92"], ["P1911", "P1911"], ["P18C", "P18C"], ["DesertEagle", "Deagle"],
        ["Sawnoff", "Sawed-Off"], ["Crossbow", "Crossbow"], ["Pan", "Pan"],
        ["Machete", "Machete"], ["Crowbar", "Crowbar"], ["Sickle", "Sickle"],
      ];
      m = s.match(/^Weapon_([A-Za-z0-9_-]+?)(?:_v\d+)?(?:_Esports)?$/);
      if (m) {
        const wname = m[1];
        for (const [needle, label] of WEAPONS) {
          if (wname.includes(needle)) return label;
        }
        return wname.replace(/_/g, " ");
      }
      // 6) Attachments
      const ATT = [
        ["Scope15x", "15x Scope"], ["Scope8x", "8x Scope"],
        ["Scope6x", "6x Scope"], ["Scope4x", "4x Scope"],
        ["Scope3x", "3x Scope"], ["Scope2x", "2x Scope"],
        ["DotSight", "Red Dot"], ["HoloSight", "Holo Sight"],
        ["Aimpoint", "Red Dot"], ["DualOptic", "Tactical Optic"],
        ["Comp_5_56", "Compensator (5.56)"], ["Comp_7_62", "Compensator (7.62)"],
        ["Suppressor", "Suppressor"], ["FlashHider", "Flash Hider"],
        ["QuickDraw", "QuickDraw Mag"], ["ExtendedQuickDraw", "QD Ext Mag"],
        ["Extended", "Extended Mag"], ["Foregrip", "Vertical Grip"],
        ["Angled", "Angled Grip"], ["HalfGrip", "Half Grip"],
        ["Lightweight", "Light Grip"], ["LaserSight", "Laser"],
        ["BulletLoops", "Bullet Loops"], ["CheekPad", "Cheek Pad"],
        ["Stock_AR", "Tactical Stock"], ["PM2_01", "Tactical Optic"],
      ];
      for (const [needle, label] of ATT) {
        if (s.includes(needle)) return label;
      }
      // 7) Fallback: clean string
      return s.replace(/^(Weapon|Attach_Weapon|Heal|Boost|Ammo|Back|Head|Armor)_/, "")
              .replace(/_Lv(\d+)/, " Lv$1")
              .replace(/_/g, " ");
    }

    function mdTlPoi(ctx, x, y) {
      if (ctx.mapName && PubgUI.POI && PubgUI.POI.fromCoords
          && x != null && y != null) {
        const p = PubgUI.POI.fromCoords(ctx.mapName, x, y);
        if (p) return p;
      }
      return "&lt;unknown&gt;";
    }

    function mdTlNameSpan(ev, role, colorByAcc, playerKds) {
      const name = ev[role + "Name"] || "?";
      const cls  = mdTlActorClass(ev, role);
      const teamLbl = ev[role + "TeamLabel"];
      const teamSpan = teamLbl
        ? ` <span class="md-tl-teamtag ${cls}">${teamLbl}</span>`
        : "";
      const clan = ev[role + "Clan"];
      const clanPrefix = (clan && clan.tag)
        ? `<span class="md-tl-clantag ${cls}" title="${(clan.name || "").replace(/"/g, "&quot;")}">[${clan.tag}]</span> `
        : "";
      const acc = ev[role + "Account"];
      let tooltipAttr = "";
      if (acc && playerKds) {
        const snap = playerKds[acc];
        const MODE = {"squad-fpp":"Squad FPP","squad-tpp":"Squad TPP",
          "duo-fpp":"Duo FPP","duo-tpp":"Duo TPP",
          "solo-fpp":"Solo FPP","solo-tpp":"Solo TPP",
          "fpp":"FPP gesamt","tpp":"TPP gesamt","all":"Allzeit"};
        // Herkunft und Runden-Verhaeltnis wie im Lobby-Modal, damit
        // derselbe Spieler ueberall dieselbe Auskunft bekommt.
        const _src = snap && snap.source === "season"
          ? `Season ${seasonShort(snap.seasonId) || ""}`.trim()
          : (snap && snap.source === "lifetime" ? "Lifetime" : null);
        const _rds = (snap && snap.lifetimeRounds
                      && snap.lifetimeRounds !== snap.rounds)
          ? `${snap.rounds}/${snap.lifetimeRounds} rounds`
          : `${snap && snap.rounds} rounds`;
        const tip = (snap && snap.kd != null)
          ? `K/D ${snap.kd.toFixed(2)} · ${_rds} (${MODE[snap.mode] || snap.mode || "Allzeit"}${_src ? ", " + _src : ""})`
          : snap === null
            ? "K/D N/A · no API data"
            : "K/D is still loading";
        tooltipAttr = ` data-kd-tip="${PubgUI.esc(tip)}"`;
      }

      return `${clanPrefix}<b class="${cls} md-tl-name"${tooltipAttr}>${name}</b>${teamSpan}`;
    }

    // Attachment-Class-Names → kurze Klartextnamen (Tooltip)

        ["Scope6x",       "6x Scope"],

      for (const [needle, label] of NAMES) {
        if (id.includes(needle)) return label;

      return id.replace(/^Item_Attach_Weapon_(Upper_|Lower_|Magazine_|Stock_|Muzzle_)?/, "")
               .replace(/_/g, " ");

    function mdTlWeaponMeta(ev) {
      const parts = [];
      if (ev.weaponName) {
        // Attachments als Tooltip auf die Waffe
        let attachTitle = "";
        if (ev.attachments && ev.attachments.length) {
          const labels = ev.attachments.map(_attachLabel).join(", ");
          attachTitle = ` title="${labels.replace(/"/g, "&quot;")}"`;
        }
        parts.push(`with <b${attachTitle}>${ev.weaponName}</b>`);
      }
      if (ev.distanceM) {
        let distStr = `· ${ev.distanceM.toFixed(0)}m`;
        // Bei Schuessen >200m: Victim-Ort als muted-Zusatz hinter Meterzahl
        if (ev._victimPoi) {
          distStr += ` <span class="md-tl-target-poi">(${ev._victimPoi})</span>`;
        }
        parts.push(distStr);
      }
      // Fahrzeug-Kontext: Opfer war im Auto oder Schuetze schoss aus Auto
      if (ev.victimVehicleLabel) {
        const prep = ev.victimVehicleLabel === "Emergency Pickup" ? "on" : "in";
        parts.push(`· victim ${prep} <b>${ev.victimVehicleLabel}</b>`);
      }
      if (ev.shooterVehicleLabel) parts.push(`· from <b>${ev.shooterVehicleLabel}</b>`);
      return parts.length ? " " + parts.join(" ") : "";
    }

    function mdTlSentence(ev, ctx) {
      const cba = ctx.colorByAcc;
      const kds = ctx.playerKds;
      const A = mdTlNameSpan(ev, "actor",  cba, kds);
      const T = mdTlNameSpan(ev, "target", cba, kds);
      const meta = mdTlWeaponMeta(ev);

      // Multi-Fight-Badge: Enemy hatte Squad-Mitglieder geknockt bevor er starb.
      // Primär aus Backend-Feld squadKnocksCount (kennt auch nicht-scope Knocks),
      // Fallback auf Frontend-Map fuer aeltere Daten.
      const _sqKnocks = ev.squadKnocksCount
        || (ctx.squadKnockedBy || new Map()).get(ev.targetAccount) || 0;
      // Nur wenn ein FREMDES Team zuschlaegt — schlagen wir selbst zurueck,
      // sieht man das ohnehin an der Zeile drueber.
      const _thirdParty = ev.thirdPartyHit !== undefined
        ? ev.thirdPartyHit
        : (!ev.actorIsSquad && ev.actorTeamId != null
           && ev.actorTeamId !== ev.targetTeamId);
      const _multiFight = (_sqKnocks >= 1 && !ev.targetIsSquad && _thirdParty)
        ? ` <span class="md-tl-multifight" title="${ev.targetName || "This enemy"} knocked ${_sqKnocks} of your squad">${T} had knocked ${_sqKnocks} mate${_sqKnocks > 1 ? "s" : ""}</span>`
        : "";

      switch (ev.type) {
        case "join":
          return `${A} joined the lobby`;
        case "knock":
          // System-Events ohne Actor (Blue Zone, Train, Drowning etc.):
          // Spieler "wurde geknockt von <cause>" statt "? knocked X with cause"
          if (!ev.actorName && ev.weaponName) {
            return `${T} was knocked by <b>${ev.weaponName}</b>`;
          }
          return `${A} knocked ${T}${meta}${_multiFight}`;
        case "kill":
          if (!ev.actorName && ev.weaponName) {
            return `${T} was killed by <b>${ev.weaponName}</b>`;
          }
          return `${A} killed ${T}${meta}${_multiFight}`;
        case "kill_bleedout":
          // Wer geknockt hat war (laut PUBG) der gleiche Actor — Knocker-
          // Info redundant. Just: "X bled out and died".
          return `${T} bled out and died${_multiFight}`;
        case "kill_finish":
          // Knock-Info redundant (eigene Timeline-Zeile davor) — finish
          // bedeutet: ein Squad-Mate hatte ihn schon down.
          return `${A} finished ${T}${meta}${_multiFight}`;
        case "kill_steal": {
          const K = mdTlNameSpan(ev, "knocker", cba, kds);
          const kw = ev.knockerWeaponName ? ` with <b>${ev.knockerWeaponName}</b>` : "";
          const kd = ev.knockerDistanceM ? ` · ${ev.knockerDistanceM.toFixed(0)}m` : "";
          return `${A} stole the knock (knocked by ${K}${kw}${kd}) — killed ${T}${meta}${_multiFight}`;
        }
        case "revive":
          return `${A} revived ${T}`;
        case "revive_inferred":
          // Aus dem 2-Knock-Pattern hergeleitet (DBNO-Spieler kann nicht
          // ein zweites Mal geknockt werden → muss dazwischen revived
          // worden sein). PUBG fired LogPlayerRevive nicht zuverlaessig
          // fuer Enemy-Revives → wir kennen den Reviver nicht.
          return `${T} was revived <span class="md-dim">(inferred — reviver unknown)</span>`;
        case "redeploy":
          return ev.targetName
            ? `${A} used the revive antenna for ${T}`
            : `${A} used the revive antenna`;
        case "comeback":
          return `${A} dropped back in via Comeback Heli`;
        case "chip_pickup": {
          const n = ev.chipCount || 1;
          const chipLbl = (n > 1) ? `${n} BlueChips` : "the BlueChip";
          return ev.targetName
            ? `${A} picked up ${chipLbl} from ${T}`
            : `${A} picked up a BlueChip`;
        }
        case "chip_drop":
          return ev.targetName
            ? `${A} dropped the BlueChip from ${T}`
            : `${A} dropped a BlueChip`;
        case "chip_upload_comeback":
          return ev.targetName
            ? `${A} uploaded ${T}'s BlueChip at the Comeback Tower`
            : `${A} uploaded a squad BlueChip at the Comeback Tower`;
        case "chip_upload_carepackage": {
          const n = ev.chipCount || 1;
          // Inhalt der Carepackage (Item-IDs → kurze Klartextnamen)
          const items = (ev.packageItems || []).map(_carepkgItemLabel);
          const contents = items.length
            ? ` (${items.join(", ")})` : "";
          const base = (n > 1)
            ? `${A} uploaded ${n} enemy BlueChips at the Tower`
            : `${A} uploaded an enemy BlueChip`;
          return `${base}${contents}`;
        }
        case "chip_upload":
          return `${A} uploaded a BlueChip at the Comeback Tower`;
        case "kill_self_eject": {
          const veh = ev.victimVehicleLabel
            ? ` from <b>${ev.victimVehicleLabel}</b>` : "";
          return `${T} died after jumping${veh}`;
        }
        case "kill_fall":
          return `${T} fell to their death`;
        case "kill_bluezone":
          return `${T} died in the Blue Zone`;
        case "kill_redzone":
          return `${T} died in the Red Zone`;
        case "kill_drown":
          return `${T} drowned`;
        case "kill_self_inflicted": {
          const w = ev.selfWeaponName
            ? ` with <b>${ev.selfWeaponName}</b>` : "";
          return `${T} killed themselves${w}`;
        }
        case "kill_self":
          return `${T} died`;
        default:
          return `${A} ${ev.type} ${T}${meta}`;
      }
    }

    function mdTlRowHtml(ev, ctx) {
      // Takeoff-relativ: positive Werte = ingame nach Plane-Takeoff,
      // negative = Lobby/Insert-Phase.
      const displayMs = (ev.tsMs != null)
        ? ev.tsMs - (ctx.takeoffOffsetMs || 0) : null;
      const tCell = mdTlFmtMatchTime(displayMs);
      // POI-Logik je Event-Typ:
      //   join → "Lobby"
      //   kill/knock/finish/steal → Shooter-Pos (= wo DU standst); bei
      //     Distanz > 200m wird der Victim-POI muted hinter die Meterzahl
      //     im Satz angehaengt (nicht in der POI-Spalte).
      //   bleedout/self/fall/etc. → Victim-Pos
      //   pickup/drop/upload/comeback → Actor-Pos
      let poi;
      const isShooterEv = ev.type === "kill"
                       || ev.type === "knock"
                       || ev.type === "kill_finish"
                       || ev.type === "kill_steal";
      if (ev.type === "join") {
        poi = "Lobby";
      } else if (isShooterEv && ev.actorX != null) {
        poi = mdTlPoi(ctx, ev.actorX, ev.actorY);
        // Victim-POI fuer Satz-Zusatz (nur bei langen Schuessen)
        const distM = ev.distanceM || 0;
        if (distM > 200 && ev.victimX != null) {
          const vp = mdTlPoi(ctx, ev.victimX, ev.victimY);
          if (vp && vp !== "&lt;unknown&gt;" && vp !== poi) {
            // Auf ev anheften, mdTlWeaponMeta haengt's hinter die Meterzahl
            ev._victimPoi = vp;
          }
        }
      } else {
        const px = (ev.victimX != null) ? ev.victimX : ev.actorX;
        const py = (ev.victimY != null) ? ev.victimY : ev.actorY;
        poi = mdTlPoi(ctx, px, py);
      }
      const sentence = mdTlSentence(ev, ctx);
      const myAccount = ctx.myAccount;
      const involvesMe = ev.actorAccount === myAccount
                      || ev.targetAccount === myAccount
                      || ev.knockerAccount === myAccount;
      const isLobby = (displayMs != null && displayMs < 0);
      return `<div class="md-tl-row${isLobby ? ' md-tl-row--lobby' : ''}"
                   data-ev-type="${ev.type}"
                   data-ev-me="${involvesMe}">
        <span class="md-tl-t">${tCell}</span>
        <span class="md-tl-poi">${poi}</span>
        <span class="md-tl-text">${sentence}</span>
      </div>`;
    }

    function renderMdTimeline(events, ctx) {
      // Multi-Fight-Map: enemy account → Anzahl Squad-Knocks (vor seinem Tod)
      // Wird in ctx.squadKnockedBy weitergegeben, damit mdTlSentence den
      // Hinweis "had knocked N squad mate(s)" anhaengen kann.
      const squadKnockedBy = new Map();
      for (const ev of (events || [])) {
        const _hitsSquad = ev.type === "knock" || ev.type.startsWith("kill");
        if (_hitsSquad && !ev.actorIsSquad && ev.targetIsSquad && ev.actorAccount) {
          squadKnockedBy.set(ev.actorAccount, (squadKnockedBy.get(ev.actorAccount) || 0) + 1);
        }
      }
      ctx = { ...ctx, squadKnockedBy };

      const filters = _MD_TIMELINE_FILTERS.map(([key, lbl]) =>
        `<button type="button" class="md-timeline__chip${key === "all" ? " is-active" : ""}"
                 data-tl-filter="${key}">${lbl}</button>`).join("");
      const chev = `<span class="material-symbols-outlined md-tl-chev" aria-hidden="true">expand_more</span>`;
      if (!events || !events.length) {
        return `<details class="md-timeline-details" open>
          <summary class="md-timeline__title">${chev} Timeline</summary>
          <div class="md-tl-empty">No squad events in this match.</div>
        </details>`;
      }
      const rows = events.map(ev => mdTlRowHtml(ev, ctx)).join("");
      const header = `<div class="md-tl-row md-tl-header">
          <span class="md-tl-t">Time</span>
          <span class="md-tl-poi">Location</span>
          <span class="md-tl-text">Event</span>
        </div>`;
      return `<details class="md-timeline-details" open>
        <summary class="md-timeline__title">${chev} Timeline (${events.length} events)</summary>
        <div class="md-timeline__head">
          <div class="md-timeline__filters">${filters}</div>
        </div>
        <div class="md-timeline__list">${header}${rows}</div>
      </details>`;
    }

    function wireMdTimelineFilters(rootEl, myAccount) {
      const chips = rootEl.querySelectorAll(".md-timeline__chip");
      const rows  = rootEl.querySelectorAll(".md-tl-row");
      chips.forEach(chip => {
        chip.addEventListener("click", () => {
          chips.forEach(c => c.classList.remove("is-active"));
          chip.classList.add("is-active");
          const key = chip.getAttribute("data-tl-filter");
          const spec = _MD_TIMELINE_FILTERS.find(f => f[0] === key);
          const allow = spec ? spec[2] : null;
          rows.forEach(r => {
            const t = r.getAttribute("data-ev-type");
            const me = r.getAttribute("data-ev-me") === "true";
            let show = true;
            if (key === "me") show = me;
            else if (allow) show = allow.indexOf(t) >= 0;
            r.style.display = show ? "" : "none";
          });
        });
      });
    }

    async function mdMount(host) {
      if (host.dataset.mounted === "1") return;
      host.dataset.mounted = "1";
      const matchId = host.getAttribute("data-match-id");
      const mapName = host.getAttribute("data-map");
      host.innerHTML = `
        <div class="md-grid">
          <div class="md-mapcol">
            <div class="md-matchid" title="Click to copy the match ID">${matchId}</div>
            <div class="md-mapwrap">
              <canvas class="md-basemap"></canvas>
              <canvas class="md-overlay"></canvas>
              <div class="md-zoombtns">
                <button class="md-zoom-in" title="Reinzoomen">+</button>
                <button class="md-zoom-out" title="Rauszoomen">−</button>
                <button class="md-zoom-reset" title="Reset">⊙</button>
              </div>
              <div class="md-hover-label"></div>
            </div>
            <div class="md-scrub">
              <button class="md-play-btn">▶</button>
              <input type="range" class="md-scrub-slider" min="0" max="100" value="0">
              <span class="md-time">0:00 / 0:00</span>
            </div>
            <div class="md-speedbar">
              ${MD_SPEEDS.map(sp => `<button class="md-speedbtn" data-speed="${sp}">${sp}×</button>`).join("")}
            </div>
          </div>
          <div class="md-rightcol">
            <div class="squad-table-wrap" id="mdSquadTableWrap_${matchId}"></div>
            <div class="md-allebar">
              <button class="md-allebtn">● All visible</button>
            </div>
            <div class="md-cards"></div>
          </div>
        </div>`;
      // Map-Bild parallel zum Telemetrie-Fetch starten — sonst kettet sich
      // das (mdLoad ~30s fuer 99-Spieler-Matches, danach 2-3s fuer das Bild
      // = 40s schwarz). Promise wird gecached, also gleich verfuegbar.
      mdMapImage(mapName);
      const md = await mdLoad(matchId);
      const s = mdGetState(host);
      if (!md || !md.detail) {
        host.querySelector(".md-cards").innerHTML =
          `<div class="md-empty md-card">— no telemetry available —</div>`;
        return;
      }
      s.detail = md.detail;
      s.colorByAcc = md.colorByAcc;
      // Map-Name nachträglich ins Host-Attribut schreiben — Panel-Mount
      // setzt data-map="" leer, weil die Map erst aus md.detail.mapName
      // bekannt ist. Ohne diesen Schritt liefert mdRenderBasemap
      // (host.getAttribute("data-map") → "") keine Map-Image.
      if (md.detail.mapName) {
        host.setAttribute("data-map", md.detail.mapName);
        // Map-Image vorab anstossen damit mdRenderBasemap nicht warten muss
        mdMapImage(md.detail.mapName);
      }
      // Squad-Tabelle aus Match-Detail-Response rendern.
      // Liefert das gleiche `<table>` wie zuvor fmtSquadDetail im
      // session-report-Kontext — aber datenbasiert aus md.detail.members
      // statt aus dem Session-Match-Objekt.
      const tableWrap = host.querySelector(
        `#mdSquadTableWrap_${CSS.escape(matchId)}`);
      if (tableWrap && md && md.detail && md.detail.members) {
        tableWrap.innerHTML = renderMdSquadTable(md.detail.members,
                                                  md.colorByAcc,
                                                  md.detail.takeoffMs
                                                    || md.detail.matchStartMs);
      }
      // Panel-Titel aktualisieren (Map + Match-Nr + Uhrzeit)
      const panelTitle = document.getElementById("mdPanelTitle");
      if (panelTitle && md && md.detail) {
        const mapLbl = PubgUI.fmtMap(md.detail.mapName);
        panelTitle.textContent = `Match · ${mapLbl}`;
      }
      // Timeline-Sektion fuellen — absTs kommt jetzt direkt vom Backend
      // (kein playedAt-Frontend-Lookup mehr). POI-Polygone werden async
      // geladen — Render erst nachdem POI.ready resolved, sonst zeigen
      // alle Zeilen '<unknown>' weil fromCoords noch nicht gefuettert ist.
      const tlSect = document.getElementById("mdTimelineSection");
      if (tlSect && md && md.detail) {
        tlSect.hidden = false;
        const myAcc = (md.detail.members.find(x => x.isSelf) || {}).accountId;
        // Takeoff = Match-Zeit 0. ev.tsMs ist Lobby-relativ (vom Backend);
        // wir verschieben um (takeoffMs - matchStartMs) ins Takeoff-Frame.
        const takeoffOffsetMs = (md.detail.takeoffMs && md.detail.matchStartMs)
          ? (md.detail.takeoffMs - md.detail.matchStartMs) : 0;
        const ctx = {
          mapName:         md.detail.mapName,
          colorByAcc:      md.colorByAcc,
          myAccount:       myAcc,
          takeoffOffsetMs: takeoffOffsetMs,
          playerKds:       md.playerKds || {},
        };
        const _renderTl = () => {
          tlSect.innerHTML = renderMdTimeline(md.detail.events || [], ctx);
          wireMdTimelineFilters(tlSect, myAcc);
        };
        if (PubgUI.POI && PubgUI.POI.ready) {
          PubgUI.POI.ready.then(_renderTl).catch(_renderTl);
        } else {
          _renderTl();
        }
      }
      // Match-Zeitraum aus allen Pfaden ableiten
      let mStart = Infinity, mEnd = -Infinity;
      for (const m of s.detail.members) {
        if (!m.lives) continue;
        for (const life of m.lives) {
          const fullPath = [...(life.planeRoute||[]), ...(life.groundPath||[])];
          if (!fullPath.length) continue;
          const t0 = fullPath[0][2], tN = fullPath[fullPath.length - 1][2];
          if (t0 < mStart) mStart = t0;
          if (tN > mEnd) mEnd = tN;
        }
      }
      s.zeitraffer.matchStart = isFinite(mStart) ? mStart : 0;
      s.zeitraffer.matchEnd = isFinite(mEnd) ? mEnd : 1;
      s.zeitraffer.cursorTs = 0;

      // Viewport-Default: bbox(alle Landings) + 500m
      const landingCoords = [];
      for (const m of s.detail.members) {
        if (!m.lives) continue;
        for (const life of m.lives) {
          if (life.landing) landingCoords.push([life.landing.x, life.landing.y]);
        }
      }
      s.viewport = mdBboxFitViewport(landingCoords, MD_PAD_500M_CM);
      s.viewport.autoFollow = true;
      mdClampViewport(host);

      // Telemetrie-Pfad-Check: wenn KEIN Member einen Pfad hat (weder
      // planeRoute noch groundPath fuer irgendein Leben), zeigen wir
      // einen Hinweis statt einer halb-leeren Karte.
      let anyPath = false;
      for (const m of s.detail.members) {
        if (!m.lives) continue;
        for (const life of m.lives) {
          if ((life.planeRoute && life.planeRoute.length) ||
              (life.groundPath && life.groundPath.length)) {
            anyPath = true; break;
          }
        }
        if (anyPath) break;
      }
      if (!anyPath) {
        const banner = document.createElement("div");
        banner.className = "md-warning";
        banner.textContent = "No movement path in the telemetry. "
          + "Eventuell historischer Match — 'python -m pubg.cli hidrive-refill' "
          + "fuellt fehlende Position-Events nach.";
        host.querySelector(".md-mapcol").appendChild(banner);
      }
      mdRenderState(host);
      // Auto-Play: Zeitraffer startet sofort, Kamera folgt automatisch
      if (anyPath) {
        mdTogglePlay(host);
      }
    }

    // Begrenze viewport.center so dass das sichtbare Fenster die Map nicht
    // verlaesst. Wenn das Fenster groesser als die Map ist, zentrieren wir.
    function mdClampViewport(host) {
      const s = mdGetState(host);
      const vp = s.viewport;
      if (!vp) return;
      const mapKm = parseFloat(host.dataset.mapKm) || 8;
      const mapCm = mapKm * 100000;
      const halfVis = (MD_MAP_PX / 2) / vp.zoom;
      if (halfVis * 2 >= mapCm) {
        vp.centerX = mapCm / 2;
        vp.centerY = mapCm / 2;
        return;
      }
      vp.centerX = Math.max(halfVis, Math.min(mapCm - halfVis, vp.centerX));
      vp.centerY = Math.max(halfVis, Math.min(mapCm - halfVis, vp.centerY));
    }

    function mdTogglePlay(host) {
      const s = mdGetState(host);
      const z = s.zeitraffer;
      if (z.playing) {
        z.playing = false;
        s.playToken++;
        mdRenderState(host);
        return;
      }
      z.playing = true;
      z.playStartWallTs = performance.now();
      z.playStartCursor = z.cursorTs;
      if (z.cursorTs >= z.matchEnd - z.matchStart) {
        z.cursorTs = 0;
        z.playStartCursor = 0;
      }
      const token = ++s.playToken;
      const dur = z.matchEnd - z.matchStart;
      function frame(now) {
        if (token !== s.playToken) return;
        if (host.dataset.mounted !== "1") return;
        const realElapsed = now - z.playStartWallTs;
        // 1x = 1 ms cursor pro 1 ms real-time. Multiplikator skaliert.
        const scaledCursor = z.playStartCursor
          + realElapsed * (s.playSpeed || MD_DEFAULT_SPEED);
        z.cursorTs = Math.min(dur, scaledCursor);
        if (s.viewport && s.viewport.autoFollow) {
          mdAutoFollow(host);
        }
        mdRenderBasemap(host);
        mdRenderOverlay(host);
        mdUpdateScrubBar(host);
        if (z.cursorTs < dur) {
          requestAnimationFrame(frame);
        } else {
          z.playing = false;
          mdUpdateScrubBar(host);
        }
      }
      requestAnimationFrame(frame);
    }

    function mdAutoFollow(host) {
      const s = mdGetState(host);
      const absTs = s.zeitraffer.matchStart + s.zeitraffer.cursorTs;
      const coords = [];
      const visibleMembers = s.detail.members.filter(
        m => !s.hiddenAccs.has(m.accountId));
      for (const m of visibleMembers) {
        const pin = mdInterpolatePin(m, absTs);
        if (pin) coords.push([pin.x, pin.y]);
      }
      if (coords.length === 0) return;
      const target = mdBboxFitViewport(coords, MD_PAD_500M_CM);
      // Smooth ease toward target (lerp 0.18 / frame) — Zoom bleibt
      // bewusst auf User-Wert, nur Center bewegt sich mit der Action.
      const t = 0.18;
      s.viewport.centerX += (target.centerX - s.viewport.centerX) * t;
      s.viewport.centerY += (target.centerY - s.viewport.centerY) * t;
      mdClampViewport(host);
    }

    // Slider-Input setzt cursor — Playback laeuft weiter (Anker rebasen).
    function mdScrubTo(host, cursorMs) {
      const s = mdGetState(host);
      const z = s.zeitraffer;
      z.cursorTs = Math.max(0, Math.min(z.matchEnd - z.matchStart, cursorMs));
      if (z.playing) {
        z.playStartWallTs = performance.now();
        z.playStartCursor = z.cursorTs;
      }
      mdRenderOverlay(host);
      mdUpdateScrubBar(host);
    }

    // Globale Event-Delegations
    document.addEventListener("click", (e) => {
      const mid = e.target.closest && e.target.closest(".md-matchid");
      if (mid) {
        const id = mid.textContent.trim();
        if (id && navigator.clipboard) {
          navigator.clipboard.writeText(id).then(() => {
            const orig = mid.textContent;
            mid.textContent = "✓ kopiert";
            setTimeout(() => { mid.textContent = orig; }, 1200);
          });
        }
        e.stopPropagation();
        return;
      }
      const playBtn = e.target.closest && e.target.closest(".md-play-btn");
      if (playBtn) {
        const host = playBtn.closest(".md-host");
        if (host) { mdTogglePlay(host); e.stopPropagation(); }
        return;
      }
      const speedBtn = e.target.closest && e.target.closest(".md-speedbtn");
      if (speedBtn) {
        const host = speedBtn.closest(".md-host");
        if (host) {
          const s = mdGetState(host);
          const newSpeed = parseFloat(speedBtn.dataset.speed) || 1;
          // Wenn gerade Playback laeuft: Zeit-Anker neu setzen damit der
          // Speed-Wechsel ohne Cursor-Sprung passiert.
          if (s.zeitraffer.playing) {
            s.zeitraffer.playStartWallTs = performance.now();
            s.zeitraffer.playStartCursor = s.zeitraffer.cursorTs;
          }
          s.playSpeed = newSpeed;
          mdUpdateScrubBar(host);
          e.stopPropagation();
        }
        return;
      }
    });

    document.addEventListener("input", (e) => {
      const slider = e.target.closest && e.target.closest(".md-scrub-slider");
      if (!slider) return;
      const host = slider.closest(".md-host");
      if (!host) return;
      mdScrubTo(host, parseInt(slider.value, 10) || 0);
    });

    document.addEventListener("keydown", (e) => {
      // Pfeil-Tasten ±1s wenn ein Match-Detail focused
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      // nicht in Inputs
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      const host = document.querySelector(".md-host[data-mounted='1']");
      if (!host) return;
      const s = mdGetState(host);
      const delta = e.key === "ArrowLeft" ? -1000 : 1000;
      mdScrubTo(host, s.zeitraffer.cursorTs + delta);
      e.preventDefault();
    });

    function mdZoomAt(host, deltaScale, anchorPx, anchorPy) {
      const s = mdGetState(host);
      const vp = s.viewport;
      if (!vp) return;
      // Neuer zoom mit Limits
      const maxZoom = MD_MAP_PX / MD_MIN_ZOOM_CM;
      const minZoom = MD_MAP_PX / MD_MAX_ZOOM_CM;
      let newZoom = Math.max(minZoom, Math.min(maxZoom, vp.zoom * deltaScale));
      vp.zoom = newZoom;
      if (vp.autoFollow) {
        // Auto-Follow ist an → Zoom soll Pins zentriert lassen, NICHT
        // an Maus-Anker. Direkt auf Pin-bbox snappen, naechster Frame
        // lerpt dann weiter.
        const absTs = s.zeitraffer.matchStart + s.zeitraffer.cursorTs;
        const coords = [];
        for (const m of s.detail.members) {
          if (s.hiddenAccs.has(m.accountId)) continue;
          const pin = mdInterpolatePin(m, absTs);
          if (pin) coords.push([pin.x, pin.y]);
        }
        if (coords.length) {
          let mnX = Infinity, mxX = -Infinity, mnY = Infinity, mxY = -Infinity;
          for (const [x, y] of coords) {
            if (x < mnX) mnX = x; if (x > mxX) mxX = x;
            if (y < mnY) mnY = y; if (y > mxY) mxY = y;
          }
          vp.centerX = (mnX + mxX) / 2;
          vp.centerY = (mnY + mxY) / 2;
        }
      } else {
        // Manueller Modus (nach Drag-Pan) → Zoom an Maus-Anker
        const [acmX, acmY] = mdCanvasToCm(host, anchorPx, anchorPy);
        vp.centerX = acmX - (anchorPx - MD_MAP_PX / 2) / vp.zoom;
        vp.centerY = acmY - (anchorPy - MD_MAP_PX / 2) / vp.zoom;
      }
      mdClampViewport(host);
      mdRenderBasemap(host);
      mdRenderOverlay(host);
    }

    document.addEventListener("wheel", (e) => {
      const wrap = e.target.closest && e.target.closest(".md-mapwrap");
      if (!wrap) return;
      e.preventDefault();
      const host = wrap.closest(".md-host");
      if (!host) return;
      const rect = wrap.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;
      const scale = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      mdZoomAt(host, scale, px, py);
    }, { passive: false });

    // Aktueller Drag-Host (modul-global), damit mousemove/up den richtigen
    // Host treffen wenn mehrere Match-Details gleichzeitig ausgeklappt sind.
    let _mdDragHost = null;
    document.addEventListener("mousedown", (e) => {
      const wrap = e.target.closest && e.target.closest(".md-mapwrap");
      if (!wrap) return;
      if (e.target.closest(".md-zoombtns")) return;
      const host = wrap.closest(".md-host");
      if (!host) return;
      if (e.button !== 0) return;
      const s = mdGetState(host);
      s.dragPan = {
        startX: e.clientX, startY: e.clientY,
        startCenterX: s.viewport.centerX, startCenterY: s.viewport.centerY,
      };
      _mdDragHost = host;
    });

    document.addEventListener("mousemove", (e) => {
      const host = _mdDragHost;
      if (!host) return;
      const s = mdGetState(host);
      if (!s.dragPan) return;
      const dx = e.clientX - s.dragPan.startX;
      const dy = e.clientY - s.dragPan.startY;
      s.viewport.centerX = s.dragPan.startCenterX - dx / s.viewport.zoom;
      s.viewport.centerY = s.dragPan.startCenterY - dy / s.viewport.zoom;
      s.viewport.autoFollow = false;
      mdClampViewport(host);
      mdRenderBasemap(host);
      mdRenderOverlay(host);
    });

    document.addEventListener("mouseup", () => {
      if (!_mdDragHost) return;
      const s = mdGetState(_mdDragHost);
      s.dragPan = null;
      _mdDragHost = null;
    });

    document.addEventListener("dblclick", (e) => {
      const wrap = e.target.closest && e.target.closest(".md-mapwrap");
      if (!wrap) return;
      const host = wrap.closest(".md-host");
      if (!host) return;
      mdResetView(host);
    });

    function mdResetView(host) {
      const s = mdGetState(host);
      if (!s.detail) return;
      const coords = [];
      for (const m of s.detail.members) {
        if (!m.lives) continue;
        for (const life of m.lives) {
          if (life.landing) coords.push([life.landing.x, life.landing.y]);
        }
      }
      s.viewport = mdBboxFitViewport(coords, MD_PAD_500M_CM);
      s.viewport.autoFollow = true;
      mdClampViewport(host);
      mdRenderState(host);
    }

    document.addEventListener("click", (e) => {
      const zi = e.target.closest && e.target.closest(".md-zoom-in");
      if (zi) {
        const host = zi.closest(".md-host");
        mdZoomAt(host, 1.5, MD_MAP_PX / 2, MD_MAP_PX / 2);
        e.stopPropagation(); return;
      }
      const zo = e.target.closest && e.target.closest(".md-zoom-out");
      if (zo) {
        const host = zo.closest(".md-host");
        mdZoomAt(host, 1 / 1.5, MD_MAP_PX / 2, MD_MAP_PX / 2);
        e.stopPropagation(); return;
      }
      const zr = e.target.closest && e.target.closest(".md-zoom-reset");
      if (zr) {
        const host = zr.closest(".md-host");
        mdResetView(host);
        e.stopPropagation(); return;
      }
    });

    // Date-Range-Picker initialisieren mit aktuellen URL-Werten
    function pad(n) { return String(n).padStart(2, "0"); }
    function isoLocal(date) {
      // LOKALES Datum als "YYYY-MM-DD" — NIE toISOString() nutzen!
      // toISOString liefert UTC; bei MESZ (+02:00) springt das Datum um
      // einen Tag zurueck (1.5. 00:00 local → 30.4. 22:00 UTC).
      return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
    }

    if (FROM) {
      const d = new Date(FROM);
      document.getElementById("dateFrom").value = isoLocal(d);
      document.getElementById("timeFrom").value = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    if (TO) {
      const d = new Date(TO);
      document.getElementById("dateTo").value = isoLocal(d);
      document.getElementById("timeTo").value = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // ── Auswahl-Leiste ───────────────────────────────────────────────
    // Vorher zwei Tabs (Sessions / Custom Range) mit fuenf Presets im
    // einen und Monats-Akkordeons im anderen — zwei Wege zum selben
    // Ziel, und "Yesterday" stand als Knopf UND als Session in der
    // Liste. Jetzt ein switch fuer gerundete Zeitraeume, eine Zeile fuer
    // die konkrete Session.
    let allSessions = [];

    function monthKey(iso) {
      const d = new Date(iso);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }

    function _monthLabel(k) {
      const [y, m] = k.split("-");
      const names = ["January", "February", "March", "April", "May", "June",
                     "July", "August", "September", "October",
                     "November", "December"];
      return `${names[parseInt(m, 10) - 1] || m} ${y}`;
    }

    //: Zeitraum eines Presets. Rein rechnend, damit derselbe Code den
    //: aktiven Knopf erkennen und ihn setzen kann — sonst laufen
    //: Anzeige und Wirkung auseinander.
    function presetRange(p, now) {
      const day = new Date(now); day.setHours(0, 0, 0, 0);
      if (p === "current") return { from: "", to: "" };
      if (p === "today") {
        const e = new Date(day); e.setHours(23, 59, 59, 0);
        return { from: day.toISOString(), to: e.toISOString() };
      }
      if (p === "7" || p === "30") {
        const s = new Date(day); s.setDate(s.getDate() - parseInt(p, 10));
        return { from: s.toISOString(), to: "" };   // to leer = bis jetzt
      }
      if (p === "all") return { from: "1970-01-01T00:00:00Z", to: "" };
      return null;                                   // custom
    }

    //: Welcher Knopf gehoert zum aktuellen from/to? Eine gewaehlte
    //: Session ist KEIN Preset — dann bleibt der switch auf "custom"
    //: und die Session-Zeile zeigt, was gilt.
    function activePreset(from, to, sessions, now) {
      if (!from && !to) return "current";
      for (const p of ["today", "7", "30", "all"]) {
        const r = presetRange(p, now);
        if (r && r.from === from && (r.to || "") === (to || "")) return p;
      }
      return "custom";
    }

    function sessionIndex(from, to, sessions) {
      if (!from) return 0;            // kein Filter = laufende Session
      return (sessions || []).findIndex(s => s.from === from);
    }

    function applyRange(fromIso, toIso) {
      const u = new URL(location.href);
      if (fromIso) u.searchParams.set("from", fromIso);
      else u.searchParams.delete("from");
      if (toIso) u.searchParams.set("to", toIso);
      else u.searchParams.delete("to");
      // Der alte view-Parameter steuerte die Tabs, die es nicht mehr gibt.
      u.searchParams.delete("view");
      location.href = u.toString();
    }

    function sessLabel(s, idx) {
      if (!s) return "&mdash;";
      const time = PubgUI.fmtTime ? PubgUI.fmtTime(s.from) : "";
      const win = s.wins ? ` &middot; ${s.wins} W` : "";
      const live = idx === 0 ? ' <span class="pick-live">&#9654; live</span>' : "";
      return `<span>${PubgUI.fmtDate(s.from)}${time ? " " + time : ""}</span>`
        + `<span class="pick-meta">${s.matches || 0} matches${win}</span>`
        + live;
    }

    function paintPicker() {
      const now = new Date();
      const preset = activePreset(FROM, TO, allSessions, now);
      const box = document.getElementById("rangeSwitch");
      [...box.querySelectorAll("button")].forEach(b =>
        b.setAttribute("aria-pressed", String(b.dataset.r === preset)));
      document.getElementById("customRow").hidden = preset !== "custom"
        || sessionIndex(FROM, TO, allSessions) >= 0;

      const idx = sessionIndex(FROM, TO, allSessions);
      const combo = document.getElementById("sessCombo");
      const row = document.getElementById("sessionRow");
      if (!allSessions.length) { row.hidden = true; return; }
      row.hidden = false;
      // Kein Treffer heisst: der Zeitraum ist keine Session (Preset oder
      // eigenes Fenster). Dann sagt die Zeile das, statt eine fremde
      // Session als gewaehlt auszugeben.
      combo.innerHTML = idx >= 0 ? sessLabel(allSessions[idx], idx)
        : `<span class="pick-meta">not a single session &mdash; pick one</span>`
          + `<span class="pick-chev" aria-hidden="true">&#9662;</span>`;
      if (idx >= 0) combo.innerHTML += `<span class="pick-chev" aria-hidden="true">&#9662;</span>`;
      document.getElementById("sessPrev").disabled = idx < 0
        || idx >= allSessions.length - 1;
      document.getElementById("sessNext").disabled = idx <= 0;
      document.getElementById("sessCount").textContent =
        `${allSessions.length} sessions`;

      let html = "", last = null;
      allSessions.forEach((s, i) => {
        const k = monthKey(s.from);
        if (k !== last) { html += `<div class="pick-mhead">${_monthLabel(k)}</div>`; last = k; }
        const time = PubgUI.fmtTime ? PubgUI.fmtTime(s.from) : "";
        html += `<button type="button" class="pick-opt" role="option"`
          + ` data-i="${i}" aria-selected="${i === idx}">`
          + `<span class="pick-day">${PubgUI.fmtDate(s.from)}${time ? " " + time : ""}</span>`
          + `<span class="pick-num">${s.matches || 0} matches</span>`
          + `<span class="pick-win">${s.wins ? s.wins + " W" : ""}</span>`
          + (s.kills != null ? `<span class="pick-meta">${s.kills} K</span>` : "")
          + (i === 0 ? `<span class="pick-live">&#9654; live</span>` : "")
          + `</button>`;
      });
      document.getElementById("sessPop").innerHTML = html
        || `<p class="pick-empty">No sessions yet.</p>`;
    }

    function gotoSession(i) {
      const s = allSessions[i];
      if (!s) return;
      if (i === 0) applyRange("", "");        // laufende Session = kein Filter
      else applyRange(s.from, s.to);
    }

    document.getElementById("rangeSwitch").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-r]");
      if (!b) return;
      const r = presetRange(b.dataset.r, new Date());
      if (!r) {
        // Custom: Felder zeigen, nicht sofort laden.
        [...e.currentTarget.querySelectorAll("button")].forEach(x =>
          x.setAttribute("aria-pressed", String(x === b)));
        const row = document.getElementById("customRow");
        row.hidden = false;
        document.getElementById("dateFrom").focus();
        return;
      }
      applyRange(r.from, r.to);
    });

    document.getElementById("applyRange").addEventListener("click", () => {
      const df = document.getElementById("dateFrom").value;
      const tf = document.getElementById("timeFrom").value || "00:00";
      const dt = document.getElementById("dateTo").value;
      const tt = document.getElementById("timeTo").value || "23:59";
      applyRange(df ? new Date(`${df}T${tf}:00`).toISOString() : "",
                 dt ? new Date(`${dt}T${tt}:00`).toISOString() : "");
    });

    const _pop = document.getElementById("sessPop");
    document.getElementById("sessCombo").addEventListener("click", (e) => {
      const open = _pop.hidden;
      _pop.hidden = !open;
      e.currentTarget.setAttribute("aria-expanded", String(open));
      if (open) {
        const sel = _pop.querySelector('[aria-selected="true"]');
        if (sel) sel.scrollIntoView({ block: "nearest" });
      }
    });
    _pop.addEventListener("click", (e) => {
      const o = e.target.closest("[data-i]");
      if (o) gotoSession(parseInt(o.dataset.i, 10));
    });
    // Escape schliesst die Liste, ohne die Auswahl zu aendern.
    _pop.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      _pop.hidden = true;
      const c = document.getElementById("sessCombo");
      c.setAttribute("aria-expanded", "false");
      c.focus();
    });
    document.getElementById("sessPrev").addEventListener("click", () => {
      const i = sessionIndex(FROM, TO, allSessions);
      if (i >= 0) gotoSession(i + 1);
    });
    document.getElementById("sessNext").addEventListener("click", () => {
      const i = sessionIndex(FROM, TO, allSessions);
      if (i > 0) gotoSession(i - 1);
    });

    PubgUI.fetchJson((window.__SERVE_BASE__ || "/") + "api/pubg/sessions")
      .then(sessions => { allSessions = sessions || []; paintPicker(); })
      .catch(() => { paintPicker(); });
    paintPicker();

    function fmtDuration(secs) {
      if (!secs) return "0min";
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      return h ? `${h}h ${m}min` : `${m}min`;
    }

    function fmtSurv(secs) {
      const m = Math.floor((secs||0)/60);
      const s = (secs||0) % 60;
      return `${m}:${String(s).padStart(2,"0")}`;
    }

    // ── Lobby-Aufschluesselung (Modal) ──────────────────────────────────
    // Hinter jeder Lobby-Zahl steht eine Verteilung: 1.33 im Schnitt kann
    // eine gleichmaessige Lobby sein oder fuenf Haie und dreissig Bots.
    const _lobbyCache = new Map();
    // Harte Lobby: Maßstab ist der Schnitt der stärksten Fünf, nicht der
    // Gesamtschnitt — der liegt fast immer bei 1,3 und sagt nichts darüber,
    // ob oben Haie sassen. Ab 3,0 markiert, ab 4,0 deutlicher.
    const LOBBY_HOT = [3.0, 4.0, 5.0];

    // Der Effekt gehoert an den Wert, der ihn ausloest. Vorher hing er an
    // der Lobby-K/D, richtete sich aber nach dem Top-5-Schnitt — eine Lobby
    // mit K/D 1,13 glomm, weil oben fuenf Haie sassen. Jetzt entscheidet
    // jeder Wert fuer sich, und die Spitze hat ihre eigene Kachel.
    function hotLobby(value, formatted) {
      return value == null ? formatted : PubgUI.hot(value, LOBBY_HOT, formatted);
    }

    // Spiegelt pubg/lobby_kd.py::MIN_KD_ROUNDS — nur fuer den Hinweistext.
    // Stand 2026-09-07 dort von 50 auf 20 gesenkt.
    const MIN_KD_ROUNDS = 20;

    function lobbyKdStr(v) { return v == null ? "—" : v.toFixed(2); }
    // Wie im Report-Kopf: der Effekt haengt am Wert, nicht am Ort. Im Modal
    // stehen die haertesten Gegner — dort gehoert er hin, sonst sieht eine
    // 6er-K/D in der Liste aus wie jede andere Zahl.
    function hotKd(v) {
      return v == null ? "—" : hotLobby(v, v.toFixed(2));
    }

    // Woher der Wert stammt: der gespielte Modus zuerst, sonst dieselbe
    // Perspektive, zuletzt alles. Das gehört sichtbar dazu — 3.26 aus
    // squad-fpp ist etwas anderes als 3.26 aus zwei Third-Person-Runden.
    const BASIS_LABEL = { fpp: "all FPP", tpp: "all TPP", all: "all modes" };

    // Season-IDs kommen als "division.bro.official.pc-2018-42". Das "2018"
    // ist ein festes Praefix aus PUBGs Namensschema, kein Jahr — es steht
    // seit Jahren still, waehrend nur die hintere Zahl hochzaehlt (die
    // Asset-Liste endet bei 19, live laeuft 42). Also nur die Nummer.
    function seasonShort(id) {
      const m = String(id || "").match(/-(\d+)$/);
      return m ? m[1] : (id || "").replace(/^.*\./, "");
    }

    function basisHtml(p) {
      if (!p || !p.basis) return "";
      const label = BASIS_LABEL[p.basis] || p.basis;
      // Quelle direkt an den Modus haengen statt in eine eigene Zeile: ein
      // Season-Wert ist etwas anderes als ein Karriere-Wert, und das muss
      // an der Zahl stehen, nicht daneben.
      const src = p.source === "season"
        ? `-season-${seasonShort(p.seasonId) || "current"}`
        : (p.source === "lifetime" ? "-lifetime" : "");
      // Ranked-Match, aber nur Normal-Werte vorhanden: der Wert gilt, muss
      // aber als Ersatz erkennbar sein — sonst liest man eine
      // Unranked-Zahl als Ranked-Leistung.
      const rkFb = p.rankedFallback
        ? ` <span class="where where--fallback" title="No ranked data for this player yet — this is their unranked value">unranked data</span>`
        : "";
      // Stichprobe im Verhaeltnis zur Karriere: "230/7000 Runden" zeigt,
      // dass der Season-Wert aus 230 von insgesamt 7000 Runden stammt.
      // Ohne Bezugsgroesse sagt "230 Runden" wenig darueber, wie
      // repraesentativ die Zahl ist.
      const lt = p.lifetimeRounds || 0;
      const rounds = p.rounds
        ? (lt && lt !== p.rounds
             ? `, ${p.rounds}/${lt} rounds`
             : `, ${p.rounds} rounds`)
        : "";
      return ` <span class="where">${PubgUI.esc(label + src + rounds)}</span>${rkFb}`;
    }

    function lobbyListHtml(players, cls, withMatch) {
      if (!players || !players.length) {
        return `<p class="lobby-modal__empty">No values.</p>`;
      }
      return `<ul class="lobby-list lobby-list--${cls}">` + players.map(p => `
        <li><span class="li-name">${PubgUI.esc(p.name)}${withMatch && p.playedAt
              ? ` <span class="where">${PubgUI.esc(PubgUI.fmtTime(p.playedAt))}</span>` : ""
            }</span>
            <span class="li-basis">${basisHtml(p)}</span>
            <span class="kd">${hotKd(p.kd)}</span></li>`).join("") + `</ul>`;
    }

    // Squad Record: was in DIESEN Matches passiert ist — Kills durch Tode.
    // Bewusst getrennt vom Karriere-K/D im Squad-Modal: das eine sagt, wie
    // gut jemand ueblicherweise ist, das andere, was in diesem Zeitraum
    // herauskam.
    function recordBodyHtml(d, isPhase) {
      const src = isPhase ? d.totals : (d.matches && d.matches[0]);
      const mates = (src && src.squad) || [];
      if (!mates.length || !src) {
        return `<p class="lobby-modal__empty">No squad data for this
          selection.</p>`;
      }
      const kdStr = (v) => v == null ? "—" : v.toFixed(2);
      const rows = [...mates].sort((a, b) =>
        (b.recKd ?? -1) - (a.recKd ?? -1));
      return `
        <div class="lobby-kpis">
          <div class="lobby-kpi"><b>${hotKd(src.recordKdMates)}</b><span>Mates Record</span></div>
          <div class="lobby-kpi"><b>${src.recordKillsMates}</b><span>Mate Kills</span></div>
          <div class="lobby-kpi"><b>${src.recordDeathsMates}</b><span>Mate Deaths</span></div>
          <div class="lobby-kpi"><b>${hotKd(src.recordKd)}</b><span>Incl. me</span></div>
        </div>
        <div class="lobby-side">
          <h3>Who did what <em>kills and deaths in ${
            isPhase ? "this phase" : "this match"}</em></h3>
          <ul class="lobby-list lobby-list--top">${rows.map(m => `
            <li${m.isMe ? ' class="is-me"' : ''}><span class="li-name">${
                PubgUI.esc(m.name)}${m.isMe
                  ? ` <span class="where where--me">me</span>` : ""}</span>
                <span class="li-basis"><span class="where">${m.recKills} kills · ${
                  m.recDeaths} ${m.recDeaths === 1 ? "death" : "deaths"}</span></span>
                <span class="kd">${hotKd(m.recKd)}</span></li>`).join("")}</ul>
        </div>
        <p class="lobby-modal__note">Kills divided by deaths, summed over
          ${isPhase ? "all matches of the phase" : "this match"} &mdash; not an
          average of per-match ratios, so a match with ten kills weighs more
          than one with a single kill. A death counts when the player died
          before the match ended. The headline figure leaves my own numbers
          out, same as the header; &bdquo;Incl. me&ldquo; is the record of the
          whole team for comparison.</p>`;
    }

    function squadBodyHtml(d, isPhase) {
      const src = isPhase ? d.totals : (d.matches && d.matches[0]);
      const mates = (src && src.squad) || [];
      if (!mates.length) {
        return `<p class="lobby-modal__empty">No squad data for this
          selection.</p>`;
      }
      const known = mates.filter(m => m.kd != null).length;
      // Der angezeigte Schnitt muss zu der Zahl passen, auf die geklickt
      // wurde: aus der Match Row kommt der Wert MIT mir, aus dem
      // Phasen-Header der ohne mich. Nur im Phasen-Fall wird der eigene
      // Eintrag deshalb abgesetzt.
      const avg = isPhase ? src.squadAvgMates : src.squadAvg;
      const dimMe = isPhase;
      return `
        <div class="lobby-kpis">
          <div class="lobby-kpi"><b>${hotKd(avg)}</b><span>${
            isPhase ? "Ø Mates K/D" : "Ø Squad K/D"}</span></div>
          <div class="lobby-kpi"><b>${mates.length}</b><span>${
            isPhase ? "teammates" : "in the squad"}</span></div>
          ${known < mates.length
            ? `<div class="lobby-kpi"><b>${mates.length - known}</b><span>no value</span></div>`
            : ""}
        </div>
        <div class="lobby-side">
          <h3>${isPhase ? "Who played along" : "The squad"}
            <em>${isPhase
              ? "K/D measured per match, for the mode each was played in"
              : "K/D for the mode of this match"}</em></h3>
          <ul class="lobby-list lobby-list--top">${mates.map(m => {
            // Der eigene Eintrag steht in der Liste, geht aber NICHT in den
            // Schnitt ein — ohne Kennzeichnung sieht das wie ein Rechenfehler
            // aus (Liste mit drei Namen, Mittel aus zwei).
            const isMe = dimMe && !!m.isMe;
            return `
            <li${isMe ? ' class="is-me"' : ''}><span class="li-name">${PubgUI.esc(m.name)}${isMe
                  ? ` <span class="where where--me">not counted</span>` : ""}${isPhase && m.matches
                  ? ` <span class="where">${m.matches} ${
                      m.matches === 1 ? "match" : "matches"}</span>` : ""
                }</span>
                <span class="li-basis">${basisHtml(m)}</span>
                <span class="kd">${m.kd == null ? "N/A" : hotKd(m.kd)}</span></li>`;
            }).join("")}</ul>
        </div>
        <p class="lobby-modal__note">${isPhase
            ? "Measured per match, for the mode each one was played in — a phase can mix duo and squad"
            : "Measured for the mode of this match"}, taken from the current
          season first — that says more about current form. If the season is too thin, an older one counts, and only then
          the career value; the basis used is shown behind every name. In no
          case is this their performance in ${isPhase ? "this phase" : "this match"} —
          that is what &bdquo;Squad Record&ldquo; in the phase header shows.${isPhase
            ? " Anyone who only joined for a round or two barely moves the"
              + " average but still shows up here."
            : ""}</p>`;
    }

    function lobbyBodyHtml(d, isPhase) {
      const src = isPhase ? d.totals : (d.matches && d.matches[0]);
      if (!src || src.avg == null) {
        return `<p class="lobby-modal__empty">No values for this lobby yet
          &mdash; the collector is still working on it.</p>`;
      }
      const n = d.topN || 5;
      const cov = isPhase
        ? `${src.matchesInAverage} of ${src.matches} matches counted`
        : `${src.known} von ${src.lobbyPlayers} Gegnern bekannt`
          + ` (${Math.round(src.coverage)} %)`;
      return `
        <div class="lobby-kpis">
          <div class="lobby-kpi"><b>${lobbyKdStr(src.avg)}</b><span>Ø K/D</span></div>
          <div class="lobby-kpi"><b>${lobbyKdStr(src.median)}</b><span>Median</span></div>
          <div class="lobby-kpi"><b>${hotKd(src.max)}</b><span>Toughest</span></div>
          <div class="lobby-kpi"><b>${hotKd(src.topAvg)}</b><span>Top ${n} Ø</span></div>
          <div class="lobby-kpi"><b>${lobbyKdStr(src.lowAvg)}</b><span>Low ${n} Ø</span></div>
        </div>
        <div class="lobby-side">
          <h3>Top ${n} <em>${cov}</em></h3>
          ${lobbyListHtml(isPhase ? src.strongest : src.top, "top", isPhase)}
        </div>
        <div class="lobby-side">
          <h3>Bottom ${n}</h3>
          ${lobbyListHtml(isPhase ? src.weakest : src.low, "low", isPhase)}
        </div>
        <p class="lobby-modal__note">${isPhase
          ? `Average and median are means of the per-match values &mdash;
             otherwise full lobbies would outweigh short matches. Top and
             bottom, in contrast, are the extremes of the whole phase, each
             player counted once. Every value is measured for the mode of the
             match it came from, so a phase mixing duo and squad mixes both.`
          : `My own squad and bots are excluded. Measured for the mode of this
             match; if it says &bdquo;all FPP&ldquo; or &bdquo;all
             modes&ldquo;, that player had too few rounds in the mode itself.
             Below ${MIN_KD_ROUNDS} rounds there is no value at all &mdash; 20
             kills from two rounds mean nothing.`}</p>`;
    }

    async function openLobbyModal(matchIds, title, sub, isPhase, view) {
      const dlg = document.getElementById("lobbyModal");
      const body = document.getElementById("lobbyModalBody");
      document.getElementById("lobbyModalTitle").textContent = title;
      document.getElementById("lobbyModalSub").textContent = sub || "";
      body.innerHTML = `<p class="lobby-modal__empty">Lade …</p>`;
      if (typeof dlg.showModal === "function") dlg.showModal();
      const key = matchIds.join(",");
      try {
        let d = _lobbyCache.get(key);
        if (!d) {
          d = await PubgUI.fetchJson((window.__SERVE_BASE__ || "/")
            + "api/pubg/lobby-detail?matches=" + encodeURIComponent(key), 30000);
          _lobbyCache.set(key, d);
        }
        // Hat der Server gekuerzt, muss das in der Kopfzeile stehen:
        // sonst zeigt das Modal einen anderen Top-5-Schnitt als der
        // Report daneben, bei identischer Rechnung — nur ueber weniger
        // Matches.
        if (d.matchesRequested && d.matchesUsed
            && d.matchesUsed < d.matchesRequested) {
          document.getElementById("lobbyModalSub").textContent =
            `${sub || ""}${sub ? " · " : ""}only the newest `
            + `${d.matchesUsed} of ${d.matchesRequested} matches `
            + `(URL length limit) — values differ from the totals above`;
        }
        body.innerHTML = view === "record"
          ? recordBodyHtml(d, isPhase)
          : view === "squad"
            ? squadBodyHtml(d, isPhase)
            : lobbyBodyHtml(d, isPhase);
      } catch (err) {
        body.innerHTML = `<p class="lobby-modal__empty">Could not load the
          lobby: ${PubgUI.esc(String(err && err.message || err))}</p>`;
      }
    }

    // Delegiert statt direkt gebunden: das <dialog> steht im Markup NACH
    // diesem Script — ein getElementById darauf ist hier null und haette
    // das ganze Script abgebrochen (und damit den Report nie geladen).
    document.addEventListener("click", (e) => {
      const dlg = document.getElementById("lobbyModal");
      if (!dlg) return;
      // Klick auf den Backdrop trifft das dialog-Element selbst.
      if (e.target === dlg || e.target.closest("#lobbyModalClose")) dlg.close();
    });

    document.addEventListener("click", (e) => {
      const btn = e.target.closest(".lobby-open");
      if (!btn) return;
      // Die Match-Zeile selbst oeffnet das Match-Detail. Beide Handler
      // haengen an document, also reicht stopPropagation nicht — es muessen
      // die weiteren Listener AM SELBEN Knoten gestoppt werden.
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      const ids = (btn.dataset.matches || "").split(",").filter(Boolean);
      if (!ids.length) return;
      openLobbyModal(ids, btn.dataset.title || "Lobby", btn.dataset.sub || "",
                     btn.dataset.phase === "1", btn.dataset.view || "lobby");
    });

    // Ab welcher Abdeckung ein Lobby-Wert etwas aussagt. Dieselbe Schwelle
    // benutzt das Backend fuer Phasen- und Session-Schnitt — sonst zeigt die
    // Match-Zeile eine Zahl, die in der Phase darueber fehlt (gemessen:
    // Matches mit 2 von 95 bekannten Spielern und "1.82" in der Zelle).
    const MIN_LOBBY_COVERAGE = 25;
    // Ab hier gilt die Sammlung als abgeschlossen. Zwischen den beiden
    // Schwellen steht die Zahl MIT Spinner: sie ist belastbar genug zum
    // Anzeigen, wandert aber noch. Der Sprung von "nichts" direkt auf
    // "fertige Zahl" verschwieg das.
    const FULL_LOBBY_COVERAGE = 75;

    // Zahl + Spinner, solange noch gesammelt wird.
    function lobbyPendingMark(coverage) {
      // Ohne bekannte Abdeckung KEIN Spinner: sonst laeuft er dauerhaft,
      // wo das Feld fehlt, und behauptet eine Sammlung, die niemand kennt.
      if (coverage == null) return "";
      return coverage < FULL_LOBBY_COVERAGE
        ? ` <span class="lobby-pending lobby-pending--inline" role="img"`
          + ` aria-label="still collecting"></span>`
        : "";
    }

    // TopScorer-Score: "16K / 3A". Assists fehlen bei Matches, die vor der
    // assists-Spalte eingelesen wurden — dann nur die Kills, keine erfundene 0.
    function fmtScore(sc) {
      if (!sc) return "";
      return sc.assists == null
        ? `${sc.kills}K`
        : `${sc.kills}K / ${sc.assists}A`;
    }

    function fmtMatchRow(m, idx, matchNum) {
      const startIso = PubgUI.matchStartIso(m.matchEnd, m.durationSec);
      const mySurv = m.timeSurvived || 0;
      const squadSurv = m.squadTimeSurvived || mySurv;
      const isWin = m.place === 1;
      const squadOutIso = new Date(new Date(startIso).getTime() + squadSurv * 1000).toISOString();
      // Datum nur zeigen wenn Match anderen Tag als Match-End hat (Mitternacht-Übergang)
      const startD = PubgUI.fmtDate(startIso);
      const outD = PubgUI.fmtDate(squadOutIso);
      const startTimeStr = (startD === outD)
        ? PubgUI.fmtTime(startIso)
        : `${startD.slice(0,5)} ${PubgUI.fmtTime(startIso)}`;
      const outTimeStr = (startD === outD)
        ? PubgUI.fmtTime(squadOutIso)
        : `${outD.slice(0,5)} ${PubgUI.fmtTime(squadOutIso)}`;
      const numStr = matchNum != null ? `<span class="num">#${matchNum}</span> ` : "";
      const isEvent = !!m.isEvent;
      const isTdm = (m.mode || "") === "tdm";
      // Event-Matches: Place + Kills/DMG/Surv ausgrauen, Badge in Map-Spalte.
      // TDM bekommt ein eigenes „TDM"-Badge statt des generischen „EVENT".
      const placeCell = isEvent
        ? `<span class="place event-badge" title="${m.mode || 'event'}">${isTdm ? 'TDM' : 'EVENT'}</span>`
        : `<span class="place">#${m.place}</span>`;
      const dimAttr = isEvent ? ' data-event="1"' : '';
      return `
        <div class="m ${isWin && !isEvent ? 'win' : ''}${isEvent ? ' is-event' : ''}" data-idx="${idx}" data-match-id="${m.matchId || ''}"${dimAttr}>
          <span class="time-range">${numStr}<b>${startTimeStr}</b> → <b>${outTimeStr}</b>${m.isRanked
            ? `<span class="ranked-badge" title="Ranked match (matchType: competitive)"><span
                 class="material-symbols-outlined icon-sm" aria-hidden="true">military_tech</span><span
                 class="sr-only">Ranked</span></span>`
            : ""}</span>
          ${placeCell}
          <span class="map">${PubgUI.fmtMap(m.map)}<span class="hot-drop-badge" data-hd-slot></span></span>
          <span class="stat bot-teams" title="Bot teams / total teams in the lobby"><b>${m.botTeamsInLobby || 0}/${m.totalTeamsInLobby || 0}</b> Teams</span>
          <span class="stat bot-teams" title="Bot players / total players in the lobby"><b>${m.botPlayersInLobby || 0}/${m.totalPlayersInLobby || 0}</b> <span class="material-symbols-outlined icon-sm" aria-hidden="true">smart_toy</span></span>
