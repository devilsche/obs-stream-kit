          <span class="stat"><b>${m.kills}</b> K${m.myStats && m.myStats.botKills ? ` <span class="bot-kills">(${m.myStats.botKills})</span>` : ""}</span>
          <span class="stat"><b>${Math.round(m.damage||0)}</b> DMG</span>
          <span class="stat"><b>${fmtSurv(mySurv)}</b></span>
          <span class="stat lobby-kd" title="${
            (m.lobbyKd == null || (m.lobbyCoverage || 0) < MIN_LOBBY_COVERAGE)
              ? `Opponent K/D is still being collected — only ${m.lobbyKnown || 0} of ${m.lobbyPlayers || 0} known so far, calculated from ${MIN_LOBBY_COVERAGE} % on`
              : `Average opponent K/D for the mode of this match, my own squad excluded (${m.lobbyKnown}/${m.lobbyPlayers} known, ${Math.round(m.lobbyCoverage || 0)} %)${
                  (m.lobbyCoverage || 0) < FULL_LOBBY_COVERAGE
                    ? " — still collecting, the value will keep moving" : ""}`
          }">${(m.lobbyKd == null || (m.lobbyCoverage || 0) < MIN_LOBBY_COVERAGE)
                ? (m.lobbyPlayers
                    ? `<span class="lobby-pending" role="img" aria-label="Lobby strength is still being collected"></span>`
                    : '<span class="dim">—</span>')
                : `<button type="button" class="lobby-open"
                     data-matches="${PubgUI.esc(m.matchId)}"
                     data-title="Lobby · ${PubgUI.esc(PubgUI.fmtMap(m.map))}"
                     data-sub="${PubgUI.esc(PubgUI.fmtDateTime(m.matchEnd))}"
                     aria-label="Break down the lobby: median, strongest and weakest opponents"
                   >${hotLobby(m.lobbyKd, `<b>${m.lobbyKd.toFixed(2)}</b>`)}</button>${
                     lobbyPendingMark(m.lobbyCoverage)}`}</span>
          <span class="stat lobby-kd" title="${
            m.squadKd == null
              ? "Squad K/D not known yet"
              : "Average K/D of my squad for the mode of this match, myself included"
          }">${
            (m.squadKd == null || (m.lobbyCoverage || 0) < MIN_LOBBY_COVERAGE)
              ? (m.lobbyPlayers
                  ? `<span class="lobby-pending" role="img" aria-label="Squad strength is still being collected"></span>`
                  : '<span class="dim">—</span>')
              : `<button type="button" class="lobby-open" data-view="squad"
                     data-matches="${PubgUI.esc(m.matchId)}"
                     data-title="Squad · ${PubgUI.esc(PubgUI.fmtMap(m.map))}"
                     data-sub="${PubgUI.esc(PubgUI.fmtDateTime(m.matchEnd))}"
                     aria-label="Break down the squad: career K/D of my teammates"
                   ><b>${m.squadKd.toFixed(2)}</b>${
                  m.lobbyKd != null
                    ? ` <span class="lobby-diff ${m.squadKd >= m.lobbyKd ? "up" : "down"}">${
                        m.squadKd - m.lobbyKd >= 0 ? "▲" : "▼"}</span>`
                    : ""}</button>`
          }</span>
          <span class="stat top-scorer" title="Best player in the entire lobby this match">${
            m.topScorer
              ? `<span class="top-scorer__name">${PubgUI.esc(m.topScorer.name)}</span><b>${fmtScore(m.topScorer)}</b>`
              : "<span>—</span>"
          }</span>
        </div>
`;
    }

    // Fingerprint des Report-Payloads — wenn unveraendert,
    // ueberspringen wir komplett (kein Re-Render, kein State-Reset).
    function reportFingerprint(d) {
      if (!d) return "0";
      const t = d.totals || {};
      const phases = (d.phases || []).map(ph =>
        `${ph.matches ? ph.matches.length : 0}:${(ph.stats||{}).endTime||""}`
      ).join("|");
      const maps = (d.mapsPerf || []).length;
      return [
        d.totalMatches || 0,
        t.endTime || "",
        t.kills || 0, t.damage || 0, t.wins || 0,
        phases, maps,
      ].join("#");
    }
    // Snapshot offener UI-States damit wir sie nach einem Re-Render
    // restoren koennen — Match-Expand + Achievements-Details + Scroll.
    function snapshotUiState() {
      const expandedMatches = new Set();
      document.querySelectorAll(".m.expanded[data-match-id]").forEach(r => {
        const id = r.getAttribute("data-match-id");
        if (id) expandedMatches.add(id);
      });
      const achOpen = !!document.querySelector("details.ach-details[open]");
      return { expandedMatches, achOpen, scrollY: window.scrollY };
    }
    function restoreUiState(snap) {
      if (!snap) return;
      // Match-Rows wieder expanden
      snap.expandedMatches.forEach(id => {
        const row = document.querySelector(`.m[data-match-id="${id}"]`);
        if (!row) return;
        const idx = row.getAttribute("data-idx");
        const detail = idx
          ? document.querySelector(`[data-idx-detail="${idx}"]`) : null;
        row.classList.add("expanded");
        if (detail) {
          detail.classList.add("show");
          const host = detail.querySelector(".md-host");
          if (host) mdMount(host);
        }
      });
      // Achievements-Akkordeon wieder aufklappen (erst nach renderExtras
      // verfuegbar — siehe restore-Aufruf weiter unten).
      if (snap.achOpen) {
        const det = document.querySelector("details.ach-details");
        if (det) det.open = true;
      }
      // Scroll-Position grob wiederherstellen
      if (snap.scrollY) window.scrollTo({ top: snap.scrollY, behavior: "instant" });
    }
    // Pending-Restore: das Achievements-Akkordeon wird erst durch
    // renderExtras() asynchron eingehaengt — daher merken wir uns den
    // Snapshot und re-applien sobald die extras drin sind.
    let _pendingRestore = null;

    let _lastReportFp = null;
    function render(d) {
      const root = document.getElementById("report");
      // Skip wenn sich nichts geaendert hat — verhindert dass offene
      // Match-Expands / Achievement-Details bei jedem 60s-Poll zuklappen.
      const fp = reportFingerprint(d);
      if (fp === _lastReportFp && root.querySelector(".totals")) return;
      _lastReportFp = fp;
      const snap = root.querySelector(".totals") ? snapshotUiState() : null;
      _pendingRestore = snap;
      if (!d.totalMatches) {
        root.innerHTML = `<div class="empty">— no matches in session yet —</div>`;
        return;
      }
      const t = d.totals;
      const startIso = PubgUI.matchStartIso(t.startTime, 0);  // approx
      const subtitle = `${PubgUI.fmtDate(t.startTime)} · ${PubgUI.fmtTime(d.sessionStartedAt)} – ${PubgUI.fmtTime(t.endTime)} · ${fmtDuration(t.totalSurvivedSec)} active playtime`;

      // Drei Gruppen, damit ohne Tooltip ablesbar ist, wessen Zahl es ist:
      // ME (nur ich) · TEAM (mein Squad) · LOBBY (die Gegner). Vorher stand
      // alles in einer Reihe und "Squad Session" sah aus wie eine Variante
      // von "Squad K/D", obwohl das eine die Bilanz des Zeitraums ist und
      // das andere der Karriere-Schnitt der Mitspieler.
      const cell = (val, label, title) =>
        `<div class="cell"${title ? ` title="${title}"` : ""}>`
        + `<span class="pubg-stat-value">${val}</span>`
        + `<span class="pubg-stat-label">${label}</span></div>`;

      // Match-IDs der ganzen Session fuer die Lobby-Modals im Header.
      // window._allMatchIds wird erst weiter unten gesetzt, hier also
      // direkt aus den Phasen geholt.
      // NUR Battle-Royale-Matches: die Header-Zahlen rechnen ueber
      // is_br_mode, TDM und Event-Modi sind dort ausgenommen. Gingen sie
      // ins Modal mit, stand oben eine andere K/D als darin.
      //: Obergrenze fuer die Match-Ids im Modal-Aufruf. Muss zur Grenze
      //: im Endpoint passen (MAX_DETAIL_MATCHES = 250); der Grund ist die
      //: URL-Laenge — eine Id ist 37 Zeichen, 250 sind 9 KB.
      //:
      //: Vorher standen hier 60, und zwar unsichtbar: der Report zeigte
      //: den Top-5-Schnitt ueber alle 220 Matches von 30 Tagen (14,10),
      //: das Modal daneben ueber die ersten 60 (11,28). Die Rechnung war
      //: identisch, nur die Menge nicht.
      const MODAL_MATCH_LIMIT = 250;
      const brIds = (ms) => (ms || [])
        .filter(x => !x.isEvent && (x.mode || "") !== "tdm")
        .map(x => x.matchId).filter(Boolean);
      const brMids = (ms) => brIds(ms).slice(0, MODAL_MATCH_LIMIT).join(",");
      //: Wie viele Matches der Aufruf auslaesst — fuer die Kopfzeile des
      //: Modals. Eine gekuerzte Menge ohne Hinweis ist der Grund, warum
      //: zwei Zahlen nebeneinander nicht zusammenpassten.
      const brDropped = (ms) => Math.max(0, brIds(ms).length - MODAL_MATCH_LIMIT);
      const _sessionMatches = (d.phases || []).flatMap(ph => ph.matches || []);
      const _sessionMids = brMids(_sessionMatches);
      const _sessionDropped = brDropped(_sessionMatches);
      // Wie im Phasen-Header: der Wert wird zum Button, der das
      // Lobby-Modal oeffnet.
      const lobbyBtn = (formatted, view) =>
        `<button type="button" class="lobby-open" data-phase="1"`
        + (view ? ` data-view="${view}"` : "")
        + ` data-matches="${_sessionMids}"`
        + ` data-title="${view === "squad" ? "Squad" : "Lobby"} · Session"`
        + ` data-sub="${brIds(_sessionMatches).length}`
        + `${brIds(_sessionMatches).length === 1 ? " match" : " matches"}`
        + `${_sessionDropped ? ` · only the newest ${MODAL_MATCH_LIMIT}`
             + ` counted, ${_sessionDropped} left out (URL length)` : ""}"`
        + ` aria-label="Break down the ${view === "squad" ? "squad" : "lobby"} of this session">`
        + `${formatted}</button>`;

      const totalsHtml = `
        <div class="totals-group">
          <h4 class="totals-h">Me</h4>
          <div class="totals">
            ${cell(t.matches, "Matches")}
            ${cell(t.wins, "Chicken Wins")}
            ${cell(t.kills, "Kills")}
            ${cell(PubgUI.fmtKD(t.kd), "K/D",
                   "My kills per lost match (kills / matches - wins)")}
            ${cell(PubgUI.fmtKD(t.avgKills), "Kills/Match", "My kills per match")}
            ${cell(Math.round(t.avgDamage), "Damage/Match", "My damage per match")}
            ${cell(fmtDuration(Math.round(t.avgSurvivedSec)), "Survival")}
            ${cell("#" + t.avgPlace.toFixed(1), "Placement")}
            ${cell(t.headshots, "Headshot Kills",
                   "Kills where the finishing shot was a headshot — not the number of head hits")}
            ${t.headshotPct != null
                ? cell(t.headshotPct.toFixed(1) + "%", "Head Hit Rate",
                       `${t.headHits} of ${t.totalHits} landed hits went to the head — share of hits, not of shots fired`)
                : ""}
            ${cell(t.dbnos, "Knocks")}
            ${cell(PubgUI.hotIf(t.longestKill, 300, Math.round(t.longestKill) + "m"),
                   "Longest Kill")}
            ${cell(t.uniqueMaps, "Maps")}
          </div>
        </div>
        <div class="totals-group">
          <h4 class="totals-h">Team</h4>
          <div class="totals">
            ${cell(lobbyBtn(hotLobby(t.squadKd, PubgUI.fmtKD(t.squadKd || 0)), "record"), "Mates Record",
                   "Kills per death of my teammates this session — my own numbers excluded")}
            ${t.lobbySquadKd
                ? cell(lobbyBtn(hotLobby(t.lobbySquadKd, t.lobbySquadKd.toFixed(2)), "squad"), "Mates K/D",
                       "Average career K/D of my teammates in the mode played — my own value excluded")
                : ""}
            ${cell((t.squadKillsPerMatch || 0).toFixed(1), "Squad Kills/Match",
                   "Kills per match of the whole squad, myself included")}
          </div>
        </div>
        ${t.event ? `<div class="totals-group">
          <h4 class="totals-h">${(t.event.modes || []).join(" / ").toUpperCase() || "Event"}</h4>
          <div class="totals">
            ${cell(t.event.matches, "Matches")}
            ${cell(t.event.kills, "Kills")}
            ${cell(t.event.deaths, "Deaths")}
            ${cell(t.event.kd == null ? "—" : t.event.kd.toFixed(2), "K/D",
                   "Kills divided by deaths — event modes have no placement, so there is no win rate")}
            ${cell(Math.round(t.event.avgKills), "Kills/Match")}
            ${cell(Math.round(t.event.avgDamage), "Damage/Match")}
          </div>
        </div>` : ""}
        ${t.lobbyKd ? `<div class="totals-group">
          <h4 class="totals-h">Lobby</h4>
          <div class="totals">
            ${cell(lobbyBtn(hotLobby(t.lobbyKd, t.lobbyKd.toFixed(2))), "Lobby K/D",
                   "Average K/D of the opponents in the mode played — my own squad excluded")}
            ${t.lobbyTop5 != null
                ? cell(lobbyBtn(hotLobby(t.lobbyTop5, t.lobbyTop5.toFixed(2))), "Top 5 Avg",
                       "Average K/D of the five strongest opponents of the whole session — each counted once, however many matches they played")
                : ""}
          </div>
        </div>` : ""}`;

      // Chronologische Match-Nummer ueber alle Phases (key = matchEnd
       // Iso-String). Robust gegen interne Sortierung der phases.
      const _allMatches = d.phases.flatMap(ph => ph.matches || []);
      const _sorted = [..._allMatches].sort((a, b) =>
        new Date(a.matchEnd || 0) - new Date(b.matchEnd || 0));
      const matchNumMap = new Map();
      const matchNumByMatchId = new Map();
      _sorted.forEach((m, idx) => {
        matchNumMap.set(m.matchEnd, idx + 1);
        if (m.matchId) matchNumByMatchId.set(m.matchId, idx + 1);
      });
      // Globaler Cache fuer evRows (Vehicle-Events) — damit dort die
      // korrekte Session-Match-Nummer angezeigt wird, nicht die lokale.
      window._matchNumByMatchId = matchNumByMatchId;
      // Match-Meta (Map, Start) fuer Sektionen die nur eine matchId haben
      // — z.B. Special-Action-Achievements.
      window._matchMetaByMatchId = new Map(
        _sorted.filter(m => m.matchId)
               .map(m => [m.matchId, m]));
      // Modal-Navigation braucht die chrono Liste der Match-IDs
      window._allMatchIds = _sorted
        .map(m => m.matchId || "").filter(Boolean);
      window._allMatchesByIdx = _sorted;

      const phasesHtml = d.phases.map((ph, i) => {
        const s = ph.stats;
        const core = ph.coreSquad && ph.coreSquad.length
          ? ph.coreSquad.map(n => `<b>${n}</b>`).join(" + ")
          : "<i>Solo</i>";
        const fillersStr = (ph.fillers && ph.fillers.length)
          ? ` <span style="opacity:0.7">+ wechselnd: ${ph.fillers.map(f => `${f.name} (${f.count})`).join(", ")}</span>`
          : "";
        // Datum + Zeit. Bei Tageswechsel auch das End-Datum zeigen.
        const startD = PubgUI.fmtDate(s.startTime);
        const endD = PubgUI.fmtDate(s.endTime);
        const startStr = `${startD} ${PubgUI.fmtTime(s.startTime)}`;
        const endStr = (startD === endD)
          ? PubgUI.fmtTime(s.endTime)
          : `${endD} ${PubgUI.fmtTime(s.endTime)}`;
        return `
          <div class="phase">
            <h2><span class="num">Phase ${i+1}</span>${s.isRanked
              ? `<span class="phase-tag phase-tag--ranked" title="Ranked matches are kept in their own phase — different lobby strength, not comparable to unranked">Ranked</span>`
              : ""}${s.isEventPhase
              ? `<span class="phase-tag">${(s.eventModes || []).join(" / ").toUpperCase()}</span>`
              : ""}<span class="phase-when">${startStr} → ${endStr} · ${
              s.isEventPhase ? s.eventMatches : s.matches} ${
              (s.isEventPhase ? s.eventMatches : s.matches) === 1 ? 'match' : 'matches'}</span></h2>
            <div class="squad">Core: ${core}${fillersStr}</div>
            <div class="phase-stats">
              ${s.isEventPhase ? `
              <span class="ps-group">${(s.eventModes || []).join(" / ").toUpperCase() || "Event"}</span>
              <span><b>${s.matches + s.eventMatches}</b> Matches</span>
              <span><b>${s.eventKills}</b> Kills</span>
              <span><b>${s.eventDeaths}</b> Deaths</span>
              <span title="Kills divided by deaths — event modes have no placement, so there is no win rate"><b>${
                s.eventKd == null ? "—" : s.eventKd.toFixed(2)}</b> K/D</span>
              <span><b>${Math.round(s.eventAvgKills)}</b> Kills/Match</span>
              <span><b>${Math.round(s.eventAvgDamage)}</b> Damage/Match</span>
              ` : `
              <span class="ps-group">Me</span>
              <span><b>${s.kills}</b> Kills</span>
              <span><b>${s.wins}</b> Wins</span>
              <span><b>${PubgUI.fmtKD(s.kd)}</b> K/D</span>
              <span><b>${Math.round(s.avgDamage)}</b> Damage</span>
              <span><b>${fmtDuration(Math.round(s.avgSurvivedSec))}</b> Survival</span>
              <span><b>#${s.avgPlace.toFixed(1)}</b> Placement</span>
              ${s.headshotPct != null
                  ? `<span title="${s.headHits} of ${s.totalHits} landed hits went to the head — share of hits, not of shots fired"><b>${s.headshotPct.toFixed(1)}%</b> Head Hits</span>`
                  : ""}
              <span class="ps-group">Team</span>
              ${(s.squadMatchesWithMapping||0) > 0 ? `<span title="Kills per death of my teammates in this phase — my own numbers excluded"><button
                       type="button" class="lobby-open" data-phase="1" data-view="record"
                       data-matches="${brMids(ph.matches)}"
                       data-title="Mates Record · Phase ${i+1}"
                       data-sub="${s.matches} ${s.matches === 1 ? 'match' : 'matches'}"
                       aria-label="Break down the squad record of this phase: kills and deaths per player"
                     >${hotLobby(s.squadKd, `<b>${PubgUI.fmtKD(s.squadKd||0)}</b>`)}</button> Mates Record</span>` : ""}
              ${s.lobbySquadKd != null
                  ? `<span title="Average career K/D of my teammates in the mode played — my own value excluded"><button
                       type="button" class="lobby-open" data-phase="1" data-view="squad"
                       data-matches="${brMids(ph.matches)}"
                       data-title="Squad · Phase ${i+1}"
                       data-sub="${s.lobbyMatches} ${s.lobbyMatches === 1 ? 'match' : 'matches'} counted${
                         brDropped(ph.matches) ? ` · only the newest ${MODAL_MATCH_LIMIT} of ${
                           brIds(ph.matches).length} sent (URL length)` : ''}"
                       aria-label="Break down the squad of this phase: career K/D of my teammates"
                     >${hotLobby(s.lobbySquadKd, `<b>${s.lobbySquadKd.toFixed(2)}</b>`)}</button> Mates K/D</span>`
                  : (s.lobbyPending
                      ? `<span title="Teammate K/D is still being collected"><span class="lobby-pending" role="img" aria-label="Teammate K/D is still being collected"></span> Mates K/D</span>`
                      : "")}
              <span class="ps-group">Lobby</span>
              ${s.lobbyKd != null
                  ? `<span title="Average K/D of the opponents across ${s.lobbyMatches} matches of this phase${
                       s.lobbyTop5 != null ? ` · top five average ${s.lobbyTop5.toFixed(2)}` : ""}"><button
                       type="button" class="lobby-open" data-phase="1"
                       data-matches="${brMids(ph.matches)}"
                       data-title="Lobby · Phase ${i+1}"
                       data-sub="${s.lobbyMatches} ${s.lobbyMatches === 1 ? 'match' : 'matches'} counted${
                         brDropped(ph.matches) ? ` · only the newest ${MODAL_MATCH_LIMIT} of ${
                           brIds(ph.matches).length} sent (URL length)` : ''}"
                       aria-label="Break down the lobby of this phase: median and toughest opponents"
                     >${hotLobby(s.lobbyKd, `<b>${s.lobbyKd.toFixed(2)}</b>`)}</button>${
                       lobbyPendingMark(s.lobbyCoverage)} Lobby K/D</span>`
                  : (s.lobbyPending
                      ? `<span title="Opponent K/D is still being collected"><span class="lobby-pending" role="img" aria-label="Opponent K/D is still being collected"></span> Lobby K/D</span>`
                      : "")}
              ${s.lobbyTop5 != null
                  ? `<span title="Average K/D of the five strongest opponents in this phase — each of them counted once, however many matches they played"><button
                       type="button" class="lobby-open" data-phase="1"
                       data-matches="${brMids(ph.matches)}"
                       data-title="Lobby · Phase ${i+1}"
                       data-sub="${s.lobbyMatches} ${s.lobbyMatches === 1 ? 'match' : 'matches'} counted${
                         brDropped(ph.matches) ? ` · only the newest ${MODAL_MATCH_LIMIT} of ${
                           brIds(ph.matches).length} sent (URL length)` : ''}"
                       aria-label="Break down the lobby of this phase: strongest and weakest opponents"
                     >${hotLobby(s.lobbyTop5, `<b>${s.lobbyTop5.toFixed(2)}</b>`)}</button> Top 5 Avg</span>`
                  : ""}
              `}
            </div>
            <div class="matches-list">
              <div class="header-row">
                <span>Squad in Match</span><span>Place</span><span>Map</span>
                <span style="text-align:right" title="Bot teams / total teams">Bot teams</span>
                <span style="text-align:right" title="Bot players / total players">Bots</span>
                <span style="text-align:right">Kills</span>
                <span style="text-align:right">Damage</span>
                <span style="text-align:right">Survived</span>
                <span class="col-right" title="Average opponent K/D in this lobby for the mode played — my own squad excluded">Lobby K/D</span>
                <span class="col-right" title="Average career K/D of my squad for the mode played — not their performance this match">Squad K/D</span>
                <span class="col-right" title="Best player in the lobby">TopScorer</span>
              </div>
              ${ph.matches.map((m, i) => fmtMatchRow(m, `${ph.coreSquad.join('-')}-${i}`, matchNumMap.get(m.matchEnd))).join("")}
            </div>
          </div>`;
      }).join("");

      // Map-Performance
      const mp = d.mapsPerf || [];
      const mapsHtml = mp.length ? `
        <h3 class="extras-h">Map-Performance</h3>
        <table style="width:100%;border-collapse:collapse;font-size:0.85em;font-variant-numeric:tabular-nums;margin-top:8px">
          <thead><tr style="color:var(--pubg-muted);font-size:0.85em">
            <th style="text-align:left;padding:4px 8px;border-bottom:1px solid rgba(255,255,255,0.1)">Map</th>
            <th style="text-align:right;padding:4px 8px;border-bottom:1px solid rgba(255,255,255,0.1)">Matches</th>
            <th style="text-align:right;padding:4px 8px;border-bottom:1px solid rgba(255,255,255,0.1)">Wins</th>
            <th style="text-align:right;padding:4px 8px;border-bottom:1px solid rgba(255,255,255,0.1)">K/D</th>
            <th style="text-align:right;padding:4px 8px;border-bottom:1px solid rgba(255,255,255,0.1)">Ø Kills</th>
            <th style="text-align:right;padding:4px 8px;border-bottom:1px solid rgba(255,255,255,0.1)">Ø DMG</th>
            <th style="text-align:right;padding:4px 8px;border-bottom:1px solid rgba(255,255,255,0.1)">Ø Place</th>
            <th style="text-align:right;padding:4px 8px;border-bottom:1px solid rgba(255,255,255,0.1)">Ø Surv</th>
          </tr></thead>
          <tbody>
            ${mp.map(m => {
              const isEvent = !!m.isEvent;
              // Event-Rows nicht gold faerben — in Events ist 'place=1'
              // immer fuer alle gesetzt → 'wins' ist hier kein echter Win.
              // Klassen statt style-Attribute: der feste Lila-Ton war auf
              // hellen Themes unlesbar (Kontrast 1,81), und Inline-Styles
              // koennen kein Theme tragen.
              const rowStyle = (m.wins && !isEvent) ? 'class="map-row--win"'
                : isEvent ? 'class="map-row--event"' : '';
              // KD: in Event-Only-Maps wenn keine Deaths → 'Perfekt'.
              // Auch in BR ohne Deaths → 'Perfekt'.
              const kdCell = (m.deaths === 0 && (m.brMatches || 0) > 0)
                ? '<span title="No deaths" class="map-perfect">Perfect</span>'
                : (isEvent && m.deaths === 0)
                  ? '<span title="event without DIED" class="map-perfect">Perfect</span>'
                  : m.kd.toFixed(2);
              const placeCell = isEvent ? '—' : `#${m.avgPlace.toFixed(1)}`;
              // Event-Badge: lila Text auf transparentem Hintergrund. Bei
              // gold-row-context wuerde die Inline-color zwar gewinnen,
              // aber wir entfernen sie sowieso (siehe rowStyle).
              const nameCell = isEvent
                ? `${PubgUI.fmtMap(m.map)} <span style="display:inline-block;margin-left:6px;padding:1px 6px;background:rgba(216,180,255,0.18);border:1px solid rgba(216,180,255,0.5);border-radius:9px;font-size:0.7em;color:#e0c8ff !important;letter-spacing:0.06em;text-transform:uppercase">Event</span>`
                : PubgUI.fmtMap(m.map);
              return `<tr ${rowStyle}>
                <td style="padding:4px 8px">${nameCell}</td>
                <td style="text-align:right;padding:4px 8px">${m.matches}</td>
                <td style="text-align:right;padding:4px 8px">${m.wins || '—'}</td>
                <td style="text-align:right;padding:4px 8px">${kdCell}</td>
                <td style="text-align:right;padding:4px 8px">${m.avgKills.toFixed(1)}</td>
                <td style="text-align:right;padding:4px 8px">${Math.round(m.avgDamage)}</td>
                <td style="text-align:right;padding:4px 8px">${placeCell}</td>
                <td style="text-align:right;padding:4px 8px">${fmtDuration(Math.round(m.avgSurvivedSec))}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>` : "";

      const hl = d.highlights || [];
      const ll = d.lowlights || [];
      const highlightsHtml = (hl.length || ll.length) ? `
        <div class="highlights">
          <div class="col">
            <h3>★ Top-DMG matches</h3>
            ${hl.map(m => {
              const startIso = PubgUI.matchStartIso(m.matchEnd, m.durationSec);
              return `<div class="highlight-item">${PubgUI.fmtTime(startIso)} · ${PubgUI.fmtMap(m.map)} · <b>#${m.place}</b> · <b>${m.kills}</b>K · <b>${Math.round(m.damage)}</b>DMG</div>`;
            }).join("")}
          </div>
          <div class="col">
            <h3>✘ Early deaths</h3>
            ${ll.map(m => {
              const startIso = PubgUI.matchStartIso(m.matchEnd, m.durationSec);
              const surv = m.timeSurvived || 0;
              return `<div class="highlight-item">${PubgUI.fmtTime(startIso)} · ${PubgUI.fmtMap(m.map)} · #${m.place} after <b>${Math.floor(surv/60)}:${String(surv%60).padStart(2,"0")}</b></div>`;
            }).join("")}
          </div>
        </div>` : "";

      // Trend / Achievements / Streaks — extra Sektion mit eigenem Fetch.
      // Skeleton mit reservierter Hoehe verhindert das Springen wenn der
      // async Inhalt spaeter reinkommt.
      const extrasPlaceholder = `<div class="extras-placeholder">
          <div class="extras-skeleton" aria-hidden="true">
            <div class="extras-skel-box extras-skel-trend"></div>
            <div class="extras-skel-box extras-skel-streak"></div>
            <div class="extras-skel-box extras-skel-ach"></div>
          </div>
        </div>`;

      root.innerHTML = `
        <h1>After-Session Report</h1>
        <div class="subtitle">${subtitle}</div>
        ${totalsHtml}
        ${extrasPlaceholder}
        ${d.phases && d.phases.length ? '<h3 class="extras-h">Phases</h3>' : ''}
        ${phasesHtml}
        ${mapsHtml}
        ${highlightsHtml}
      `;

      renderExtras();
    }

    // Trend, Achievements und Streaks fetchen + in den Report einhängen.
    // Streaks werden client-seitig aus session-matches berechnet (matches
    // sind absteigend sortiert: neueste zuerst).
    async function renderExtras() {
      // Range an alle Extras durchreichen — sonst zeigen Trend/Achievements/
      // Streaks immer die aktuelle Session unabhängig von gewählter Phase.
      const fromTo = (FROM || TO)
        ? "?" + new URLSearchParams({
            ...(FROM ? {from: FROM} : {}),
            ...(TO   ? {to:   TO}   : {}),
          }).toString()
        : "";
      const _SB = window.__SERVE_BASE__||"/";
      // fetchJson bricht sonst nach 10s ab. Ueber alle Sessions gerechnet
      // brauchen vehicle-stats 7,7s und session-achievements 6,0s; der
      // Server arbeitet die parallelen Requests hintereinander ab, also
      // lief achievements in den Abort — der Server antwortete mit 200,
      // das .catch() machte daraus stillschweigend eine leere Liste, und
      // der Report zeigte Vehicle-Action ohne Achievements.
      const EXTRAS_TIMEOUT_MS = 60000;
      const matchesUrl = (FROM || TO)
        ? _SB + `api/pubg/session-matches${fromTo}`
        : _SB + `api/pubg/session-matches?range=session`;
      const hotDropUrl = (FROM || TO)
        ? _SB + `api/pubg/hot-drop${fromTo}`
        : _SB + `api/pubg/hot-drop?range=session`;
      const paydayUrl = (FROM || TO)
        ? _SB + `api/pubg/payday-stats${fromTo}`
        : _SB + `api/pubg/payday-stats?range=session`;
      const vehicleUrl = (FROM || TO)
        ? _SB + `api/pubg/vehicle-stats${fromTo}`
        : _SB + `api/pubg/vehicle-stats?range=session`;
      const [trend, achievements, matches, hotDrop, payday, vehicle] = await Promise.all([
        PubgUI.fetchJson((window.__SERVE_BASE__||"/") + `api/pubg/trend-deltas${fromTo}`, EXTRAS_TIMEOUT_MS).catch(() => null),
        PubgUI.fetchJson((window.__SERVE_BASE__||"/") + `api/pubg/session-achievements${fromTo}`, EXTRAS_TIMEOUT_MS).catch(() => []),
        PubgUI.fetchJson(matchesUrl, EXTRAS_TIMEOUT_MS).catch(() => []),
        PubgUI.fetchJson(hotDropUrl, EXTRAS_TIMEOUT_MS).catch(() => null),
        PubgUI.fetchJson(paydayUrl, EXTRAS_TIMEOUT_MS).catch(() => null),
        PubgUI.fetchJson(vehicleUrl, EXTRAS_TIMEOUT_MS).catch(() => null),
      ]);

      // POI-Lookup-Tabelle muss da sein bevor wir Tooltips bauen.
      if (PubgUI.POI && PubgUI.POI.ready) {
        try { await PubgUI.POI.ready; } catch (e) {}
      }

      // Landings + POI-Cal pre-fetchen fuer Mini-Map. Lazy-rendert wenn
      // User Match expandiert.
      try {
        const [lj, pj] = await Promise.all([
          PubgUI.fetchJson((window.__SERVE_BASE__||"/") + "api/pubg/landings"),
          PubgUI.fetchJson((window.__SERVE_BASE__||"/") + "api/pubg/pois"),
        ]);
        window._landingsByMatch = new Map();
        const lans = (lj && lj.landings) || lj || [];
        for (const ld of lans) {
          if (!ld.matchId) continue;
          if (!window._landingsByMatch.has(ld.matchId)) {
            window._landingsByMatch.set(ld.matchId, []);
          }
          window._landingsByMatch.get(ld.matchId).push(ld);
        }
        window._poiData = pj || {};
      } catch (e) {
        window._landingsByMatch = new Map();
        window._poiData = {};
      }

      // Flammen-Badge in jeder Match-Zeile rendern: Hot-Drop → local_fire_department
      // (greyscale wenn nicht ueberlebt). Tooltip = POI-Name (Map ist
      // schon in der Zeile selbst sichtbar).
      if (hotDrop && Array.isArray(hotDrop.perMatch)) {
        const hdMap = new Map();
        for (const pm of hotDrop.perMatch) {
          if (pm.matchId) hdMap.set(pm.matchId, pm);
        }
        document.querySelectorAll(".m[data-match-id]").forEach((row) => {
          const id = row.getAttribute("data-match-id");
          const slot = row.querySelector("[data-hd-slot]");
          if (!id || !slot) return;
          const pm = hdMap.get(id);
          if (!pm || !pm.hotDrop) return;
          const survived = !!pm.soloSurvived;
          const teamSaved = !survived && !!pm.teamSurvived;
          const poi = (PubgUI.POI && PubgUI.POI.fromCoords)
            ? PubgUI.POI.fromCoords(pm.mapName, pm.landingX, pm.landingY)
            : null;
          let tooltip = "Hot Drop";
          if (poi) tooltip += " · " + poi;
          if (survived) tooltip += " · survived";
          else if (teamSaved) tooltip += " · died, team survived";
          else tooltip += " · died";
          slot.className = "hot-drop-badge " + (survived ? "hot" : "died");
          slot.innerHTML = '<span class="material-symbols-outlined" aria-hidden="true">local_fire_department</span>';
          slot.setAttribute("title", tooltip);
        });
      }

      const placeholder = document.querySelector(".extras-placeholder");
      if (!placeholder) return;

      const arrow = (v) => v > 0.001 ? "↑" : (v < -0.001 ? "↓" : "·");
      const cls = (v) => v > 0.001 ? "delta-pos" : (v < -0.001 ? "delta-neg" : "delta-zero");

      let trendHtml = "";
      if (trend && trend.deltas && trend.current) {
        const d = trend.deltas;
        trendHtml = `
          <h3 class="extras-h">Trend vs. last session</h3>
          <div class="trend-grid">
            <div class="trend-cell">
              <div class="trend-label">K/D</div>
              <div class="trend-row"><span class="trend-val">${(trend.current.kd||0).toFixed(2)}</span>
                <span class="trend-delta ${cls(d.kd)}">${arrow(d.kd)}${Math.abs(d.kd).toFixed(2)}</span></div>
            </div>
            <div class="trend-cell">
              <div class="trend-label">Wins</div>
              <div class="trend-row"><span class="trend-val">${trend.current.wins||0}</span>
                <span class="trend-delta ${cls(d.wins)}">${arrow(d.wins)}${Math.abs(d.wins)}</span></div>
            </div>
            <div class="trend-cell">
              <div class="trend-label">Ø Damage</div>
              <div class="trend-row"><span class="trend-val">${Math.round(trend.current.avgDmg||0)}</span>
                <span class="trend-delta ${cls(d.avgDmg)}">${arrow(d.avgDmg)}${Math.round(Math.abs(d.avgDmg))}</span></div>
            </div>
            <div class="trend-cell">
              <div class="trend-label">Matches</div>
              <div class="trend-row"><span class="trend-val">${trend.current.matches||0}</span>
                <span class="trend-delta ${cls(d.matches)}">${arrow(d.matches)}${Math.abs(d.matches)}</span></div>
            </div>
          </div>`;
      }

      // Streaks aus session-matches berechnen — current = vom neuesten
      // Match rückwärts; best = längster Run im Range (chronologisch)
      const computeCurrent = (test) => {
        let n = 0;
        for (const m of (matches || [])) {
          if (test(m)) n++; else break;
        }
        return n;
      };
      const computeBest = (test) => {
        // matches kommt newest-first. Für best brauchen wir chrono ASC.
        const arr = (matches || []).slice().reverse();
        let run = 0, best = 0;
        for (const m of arr) {
          if (test(m)) { run++; if (run > best) best = run; }
          else run = 0;
        }
        return best;
      };
      const tests = {
        chicken: m => (m.place || 99) === 1,
        top10:   m => (m.place || 99) <= 10,
        kd1:     m => (m.kills || 0) >= 1,
        kd2:     m => (m.kills || 0) >= 2,
      };
      const chickenCur = computeCurrent(tests.chicken), chickenBest = computeBest(tests.chicken);
      const top10Cur   = computeCurrent(tests.top10),   top10Best   = computeBest(tests.top10);
      const kd1Cur     = computeCurrent(tests.kd1),     kd1Best     = computeBest(tests.kd1);
      const kd2Cur     = computeCurrent(tests.kd2),     kd2Best     = computeBest(tests.kd2);
      const streakItem = (label, cur, best) =>
        `<div class="streak-cell ${cur > 0 ? '' : 'cold'}">
           <span class="streak-num">${cur}</span>
           <span class="streak-label">${label}<br><span style="font-size:0.85em;opacity:0.7">best ${best}</span></span>
         </div>`;
      const streaksHtml = `
        <h3 class="extras-h">Streaks (current · best)</h3>
        <div class="streaks-grid">
          ${streakItem("Chicken (#1)", chickenCur, chickenBest)}
          ${streakItem("Top-10", top10Cur, top10Best)}
          ${streakItem("Kills ≥ 1", kd1Cur, kd1Best)}
          ${streakItem("Kills ≥ 2", kd2Cur, kd2Best)}
        </div>`;

      // Seltene Achievements, die zusaetzlich eine eigene Karte bekommen.
      // Kriterium: Seltenheit plus Erzaehlwert. Match-Anteile gemessen am
      // 2026-09-07 ueber drei Tenants (T1 1104, T2 638, T3 942 Matches):
      //                          T1     T2     T3
      //   em_pickup_kill        0,09   0,00   0,00   Sky Snipe
      //   god_mode_chicken      0,09   0,00   0,32   Chicken 15+ Kills
      //   damage_2000           0,27   0,00   0,00   Spitze der Damage-Staffel
      //   kills_20              0,27   0,16   0,21   20-Bomb
      //   ultra_chicken         0,45   0,47   1,49   Chicken 10+ Kills
      //   chicken_streak        0,63   0,31   0,11   Dinner Spree
      //   longest_kill_600      0,09   0,00   0,00   Sniper Elite (ab 600m)
      //   longest_kill_800         —      —      —   nie erreicht
      //   longest_kill_1000        —      —      —   nie erreicht
      //
      // longest_kill_400 bleibt draussen: ~1 % und Einstiegsstufe der
      // Staffel, wie kills_7. Die Tiers standen bis 2026-09-07 bei 0 %,
      // weil der API-Meter-Wert durch 100 geteilt wurde — deshalb waren
      // sie vorher nicht als Kandidaten sichtbar.
      //
      // burning_hell_survivor stand hier und ist am 2026-09-07 raus:
      // 6,88 / 2,82 / 12,00 % — bei Tenant 3 jedes achte Match. Damit
      // haette dieses eine Achievement die Sektion gefuellt und die
      // Seltenheit der uebrigen entwertet.
      //
      // Bewusst NICHT drin: Zwischenstufen der Staffeln (kills_7/10/15,
      // damage_1000/1500, beast_chicken) — sonst steht dieselbe Leistung
      // mehrfach in der Sektion. Ebenso keine Heist- und Fahrzeug-IDs
      // (letztere stehen unter Vehicle-Action) und keine Tode.
      // wins_milestone_* fehlt absichtlich: die ID wird dynamisch aus der
      // Karriere-Win-Nummer gebaut, liesse sich hier also nur per
      // Praefix-Match fassen — und ist ein Zaehler, keine Match-Leistung.
      const SPECIAL_ACH_IDS = new Set([
        "em_pickup_kill", "god_mode_chicken", "damage_2000", "kills_20",
        "ultra_chicken", "chicken_streak",
        "longest_kill_600", "longest_kill_800", "longest_kill_1000",
      ]);

      let achievementsHtml = "";
      let specialHtml = "";
      if (achievements && achievements.length) {
        const isEmoji = (s) => s && !s.startsWith("/") && !s.startsWith("http");
        const iconHtml = (a) => a.iconUrl
          ? `<img src="${a.iconUrl}" alt="">`
          : (isEmoji(a.icon) ? a.icon : "");

        // Specials werden hervorgehoben, aber NICHT aus der Liste
        // entfernt: sonst fehlt z.B. Sky Snipe im Achievement-Aufklapp
        // und man sucht es dort vergeblich.
        const specialAchs = achievements.filter(a => SPECIAL_ACH_IDS.has(a.id));
        const normalAchs  = achievements;

        if (normalAchs.length) {
          achievementsHtml = `
            <details class="ach-details">
              <summary class="extras-h ach-summary">
                Achievements <span class="ach-count">(${normalAchs.length})</span>
              </summary>
              <div class="ach-list">
                ${normalAchs.map(a => `
                  <div class="ach-item">
                    <span class="ach-icon">${iconHtml(a)}</span>
                    <span class="ach-text">
                      ${a.canonical ? `<span class="ach-canonical">${a.canonical}</span>` : ""}
                      <span class="ach-label">${a.label || a.id}</span>
                    </span>
                    <span class="ach-when">${PubgUI.fmtTime(a.playedAt)}</span>
                  </div>`).join("")}
              </div>
            </details>`;
        }

        if (specialAchs.length) {
          // Kontext wie bei Vehicle-Action: wer, welches Match, welche Map.
          const numByMid  = window._matchNumByMatchId  || new Map();
          const metaByMid = window._matchMetaByMatchId || new Map();
          const ctxLine = (a) => {
            const bits = [];
            if (a.playerName) bits.push(`<b>${a.playerName}</b>`);
            const n = numByMid.get(a.matchId);
            if (n) bits.push(`Match #${n}`);

            if (m && m.map) bits.push(PubgUI.fmtMap(m.map));
            return bits.length
              ? `<span class="special-ach-ctx">${bits.join(" · ")}</span>` : "";

          specialHtml = `<h3 class="extras-h">Special Achievements</h3>
            <div class="special-ach-list">
              ${specialAchs.map(a => `
                <div class="special-ach-item">
                  <span class="special-ach-icon">${iconHtml(a)}</span>

      // PAYDAY/Event-Stats werden jetzt INLINE im jeweiligen Match-Detail-
      // Panel angezeigt (nicht mehr als separate Sektion). Wir fuellen die
      // .event-detail-Placeholder mit Loot/Windows/Doors etc.
      if (payday && payday.matches && payday.matches.length) {
        const labels = payday.labels || {};
        const lootBadges = (loot) => Object.entries(loot || {})
          .sort((a,b) => b[1] - a[1])
          .map(([itemId, n]) => {
            const lbl = labels[itemId] || [itemId.replace(/^Item_/, ""), ""];
            return `<span class="loot-badge" title="${itemId}">`
              + `${lbl[1] || ""} <b>${n}</b> ${lbl[0]}</span>`;
          }).join("");
        for (const pm of payday.matches) {
          const slot = document.querySelector(
            `[data-event-detail-match-id="${pm.matchId}"]`);
          if (!slot) continue;
          const badges = lootBadges(pm.loot);
          slot.innerHTML = `
            <div class="event-detail-grid">
              <div class="event-stat"><span class="v">${pm.myKills}</span><span class="l">My Kills</span></div>
              <div class="event-stat"><span class="v">${Math.round(pm.myDamage)}</span><span class="l">My DMG</span></div>
              <div class="event-stat"><span class="v">${pm.squadKills}</span><span class="l">Squad K</span></div>
              <div class="event-stat"><span class="v">${Math.round(pm.squadDamage)}</span><span class="l">Squad DMG</span></div>
              <div class="event-stat"><span class="v">${pm.windows}</span><span class="l"><span class="material-symbols-outlined icon-sm" aria-hidden="true">window</span> Windows</span></div>
              <div class="event-stat"><span class="v">${pm.doors}</span><span class="l"><span class="material-symbols-outlined icon-sm" aria-hidden="true">door_front</span> Doors</span></div>
              <div class="event-stat"><span class="v">${pm.lootTotal}</span><span class="l"><span class="material-symbols-outlined icon-sm" aria-hidden="true">inventory_2</span> Loot</span></div>
            </div>
            ${badges ? `<div class="event-detail-loot">${badges}</div>` : ""}`;
          // Squad-Tabelle des gleichen Match-Expand-Panels mit Mate-
          // Daten aus Telemetry ueberschreiben (PUBG-API liefert fuer
          // Events 0/0 in participants — alle Mate-Stats wuerden sonst
          // als 0 angezeigt). HS/Ass/DBNO/Survived gibt's in Event-
          // Modes nicht → '—'.
          if (pm.mates && pm.mates.length) {
            const parent = slot.closest(".squad-detail");
            const tbody = parent && parent.querySelector(
              ".squad-table-wrap tbody");
            if (tbody) {
              tbody.innerHTML = pm.mates.map(mate => `
                <tr class="${mate.isSelf ? 'self' : ''}">
                  <td>${mate.name}${mate.isSelf ? ' (du)' : ''}</td>
                  <td>${mate.kills}</td>
                  <td>—</td><td>—</td><td>—</td>
                  <td>${Math.round(mate.damage)}</td>
                  <td>—</td>
                </tr>`).join("");
            }
          }
        }
        // Event-Matches ohne payday-Daten: 'keine Daten'-Hint
        document.querySelectorAll(".event-detail .event-detail-empty")
          .forEach(el => { el.textContent = "— keine Event-Telemetry —"; });
      }

      // Vehicle-Eviction-Sektion: pro Squad-Member aufklappbar mit
      // Detail-Events (Match-Zeit, POI, Fahrzeug, Gegner).
      let vehicleHtml = "";
      function poiOfV(mapName, x, y) {
        if (x == null || y == null) return null;
        if (PubgUI.POI && PubgUI.POI.fromCoords)
          return PubgUI.POI.fromCoords(mapName, x, y);
        return null;
      }
      function fmtMatchTime(ms) {
        if (ms == null) return "?";
        const sec = Math.floor(ms / 1000);
        return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
      }
      function fmtAbsClock(playedAtIso, msIntoMatch) {
        if (!playedAtIso) return null;
        const start = Date.parse(playedAtIso);
        if (isNaN(start)) return null;
        const d = new Date(start + (msIntoMatch || 0));
        return `${String(d.getHours()).padStart(2,"0")}:` +
               `${String(d.getMinutes()).padStart(2,"0")}`;
      }
      // Port von pubg/aggregations.py:_VEHICLE_PATTERNS. Fasst Skin/Variant-
      // Varianten ('BP_Dacia_A_04_v2_C', 'BP_Mirado_A_03_Esports_C', ...)
      // unter einem Klartext-Namen zusammen.
      const VEHICLE_PATTERNS = [
        ["Mirado", "Mirado"], ["PickupTruck", "Pickup Truck"],
        ["Motorbike", "Motorbike"], ["Dacia", "Dacia"], ["Uaz", "UAZ"],
        ["Niva", "Niva"], ["BearV2", "Bear"], ["Bear", "Bear"],
        ["PonyCoupe", "Pony Coupe"], ["CoupeRB", "Coupe RB"],
        ["Blanc", "Blanc"], ["PicoBus", "Pico Bus"], ["Van_", "Van"],
        ["BRDM", "BRDM"], ["Pillar_Car", "Pillar Car"], ["Buggy", "Buggy"],
        ["Boat", "Aquarail"], ["Snowmobile", "Snowmobile"],
        ["Tukshai", "Tukshai"], ["Lava_Mtb", "Mountain Bike"],
        ["Scooter", "Scooter"],
      ];
      function fmtVeh(wid) {
        if (!wid) return "Fahrzeug";
        for (const [needle, label] of VEHICLE_PATTERNS) {
          if (wid.indexOf(needle) >= 0) return label;
        }
        // Fallback: BP_ und _C strippen, Underscores zu Leerzeichen
        return wid.replace(/^BP_/, "").replace(/_C$/, "").replace(/_/g, " ");
      }
      function evRows(events, role) {
        // Globale Session-Match-Nummer (in chronologischer Reihenfolge
        // aller Matches dieser Session), aus renderSessionSummary gecached.
        // Fallback auf lokale Numerierung wenn (noch) nicht vorhanden.
        const globalMap = window._matchNumByMatchId;
        const matchNumByMid = new Map();
        events.forEach(ev => {
          if (!ev.matchId || matchNumByMid.has(ev.matchId)) return;
          if (globalMap && globalMap.has(ev.matchId)) {
            matchNumByMid.set(ev.matchId, globalMap.get(ev.matchId));
          } else {
            matchNumByMid.set(ev.matchId, matchNumByMid.size + 1);
          }
        });
        let lastMid = null;
        return events.map(ev => {
          const mapName = ev.mapName || "";
          const poi = poiOfV(mapName, ev.x, ev.y);
          const veh = fmtVeh(ev.vehicle);
          const opp = ev.opponent ? `<b>${ev.opponent}</b>` : "an opponent";
          const matchT = fmtMatchTime(ev.tsMs);
          const absT = fmtAbsClock(ev.playedAt, ev.tsMs);
          const where = poi ? `<span class="ve-poi">${poi}</span>` : "";
          const KIND_LABELS = {
            eject_knock: "shot out (knock)",
            eject_kill:  "shot out (kill)",
            driveby_knock: "drive-by (knock)",
            driveby_kill:  "drive-by (kill)",
            knock_died: "knocked → died",
            kill: "kill",
          };
          const kindLbl = KIND_LABELS[ev.kind] || ev.kind || "kill";
          const verb = role === "dealt"
            ? `→ ${opp}` : `by ${opp}`;
          // Match-Header beim Wechsel der matchId davorhängen
          const matchN = matchNumByMid.get(ev.matchId);
          let header = "";
          if (ev.matchId !== lastMid) {
            const mapLbl = PubgUI.fmtMap(mapName);
            const startLbl = ev.playedAt
              ? fmtAbsClock(ev.playedAt, 0) : "?";
            header = `<div class="ve-match-head">Match #${matchN || "?"} · ${mapLbl} · Start ${startLbl}</div>`;
            lastMid = ev.matchId;
          }
          // Zeitspalte: absolute Uhrzeit + (mm:ss ins Match)
          const tCell = absT
            ? `<span class="ve-t" title="${matchT} ins Match"><b>${absT}</b> <span class="ve-tsub">+${matchT}</span></span>`
            : `<span class="ve-t">${matchT}</span>`;
          return header + `<div class="ve-row">
            ${tCell}
            <span class="ve-veh"><span class="material-symbols-outlined icon-sm" aria-hidden="true">directions_car</span> ${veh}</span>
            <span class="ve-act">${verb}</span>
            ${where}
            <span class="ve-kind">${kindLbl}</span>
          </div>`;
        }).join("");
      }
      if (vehicle && Array.isArray(vehicle.members) && vehicle.members.length) {
        const parts = [];
        for (const m of vehicle.members) {
          const dealt = m.evictionsDealt || 0;
          const taken = m.evictionsTaken || 0;
          if (!dealt && !taken) continue;
          const who = m.name;
          const blocks = [];
          if (dealt > 0) {
            const evDealt = m.eventsDealt || [];
            const nEject   = evDealt.filter(e => (e.kind||"").startsWith("eject")).length;
            const nDriveby = evDealt.filter(e => (e.kind||"").startsWith("driveby")).length;
            const parts2 = [];
            if (nEject)   parts2.push(`<b>${nEject}</b> shot out of a vehicle`);
            if (nDriveby) parts2.push(`<b>${nDriveby}</b> gunned down while driving`);
            const summary = parts2.join(", ") || `<b>${dealt}</b> vehicle kills`;
            blocks.push(`<details class="ve"><summary><span class="material-symbols-outlined icon-sm" aria-hidden="true">directions_car</span> ${summary}</summary>${evRows(evDealt, "dealt")}</details>`);
          }
          if (taken > 0) {
            blocks.push(`<details class="ve"><summary><span class="material-symbols-outlined icon-sm" aria-hidden="true">skull</span> was shot out <b>${taken}</b> ${taken === 1 ? "time" : "times"}</summary>${evRows(m.eventsTaken || [], "taken")}</details>`);
          }
          parts.push(`<div class="ve-member"><div class="ve-name">${who}</div>${blocks.join("")}</div>`);
        }
        if (parts.length) {
          vehicleHtml = `<h3 class="extras-h">Vehicle Action</h3>
            <div class="vehicle-events">${parts.join("")}</div>`;
        }
      }

      placeholder.innerHTML = trendHtml + streaksHtml + achievementsHtml + specialHtml + vehicleHtml;
      // Skeleton-Reserve-Hoehe entfernen, sobald echter Content drin ist —
      // sonst klebt 450px Leerraum unten an wenn der Content kuerzer ist.
      placeholder.classList.add("extras-placeholder--filled");
      // UI-State nach komplettem Re-Render wiederherstellen (Match-
      // Expands + Achievement-Details + Scroll).
      if (_pendingRestore) {
        restoreUiState(_pendingRestore);
        _pendingRestore = null;
      }
    }

    function mapImageUrl(mapName) {
      // .png ist primaer (Symlinks zu api-assets HD No-Text-Versionen),
      // .webp ist Remote-Fallback wenn kein Lokal-Clone vorhanden.
      return `${window.__STATIC_BASE__||"/widgets/"}pubg/maps/${mapName}.png`;
    }


    // Click-Handler: Match-Zeile öffnet Slide-In Match-Detail-Panel
    document.addEventListener("click", (e) => {
      const row = e.target.closest(".m[data-idx]");
      if (!row) return;
      // Der Lobby-Button in der Zeile hat sein eigenes Ziel; unabhaengig von
      // der Reihenfolge der Listener darf er hier nicht durchschlagen.
      if (e.target.closest(".lobby-open")) return;
      const mid = row.getAttribute("data-match-id");
      if (!mid) return;
      mdPanelOpen(mid);
    });

    const reportUrl = (window.__SERVE_BASE__||"/") + "api/pubg/session-report" +
      ((FROM || TO) ? "?" + new URLSearchParams({
        ...(FROM ? {from: FROM} : {}), ...(TO ? {to: TO} : {})
      }).toString() : "");
    // 45 s statt der 10 s Standard: der Report ueber den ganzen Bestand
    // rechnet serverseitig rund 7 s (1070 Matches) und wurde vorher
    // abgeschnitten — die Seite blieb dann stumm am Platzhalter stehen.
    let _reportShown = false;
    PubgUI.poll(reportUrl, 60000, (d) => {
      _reportShown = true;
      render(d);
    }, (err) => {
      console.error(err);
      if (_reportShown) return;   // alte Anzeige stehen lassen
      const host = document.getElementById("report");
      const aborted = err && (err.name === "AbortError"
                              || /abort/i.test(String(err.message || "")));
      host.innerHTML = `<div class="empty report-error">
          <p>${aborted
                ? "The report took too long &mdash; that can happen for very large date ranges."
                : "Could not load the report: "
                  + PubgUI.esc(String(err && err.message || err))}</p>
          <button type="button" class="report-retry" id="reportRetry">
            Try again</button>
        </div>`;
      document.getElementById("reportRetry").addEventListener("click", () => {
        host.innerHTML = `<div class="empty">— loading —</div>`;
        PubgUI.fetchJson(reportUrl, 45000)
          .then((d) => { _reportShown = true; render(d); })
          .catch((e) => { host.innerHTML =
            `<div class="empty report-error">Still failing: `
            + PubgUI.esc(String(e && e.message || e)) + `</div>`; });
      });
    }, 45000);

    // Findet Marker unter Maus-Position. Returns {acc, lifeIdx, kind, target}
    // oder null. kind = 'landing' | 'death' | 'kill' | 'revive'
    function mdHitTestMarker(host, canvasPx, canvasPy) {
      const s = mdGetState(host);
      if (!s.detail) return null;
      const HIT_PX = 8;  // 8px hit-radius
      const cursorTs = s.zeitraffer.cursorTs;
      const absTs = s.zeitraffer.matchStart + cursorTs;
      const inDefault = (cursorTs === 0);
      for (const m of s.detail.members) {
        if (s.hiddenAccs.has(m.accountId)) continue;
        if (!m.lives) continue;
        for (const life of m.lives) {
          // Landing
          if (life.landing && (inDefault || absTs >= life.landing.tsMs)) {
            const [cx, cy] = mdCmToCanvas(host, life.landing.x, life.landing.y);
            if (Math.hypot(cx - canvasPx, cy - canvasPy) <= HIT_PX) {
              return { acc: m.accountId, lifeIdx: life.lifeIndex,
                       kind: "landing", tsMs: life.landing.tsMs };
            }
          }
          // Death
          if (!inDefault && life.death && absTs >= life.death.tsMs) {
            const [cx, cy] = mdCmToCanvas(host, life.death.x, life.death.y);
            if (Math.hypot(cx - canvasPx, cy - canvasPy) <= HIT_PX) {
              return { acc: m.accountId, lifeIdx: life.lifeIndex,
                       kind: "death", tsMs: life.death.tsMs };
            }
          }
          // Kills — Hit-Test auf das Opfer-X (Schuetzen-Pin wurde
          // entfernt; der Marker auf der Karte ist das X beim Opfer).
          if (!inDefault) {
            for (const k of life.kills) {
              if (absTs < k.tsMs) continue;
              if (k.victimX == null) continue;
              const [vx, vy] = mdCmToCanvas(host, k.victimX, k.victimY);
              if (Math.hypot(vx - canvasPx, vy - canvasPy) <= HIT_PX) {
                return { acc: m.accountId, lifeIdx: life.lifeIndex,
                         kind: "kill", tsMs: k.tsMs };
              }
            }
          }
        }
      }
      return null;
    }

    // Click auf Marker: alle anderen ausblenden + Zoom 500m + Cursor-Seek + Pause
    async function mdMarkerClick(host, hit) {
      const s = mdGetState(host);
      s.hiddenAccs = new Set(
        s.detail.members.map(m => m.accountId).filter(a => a !== hit.acc));
      s.zeitraffer.cursorTs = Math.max(0, hit.tsMs - s.zeitraffer.matchStart);
      s.zeitraffer.playing = false;
      s.playToken++;
      // 500m-Zoom auf Marker-Position
      const member = s.detail.members.find(m => m.accountId === hit.acc);
      let cx = null, cy = null;
      if (member && member.lives) {
        const life = member.lives.find(l => l.lifeIndex === hit.lifeIdx);
        if (life) {
          if (hit.kind === "landing" && life.landing) {
            cx = life.landing.x; cy = life.landing.y;
          } else if (hit.kind === "death" && life.death) {
            cx = life.death.x; cy = life.death.y;
          } else if (hit.kind === "kill") {
            const k = life.kills.find(kk => kk.tsMs === hit.tsMs);
            if (k) { cx = k.actorX; cy = k.actorY; }
          }
        }
      }
      if (cx != null) {
        s.viewport = {
          centerX: cx, centerY: cy,
          zoom: MD_MAP_PX / MD_PAD_500M_CM * 0.5,  // 500m wide visible
          autoFollow: false,
        };
        mdClampViewport(host);
      }
      mdRenderState(host);
    }

    document.addEventListener("click", (e) => {
      const wrap = e.target.closest && e.target.closest(".md-mapwrap");
      if (!wrap) return;
      if (e.target.closest(".md-zoombtns") || e.target.closest(".md-tools")) return;
      const host = wrap.closest(".md-host");
      if (!host) return;
      const rect = wrap.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;
      const hit = mdHitTestMarker(host, px, py);
      if (hit) {
        mdMarkerClick(host, hit);
        e.stopPropagation();
      }
    });

    // Card-Click toggelt Sichtbarkeit dieses Members
    document.addEventListener("click", (e) => {
      const card = e.target.closest && e.target.closest(".md-card[data-acc]");
      if (!card) return;
      const host = card.closest(".md-host");
      if (!host) return;
      const s = mdGetState(host);
      const acc = card.getAttribute("data-acc");
      if (s.hiddenAccs.has(acc)) s.hiddenAccs.delete(acc);
      else                       s.hiddenAccs.add(acc);
      mdRenderState(host);
      e.stopPropagation();
    });

    // "Alle anzeigen"-Button: nur Sichtbarkeit + Viewport zurueck, Zeit + Play
    // bleiben unangetastet.
    document.addEventListener("click", (e) => {
      const btn = e.target.closest && e.target.closest(".md-allebtn");
      if (!btn) return;
      const host = btn.closest(".md-host");
      if (!host) return;
      const s = mdGetState(host);
      s.hiddenAccs.clear();
      mdResetView(host);
      e.stopPropagation();
    });

    document.addEventListener("mousemove", (e) => {
      const wrap = e.target.closest && e.target.closest(".md-mapwrap");
      if (!wrap) return;
      const host = wrap.closest(".md-host");
      if (!host || host.dataset.mounted !== "1") return;
      const s = mdGetState(host);
      if (s.dragPan) return;  // waehrend Pan keine Hover-Label
      const rect = wrap.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;
      const hit = mdHitTestMarker(host, px, py);
      const labelEl = wrap.querySelector(".md-hover-label");
      if (!labelEl) return;
      if (!hit) {
        labelEl.classList.remove("show");
        return;
      }
      let txt = "?";
      const member = s.detail.members.find(m => m.accountId === hit.acc);
      const memberName = member && (member.name);
      const lifeSuffix = (member && member.lives.length > 1)
        ? ` ${hit.lifeIdx}` : "";
      if (hit.kind === "landing") txt = `${memberName} • Landing${lifeSuffix}`;
      else if (hit.kind === "death") txt = `${memberName} • Death${lifeSuffix}`;
      else if (hit.kind === "kill") {
        const life = member.lives.find(l => l.lifeIndex === hit.lifeIdx);
        const k = life.kills.find(kk => kk.tsMs === hit.tsMs);
        const wn = (k && k.weaponName) ? k.weaponName
                 : (k && k.weapon ? k.weapon.replace("Weap_", "").replace("_C", "") : "Kill");
        const victim = k && k.victimName ? k.victimName : "an opponent";
        const dist = k && k.distanceM != null ? ` · ${Math.round(k.distanceM)}m` : "";
        txt = `${memberName} • ${wn}${dist} → ${victim}`;
      }
      labelEl.textContent = txt;
      labelEl.style.left = (px + 8) + "px";
      labelEl.style.top  = (py - 24) + "px";
      labelEl.classList.add("show");
    });

    // ── Slide-In Match-Detail Panel ───────────────────────────────────
    let _mdPanelLastFocused = null;
    let _mdPanelCurrentId = null;

    function mdPanelOpen(matchId) {
      const panel = document.getElementById("mdPanel");
      const title = document.getElementById("mdPanelTitle");
      const body  = document.getElementById("mdPanelBody");
      if (!panel || !body) return;
      if (_mdPanelCurrentId === matchId && !panel.hidden) return;
      _mdPanelLastFocused = document.activeElement;
      _mdPanelCurrentId = matchId;
      // Vorheriges md-host (falls Panel bereits offen war) stoppen — sonst
      // läuft die requestAnimationFrame-Schleife des Zeitraffers auf einem
      // detachten Canvas weiter und verbrennt CPU.
      const _prevHost = body.querySelector(".md-host");
      if (_prevHost) {
        try {
          const _prevState = mdGetState(_prevHost);
          if (_prevState) {
            _prevState.playToken++;
            if (_prevState.zeitraffer) _prevState.zeitraffer.playing = false;
          }
        } catch (_) {}
      }
      // Body: existierende mdMount-Logik nutzen via md-host
      body.innerHTML = `
        <div class="md-host" data-match-id="${matchId}" data-map=""></div>
        <section class="md-timeline" id="mdTimelineSection" hidden></section>`;
      title.textContent = "Match detail · loading …";
      const host = body.querySelector(".md-host");
      mdMount(host);
      panel.hidden = false;
      requestAnimationFrame(() => panel.classList.add("is-open"));
      document.body.style.overflow = "hidden";
      // URL-Hash setzen (replace damit der Open kein Doppel-State erzeugt)
      const newHash = "#match=" + encodeURIComponent(matchId);
      if (location.hash !== newHash) {
        history.pushState({ matchId }, "", newHash);
      }
      // Focus auf Close-Button
      const closeBtn = panel.querySelector(".md-panel__close");
      if (closeBtn) closeBtn.focus();
    }

    function mdPanelClose() {
      const panel = document.getElementById("mdPanel");
      if (!panel || panel.hidden) return;
      const _closeHost = panel.querySelector(".md-host");
      if (_closeHost) {
        try {
          const _closeState = mdGetState(_closeHost);
          if (_closeState) {
            _closeState.playToken++;
            if (_closeState.zeitraffer) _closeState.zeitraffer.playing = false;
          }
        } catch (_) {}
      }
      panel.classList.remove("is-open");
      const finish = () => {
        panel.hidden = true;
        document.body.style.overflow = "";
        _mdPanelCurrentId = null;
        if (_mdPanelLastFocused && _mdPanelLastFocused.focus) {
          _mdPanelLastFocused.focus();
        }
      };
      // Wenn reduced-motion: sofort schließen, sonst nach Transition
      const reduced = window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduced) finish();
      else setTimeout(finish, 230);
      if (location.hash.includes("match=")) {
        history.pushState({}, "", location.pathname + location.search);
      }
    }

    // Backdrop + X + Esc-Handling
    document.addEventListener("click", (e) => {
      if (e.target.closest("[data-md-close]")) mdPanelClose();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      const panel = document.getElementById("mdPanel");
      if (panel && !panel.hidden) mdPanelClose();
    });

    // Browser-Back → öffnet/schließt Panel je nach Hash
    window.addEventListener("popstate", () => {
      const m = (location.hash || "").match(/match=([^&]+)/);
      if (m) mdPanelOpen(decodeURIComponent(m[1]));
      else mdPanelClose();
    });

    // Deep-Link: bei Page-Load nach #match=<id> schauen.
    // Da die Session-Liste asynchron lädt, warten wir 800ms damit
    // mdMount eine Match-ID greifen kann (sonst nur Telemetrie-Fetch
    // — der funktioniert ohnehin matchId-only).
    document.addEventListener("DOMContentLoaded", () => {
      const m = (location.hash || "").match(/match=([^&]+)/);
      if (m) mdPanelOpen(decodeURIComponent(m[1]));

      // Auto-Reload wenn der Poller neue Matches meldet
      let _lastPollAt = null;
      setInterval(async () => {
        try {
          const s = await PubgUI.fetchJson(
            (window.__SERVE_BASE__ || "/") + "api/pubg/status");
          const pollAt = s && s.lastPollAt;
          if (!pollAt) return;
          const anyNew = Object.values(s.perTenant || {})
            .some(t => (t.newMatches || 0) > 0);
          if (anyNew && _lastPollAt && pollAt !== _lastPollAt) {
            location.reload();
          }
          _lastPollAt = pollAt;
        } catch (_) {}
      }, 60_000);
    });

  </script>

  <div id="mdPanel" class="md-panel" hidden role="dialog" aria-modal="true"
       aria-labelledby="mdPanelTitle">
    <div class="md-panel__backdrop" data-md-close></div>
    <div class="md-panel__sheet" role="document">
      <header class="md-panel__header">
        <h2 id="mdPanelTitle" class="md-panel__title">Match-Detail</h2>
        <button class="md-panel__close" data-md-close type="button"
                aria-label="Close match detail">
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
      </header>
      <div class="md-panel__body" id="mdPanelBody"></div>
    </div>
  </div>

  <dialog id="lobbyModal" class="lobby-modal" aria-labelledby="lobbyModalTitle">
    <div class="lobby-modal__head">
      <div>
        <h2 class="lobby-modal__title" id="lobbyModalTitle">Lobby</h2>
        <p class="lobby-modal__sub" id="lobbyModalSub"></p>
      </div>
      <button type="button" class="lobby-modal__close" id="lobbyModalClose"
              aria-label="Close">
        <span class="material-symbols-outlined" aria-hidden="true">close</span>
      </button>
    </div>
    <div class="lobby-modal__body" id="lobbyModalBody"></div>
  </dialog>
</body>
</html>
