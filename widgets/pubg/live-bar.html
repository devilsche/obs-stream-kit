<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PUBG Live Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="_pubg.css">
  <link rel="stylesheet" href="../_theme.css">
  <link rel="stylesheet" href="../_theme.css">
  <style>
    html, body { margin: 0; padding: 0; }
    /* Anker: top-center. Bar ist nur so breit wie Inhalt — Source kann ruhig
       1920 sein, sichtbare Pixel = nur Content-Breite, zentriert. */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
    }
    body:not(.pubg-has-filter) { height: 40px; }
    .live-bar {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px;
      height: 40px;
      font-size: 16px;
    }
    .live-bar .sep { color: var(--pubg-muted); }
    .live-bar .label { color: var(--pubg-muted); margin-right: 4px; font-size: 0.85em; }
    .live-bar .icon { margin-right: 4px; }
  </style>
</head>
<body>
  <div class="pubg-card pubg-bar live-bar pubg-fade-in" id="bar"></div>
  <script src="_pubg.js"></script>
  <script>
    // ?stats=kills,kd,dmg,... — welche Werte in welcher Reihenfolge.
    // Ohne Parameter die bisherigen vier (Kills · DMG · Wins · Matches).
    const fmt = (n) => {
      if (n == null) return "—";
      if (n >= 1000) return (n / 1000).toFixed(1) + "k";
      return String(Math.round(n));
    };
    const fmt2 = (n) => (n == null ? "—" : n.toFixed(2));

    // key → [Label, Wert aus /api/pubg/session, Formatter, animieren?]
    const STATS = {
      kills:   ["Kills",   (s) => s.kills || 0,            fmt,  true],
      dmg:     ["DMG",     (s) => s.damage || 0,           fmt,  true],
      wins:    ["Wins",    (s) => s.wins || 0,             fmt,  true],
      matches: ["Matches", (s) => s.matches || 0,          fmt,  true],
      kd:      ["K/D",     (s) => s.kd || 0,               fmt2, true],
      kpm:     ["K/M",     (s) => s.kpm || 0,              fmt2, true],
      hs:      ["HS",      (s) => s.headshotPct || 0,      (n) => Math.round(n) + "%", true],
      top10:   ["Top 10",  (s) => s.top10s || 0,           fmt,  true],
      best:    ["Best",    (s) => s.bestPlace,             (n) => (n == null ? "—" : "#" + n), false],
      longest: ["Longest", (s) => s.longestKill || 0,      (n) => Math.round(n) + " m", true],
      assists: ["Assists", (s) => s.totalAssists || 0,     fmt,  true],
      knocks:  ["Knocks",  (s) => s.totalDbnos || 0,       fmt,  true],
      heals:   ["Heals",   (s) => s.totalHeals || 0,       fmt,  true],
      boosts:  ["Boosts",  (s) => s.totalBoosts || 0,      fmt,  true],
      healed:  ["HP healed", (s) => s.hpHealed || 0,       fmt,  true],
    };
    const DEFAULT_STATS = "kills,dmg,wins,matches";

    PubgUI.buildFilter([
      { key: "stats", label: "Stats", type: "multiselect", default: "",
        options: [
          ["kills", "Kills"], ["dmg", "DMG"], ["wins", "Wins"],
          ["matches", "Matches"], ["kd", "K/D"], ["kpm", "K/M"],
          ["hs", "HS"], ["top10", "Top 10"], ["best", "Best"],
          ["longest", "Longest"], ["assists", "Assists"], ["knocks", "Knocks"],
          ["heals", "Heals"], ["boosts", "Boosts"], ["healed", "HP healed"],
        ],
        tooltip: "Which values the bar shows, in URL order " +
                 "(e.g. ?stats=kills,kd,dmg,wins). None selected = " +
                 "Kills, DMG, Wins, Matches." },
    ]);
    const REFRESH_MS = parseInt(PubgUI.qs("refreshMs", 30000), 10);

    const keys = (PubgUI.qs("stats", "") || DEFAULT_STATS)
      .split(",").map((k) => k.trim()).filter((k) => STATS[k]);
    if (!keys.length) keys.push(...DEFAULT_STATS.split(","));

    const bar = document.getElementById("bar");
    const cells = {};
    keys.forEach((k, i) => {
      if (i > 0) {
        const sep = document.createElement("span");
        sep.className = "sep";
        sep.setAttribute("aria-hidden", "true");
        sep.textContent = "·";
        bar.appendChild(sep);
      }
      const value = document.createElement("span");
      value.className = "pubg-stat-value";
      value.textContent = "—";
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = STATS[k][0];
      bar.append(value, " ", label);
      cells[k] = { value, label };
    });

    function renderSession(s) {
      keys.forEach((k) => {
        const [, get, format, animate] = STATS[k];
        const v = get(s);
        if (animate) PubgUI.animateNumber(cells[k].value, v, {format});
        else cells[k].value.textContent = format(v);
      });
      if (cells.matches) {
        cells.matches.label.textContent = (s.matches === 1) ? "Match" : "Matches";
      }
    }

    PubgUI.hideIfStale();
    PubgUI.poll((window.__SERVE_BASE__||"/") + "api/pubg/session", REFRESH_MS, (s) => {
      PubgUI.hideIfStale();
      renderSession(s);
    }, console.error);
  </script>
</body>
</html>
