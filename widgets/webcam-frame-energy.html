<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Webcam Frame Energy</title>
  <!-- Energierand um die Kamera (WebGL): fließendes Plasma in Theme-Farben, zwei Lichtkometen laufen um den Rahmen,
       bei jedem Alert flammt der Rand auf und eine Lichtwelle läuft von oben Mitte einmal herum (Raid/Giftsub stärker).
       Browser-Source = Kamera + 2 × pad (Standard pad 50, wie der alte Webcam Frame); der Schein endet weich vor dem Rand.
       URL: width/height (Kamera, Standard: Quelle minus Rand), pad (px), radius (Ecken, Standard 10), speed (0.2–3),
       alerts (1/0, Standard 1), demo=1 (alle 6 s ein Alert). -->
  <link rel="stylesheet" href="_theme.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <script src="../js/stinger-gl.js"></script>
  <script>
    (function () {
      'use strict';
      var S = window.StingerGL, P = new URLSearchParams(location.search);
      function num(k, d, lo, hi) { var v = parseFloat(P.get(k)); return isNaN(v) ? d : Math.max(lo, Math.min(hi, v)); }
      var cv = document.getElementById('gl');
      var gl = cv.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
      if (!gl) return;

      var FS = [
        'precision highp float;',
        'uniform vec2 uRes, uHalf; uniform float uR, uT, uAge, uPow, uCalm;',
        'uniform vec3 uP, uA, uA2;',
        'float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
        'float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);',
        '  return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }',
        'float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ s += a*n(p); p *= 2.07; a *= 0.5; } return s; }',
        'float sdRR(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }',
        'void main(){',
        '  vec2 fc = gl_FragCoord.xy, p = fc - 0.5*uRes;',
        '  float d = sdRR(p, uHalf, uR);',
        // Winkel ums Rechteck (Seitenverhältnis ausgeglichen), t = 0..1 ringsum, oben Mitte = 0.75
        '  float a = atan(p.y / uHalf.y, p.x / uHalf.x), t = a / 6.2831853 + 0.5;',
        '  float fl = uAge < 3.0 ? uPow * (1.0 - smoothstep(0.0, 3.0, uAge)) : 0.0;',
        '  float sp = mix(1.0, 0.3, uCalm);',
        '  vec2 ring = vec2(cos(a - uT*0.45*sp), sin(a - uT*0.45*sp));',
        '  float flow = fbm(ring*3.2 + vec2(d/22.0, uT*0.35*sp));',
        '  float core = exp(-abs(d) / 1.4);',
        '  float band = exp(-abs(d - 2.5) / (4.5 + 7.0*fl)) * (0.35 + 0.9*flow) * (d < 0.0 ? exp(d / 3.0) : 1.0);',
        // Schein nur außen; innen nur ein schmaler Saum, die Kamera bleibt frei
        '  float glow = d > 0.0 ? exp(-d / (11.0 + 10.0*fl)) * (0.22 + 0.35*fl) : exp(d / 3.0) * (0.15 + 0.2*fl);',
        // zwei Kometen gegenläufig versetzt, Schweif hinter dem Kopf
        '  float com = 0.0;',
        '  for (int i = 0; i < 2; i++){ float ph = fract(uT*0.09*sp + float(i)*0.5); float x = fract(ph - t);',
        '    float head = exp(-min(x, 1.0 - x)*240.0), tail = exp(-x*28.0) * smoothstep(0.0, 0.012, x);',
        '    com += (tail + 0.9*head) * exp(-abs(d)/3.5); }',
        // Alert: Welle läuft von oben Mitte nach beiden Seiten einmal herum
        '  float dt = abs(fract(t - 0.75 + 0.5) - 0.5);',
        '  float wave = uAge < 3.0 ? exp(-abs(dt - uAge*0.38)*38.0) * exp(-abs(d)/(5.0 + 6.0*uPow)) * (1.0 - smoothstep(1.0, 1.6, uAge)) * uPow : 0.0;',
        '  vec3 c = mix(uP, uA2, smoothstep(0.3, 0.8, flow)) * band * (1.0 + fl);',
        '  c += mix(uA, vec3(1.0), 0.35) * core * (0.55 + 0.6*fl);',
        '  c += mix(uA, vec3(1.0), 0.25) * com * 0.9;',
        '  c += mix(uA, vec3(1.0), 0.5) * wave * 1.6;',
        '  c += mix(uP, uA2, 0.5) * glow;',
        // weicher Rand der Quelle: nichts reicht bis an die Kante
        '  float e = min(min(fc.x, fc.y), min(uRes.x - fc.x, uRes.y - fc.y));',
        '  c *= smoothstep(0.0, 18.0, e);',
        '  float al = clamp(max(max(c.r, c.g), c.b), 0.0, 1.0);',
        '  gl_FragColor = vec4(c, al);',
        '}'
      ].join('\n');

      function sh(type, src) {
        var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error('webcam-frame-energy', gl.getShaderInfoLog(s)); return null; }
        return s;
      }
      var vs = sh(gl.VERTEX_SHADER, 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }'), fs = sh(gl.FRAGMENT_SHADER, FS);
      if (!vs || !fs) return;
      var pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr); gl.useProgram(pr);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      function U(n) { return gl.getUniformLocation(pr, n); }
      var uT = U('uT'), uAge = U('uAge'), uPow = U('uPow');

      // Theme-Farben, auch nach Theme-Wechsel ohne Neuladen (data-theme am <html>)
      function setColors() {
        var C = S.colors();
        gl.uniform3fv(U('uP'), C.primary); gl.uniform3fv(U('uA'), C.accent); gl.uniform3fv(U('uA2'), C.accent2);
      }
      setColors();
      new MutationObserver(setColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      gl.uniform1f(U('uCalm'), S.reduced() ? 1 : 0);

      function size() {
        var W = window.innerWidth, H = window.innerHeight, pad = num('pad', 50, 0, 300);
        cv.width = W; cv.height = H; gl.viewport(0, 0, W, H);
        var cw = num('width', W - 2 * pad, 20, W), ch = num('height', H - 2 * pad, 20, H);
        gl.uniform2f(U('uRes'), W, H); gl.uniform2f(U('uHalf'), cw / 2, ch / 2);
        gl.uniform1f(U('uR'), Math.min(num('radius', 10, 0, 200), cw / 2, ch / 2));
      }
      size(); window.addEventListener('resize', size);

      var speed = num('speed', 1, 0.2, 3), t0 = performance.now(), hit = -99, pow = 0;
      var BIG = { raid: 1.6, giftsub: 1.4, bits: 1.2, donation: 1.2 };
      function flare(ev) { hit = (performance.now() - t0) / 1000; pow = BIG[ev] || 1; }
      (function frame() {
        var t = (performance.now() - t0) / 1000;
        gl.uniform1f(uT, t * speed); gl.uniform1f(uAge, t - hit); gl.uniform1f(uPow, pow);
        gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(frame);
      })();

      if (P.get('demo') === '1') setInterval(function () { flare(['follow', 'raid', 'sub'][Math.floor(Math.random() * 3)]); }, 6000);
      // Alerts mitlesen (gleiche Befehle wie die Alert-Sources), nur über die Token-URL
      var m = location.pathname.match(/^\/s\/([A-Za-z0-9_]+)\//);
      if (!m || P.get('alerts') === '0') return;
      var url = '/s/' + m[1] + '/api/fx/alert/poll', seq = null, epoch = null;
      (function poll() {
        var delay = 1000;
        fetch(url + (seq === null ? '' : '?since=' + seq), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
          .then(function (d) {
            if (epoch !== null && d.epoch !== epoch) { epoch = d.epoch; seq = 0; delay = 0; return; }
            epoch = d.epoch;
            if (seq !== null && (d.commands || []).length) flare(d.commands[d.commands.length - 1].cmd);
            seq = d.seq;
          })
          .catch(function () { delay = 4000; })
          .then(function () { setTimeout(poll, delay); });
      })();
    })();
  </script>
</body>
</html>
