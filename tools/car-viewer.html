<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car viewer</title>
  <style>
    /* Großansicht eines Auto-Modells aus dem Katalog (/api/fx/cars/catalog.json) in voller Qualität (Original von Sketchfab über
       /app/api/cars/preview/<uid>.glb, sonst die Regen-Fassung), aufbereitet von js/glb-fix.js: frei drehen und zoomen */
    :root { --bg: #1d2433; --panel: #141a26; --line: #2a3346; --text: #f0eaf5; --muted: #c4bad6; --accent: #f2b705; --btn: #5e2a79; --btn-hi: #8a4dad; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 'DM Sans', system-ui, sans-serif; }
    .skip { position: absolute; left: -9999px; }
    .skip:focus { left: 12px; top: 12px; background: var(--accent); color: #000; padding: 6px 10px; z-index: 5; }
    header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
    h1 { font-size: 18px; margin: 0; }
    header a { color: var(--text); }
    label { color: var(--muted); }
    select { background: #0e131c; color: var(--text); border: 1px solid #4a5570; border-radius: 6px; padding: 4px 6px; font: inherit; min-height: 32px; }
    button { background: var(--btn); color: #fff; border: 1px solid var(--btn-hi); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; min-height: 32px; }
    button:hover { background: var(--btn-hi); }
    button:focus-visible, select:focus-visible, a:focus-visible, canvas:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    main { position: relative; height: calc(100% - 58px); }
    #view { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    .credit { position: absolute; left: 12px; bottom: 10px; margin: 0; color: var(--muted); font-size: 12px; background: rgba(20, 26, 38, 0.85); padding: 4px 8px; border-radius: 6px; max-width: calc(100% - 40px); }
    .credit a { color: var(--text); }
    .cams { display: flex; gap: 6px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <a class="skip" href="#view">Skip to the 3D view</a>
  <header>
    <h1>Car viewer</h1>
    <label for="pick">Model</label>
    <select id="pick"></select>
    <div class="cams" role="group" aria-label="Camera">
      <button type="button" data-cam="3q">3/4</button>
      <button type="button" data-cam="side">Side</button>
      <button type="button" data-cam="front">Front</button>
      <button type="button" data-cam="rear">Rear</button>
      <button type="button" data-cam="top">Top</button>
    </div>
    <a href="car-gallery">All cars</a>
  </header>
  <main>
    <canvas id="view" tabindex="0" role="img" aria-label="Large 3D view of the selected car. Drag to turn, scroll or pinch to zoom, arrow keys turn it."></canvas>
    <p class="credit" id="credit"></p>
  </main>
  <script src="/s/__WIDGET_TOKEN__/js/vendor/three-r128.min.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/vendor/three-r128-GLTFLoader.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/vendor/three-r128-RoomEnvironment.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/car-stage.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/vendor/three-r128-BufferGeometryUtils.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/glb-fix.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/toy-cars.js"></script>
  <script src="/s/__WIDGET_TOKEN__/api/fx/cars/custom.js"></script>
  <script>
    (function () {
      'use strict';
      var THREE = window.THREE, $ = function (id) { return document.getElementById(id); };
      var canvas = $('view'), renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      renderer.outputEncoding = THREE.sRGBEncoding; renderer.setClearColor(0x1d2433);
      var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, 0.01, 200);
      CarStage.setup(renderer, scene);   // Studio-Raum, ACES-Belichtung (js/car-stage.js)
      var floor = new THREE.Mesh(new THREE.CircleGeometry(5, 64), new THREE.MeshStandardMaterial({ color: 0x2a3346, roughness: 0.9 }));
      floor.rotation.x = -Math.PI / 2; scene.add(floor);
      var holder = new THREE.Group(); scene.add(holder);
      var loader = new THREE.GLTFLoader(), credits = [], current = null;

      // Modell auf ~4,4 m Länge, längste Achse = x, Boden y = 0
      function show(c) {
        current = c.uid;
        while (holder.children.length) holder.remove(holder.children[0]);
        var p = $('credit'); p.textContent = 'Loading …';
        // volle Qualität: Original von Sketchfab über den Server (Cache); sonst die leichte Fassung für den Regen
        var m0 = /([0-9a-f]{32})/.exec(c.url || ''), full = m0 ? '/app/api/cars/preview/' + m0[1] + '.glb' : null;
        p.textContent = full ? 'Loading the full-quality model … the first time the server fetches it from Sketchfab, this can take up to a minute.' : 'Loading …';
        function light() { loader.load('/s/__WIDGET_TOKEN__/api/fx/cars/model/' + c.uid + '.glb', got, null, function () { p.textContent = 'Could not load this model.'; }); }
        if (full) loader.load(full, got, null, light); else light();
        function got(gl) {
          if (current !== c.uid) return;
          // wie im Regen aufbereiten: Front nach +x (inkl. „Turn around“), Länge nach Katalog, Räder gerade
          var car = ToyCars.prepare(gl.scene, c); car.position.y = car.userData.dims.H / 2;
          holder.add(car); orbit.dist = Math.max(9, car.userData.dims.L * 2.1); orbit.t.set(0, 0.6, 0);
          p.textContent = '';
          var a = document.createElement('a'); a.href = c.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '“' + c.name + '”';
          var l = document.createElement('span'); l.textContent = c.license;
          p.append(a, document.createTextNode(' by ' + c.author + ', '), l, document.createTextNode('. Full-quality original.'));
        }
      }
      fetch('/s/__WIDGET_TOKEN__/api/fx/cars/catalog.json').then(function (r) { return r.json(); }).then(function (list) {
        credits = list;
        list.forEach(function (c) { var o = document.createElement('option'); o.value = c.uid; o.textContent = c.brand + ' – ' + c.name; $('pick').appendChild(o); });
        var want = new URLSearchParams(location.search).get('model'), c = list.filter(function (x) { return x.uid === want || x.key === want; })[0] || list[0];
        if (!c) return;
        $('pick').value = c.uid; show(c);
      });
      $('pick').addEventListener('change', function () {
        var c = credits.filter(function (x) { return x.uid === $('pick').value; })[0];
        if (c) { show(c); history.replaceState(null, '', '?model=' + encodeURIComponent(c.uid)); }
      });

      // ── Ansicht: ziehen, Mausrad/Pinch, Pfeiltasten, Kamera-Knöpfe ──
      var orbit = { yaw: 0.8, pitch: 0.22, dist: 9, t: new THREE.Vector3(0, 0.6, 0) }, pts = {}, pinch = null, drag = null;
      var CAMS = { '3q': [0.8, 0.22], side: [Math.PI / 2, 0.05], front: [0, 0.1], rear: [Math.PI, 0.1], top: [Math.PI, 1.45] };   // Front zeigt nach +x (wie im Regen)
      Array.prototype.forEach.call(document.querySelectorAll('[data-cam]'), function (b) {
        b.addEventListener('click', function () { var c = CAMS[b.dataset.cam]; orbit.yaw = c[0]; orbit.pitch = c[1]; orbit.t.set(0, 0.6, 0); var hc = holder.children[0]; orbit.dist = Math.max(9, hc && hc.userData.dims ? hc.userData.dims.L * 2.2 : 9); });
      });
      // rechts/Mitte/Shift ziehen: Ansicht verschieben (Blickziel entlang der Bildebene)
      function panBy(dx, dy) {
        var k = orbit.dist * 0.0012, r = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0), u = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
        orbit.t.addScaledVector(r, -dx * k).addScaledVector(u, dy * k);
      }
      canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      // Drehpunkt = Oberfläche in der Bildmitte (Kamera bleibt stehen, nur Ziel/Abstand rücken auf den Treffer)
      var fRay = new THREE.Raycaster(), fMid = new THREE.Vector2(0, 0);
      function refocus() {
        if (!holder.children.length) return;
        cam.updateMatrixWorld(); fRay.setFromCamera(fMid, cam);
        var h = fRay.intersectObject(holder, true).filter(function (x) {
          var m = Array.isArray(x.object.material) ? x.object.material[0] : x.object.material;
          return x.object.visible && !(m && m.transparent && m.opacity < 0.6);
        })[0];
        if (!h || h.distance < 0.05) return;
        orbit.t.copy(cam.position).addScaledVector(fRay.ray.direction, h.distance); orbit.dist = h.distance;
      }
      canvas.addEventListener('pointerdown', function (e) { if (!(e.button === 1 || e.button === 2 || e.shiftKey) && !Object.keys(pts).length) refocus(); pts[e.pointerId] = { x: e.clientX, y: e.clientY, pan: e.button === 1 || e.button === 2 || e.shiftKey }; canvas.setPointerCapture(e.pointerId); drag = true; });
      canvas.addEventListener('pointermove', function (e) {
        if (!pts[e.pointerId]) return;
        var ids = Object.keys(pts);
        if (ids.length === 2) {
          var a = pts[ids[0]], b = pts[ids[1]], d0 = Math.hypot(a.x - b.x, a.y - b.y);
          pts[e.pointerId] = { x: e.clientX, y: e.clientY };
          var d1 = Math.hypot(pts[ids[0]].x - pts[ids[1]].x, pts[ids[0]].y - pts[ids[1]].y);
          if (d0 > 0) orbit.dist = Math.max(0.15, Math.min(25, orbit.dist * d0 / d1));
          return;
        }
        var p = pts[e.pointerId];
        if (p.pan) panBy(e.clientX - p.x, e.clientY - p.y);
        else { orbit.yaw += (e.clientX - p.x) * 0.008; orbit.pitch = Math.max(-0.1, Math.min(1.5, orbit.pitch + (e.clientY - p.y) * 0.006)); }
        pts[e.pointerId] = { x: e.clientX, y: e.clientY, pan: p.pan };
      });
      function up(e) { delete pts[e.pointerId]; if (!Object.keys(pts).length) drag = null; }
      canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
      canvas.addEventListener('wheel', function (e) { e.preventDefault(); refocus(); orbit.dist = Math.max(0.15, Math.min(25, orbit.dist * (e.deltaY > 0 ? 1.1 : 0.9))); }, { passive: false });
      canvas.addEventListener('keydown', function (e) {
        var k = { ArrowLeft: [-0.15, 0], ArrowRight: [0.15, 0], ArrowUp: [0, 0.08], ArrowDown: [0, -0.08] }[e.key];
        if (e.key === '+' || e.key === '=') { orbit.dist = Math.max(0.15, orbit.dist * 0.9); return; }
        if (e.key === '-') { orbit.dist = Math.min(25, orbit.dist * 1.1); return; }
        if (!k) return; e.preventDefault(); orbit.yaw += k[0]; orbit.pitch = Math.max(-0.1, Math.min(1.5, orbit.pitch + k[1]));
      });
      function resize() { var r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); cam.aspect = r.width / Math.max(1, r.height); cam.updateProjectionMatrix(); }
      window.addEventListener('resize', resize); resize();
      function frame() {
        var cp = Math.cos(orbit.pitch), T = orbit.t;
        cam.position.set(T.x + Math.cos(orbit.yaw) * cp * orbit.dist, T.y + Math.sin(orbit.pitch) * orbit.dist, T.z + Math.sin(orbit.yaw) * cp * orbit.dist);
        cam.lookAt(T);
        renderer.render(scene, cam);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
