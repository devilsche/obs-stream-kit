<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car picker</title>
  <style>
    /* Auswahl der Auto-Modelle für den Regen: Kandidaten aus assets/cars/candidates.json (Sketchfab-Suche,
       frei herunterladbar), Auswahl je Modell sofort gespeichert (data/car-picks.json, /app/api/cars/picks) */
    :root { --bg: #1d2433; --panel: #141a26; --line: #2a3346; --text: #f0eaf5; --muted: #c4bad6; --accent: #f2b705; --btn: #5e2a79; --btn-hi: #8a4dad; --ok: #9be59b; --warn: #ffcf70; --danger: #ff8a80; }
    html { background: var(--bg); }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 'DM Sans', system-ui, sans-serif; }
    .skip { position: absolute; left: -9999px; }
    .skip:focus { left: 12px; top: 12px; background: var(--accent); color: #000; padding: 6px 10px; z-index: 3; }
    header { padding: 18px 20px 4px; max-width: 1400px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0; }
    .lead { color: var(--muted); margin: 4px 0 0; }
    .filters { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 20px; max-width: 1400px; margin: 0 auto; border-bottom: 1px solid var(--line); }
    button { background: var(--btn); color: #fff; border: 1px solid var(--btn-hi); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; min-height: 34px; }
    button:hover { background: var(--btn-hi); }
    button[aria-pressed="true"] { background: var(--btn-hi); box-shadow: inset 0 0 0 2px var(--accent); }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .count { color: var(--muted); margin-left: auto; }
    #status { min-height: 20px; color: var(--muted); }
    #status.err { color: var(--danger); }
    main { max-width: 1400px; margin: 0 auto; padding: 14px 20px 40px; }
    .grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .tile { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .tile.keep { border-color: var(--ok); }
    .tile[hidden] { display: none; }
    .tile img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #0e131c; }
    .meta { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
    .meta h2 { font-size: 15px; margin: 0; }
    .sub { color: var(--muted); font-size: 13px; }
    .lic { font-size: 12px; align-self: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; }
    .lic.nc { color: var(--warn); border-color: var(--warn); }
    .meta a { color: var(--text); font-size: 13px; padding: 3px 0; min-height: 24px; display: inline-block; }
    .keepbtn { margin-top: auto; }
    .keepbtn[aria-pressed="true"] { background: #2e6b3a; border-color: var(--ok); box-shadow: none; }
    .have { font-size: 12px; color: var(--ok); }
    .inside { font-size: 12px; color: var(--ok); }
    .inside.no { color: var(--muted); }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
    .btns button { flex: 1; }
    dialog { width: min(1200px, 96vw); height: min(820px, 92vh); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); }
    dialog::backdrop { background: rgba(0, 0, 0, 0.7); }
    .dlg { display: flex; flex-direction: column; height: 100%; }
    .dlg-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .dlg-head h2 { font-size: 17px; margin: 0; flex: 1; min-width: 180px; }
    .stage { position: relative; flex: 1; min-height: 0; }
    #view { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; color: var(--muted); pointer-events: none; }
    .msg[hidden] { display: none; }
    .dlg-foot { padding: 6px 14px 10px; color: var(--muted); font-size: 12px; }
    .dlg-foot a { color: var(--text); }
  </style>
</head>
<body>
  <a class="skip" href="#cars">Skip to the cars</a>
  <header>
    <h1>Car picker</h1>
    <p class="lead">Free car models from Sketchfab. “Preview” shows the model in 3D the way it will look here (the first time the server downloads it, which can take up to a minute). “Keep” saves your choice at once. Yellow licence = non-commercial.</p>
  </header>
  <div class="filters" role="group" aria-label="Filter">
    <span id="brands"></span>
    <button type="button" id="onlyKeep" aria-pressed="false">Only kept</button>
    <button type="button" id="onlyInside" aria-pressed="false">Only with interior</button>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <main>
    <p id="status" role="status" aria-live="polite">Loading …</p>
    <ul class="grid" id="cars"></ul>
  </main>
  <dialog id="dlg" aria-labelledby="dlgTitle">
    <div class="dlg">
      <div class="dlg-head">
        <h2 id="dlgTitle"></h2>
        <button type="button" id="dlgKeep" class="keepbtn"></button>
        <button type="button" data-cam="3q">3/4</button>
        <button type="button" data-cam="side">Side</button>
        <button type="button" data-cam="front">Front</button>
        <button type="button" data-cam="rear">Rear</button>
        <button type="button" data-cam="top">Top</button>
        <button type="button" id="dlgClose">Close</button>
      </div>
      <div class="stage">
        <canvas id="view" tabindex="0" role="img" aria-label="3D preview of the car. Drag to turn, scroll or pinch to zoom, arrow keys turn it."></canvas>
        <p class="msg" id="dlgMsg" role="status" aria-live="polite"></p>
      </div>
      <p class="dlg-foot" id="dlgFoot"></p>
    </div>
  </dialog>
  <script src="/s/__WIDGET_TOKEN__/js/vendor/three-r128.min.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/vendor/three-r128-GLTFLoader.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/vendor/three-r128-RoomEnvironment.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/car-stage.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/vendor/three-r128-BufferGeometryUtils.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/glb-fix.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/toy-cars.js"></script>
  <script src="/s/__WIDGET_TOKEN__/api/fx/cars/custom.js"></script>
  <script>
    (function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };
      var list = [], picks = {}, scanned = {}, brand = 'all', onlyKeep = false, onlyInside = false, tiles = [];
      function say(m, err) { $('status').textContent = m; $('status').className = err ? 'err' : ''; }
      function api(method, url, body) {
        return fetch(url, { method: method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' })
          .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
      }
      // gilt als behalten: ausdrücklich gewählt, oder schon im Regen (have) und nicht abgewählt
      function kept(c) { var p = picks[c.uid]; return p ? !!p.keep : !!c.have; }
      function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
      function build() {
        var box = $('cars'); box.textContent = ''; tiles = [];
        list.forEach(function (c) {
          var li = el('li', 'tile'), img = el('img'), meta = el('div', 'meta');
          img.src = c.thumb; img.alt = c.name; img.loading = 'lazy';
          meta.append(el('h2', null, c.name), el('span', 'sub', c.brand + ' · by ' + c.author + ' · ' + c.faces.toLocaleString('en') + ' triangles'));
          meta.appendChild(el('span', 'lic' + (/NonCommercial/.test(c.license) ? ' nc' : ''), c.license));
          if (c.have) meta.appendChild(el('span', 'have', 'Already in the rain'));
          var sc = scanned[c.uid];
          meta.appendChild(el('span', 'inside' + (sc && sc.interior ? '' : ' no'), !sc ? 'Interior: not checked yet' : sc.error ? 'Could not check' : sc.interior ? 'Interior' : 'No interior (dark windows)'));
          if (sc && !sc.error && sc.wheels != null) meta.appendChild(el('span', 'inside' + (sc.wheels === 4 ? '' : ' no'),
            sc.wheels === 4 ? 'Wheels: separate' + (sc.steered ? ', turned in the model (will be set straight, steerable)' : ', straight, steerable')
              : sc.half ? 'Wheels: only on one side (half model)' : 'Wheels: not separable (no tyre material), cannot steer'));
          var a = el('a', null, 'Sketchfab page'); a.href = c.url; a.target = '_blank'; a.rel = 'noopener'; a.setAttribute('aria-label', c.name + ' on Sketchfab'); meta.appendChild(a);
          var btns = el('div', 'btns'), pv = el('button', null, 'Preview'), b = el('button', 'keepbtn');
          pv.type = 'button'; pv.setAttribute('aria-label', 'Preview ' + c.name + ' in 3D'); b.type = 'button';
          pv.addEventListener('click', function () { openPreview(c, pv); });
          b.addEventListener('click', function () { toggle(c); });
          btns.append(pv, b); meta.appendChild(btns); li.append(img, meta); box.appendChild(li);
          tiles.push({ c: c, li: li, b: b });
        });
        paint();
      }
      function toggle(c) {
        var v = !kept(c);
        return api('POST', '/app/api/cars/picks', { key: c.uid, def: { keep: v } }).then(function () {
          picks[c.uid] = { keep: v }; paint(); say(v ? 'Kept: ' + c.name : 'Dropped: ' + c.name);
        }).catch(function (e) { say('Not saved: ' + e.message, true); });
      }
      function paint() {
        var n = 0, k = 0;
        tiles.forEach(function (t) {
          var sc = scanned[t.c.uid], on = kept(t.c), show = (brand === 'all' || t.c.brand === brand) && (!onlyKeep || on) && (!onlyInside || (sc && sc.interior));
          t.li.hidden = !show; t.li.classList.toggle('keep', on);
          t.b.textContent = on ? 'Kept' : 'Keep'; t.b.setAttribute('aria-pressed', String(on));
          t.b.setAttribute('aria-label', (on ? 'Kept: ' : 'Keep ') + t.c.name);
          if (show) n++; if (on) k++;
        });
        $('count').textContent = n + ' shown · ' + k + ' kept';
        if (cur) { var on = kept(cur); $('dlgKeep').textContent = on ? 'Kept' : 'Keep'; $('dlgKeep').setAttribute('aria-pressed', String(on)); }
      }

      // ── 3D-Vorschau im Modal: Modell vom Server (lädt beim ersten Mal von Sketchfab), unsere Darstellung ──
      var THREE = window.THREE, dlg = $('dlg'), canvas = $('view'), renderer = null, scene, cam, holder, cur = null, opener = null, req = 0;
      var orbit = { yaw: 0.8, pitch: 0.22, dist: 9, t: new THREE.Vector3(0, 0.6, 0) }, pts = {}, running = false;
      var CAMS = { '3q': [0.8, 0.22], side: [Math.PI / 2, 0.05], front: [0, 0.1], rear: [Math.PI, 0.1], top: [Math.PI, 1.45] };   // Front zeigt nach +x (wie im Regen)
      function setup() {
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
        renderer.outputEncoding = THREE.sRGBEncoding; renderer.setClearColor(0x1d2433);
        scene = new THREE.Scene(); cam = new THREE.PerspectiveCamera(30, 1, 0.05, 200);
        CarStage.setup(renderer, scene);   // Studio-Raum, ACES-Belichtung (js/car-stage.js)
        var floor = new THREE.Mesh(new THREE.CircleGeometry(5, 64), new THREE.MeshStandardMaterial({ color: 0x2a3346, roughness: 0.9 }));
        floor.rotation.x = -Math.PI / 2; scene.add(floor);
        holder = new THREE.Group(); scene.add(holder);
        // rechts/Mitte/Shift ziehen: Ansicht verschieben (Blickziel entlang der Bildebene)
      function panBy(dx, dy) {
        var k = orbit.dist * 0.0012, r = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0), u = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
        orbit.t.addScaledVector(r, -dx * k).addScaledVector(u, dy * k);
      }
      canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      canvas.addEventListener('pointerdown', function (e) { pts[e.pointerId] = { x: e.clientX, y: e.clientY, pan: e.button === 1 || e.button === 2 || e.shiftKey }; canvas.setPointerCapture(e.pointerId); });
        canvas.addEventListener('pointermove', function (e) {
          if (!pts[e.pointerId]) return;
          var ids = Object.keys(pts);
          if (ids.length === 2) {
            var a = pts[ids[0]], b = pts[ids[1]], d0 = Math.hypot(a.x - b.x, a.y - b.y);
            pts[e.pointerId] = { x: e.clientX, y: e.clientY };
            var d1 = Math.hypot(pts[ids[0]].x - pts[ids[1]].x, pts[ids[0]].y - pts[ids[1]].y);
            if (d0 > 0) orbit.dist = Math.max(2.5, Math.min(25, orbit.dist * d0 / d1));
            return;
          }
          var p = pts[e.pointerId];
          if (p.pan) panBy(e.clientX - p.x, e.clientY - p.y);
          else { orbit.yaw += (e.clientX - p.x) * 0.008; orbit.pitch = Math.max(-0.1, Math.min(1.5, orbit.pitch + (e.clientY - p.y) * 0.006)); }
          pts[e.pointerId] = { x: e.clientX, y: e.clientY, pan: p.pan };
        });
        function up(e) { delete pts[e.pointerId]; }
        canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
        canvas.addEventListener('wheel', function (e) { e.preventDefault(); orbit.dist = Math.max(2.5, Math.min(25, orbit.dist * (e.deltaY > 0 ? 1.1 : 0.9))); }, { passive: false });
        canvas.addEventListener('keydown', function (e) {
          var k = { ArrowLeft: [-0.15, 0], ArrowRight: [0.15, 0], ArrowUp: [0, 0.08], ArrowDown: [0, -0.08] }[e.key];
          if (e.key === '+' || e.key === '=') { orbit.dist = Math.max(2.5, orbit.dist * 0.9); return; }
          if (e.key === '-') { orbit.dist = Math.min(25, orbit.dist * 1.1); return; }
          if (!k) return; e.preventDefault(); orbit.yaw += k[0]; orbit.pitch = Math.max(-0.1, Math.min(1.5, orbit.pitch + k[1]));
        });
        Array.prototype.forEach.call(document.querySelectorAll('[data-cam]'), function (b) {
          b.addEventListener('click', function () { var c = CAMS[b.dataset.cam]; orbit.yaw = c[0]; orbit.pitch = c[1]; orbit.t.set(0, 0.6, 0); });
        });
      }
      function frame() {
        if (!dlg.open) { running = false; return; }
        var r = canvas.getBoundingClientRect();
        if (r.width && (canvas.width !== Math.round(r.width * renderer.getPixelRatio()))) { renderer.setSize(r.width, r.height, false); cam.aspect = r.width / Math.max(1, r.height); cam.updateProjectionMatrix(); }
        var cp = Math.cos(orbit.pitch), T = orbit.t;
        cam.position.set(T.x + Math.cos(orbit.yaw) * cp * orbit.dist, T.y + Math.sin(orbit.pitch) * orbit.dist, T.z + Math.sin(orbit.yaw) * cp * orbit.dist);
        cam.lookAt(T);
        renderer.render(scene, cam);
        requestAnimationFrame(frame);
      }
      function clearModel() {
        while (holder.children.length) {
          var o = holder.children[0]; holder.remove(o);
          o.traverse(function (m) { if (m.isMesh) { m.geometry.dispose(); [].concat(m.material).forEach(function (mt) { if (mt) { if (mt.map) mt.map.dispose(); mt.dispose(); } }); } });
        }
      }
      function openPreview(c, btn) {
        if (!renderer) setup();
        cur = c; opener = btn; var my = ++req;
        $('dlgTitle').textContent = c.name;
        var foot = $('dlgFoot'); foot.textContent = '';
        var a = el('a', null, 'Sketchfab page'); a.href = c.url; a.target = '_blank'; a.rel = 'noopener';
        foot.append(document.createTextNode('By ' + c.author + ' · ' + c.license + ' · ' + c.faces.toLocaleString('en') + ' triangles · '), a);
        clearModel(); paint();
        $('dlgMsg').hidden = false; $('dlgMsg').textContent = 'Loading … the first time the server fetches the model from Sketchfab, this can take up to a minute.';
        orbit.yaw = 0.8; orbit.pitch = 0.22; orbit.dist = 9; orbit.t.set(0, 0.6, 0);
        dlg.showModal(); canvas.focus();
        if (!running) { running = true; requestAnimationFrame(frame); }
        new THREE.GLTFLoader().load('/app/api/cars/preview/' + c.uid + '.glb', function (gl) {
          if (my !== req) return;
          // wie im Regen aufbereiten; Fahrtrichtung aus dem Katalog, falls das Auto schon drin ist
          var inCat = (ToyCars.catalog() || []).filter(function (e) { return e.uid === c.uid; })[0];
          var car = ToyCars.prepare(gl.scene, inCat || { key: c.uid, front: 0, len: 4.5 }); car.position.y = car.userData.dims.H / 2;
          holder.add(car); $('dlgMsg').hidden = true;
        }, null, function () {
          if (my !== req) return;
          // Grund vom Server holen (z. B. Sketchfab-Bremse)
          fetch('/app/api/cars/preview/' + c.uid + '.glb', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (j) {
            if (my === req) $('dlgMsg').textContent = 'Could not load this model: ' + (j.error || 'unknown error') + '.';
          }).catch(function () { if (my === req) $('dlgMsg').textContent = 'Could not load this model.'; });
        });
      }
      $('dlgKeep').addEventListener('click', function () { if (cur) toggle(cur); });
      if (window.ToyCars) ToyCars.loadCatalog().catch(function () {});
      $('dlgClose').addEventListener('click', function () { dlg.close(); });
      dlg.addEventListener('close', function () { req++; clearModel(); cur = null; if (opener) opener.focus(); });
      $('onlyKeep').addEventListener('click', function () { onlyKeep = !onlyKeep; $('onlyKeep').setAttribute('aria-pressed', String(onlyKeep)); paint(); });
      $('onlyInside').addEventListener('click', function () { onlyInside = !onlyInside; $('onlyInside').setAttribute('aria-pressed', String(onlyInside)); paint(); });
      Promise.all([
        fetch('/s/__WIDGET_TOKEN__/assets/cars/candidates.json').then(function (r) { return r.json(); }),
        api('GET', '/app/api/cars/picks'),
        api('GET', '/app/api/cars/scan').catch(function () { return { items: {} }; })
      ]).then(function (res) {
        list = res[0]; picks = res[1].items || {}; scanned = res[2].items || {};
        var brands = ['all'];
        list.forEach(function (c) { if (brands.indexOf(c.brand) < 0) brands.push(c.brand); });
        brands.forEach(function (b) {
          var btn = el('button', null, b === 'all' ? 'All' : b); btn.type = 'button'; btn.setAttribute('aria-pressed', String(b === brand));
          btn.addEventListener('click', function () { brand = b; Array.prototype.forEach.call($('brands').children, function (x) { x.setAttribute('aria-pressed', String(x === btn)); }); paint(); });
          $('brands').append(btn, document.createTextNode(' '));
        });
        say(''); build();
      }).catch(function (e) { say('Could not load: ' + e.message, true); });
    })();
  </script>
</body>
</html>
