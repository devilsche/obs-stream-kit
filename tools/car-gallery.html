<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car overview</title>
  <style>
    /* Übersicht der Autos im Regen (Katalog /api/fx/cars/catalog.json, aufbereitet von scripts/build_car_rain.py):
       eine WebGL-Fläche hinter dem Raster, jede Kachel per Scissor; Modelle laden erst, wenn sichtbar */
    :root { --bg: #1d2433; --panel: #141a26; --line: #2a3346; --text: #f0eaf5; --muted: #c4bad6; --accent: #f2b705; --btn: #5e2a79; --btn-hi: #8a4dad; --ok: #9be59b; }
    html { background: var(--bg); }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 'DM Sans', system-ui, sans-serif; }
    .skip { position: absolute; left: -9999px; }
    .skip:focus { left: 12px; top: 12px; background: var(--accent); color: #000; padding: 6px 10px; z-index: 3; }
    #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1; }
    header { padding: 18px 20px 4px; max-width: 1400px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0; }
    .lead { color: var(--muted); margin: 4px 0 0; }
    .lead a { color: var(--text); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 20px; max-width: 1400px; margin: 0 auto; }
    button { background: var(--btn); color: #fff; border: 1px solid var(--btn-hi); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; min-height: 34px; }
    button:hover { background: var(--btn-hi); }
    button[aria-pressed="true"] { background: var(--btn-hi); box-shadow: inset 0 0 0 2px var(--accent); }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    label { color: var(--muted); }
    input[type=search] { background: var(--panel); color: var(--text); border: 1px solid var(--btn-hi); border-radius: 6px; padding: 6px 10px; font: inherit; min-height: 34px; }
    .count { color: var(--muted); margin-left: auto; }
    main { max-width: 1400px; margin: 0 auto; padding: 0 20px 40px; }
    .grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
    .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .tile[hidden] { display: none; }
    .stage { aspect-ratio: 4 / 3; width: 100%; }
    .meta { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 2px; }
    .meta h2 { font-size: 15px; margin: 0; }
    .sub { color: var(--muted); font-size: 13px; }
    .param { font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--accent); }
    .tag { font-size: 12px; color: var(--ok); }
    .tag.off { color: var(--muted); }
    .links { display: flex; flex-wrap: wrap; gap: 4px 12px; }
    .meta a { color: var(--text); font-size: 13px; padding: 3px 0; min-height: 24px; display: inline-block; }
    .swatches { display: flex; gap: 4px; flex-wrap: wrap; }
    .sw { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); }
    .swo { background: conic-gradient(#c33, #3c3, #33c, #c33); }
  </style>
</head>
<body>
  <a class="skip" href="#cars">Skip to the cars</a>
  <canvas id="gl" aria-hidden="true"></canvas>
  <header>
    <h1>Car overview</h1>
    <p class="lead">Every car of the car rain (<code>effects/item-rain.html?kind=car</code>), real 3D models chosen in the <a href="car-picker">Car picker</a>. Each rain loads 6 random cars from the mix; <code>&amp;model=&lt;name&gt;</code> picks one. Paints and rim colour in the <a href="car-editor">Car editor</a>.</p>
  </header>
  <div class="filters" role="group" aria-label="Filter cars">
    <span id="brands"></span>
    <label for="q">Search</label>
    <input type="search" id="q" autocomplete="off">
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <main>
    <p id="status" role="status" aria-live="polite">Loading …</p>
    <ul class="grid" id="cars"></ul>
  </main>
  <script src="/s/__WIDGET_TOKEN__/js/vendor/three-r128.min.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/vendor/three-r128-GLTFLoader.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/vendor/three-r128-BufferGeometryUtils.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/vendor/three-r128-RoomEnvironment.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/glb-fix.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/car-stage.js"></script>
  <script src="/s/__WIDGET_TOKEN__/js/toy-cars.js"></script>
  <script src="/s/__WIDGET_TOKEN__/api/fx/cars/custom.js"></script>
  <script>
    (function () {
      'use strict';
      var THREE = window.THREE, TC = window.ToyCars, $ = function (id) { return document.getElementById(id); };
      var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
      function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
      function hex(c) { return '#' + ('000000' + (c >>> 0).toString(16)).slice(-6); }
      var tiles = [], brand = 'all', css = '', ncss = 0;

      TC.loadCatalog().then(function (list) {
        $('status').textContent = list.length ? '' : 'No cars yet – pick some in the Car picker.';
        var brands = ['all'];
        list.forEach(function (e) {
          if (brands.indexOf(e.brand) < 0) brands.push(e.brand);
          var v = TC.vehicle(e.key), li = el('li', 'tile'), st = el('div', 'stage'), meta = el('div', 'meta');
          st.setAttribute('role', 'img'); st.setAttribute('aria-label', (v.label || e.name) + ', 3D model');
          meta.append(el('h2', null, v.label || e.name), el('span', 'sub', e.brand + ' · by ' + e.author + ' · ' + e.license));
          meta.appendChild(el('span', 'tag' + (v.mix === false ? ' off' : ''), (v.mix === false ? 'Not in the mix' : 'In the mix') + (e.interior ? ' · interior' : '') + (e.wheels >= 4 ? ' · steerable wheels' : '')));
          if (Array.isArray(v.paints) && v.paints.length) {
            var sw = el('div', 'swatches'); sw.setAttribute('aria-label', 'Paints');
            v.paints.forEach(function (p) {
              var d = el('span', 'sw'); d.title = p.c == null ? 'Original colour' : hex(p.c);
              if (p.c == null) d.classList.add('swo'); else { d.classList.add('swc' + ncss); css += '.swc' + ncss + '{background:' + hex(p.c) + '}'; ncss++; }
              sw.appendChild(d);
            });
            meta.appendChild(sw);
          }
          meta.appendChild(el('code', 'param', 'model=' + e.key));
          var links = el('div', 'links'), a1 = el('a', null, 'Edit'), a2 = el('a', null, 'View large'), a3 = el('a', null, 'Sketchfab');
          a1.href = 'car-editor?car=' + encodeURIComponent(e.key); a2.href = 'car-viewer?model=' + encodeURIComponent(e.uid);
          a3.href = e.url; a3.target = '_blank'; a3.rel = 'noopener';
          links.append(a1, a2, a3); meta.appendChild(links);
          li.append(st, meta); $('cars').appendChild(li);
          var t = { e: e, li: li, stage: st, obj: null, loading: false, yaw: -0.7 + (tiles.length % 5) * 0.12, hover: false, text: (e.name + ' ' + e.key + ' ' + e.brand + ' ' + (v.label || '')).toLowerCase() };
          li.addEventListener('pointerenter', function () { t.hover = true; }); li.addEventListener('pointerleave', function () { t.hover = false; });
          li.addEventListener('focusin', function () { t.hover = true; }); li.addEventListener('focusout', function () { t.hover = false; });
          tiles.push(t);
        });
        // Farbtupfer als Klassen in einem <style>, keine Inline-Styles
        if (css) { var stl = document.createElement('style'); stl.textContent = css; document.head.appendChild(stl); }
        brands.forEach(function (b) {
          var btn = el('button', null, b === 'all' ? 'All' : b); btn.type = 'button'; btn.setAttribute('aria-pressed', String(b === brand));
          btn.addEventListener('click', function () { brand = b; Array.prototype.forEach.call($('brands').children, function (x) { x.setAttribute('aria-pressed', String(x === btn)); }); apply(); });
          $('brands').append(btn, document.createTextNode(' '));
        });
        apply();
      }).catch(function () { $('status').textContent = 'Could not load the car list.'; });
      $('q').addEventListener('input', apply);
      function apply() {
        var s = $('q').value.trim().toLowerCase(), n = 0;
        tiles.forEach(function (t) { var show = (brand === 'all' || t.e.brand === brand) && (!s || t.text.indexOf(s) >= 0); t.li.hidden = !show; if (show) n++; });
        $('count').textContent = n + ' of ' + tiles.length + ' cars';
      }

      // ── WebGL: eine Fläche, je Kachel ein Ausschnitt ──
      var canvas = $('gl'), renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      renderer.setScissorTest(true);
      var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, 0.1, 200);
      CarStage.setup(renderer, scene);
      var holder = new THREE.Group(); scene.add(holder);
      function resize() { renderer.setSize(window.innerWidth, window.innerHeight, false); }
      window.addEventListener('resize', resize); resize();
      var last = null, busy = 0;
      function frame(ts) {
        var dt = last === null ? 0 : Math.min(0.05, (ts - last) / 1000); last = ts;
        var H = window.innerHeight, W = window.innerWidth;
        renderer.setScissor(0, 0, W, H); renderer.clear();
        tiles.forEach(function (t) {
          if (t.li.hidden) return;
          var r = t.stage.getBoundingClientRect();
          if (r.bottom < 0 || r.top > H || r.right < 0 || r.left > W) return;
          // höchstens zwei Modelle gleichzeitig laden
          if (!t.obj && !t.loading && busy < 2) {
            t.loading = true; busy++;
            TC.loadModel(t.e).then(function (tpl) {
              var p = TC.pickPaint(t.e.key); t.obj = TC.paintTemplate(tpl, p.c);
            }).catch(function () {}).then(function () { busy--; });
          }
          if (!t.obj) return;
          if (!reduce) t.yaw += dt * (t.hover ? 1.2 : 0.3);
          t.obj.rotation.set(0, t.yaw, 0);
          var d = t.obj.userData.dims || { L: 4.4 }, dist = Math.max(8.5, d.L * 2.1);
          cam.position.set(0, dist * 0.23, dist); cam.lookAt(0, -0.1, 0);
          if (holder.children[0]) holder.remove(holder.children[0]);
          holder.add(t.obj);
          var y = H - r.bottom;
          renderer.setViewport(r.left, y, r.width, r.height); renderer.setScissor(r.left, y, r.width, r.height);
          cam.aspect = r.width / r.height; cam.updateProjectionMatrix();
          renderer.render(scene, cam);
        });
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
