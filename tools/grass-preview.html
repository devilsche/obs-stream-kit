<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grass preview</title>
<!-- Vergleichsseite (Admin): Rasenflächen mit den freien Sketchfab-Gras-Modellen nebeneinander, dazu das Büschel aus dem
     Spiel und der Baumstumpf-Scan. Modelle von /drive/a/api/fx/track-props/<uid>.glb (scripts/build_track_props.py,
     theme „preview“). Route: /admin/grass-preview (app/views_admin.py). -->
<style>
  :root { --gp-bg: #0d0912; --gp-panel: rgba(20, 12, 30, 0.88); --gp-text: #fff; --gp-dim: #c9bdd6; --gp-accent: #f2b705; --gp-border: #5e2a79; }
  html, body { margin: 0; height: 100%; background: var(--gp-bg); color: var(--gp-text); font: 15px/1.45 'DM Sans', system-ui, sans-serif; overflow: hidden; }
  .skip { position: absolute; left: -9999px; }
  .skip:focus { left: 12px; top: 12px; z-index: 10; background: var(--gp-accent); color: #1b1300; padding: 8px 12px; }
  main { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .panel { position: absolute; left: 16px; top: 16px; max-width: 420px; max-height: calc(100% - 32px); overflow-y: auto;
    background: var(--gp-panel); border: 2px solid var(--gp-border); border-radius: 10px; padding: 14px 16px; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 10px; color: var(--gp-dim); }
  ol { margin: 0; padding-left: 22px; }
  li { margin: 0 0 6px; }
  a { color: var(--gp-accent); }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--gp-accent); outline-offset: 2px; }
  .meta { color: var(--gp-dim); font-size: 13px; }
  .views { display: flex; gap: 8px; margin: 10px 0 12px; flex-wrap: wrap; }
  button { background: #5e2a79; color: #fff; border: 2px solid #5e2a79; border-radius: 8px; padding: 6px 12px; min-height: 36px; cursor: pointer; font: inherit; }
  .status { margin-top: 8px; color: var(--gp-dim); font-size: 13px; }
</style>
</head>
<body>
<a class="skip" href="#legend">Skip to the list</a>
<main>
  <canvas id="view" aria-label="3D lawn with numbered grass patches; drag to orbit, scroll to zoom"></canvas>
  <section class="panel" aria-labelledby="t">
    <h1 id="t">Grass preview</h1>
    <p>Each numbered patch uses one grass model, densely scattered on the same lawn. Drag to orbit, scroll to zoom.</p>
    <div class="views">
      <button type="button" id="vDriver">Driver height</button>
      <button type="button" id="vLow">Low</button>
      <button type="button" id="vTop">From above</button>
    </div>
    <ol id="legend"></ol>
    <p class="status" id="status" role="status" aria-live="polite">Loading models…</p>
  </section>
</main>
<script src="/drive/a/js/vendor/three-r128.min.js"></script>
<script src="/drive/a/js/vendor/three-r128-GLTFLoader.js"></script>
<script src="/drive/a/js/vendor/three-r128-OrbitControls.js"></script>
<script>
(function () {
  'use strict';
  var BASE = '/drive/a/api/fx/track-props/';
  // Felder: Datei (uid[-teil]), Name, Autor, Link, Dichte (Büschel je m² bei Fußfläche 1 m²)
  var PATCHES = [
    { file: null, name: 'In-game tuft (current)', author: 'procedural', dens: 1 },
    { file: '7b7ef2ff56e041d1bcc2b330ea8b1f19-tufts', name: 'Grass Lawn', author: 'pooiloui2', url: 'https://sketchfab.com/3d-models/grass-lawn-7b7ef2ff56e041d1bcc2b330ea8b1f19', dens: 1.4 },
    { file: '422f42f618d342c6958b02613dc57403-fresh', name: 'Grass pack – fresh', author: 'LOLIPOP', url: 'https://sketchfab.com/3d-models/grass-pack-lowpoly-game-ready-422f42f618d342c6958b02613dc57403', dens: 1.2 },
    { file: '422f42f618d342c6958b02613dc57403-tall', name: 'Grass pack – tall', author: 'LOLIPOP', url: 'https://sketchfab.com/3d-models/grass-pack-lowpoly-game-ready-422f42f618d342c6958b02613dc57403', dens: 0.9 },
    { file: '0561204a1fa14c17939300ee1108948b-all', name: 'Grass (9 variants)', author: 'LOLIPOP', url: 'https://sketchfab.com/3d-models/grass-pack-of-9-vars-lowpoly-game-ready-0561204a1fa14c17939300ee1108948b', dens: 1.0 },
    { file: '3352f9d646ec4f25b8aeb28e4232814a-green', name: 'Grass Pack LP', author: 'Nicothin', url: 'https://sketchfab.com/3d-models/grass-pack-lp-3352f9d646ec4f25b8aeb28e4232814a', dens: 1.0 },
    { file: 'f019f293364f4c489aa2d6bf63843c0b-all', name: 'Leafy Grass Pack', author: 'frankesalgado87', url: 'https://sketchfab.com/3d-models/leafy-grass-pack-f019f293364f4c489aa2d6bf63843c0b', dens: 0.9 },
    { file: 'eb4f6dc9d4e3455ea3435385faf58b60-p', name: 'Simple grass chunks (scan)', author: '3dhdscan', url: 'https://sketchfab.com/3d-models/simple-grass-chunks-eb4f6dc9d4e3455ea3435385faf58b60', dens: 0.9 },
    { file: 'd1484537470441b999d37077aeb9b47a', name: 'Dry grass', author: 'Pixel-bit', url: 'https://sketchfab.com/3d-models/dry-grass-d1484537470441b999d37077aeb9b47a', dens: 1.0 },
    { file: '5adad1db79404dd1983f82af4417b0e8-s', name: 'Old tree stump (scan) – one piece', author: 'Vitalii Yevsovych', url: 'https://sketchfab.com/3d-models/free-old-tree-stump-5adad1db79404dd1983f82af4417b0e8', single: 3 }
  ];
  var SIZE = 8, GAP = 3, COLS = 5;
  var canvas = document.getElementById('view'), statusEl = document.getElementById('status');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbcd6ef); scene.fog = new THREE.Fog(0xbcd6ef, 120, 400);
  scene.add(new THREE.HemisphereLight(0xdfeeff, 0x4d6a45, 0.9));
  var sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(4, 7, 5); scene.add(sun);
  var cam = new THREE.PerspectiveCamera(62, 16 / 9, 0.05, 1000);
  var controls = new THREE.OrbitControls(cam, canvas);
  controls.enableDamping = true; controls.maxPolarAngle = Math.PI / 2 - 0.02;
  var W = COLS * SIZE + (COLS - 1) * GAP, D = 2 * SIZE + GAP, cx = W / 2 - SIZE / 2, cz = D / 2 - SIZE / 2;
  // Rasen: Grundfläche wie im Spiel (Stadion-Grün mit leichten Streifen)
  var lawnTex = (function () {
    var c = document.createElement('canvas'); c.width = c.height = 256; var g = c.getContext('2d');
    for (var i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#4f9a46' : '#468d3e'; g.fillRect(0, i * 32, 256, 32); }
    for (var k = 0; k < 4000; k++) { g.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.06).toFixed(3) + ')'; g.fillRect(Math.random() * 256, Math.random() * 256, 1, 2); }
    var t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 30); t.encoding = THREE.sRGBEncoding; return t;
  })();
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ map: lawnTex, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(cx, 0, cz); scene.add(ground);
  function patchOrigin(i) { return { x: (i % COLS) * (SIZE + GAP), z: Math.floor(i / COLS) * (SIZE + GAP) }; }
  function label(i, text) {
    var c = document.createElement('canvas'), g = c.getContext('2d'); c.width = 128; c.height = 128;
    g.fillStyle = 'rgba(13,9,18,0.8)'; g.beginPath(); g.arc(64, 64, 60, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#f2b705'; g.font = '700 64px DM Sans, system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 64, 68);
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
    var o = patchOrigin(i); sp.position.set(o.x, 1.8, o.z + SIZE / 2 + 0.6); sp.scale.set(1.1, 1.1, 1); sp.renderOrder = 5; scene.add(sp);
  }
  function rnd(seed) { var s = seed >>> 0; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  // Büschel aus dem Spiel (js/car-track-themes.js greenery): 9 schmale Halme, unten dunkel, oben hell
  function gameTuft() {
    var geos = [], dark = new THREE.Color(0x3f6e2a), light = new THREE.Color(0x9ccf5a);
    for (var b = 0; b < 9; b++) {
      var a = b / 9 * Math.PI * 2 + (b % 2) * 0.4, r = 0.06 + (b % 3) * 0.05, h = 0.55 + ((b * 7) % 5) * 0.12;
      var g = new THREE.ConeGeometry(0.045, h, 3, 1).toNonIndexed(); g.translate(0, h / 2, 0);
      g.applyMatrix4(new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(0, -a, 0.32 + (b % 3) * 0.1, 'YXZ')));
      g.translate(Math.cos(a) * r, 0, Math.sin(a) * r);
      var p = g.attributes.position, cols = [];
      for (var i = 0; i < p.count; i++) { var c = dark.clone().lerp(light, Math.min(1, p.getY(i) / 1.1)); cols.push(c.r, c.g, c.b); }
      g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3)); geos.push(g);
    }
    var merged = new THREE.BufferGeometry(), pos = [], col = [];
    geos.forEach(function (g) { pos.push.apply(pos, g.attributes.position.array); col.push.apply(col, g.attributes.color.array); });
    merged.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); merged.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    merged.computeVertexNormals();
    return [{ geo: merged, mat: new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, flatShading: true }) }];
  }
  function partsOf(gltf) {
    var out = []; gltf.scene.updateMatrixWorld(true);
    gltf.scene.traverse(function (o) {
      if (!o.isMesh) return;
      var g = o.geometry.clone(); g.applyMatrix4(o.matrixWorld);
      var m = o.material; if (m.map) { m.alphaTest = Math.max(m.alphaTest || 0, 0.25); m.transparent = false; m.side = THREE.DoubleSide; }
      out.push({ geo: g, mat: m });
    });
    return out;
  }
  function scatter(i, parts, P) {
    var box = new THREE.Box3(); parts.forEach(function (p) { p.geo.computeBoundingBox(); box.union(p.geo.boundingBox); });
    var size = new THREE.Vector3(); box.getSize(size);
    var foot = Math.max(0.04, size.x * size.z), n = P.single ? 1 : Math.max(12, Math.min(1500, Math.round(SIZE * SIZE / foot * P.dens)));
    var o = patchOrigin(i), R = rnd(i * 7919 + 13), m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), t = new THREE.Vector3();
    var tris = 0;
    parts.forEach(function (p) {
      var im = new THREE.InstancedMesh(p.geo, p.mat, n);
      for (var k = 0; k < n; k++) {
        var sc = P.single ? P.single : 0.8 + R() * 0.45;
        q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), R() * Math.PI * 2); s.set(sc, sc, sc);
        t.set(P.single ? o.x : o.x + (R() - 0.5) * SIZE, 0, P.single ? o.z : o.z + (R() - 0.5) * SIZE);
        im.setMatrixAt(k, m.compose(t, q, s));
      }
      im.instanceMatrix.needsUpdate = true; scene.add(im);
      tris += (p.geo.index ? p.geo.index.count : p.geo.attributes.position.count) / 3 * n;
    });
    return { n: n, tris: Math.round(tris), h: size.y };
  }
  var legend = document.getElementById('legend'), loader = new THREE.GLTFLoader(), left = PATCHES.length;
  PATCHES.forEach(function (P, i) {
    label(i, String(i + 1));
    var li = document.createElement('li'); li.textContent = P.name + ' ';
    var meta = document.createElement('span'); meta.className = 'meta'; meta.textContent = '– ' + P.author + ' · loading…';
    li.appendChild(meta);
    if (P.url) { li.appendChild(document.createTextNode(' ')); var a = document.createElement('a'); a.href = P.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Sketchfab'; li.appendChild(a); }
    legend.appendChild(li);
    function done(parts) {
      var r = scatter(i, parts, P);
      meta.textContent = '– ' + P.author + ' · ' + (P.single ? '1 piece' : r.n + ' tufts') + ', ' + (r.tris / 1000).toFixed(1) + 'k triangles, ' + r.h.toFixed(2) + ' m high';
      if (--left === 0) statusEl.textContent = 'All models loaded.';
    }
    if (!P.file) { done(gameTuft()); return; }
    loader.load(BASE + P.file + '.glb', function (g) { done(partsOf(g)); }, null, function () {
      meta.textContent = '– ' + P.author + ' · could not load'; if (--left === 0) statusEl.textContent = 'Loaded with errors.';
    });
  });
  // Ansichten: Ziel etwas links der Mitte (rechts liegt Platz neben der Liste), Kamera schräg davor
  function view(y, back, ty) {
    var tx = cx - 11, tz = cz; controls.target.set(tx, ty, tz);
    cam.position.set(tx, y, tz + back); controls.update();
  }
  document.getElementById('vDriver').addEventListener('click', function () { view(1.8, 22, 0.4); });
  document.getElementById('vLow').addEventListener('click', function () { view(0.6, 12, 0.3); });
  document.getElementById('vTop').addEventListener('click', function () { view(26, 24, 0); });
  view(9, 26, 0);
  function resize() { var w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  window.addEventListener('resize', resize); resize();
  (function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, cam); })();
})();
</script>
</body>
</html>
