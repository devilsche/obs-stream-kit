<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PUBG Landing Spot Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/widgets-static/_theme.css">
  <link rel="stylesheet" href="/widgets-static/pubg/_pubg.css">
  <style>
    /* Browser-Tool, keine OBS-Source: fuellt das Fenster statt fix
       1920x1080 zu sein. Fest verdrahtet erzwang es auf kleineren Fenstern
       Scrollbalken und liess auf groesseren Platz liegen. */
    html, body { margin: 0; height: 100%;
                 background: var(--theme-bg); color: var(--theme-text);
                 font-family: var(--theme-font-body,"DM Sans",sans-serif); }
    body { overflow: hidden; }
    .app { display: grid; grid-template-rows: auto 1fr;
           height: 100vh; min-height: 0; }
    .header { display: flex; align-items: center; gap: 10px 16px;
              flex-wrap: wrap;
              padding: 10px 14px; border-bottom: 1px solid var(--theme-border); }
    .header label { font-size: 0.8em; color: var(--theme-text-dim); margin-right: 4px; }
    select, input[type="text"], input:not([type]) {
      font-family: inherit; background: var(--theme-surface); color: var(--theme-text);
      border: 1px solid var(--theme-primary); border-radius: var(--theme-radius);
      padding: 6px 10px; min-height: 24px; }
    .pwrap { position: relative; }
    .ac-list { position: absolute; top: 100%; left: 0; right: 0;
               background: var(--theme-surface); border: 1px solid var(--theme-primary); z-index: 20;
               max-height: 220px; overflow-y: auto; display: none; }
    .ac-list [role="option"] { padding: 6px 10px; cursor: pointer; min-height: 24px; }
    .ac-list [role="option"]:hover,
    .ac-list [role="option"][aria-selected="true"] { background: var(--theme-primary); color: var(--theme-on-primary); }
    /* Tabelle primaer, Karte als Detail rechts. Vorher war es umgekehrt
       und die Uebersicht steckte in 100 aufklappbaren Bloecken. */
    .body { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, 1fr);
            min-height: 0; }
    @media (max-width: 68rem) {
      .body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .spot-wrap { border-right: 0;
                   border-bottom: 1px solid var(--theme-border); }
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; }
    }
    /* Im Grid ohne min-height kollabiert das Canvas auf 0 — fitCanvas
       liest die Elternbox, und die waere dann leer. */
    .mapwrap { position: relative; min-height: 22rem; min-width: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .players-bar { position: absolute; bottom: 10px; left: 10px;
                   display: flex; gap: 8px; }
    .pchip { display: flex; align-items: center; gap: 6px; padding: 4px 10px;
             border-radius: 14px; background: color-mix(in srgb,var(--theme-surface) 80%,transparent); cursor: pointer;
             border: 1px solid transparent; min-height: 24px; }
    .pchip.active { border-color: var(--theme-accent); }
    .pchip .dot { width: 12px; height: 12px; border-radius: 50%; }
    .spot-wrap { overflow: auto; min-width: 0;
                 border-right: 1px solid var(--theme-border); }
    .spot-tools { display: flex; gap: 10px; align-items: center;
                  flex-wrap: wrap; padding: 8px 12px;
                  border-bottom: 1px solid var(--theme-border);
                  position: sticky; top: 0; z-index: 2;
                  background: var(--theme-bg); }
    table.spots { border-collapse: collapse; width: 100%;
                  font-variant-numeric: tabular-nums; font-size: 0.82em; }
    table.spots thead th { position: sticky; top: 41px; z-index: 1;
      background: var(--theme-bg); text-align: right; white-space: nowrap;
      padding: 6px 8px; font-size: 0.82em; font-weight: 500;
      letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--theme-text-dim); cursor: pointer; user-select: none;
      border-bottom: 1px solid var(--theme-border); }
    table.spots thead th:first-child { text-align: left; }
    table.spots thead th:hover, table.spots thead th.active {
      color: var(--theme-accent); }
    table.spots thead th:focus-visible { outline: 2px solid var(--theme-accent);
      outline-offset: -2px; }
    table.spots tbody td { text-align: right; white-space: nowrap;
      padding: 5px 8px; color: var(--theme-text); }
    table.spots tbody td:first-child { text-align: left; }
    table.spots tbody tr { cursor: pointer; }
    table.spots tbody tr + tr > td { border-top: 1px solid
      color-mix(in srgb, var(--theme-border) 60%, transparent); }
    table.spots tbody tr:hover > td { background: color-mix(in srgb,
      var(--theme-surface) 70%, transparent); }
    table.spots tbody tr.sel > td { background: color-mix(in srgb,
      var(--theme-accent) 18%, transparent); }
    table.spots tbody tr.nodata > td { color: var(--theme-text-dim); }
    .sort-arrow { font-size: 0.8em; margin-left: 2px; opacity: 0.75; }
    .goal { font-size: 0.9em; margin-left: 3px; opacity: 0.5; font-weight: 400; }
    td.bad  { color: var(--theme-danger, #e57b7b); font-weight: 500; }
    td.good { color: var(--theme-ok, #6cc294); font-weight: 500; }
    .parent-ref { background: none; border: 0; padding: 0; font: inherit;
                  font-size: 0.95em; color: var(--theme-accent);
                  cursor: pointer; text-decoration: underline;
                  text-underline-offset: 2px; }
    .spot-foot { padding: 10px 12px; font-size: 0.75em; line-height: 1.5;
                 color: var(--theme-text-dim);
                 border-top: 1px solid var(--theme-border); }
    .poi { margin-bottom: 12px; }
    .poi > summary { cursor: pointer; min-height: 24px; padding: 2px 0;
                     border-radius: var(--theme-radius); }
    .poi > summary:hover { background: color-mix(in srgb,var(--theme-surface) 60%,transparent); }
    .poi-head { display: flex; justify-content: space-between; font-weight: 700; }
    .bar { height: 6px; width: var(--w, 0%); background: var(--theme-primary);
           border-radius: var(--theme-radius); margin: 4px 0; }
    .poi-players { margin-top: 4px; }
    .poi-player { display: flex; justify-content: space-between;
                  font-size: 0.85em; color: var(--theme-text-dim); padding-left: 12px; }
    .route-label { font-size: 0.8em; color: var(--theme-text-dim); white-space: nowrap; }
    .rwrap { display: inline-flex; align-items: center; gap: 7px; }
    .rlabel { font-size: 0.8em; color: var(--theme-text-dim); }
    .switch { display: inline-flex; gap: 3px; }
    .switch button { background: var(--theme-surface, #201a28);
                     color: var(--theme-text-dim, #8a7d99); font: inherit;
                     font-size: 0.85em; border: 1px solid var(--theme-line, #372c47);
                     border-radius: 4px; padding: 4px 9px; cursor: pointer;
                     min-height: 26px; }
    .switch button[aria-pressed="true"] { color: var(--theme-accent, #f2b705);
                                          border-color: var(--theme-accent, #f2b705); }
    .switch button:hover { color: var(--theme-text); }

    /* Analyse-Zahlen je Landeplatz — aus /api/pubg/shot-quality, damit
       Karte und Bewertung an einem Ort stehen. */
    .poi-stats { display: grid; grid-template-columns: repeat(2, 1fr);
                 gap: 2px 10px; padding: 5px 0 2px;
                 border-top: 1px solid var(--theme-line, #372c47);
                 margin-top: 5px; font-size: 0.78em; }
    .poi-stats > div { display: flex; justify-content: space-between; gap: 6px; }
    .poi-stats .k { color: var(--theme-text-dim, #8a7d99); }
    .poi-stats .v { font-variant-numeric: tabular-nums; }
    .poi-stats .v.bad  { color: var(--theme-danger, #e57b7b); }
    .poi-stats .v.good { color: var(--theme-ok, #6cc294); }
    .poi-thin { font-size: 0.72em; color: var(--theme-text-faint, #6b5f7a);
                letter-spacing: 0.04em; text-transform: uppercase; }
    .poi-nostats { font-size: 0.75em; color: var(--theme-text-faint, #6b5f7a);
                   padding: 4px 0 2px; line-height: 1.5; }
    .poi-jump { background: none; border: 0; padding: 0 1px; cursor: pointer;
                font: inherit; color: var(--theme-accent, #f2b705);
                text-decoration: underline; text-underline-offset: 2px; }
    .poi-jump:hover { text-decoration-thickness: 2px; }
    .bot-mark { color: var(--theme-text-faint); font-size: 0.85em; font-weight: 400; }
    button:focus-visible, select:focus-visible,
    input:focus-visible, [tabindex]:focus-visible, summary:focus-visible {
      outline: 3px solid var(--theme-accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important;
                                transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <span>
        <label for="mapSelect">Map</label>
        <select id="mapSelect" aria-label="Select map"></select>
      </span>
      <span class="pwrap">
        <label for="p0">P1</label>
        <input id="p0" type="text" autocomplete="off"
               aria-label="Player 1" aria-autocomplete="list"
               aria-controls="ac0" aria-expanded="false">
        <div class="ac-list" id="ac0" role="listbox"
             aria-label="Suggestions for player 1"></div>
      </span>
      <span class="pwrap">
        <label for="p1">P2</label>
        <input id="p1" type="text" autocomplete="off"
               aria-label="Player 2" aria-autocomplete="list"
               aria-controls="ac1" aria-expanded="false">
        <div class="ac-list" id="ac1" role="listbox"
             aria-label="Suggestions for player 2"></div>
      </span>
      <span class="pwrap">
        <label for="p2">P3</label>
        <input id="p2" type="text" autocomplete="off"
               aria-label="Player 3" aria-autocomplete="list"
               aria-controls="ac2" aria-expanded="false">
        <div class="ac-list" id="ac2" role="listbox"
             aria-label="Suggestions for player 3"></div>
      </span>
      <span class="pwrap">
        <label for="p3">P4</label>
        <input id="p3" type="text" autocomplete="off"
               aria-label="Player 4" aria-autocomplete="list"
               aria-controls="ac3" aria-expanded="false">
        <div class="ac-list" id="ac3" role="listbox"
             aria-label="Suggestions for player 4"></div>
      </span>
      <span class="rwrap" id="modeWrap" hidden>
        <span class="rlabel">Players</span>
        <span class="switch" id="modeSwitch" role="group"
              aria-label="How the named players are combined">
          <button type="button" data-mode="squad" aria-pressed="true"
                  title="Only matches where ALL named players were in the same team">Same squad</button>
          <button type="button" data-mode="any" aria-pressed="false"
                  title="Every match with at least one of them — their landings added up, whether they played together or not">Any of them</button>
        </span>
      </span>
      <label class="route-label" id="routeWrap" hidden>
        <input type="checkbox" id="routeFilter">
        Flight path filter (≤1.5&thinsp;km)
      </label>
      <span class="rwrap">
        <span class="rlabel">Range</span>
        <span class="switch" id="rangeSwitch" role="group"
              aria-label="Time range">
          <button type="button" data-range="session" aria-pressed="true">Session</button>
          <button type="button" data-range="week" aria-pressed="false">7 days</button>
          <button type="button" data-range="all" aria-pressed="false">All</button>
        </span>
      </span>
      <span id="matchCount" aria-live="polite" aria-atomic="true"></span>
    </header>
    <div class="body">
      <section class="spot-wrap" aria-label="Landing spot table">
        <div class="spot-tools">
          <span class="switch" id="scopeSwitch" role="group"
                aria-label="Which spots to show">
            <button type="button" data-scope="mine" aria-pressed="true">My spots</button>
            <button type="button" data-scope="all" aria-pressed="false">All spots</button>
          </span>
          <span class="rlabel" id="spotCount" aria-live="polite"></span>
        </div>
        <table class="spots">
          <thead id="spotHead"><tr></tr></thead>
          <tbody id="spotRows"></tbody>
        </table>
        <p class="spot-foot" id="spotFoot"></p>
      </section>
      <div class="mapwrap">
        <canvas id="heat" role="img" aria-label="Landing heatmap"></canvas>
        <div class="players-bar" id="playersBar"
             aria-label="Toggle player scatter"></div>
      </div>
    </div>
  </main>
  <script src="/widgets-static/pubg/_pubg.js"></script>
  <script src="/tools-static/landing-spots.js"></script>
</body>
</html>
