<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Alerts (live)</title>
  <!-- Alerts im Wartemodus: EINE Quelle für alle Alerts, in OBS dauerhaft sichtbar (1920×1080, durchsichtig).
       Streamer.bot schickt nur das Ereignis:  /s/<token>/api/fx/alert?cmd=follow&username=%user%
       (cmd: follow, sub, resub, giftsub, bits, raid, donation, welcome; dazu username, name, message, tier, amount,
       months, total, viewers wie bei den einzelnen Alert-Seiten).
       Die Seite holt die Ereignisse ab, spielt sie nacheinander (Warteschlange), zeigt den jeweiligen Alert
       (alerts/<typ>.html) in einem Rahmen und hält ihn offen, bis sein Ton zu Ende ist. Dauer, Ton-Modus und Töne
       je Alert kommen aus dem Dashboard (window.__ALERT_CFG__, overlay_app/alert_sounds.py).
       URL: demo=1 spielt alle 8 s einen Beispiel-Alert. -->
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    .slot { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
    .slot.gone { visibility: hidden; }
  </style>
</head>
<body>
  <script>
    (function () {
      'use strict';
      var CFG = window.__ALERT_CFG__ || {}, p = new URLSearchParams(location.search);
      var QMAX = 25, GAP = 600, queue = [], busy = false;
      var PASS = ['username', 'name', 'message', 'tier', 'amount', 'months', 'total', 'viewers'];

      // Ton auswählen (zufällig, nicht zweimal hintereinander derselbe) – der Host kennt die Länge
      function pickSound(type, c) {
        if (!c) return { id: 'none', dur: 0 };
        if (!c.files || !c.files.length) return c['default'] ? { id: 'default', dur: c['default'].dur || 0 } : { id: 'none', dur: 0 };
        var key = 'alert-live-last:' + type, last = null;
        try { last = localStorage.getItem(key); } catch (e) { /* ohne Speicher eben zufällig */ }
        var pool = c.files.length > 1 ? c.files.filter(function (f) { return f.id !== last; }) : c.files;
        var f = pool[Math.floor(Math.random() * pool.length)];
        try { localStorage.setItem(key, f.id); } catch (e) { /* egal */ }
        return { id: f.id, dur: f.dur || 0 };
      }

      function show(ev) {
        busy = true;
        var c = CFG[ev.cmd] || {}, snd = pickSound(ev.cmd, c);
        var dur = c.duration || 6, audible = snd.id !== 'none' && (c.volume == null || c.volume > 0);
        // Anzeige: Dauer aus dem Dashboard, bei „stay“ mindestens so lang wie der Ton
        var display = (c.stay && audible) ? Math.max(dur, Math.ceil(snd.dur)) : dur;
        // offen halten: bis der Alert ausgeblendet ist bzw. bis der Ton zu Ende ist (bei „full“)
        var keep = Math.max(display + 0.8, (c.full && audible) ? snd.dur + 0.3 : 0);
        var q = new URLSearchParams();
        PASS.forEach(function (k) { if (ev.params && ev.params[k] != null) q.set(k, ev.params[k]); });
        q.set('duration', String(display)); q.set('soundfile', snd.id); if (c.full) q.set('full', '1');
        // schaltbare Teile (z. B. Welcome: Disco-Kugel, Lichter, Konfetti) aus dem Dashboard
        Object.keys(c.extras || {}).forEach(function (k) { q.set(k, c.extras[k] ? '1' : '0'); });
        q.set('v', String(Date.now()));
        var fr = document.createElement('iframe');
        fr.className = 'slot'; fr.setAttribute('title', ev.cmd + ' alert'); fr.setAttribute('aria-hidden', 'true');
        fr.src = ev.cmd + '.html?' + q.toString();
        document.body.appendChild(fr);
        setTimeout(function () { fr.classList.add('gone'); }, (display + 0.8) * 1000);
        setTimeout(function () {
          if (fr.parentNode) fr.parentNode.removeChild(fr);
          busy = false; setTimeout(next, GAP);
        }, keep * 1000);
      }
      function next() { if (!busy && queue.length) show(queue.shift()); }
      function enqueue(ev) {
        if (queue.length >= QMAX) queue.shift();   // Flut: ältestes verwerfen statt ewig nachzulaufen
        queue.push(ev); next();
      }

      if (p.get('demo') === '1') {
        var demo = [['follow', { username: 'Hat3' }], ['sub', { username: 'LuCKoR_HD', tier: '1000' }],
                    ['raid', { username: 'Moonwave_xD', viewers: 42 }], ['bits', { username: 'Hat3', amount: '500' }]], di = 0;
        (function d() { enqueue({ cmd: demo[di % demo.length][0], params: demo[di % demo.length][1] }); di++; setTimeout(d, 8000); })();
      }

      // Ereignisse von Streamer.bot / Dashboard: nur über die Token-URL
      var m = location.pathname.match(/^\/s\/([A-Za-z0-9_]+)\//);
      if (!m) return;
      var url = '/s/' + m[1] + '/api/fx/alert/poll', seq = null, epoch = null;
      // Dashboard-Änderungen (Dauer, Ton-Modus, neue Töne) ohne Neuladen übernehmen
      (function refresh() {
        fetch('/s/' + m[1] + '/alert-config.json', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) { if (d && d.alerts) CFG = d.alerts; })
          .catch(function () { /* alte Einstellungen behalten */ })
          .then(function () { setTimeout(refresh, 20000); });
      })();
      (function poll() {
        var delay = 500;
        fetch(url + (seq === null ? '' : '?since=' + seq), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
          .then(function (d) {
            if (epoch !== null && d.epoch !== epoch) { epoch = d.epoch; seq = 0; delay = 0; return; }   // Server neu gestartet
            epoch = d.epoch;
            if (seq !== null) (d.commands || []).forEach(function (c) { enqueue({ cmd: c.cmd, params: c.params || {} }); });
            seq = d.seq;
          })
          .catch(function () { delay = 3000; })
          .then(function () { setTimeout(poll, delay); });
      })();
    })();
  </script>
</body>
</html>
