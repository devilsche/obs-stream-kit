<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="../js/stinger-ready.js"></script>
  <script src="../js/stinger-kit.js"></script>
  <title>Sad Stinger</title>
  <!--
    !sad — Regenwolke + Sad Trombone (synthetisch, keine MP3).
    URL-Parameter:
      ?left=30    linke Kante der Wolke in px (0–1480), Standard 30
      ?sound=0    stumm
      ?volume=0.8 Lautstärke 0–1
      ?tune=1     Timing-Panel
  -->
  <style>
    @font-face {
      font-family: 'DM Sans';
      src: url('../assets/DM-Sans.woff2') format('woff2');
      font-weight: 100 900;
      font-display: block;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --x: 250px;
      --tx: 300px;
      --cloud-in: 0s; --rain-in: 0.55s;
      --n1: 0.75s; --n2: 1.25s; --n3: 1.75s; --n4: 2.25s;
      --title-in: 2.3s; --rain-out: 3.7s; --cloud-out: 3.9s; --stage-out: 4.1s;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
    }

    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

    @keyframes cloudIn {
      0%   { transform: translate(-50%, -420px); }
      70%  { transform: translate(-50%, 10px); }
      100% { transform: translate(-50%, 0); }
    }
    @keyframes cloudOut {
      from { transform: translate(-50%, 0); opacity: 1; }
      to   { transform: translate(-50%, -160px); opacity: 0; }
    }
    /* Pro Posaunenton sackt die Wolke ein Stück ab */
    @keyframes sag {
      0%   { transform: translateY(0) scale(1, 1); }
      45%  { transform: translateY(16px) scale(1.04, 0.94); }
      100% { transform: translateY(12px) scale(1, 1); }
    }
    @keyframes frown {
      from { transform: translateX(-50%) scaleY(0.4); }
      to   { transform: translateX(-50%) scaleY(1); }
    }
    @keyframes titleIn {
      from { opacity: 0; letter-spacing: 48px; transform: translate(-50%, -24px); }
      to   { opacity: 1; letter-spacing: 4px;  transform: translate(-50%, 0); }
    }

    .stage {
      position: absolute; inset: 0;
      animation: fadeOut 0.5s ease-in var(--stage-out) forwards;
    }

    /* Blaugrauer Schleier von den Rändern — die Mitte bleibt frei fürs Spiel */
    .veil {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 45%,
        rgba(20, 30, 50, 0) 35%,
        rgba(20, 30, 50, 0.45) 75%,
        rgba(12, 18, 32, 0.75) 100%);
      opacity: 0;
      animation: fadeIn 0.6s ease-out var(--cloud-in) forwards;
    }

    .rain {
      position: absolute; inset: 0;
      width: 1920px; height: 1080px;
      -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 88%, transparent 100%);
              mask-image: linear-gradient(to bottom, #000 0, #000 88%, transparent 100%);
    }

    .cloud {
      position: absolute;
      top: 150px;
      left: var(--x);
      width: 440px;
      height: 150px;
      transform: translate(-50%, -420px);
      filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.45));
      animation:
        cloudIn 0.6s cubic-bezier(0.25, 1, 0.4, 1) var(--cloud-in) forwards,
        cloudOut 0.5s ease-in var(--cloud-out) forwards;
    }
    .sag { position: absolute; inset: 0; transform-origin: 50% 0; }
    .sag--1 { animation: sag 0.35s ease-out var(--n1) forwards; }
    .sag--2 { animation: sag 0.35s ease-out var(--n2) forwards; }
    .sag--3 { animation: sag 0.35s ease-out var(--n3) forwards; }
    .sag--4 { animation: sag 0.5s  ease-out var(--n4) forwards; }

    .cloud__body {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 130px;
      border-radius: 65px;
      background: linear-gradient(to bottom, #8f99a8 0%, #8f99a8 40%, #687283 100%);
    }
    .cloud__body::before,
    .cloud__body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: #8f99a8;
    }
    .cloud__body::before { width: 200px; height: 200px; left: 60px;  top: -95px; }
    .cloud__body::after  { width: 250px; height: 250px; left: 160px; top: -140px; }

    /* Kleines trauriges Gesicht */
    .cloud__eye {
      position: absolute;
      top: 34px;
      width: 16px; height: 22px;
      border-radius: 50%;
      background: #2b3240;
      z-index: 1;
    }
    .cloud__eye--l { left: 168px; }
    .cloud__eye--r { right: 168px; }
    .cloud__eye::before {
      content: '';
      position: absolute;
      top: -14px;
      width: 26px; height: 5px;
      border-radius: 3px;
      background: #2b3240;
    }
    .cloud__eye--l::before { left: -8px;  transform: rotate(-18deg); }
    .cloud__eye--r::before { right: -8px; transform: rotate(18deg); }
    .cloud__mouth {
      position: absolute;
      top: 76px; left: 50%;
      width: 54px; height: 22px;
      border: 5px solid #2b3240;
      border-bottom: 0;
      border-radius: 30px 30px 0 0;
      transform: translateX(-50%) scaleY(0.4);
      z-index: 1;
      animation: frown 0.4s ease-out var(--n1) forwards;
    }

    .title {
      position: absolute;
      top: 700px;
      left: var(--tx);
      transform: translate(-50%, -24px);
      font-size: 210px;
      font-weight: 200;
      line-height: 1;
      letter-spacing: 48px;
      color: #cfdbea;
      white-space: nowrap;
      opacity: 0;
      text-shadow:
        0 4px 24px rgba(10, 20, 40, 0.8),
        0 0 60px rgba(120, 160, 210, 0.35);
      animation: titleIn 1.1s cubic-bezier(0.2, 0.8, 0.3, 1) var(--title-in) forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud {
        transform: translate(-50%, 0);
        opacity: 0;
        animation:
          fadeIn 0.5s ease-out var(--cloud-in) forwards,
          fadeOut 0.5s ease-in var(--cloud-out) forwards;
      }
      .sag { animation: none; }
      .title {
        letter-spacing: 4px;
        transform: translate(-50%, 0);
        animation: fadeIn 0.8s ease-out var(--title-in) forwards;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="veil"></div>
    <canvas class="rain" id="rain" width="1920" height="1080" aria-hidden="true"></canvas>
    <div class="cloud" aria-hidden="true">
      <div class="sag sag--1"><div class="sag sag--2"><div class="sag sag--3"><div class="sag sag--4">
        <div class="cloud__body">
          <span class="cloud__eye cloud__eye--l"></span>
          <span class="cloud__eye cloud__eye--r"></span>
          <span class="cloud__mouth"></span>
        </div>
      </div></div></div></div>
    </div>
    <div class="title">sad.</div>
  </div>

  <script>
    (function () {
      'use strict';
      var K = window.StingerKit;
      var DEFAULTS = {
        'cloud-in': 0, 'rain-in': 0.55,
        'n1': 0.75, 'n2': 1.25, 'n3': 1.75, 'n4': 2.25,
        'title-in': 2.3, 'rain-out': 3.7, 'cloud-out': 3.9, 'stage-out': 4.1
      };
      var LABELS = {
        'cloud-in': 'Cloud in', 'rain-in': 'Rain starts',
        'n1': 'Trombone 1', 'n2': 'Trombone 2', 'n3': 'Trombone 3', 'n4': 'Trombone 4 (long)',
        'title-in': 'Title in', 'rain-out': 'Rain stops', 'cloud-out': 'Cloud out', 'stage-out': 'Fade out'
      };
      var T = K.timings('sad', DEFAULTS);
      K.tune('sad', DEFAULTS, LABELS);

      // Wolke 440 px breit; Titel mittig darunter, aber nie angeschnitten
      var left = parseFloat(K.params.get('left'));
      left = isFinite(left) ? Math.max(0, Math.min(1480, left)) : 30;
      var cx = left + 220;
      K.vars({ x: cx + 'px', tx: Math.max(300, Math.min(1620, cx)) + 'px' });

      // ── Regen aus der Wolke ──
      var canvas = document.getElementById('rain');
      var g = canvas.getContext('2d');
      var W = 1920, H = 1080;
      var CX = cx;
      var HALF = 190;           // halbe Breite der Regensäule
      var GROUND = 1000;
      var drops = [], splashes = [];
      var t0 = null, last = null, spawnAcc = 0;

      function cloudBottom(t) {
        // grob wie die CSS-Animation: einfliegen, pro Ton ~12 px tiefer
        var y = 290;
        if (t < T['cloud-in'] + 0.6) y -= 420 * (1 - Math.min(1, (t - T['cloud-in']) / 0.6));
        ['n1', 'n2', 'n3', 'n4'].forEach(function (k) { if (t > T[k]) y += 12; });
        return y;
      }

      function rate(t) {
        if (t < T['rain-in'] || t > T['rain-out']) return 0;
        var ramp = Math.min(1, (t - T['rain-in']) / 0.4);
        // mit jedem Ton etwas mehr Regen
        var boost = 1;
        ['n2', 'n3', 'n4'].forEach(function (k) { if (t > T[k]) boost += 0.35; });
        return 110 * ramp * boost;
      }

      function frame(now) {
        if (t0 === null) { t0 = now; last = now; }
        var t = (now - t0) / 1000;
        var dt = Math.min(0.05, (now - last) / 1000);
        last = now;

        spawnAcc += rate(t) * dt;
        var top = cloudBottom(t) - 30;
        while (spawnAcc >= 1) {
          spawnAcc -= 1;
          var off = (Math.random() * 2 - 1) * HALF;
          drops.push({
            x: CX + off, y: top + Math.random() * 20,
            vy: 1300 + Math.random() * 600,
            len: 22 + Math.random() * 22,
            a: 0.55 * (1 - Math.pow(Math.abs(off) / HALF, 2)) + 0.1
          });
        }

        g.clearRect(0, 0, W, H);
        g.lineCap = 'round';
        g.lineWidth = 2;
        for (var i = drops.length - 1; i >= 0; i--) {
          var d = drops[i];
          d.y += d.vy * dt;
          if (d.y > GROUND) {
            for (var s = 0; s < 2; s++) {
              splashes.push({ x: d.x, y: GROUND, vx: (Math.random() * 2 - 1) * 120,
                              vy: -120 - Math.random() * 140, life: 0.35, a: d.a });
            }
            drops.splice(i, 1);
            continue;
          }
          g.strokeStyle = 'rgba(178, 202, 232,' + d.a.toFixed(3) + ')';
          g.beginPath();
          g.moveTo(d.x, d.y - d.len);
          g.lineTo(d.x, d.y);
          g.stroke();
        }
        g.lineWidth = 1.5;
        for (var j = splashes.length - 1; j >= 0; j--) {
          var p = splashes[j];
          p.life -= dt;
          if (p.life <= 0) { splashes.splice(j, 1); continue; }
          p.vy += 900 * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          g.strokeStyle = 'rgba(178, 202, 232,' + (p.a * p.life / 0.35).toFixed(3) + ')';
          g.beginPath();
          g.moveTo(p.x, p.y);
          g.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02);
          g.stroke();
        }

        if (t < T['stage-out'] + 0.6) requestAnimationFrame(frame);
      }

      // ── Sound: Regenrauschen + Sad Trombone ──
      function playSound() {
        var A = K.audio();
        if (!A) return;
        var ctx = A.ctx, base = ctx.currentTime + 0.02;

        // Regen
        var noise = ctx.createBufferSource();
        noise.buffer = K.noiseBuffer(ctx, 2);
        noise.loop = true;
        var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
        var lp = ctx.createBiquadFilter(); lp.type = 'lowpass';  lp.frequency.value = 7000;
        var rg = ctx.createGain(); rg.gain.value = 0;
        noise.connect(hp); hp.connect(lp); lp.connect(rg); rg.connect(A.out);
        var rIn = base + T['rain-in'], rOut = base + T['rain-out'];
        rg.gain.setValueAtTime(0, rIn);
        rg.gain.linearRampToValueAtTime(0.07, rIn + 0.4);
        rg.gain.setValueAtTime(0.07, rOut);
        rg.gain.linearRampToValueAtTime(0, rOut + 0.5);
        noise.start(rIn);
        noise.stop(rOut + 0.6);

        // Posaune mit Dämpfer: Sägezahn durch einen Tiefpass, der pro Ton
        // aufgeht und wieder zugeht ("wah")
        function note(t, freq, dur, last) {
          var vca = ctx.createGain();
          vca.gain.setValueAtTime(0, t);
          vca.gain.linearRampToValueAtTime(0.32, t + 0.05);
          vca.gain.setValueAtTime(0.28, t + dur - 0.12);
          vca.gain.linearRampToValueAtTime(0, t + dur);

          var f = ctx.createBiquadFilter();
          f.type = 'lowpass';
          f.Q.value = 7;
          f.frequency.setValueAtTime(260, t);
          f.frequency.exponentialRampToValueAtTime(1500, t + 0.09);
          f.frequency.exponentialRampToValueAtTime(last ? 900 : 520, t + Math.min(dur, 0.45));
          if (last) {
            f.frequency.setValueAtTime(900, t + dur - 0.35);
            f.frequency.exponentialRampToValueAtTime(260, t + dur);
          }
          f.connect(vca);
          vca.connect(A.out);

          var lfo, lfoGain;
          if (last) {
            // Vibrato auf dem letzten, langen Ton
            lfo = ctx.createOscillator();
            lfo.frequency.value = 5.5;
            lfoGain = ctx.createGain();
            lfoGain.gain.setValueAtTime(0, t);
            lfoGain.gain.linearRampToValueAtTime(45, t + 0.35);
            lfo.connect(lfoGain);
            lfo.start(t);
            lfo.stop(t + dur + 0.05);
          }

          [[1, 0.5, 'sawtooth'], [1.004, 0.4, 'sawtooth'], [0.5, 0.25, 'square']].forEach(function (v) {
            var o = ctx.createOscillator();
            o.type = v[2];
            var fr = freq * v[0];
            o.frequency.setValueAtTime(fr * 1.03, t);
            o.frequency.exponentialRampToValueAtTime(fr, t + 0.07);
            if (last) {
              o.frequency.setValueAtTime(fr, t + dur - 0.4);
              o.frequency.exponentialRampToValueAtTime(fr * 0.93, t + dur);
              lfoGain.connect(o.detune);
            }
            var gv = ctx.createGain();
            gv.gain.value = v[1];
            o.connect(gv); gv.connect(f);
            o.start(t);
            o.stop(t + dur + 0.05);
          });
        }

        var notes = [['n1', 233.08], ['n2', 220.0], ['n3', 207.65], ['n4', 196.0]];
        notes.forEach(function (n, i) {
          var t = base + T[n[0]];
          var lastNote = i === notes.length - 1;
          var dur = lastNote ? Math.max(0.6, T['cloud-out'] - T[n[0]])
                             : Math.max(0.15, T[notes[i + 1][0]] - T[n[0]] - 0.06);
          note(t, n[1], dur, lastNote);
        });
      }

      K.onStart(function () {
        playSound();
        if (!K.reducedMotion) requestAnimationFrame(frame);
      });
    })();
  </script>
</body>
</html>
