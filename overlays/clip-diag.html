    var out = document.getElementById('out');
    var results = {};

    function row(label, value, good) {
      var dt = document.createElement('dt'); dt.textContent = label;
      var dd = document.createElement('dd'); dd.textContent = value;
      if (good === true) dd.className = 'ok';
      if (good === false) dd.className = 'bad';
      out.appendChild(dt); out.appendChild(dd);
    }

    var probe = document.createElement('video');
    results.h264 = probe.canPlayType('video/mp4; codecs="avc1.42E01E"') || 'nein';
    results.mp4  = probe.canPlayType('video/mp4') || 'nein';
    results.aac  = probe.canPlayType('audio/mp4; codecs="mp4a.40.2"') || 'nein';
    row('H.264 abspielbar?', results.h264, results.h264 !== 'nein');
    row('video/mp4', results.mp4, results.mp4 !== 'nein');
    row('AAC-Audio', results.aac, results.aac !== 'nein');
    row('Engine', navigator.userAgent.replace(/^.*?(Chrome\/[\d.]+).*?(OBS\/[\d.]+)?.*$/, '$1 $2') || '?');

    var CODES = { 1: 'ABORTED', 2: 'NETWORK', 3: 'DECODE', 4: 'FORMAT_NICHT_UNTERSTUETZT' };

    function testVideo(el, src, label, key, done) {
      var settled = false;
      function finish(state) {
        if (settled) return;
        settled = true;
        results[key] = state;
        row(label, state, state.indexOf('spielt') === 0);
        done();
      }
      el.addEventListener('playing', function () { finish('spielt'); });
      el.addEventListener('error', function () {
        var e = el.error;
        finish('FEHLER ' + (e ? (CODES[e.code] || e.code) : '?')
               + (e && e.message ? ' (' + e.message.slice(0, 60) + ')' : ''));
      });
      setTimeout(function () { finish('TIMEOUT nach 15s'); }, 15000);
      el.src = src;
      var p = el.play();
      if (p && p.catch) p.catch(function (err) { finish('play() abgelehnt: ' + err.name); });
    }

    function report() {
      // Ergebnis als Query an einen Pfad haengen: landet im Server-Log,
      // niemand muss etwas abtippen.
      var base = (window.__SERVE_BASE__ || '/').replace(/\/+$/, '/');
      var q = Object.keys(results).map(function (k) {
        return k + '=' + encodeURIComponent(String(results[k]).slice(0, 60));
      }).join('&');
      new Image().src = base + 'api/clipdiag?' + q;
      row('An Server gemeldet', 'ja');
    }

    // Erst das eingebettete Referenz-Video (sagt: kann OBS ueberhaupt H.264?),
    // dann ein echter Clip vom Endpoint (sagt: liegt es an der Twitch-URL?).
    testVideo(document.getElementById('v1'), REF, 'Referenz-MP4 (eingebettet)', 'ref', function () {
      var base = (window.__SERVE_BASE__ || '/').replace(/\/+$/, '/');
      fetch(base + 'api/twitch/clips?count=1', { credentials: 'omit' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var c = (d.clips || [])[0];
          if (!c || !c.mp4) { results.clip = 'keine mp4-URL vom Server'; row('Clip-URL', results.clip, false); report(); return; }
          row('Clip-URL erhalten', c.mp4.slice(0, 40) + '...');
          testVideo(document.getElementById('v2'), c.mp4, 'Twitch-Clip stumm', 'clip', function () {
            // Der eigentliche Verdacht: die Szenen starten mit Ton. Blockiert
            // OBS das, meldet play() entweder NotAllowedError — oder gar nichts
            // und das Video bleibt einfach stehen.
            var v3 = document.getElementById('v3');
            v3.muted = false;
            v3.volume = 1;
            testVideo(v3, c.mp4, 'Twitch-Clip MIT TON', 'unmuted', report);
          });
        })
        .catch(function (e) { results.clip = 'API-Fehler: ' + e.message; row('Clip-URL', results.clip, false); report(); });
    });
  })();
