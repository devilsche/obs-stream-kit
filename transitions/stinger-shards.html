<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Stinger Shards</title>
  <!-- WebGL-Stinger „Shards“: ~290 dicke Glassplitter (Prismen mit Glaskanten) fliegen aus der Tiefe heran und setzen sich (von der Mitte aus) zu einer
       Wand in Theme-Farben mit dem Namen zusammen, ein Lichtstreif läuft drüber, kurz vor dem Schnitt reißen die Fugen
       auf, danach zerspringt die Wand, die Splitter taumeln teils zur Kamera, teils in die Tiefe und gibt die neue Szene frei. three.js r128, ein Mesh, Bewegung im
       Vertex-Shader. URL: dur (ms, Standard 2000), cut (ms, Standard 900) = OBS „Duration“ / „Transition Point“,
       name, font, show (name|logo|none). Bis cut − 0,1 s liegen alle Splitter. -->
  <link rel="stylesheet" href="../widgets/_theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Russo+One&family=Black+Ops+One&family=Audiowide&family=Teko:wght@700&family=Saira+Stencil+One&family=Wallpoet&family=Bungee&family=Chakra+Petch:wght@700&family=Oxanium:wght@800&family=Rajdhani:wght@700&family=Syncopate:wght@700&family=Metamorphous&family=MedievalSharp&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
    #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
    #fallback { position: absolute; inset: 0; opacity: 0; background: var(--theme-bg, #08040f); }
    .stinger-no-gl #fallback { animation: st-cover 2s linear forwards; }
    @keyframes st-cover { 0% { opacity: 0; } 35%, 55% { opacity: 1; } 100% { opacity: 0; } }
  </style>
</head>
<body>
  <canvas id="gl" width="1920" height="1080" aria-hidden="true"></canvas>
  <div id="fallback" aria-hidden="true"></div>
  <script src="../js/stinger-gl.js"></script>
  <script src="../js/vendor/three-r128.min.js"></script>
  <script>
    (function () {
      'use strict';
      var S = window.StingerGL, T = S.timing(1100, 900), C = S.colors();
      var W = 1920, H = 1080, NX = 16, NY = 9;
      var renderer;
      try {
        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), alpha: true, antialias: true });
      } catch (e) { S.fallback(); return; }
      renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
      var scene = new THREE.Scene();
      // Wand bei z = 0 füllt das Bild genau: Abstand = (H/2) / tan(fov/2)
      var cam = new THREE.PerspectiveCamera(30, W / H, 10, 12000);
      cam.position.z = (H / 2) / Math.tan(15 * Math.PI / 180);

      // Gitter mit verschobenen Innenpunkten, jede Zelle in zwei Dreiecke (Diagonale zufällig) → Splitter ohne Fugen
      var rnd = (function (s) { return function () { s = (s * 16807) % 2147483647; return s / 2147483647; }; })(4242);
      var pts = [];
      for (var j = 0; j <= NY; j++) for (var i = 0; i <= NX; i++) {
        var x = i / NX * W - W / 2, y = H / 2 - j / NY * H;
        if (i > 0 && i < NX) x += (rnd() - 0.5) * 0.7 * W / NX;
        if (j > 0 && j < NY) y += (rnd() - 0.5) * 0.7 * H / NY;
        pts.push([x, y]);
      }
      /* Jeder Splitter ist ein dickes Glasprisma: Vorderseite (z = 0, trägt Bild und Name), Rückseite und drei
         Seitenflächen nach hinten. Liegt er, sieht man nur die Vorderseiten, im Flug blitzen die Glaskanten. */
      var TH = 28;
      var pos = [], cen = [], rr = [], bary = [], nrm = [], side = [];
      function vtx(x, y, z, cx, cy, r4, b, nx, ny, nz, sd) {
        pos.push(x, y, z); cen.push(cx, cy, -TH / 2); rr.push.apply(rr, r4); bary.push(b[0], b[1], b[2]);
        nrm.push(nx, ny, nz); side.push(sd);
      }
      function tri(a, b, c) {
        var cx = (a[0] + b[0] + c[0]) / 3, cy = (a[1] + b[1] + c[1]) / 3, r4 = [rnd(), rnd(), rnd(), rnd()];
        var B = [[1, 0, 0], [0, 1, 0], [0, 0, 1]], N1 = [1, 1, 1];
        [a, b, c].forEach(function (p, k) { vtx(p[0], p[1], 0, cx, cy, r4, B[k], 0, 0, 1, 0); });
        [c, b, a].forEach(function (p, k) { vtx(p[0], p[1], -TH, cx, cy, r4, B[k], 0, 0, -1, 1); });
        [[a, b], [b, c], [c, a]].forEach(function (e) {
          var p = e[0], q = e[1], ex = q[0] - p[0], ey = q[1] - p[1], l = Math.hypot(ex, ey) || 1;
          var nx = ey / l, ny = -ex / l;
          if (nx * (p[0] - cx) + ny * (p[1] - cy) < 0) { nx = -nx; ny = -ny; }   // nach außen
          [[p, 0], [q, 0], [q, -TH], [p, 0], [q, -TH], [p, -TH]].forEach(function (v) {
            vtx(v[0][0], v[0][1], v[1], cx, cy, r4, N1, nx, ny, 0, 2);
          });
        });
      }
      for (j = 0; j < NY; j++) for (i = 0; i < NX; i++) {
        var p00 = pts[j * (NX + 1) + i], p10 = pts[j * (NX + 1) + i + 1], p01 = pts[(j + 1) * (NX + 1) + i], p11 = pts[(j + 1) * (NX + 1) + i + 1];
        if (rnd() < 0.5) { tri(p00, p01, p10); tri(p10, p01, p11); } else { tri(p00, p01, p11); tri(p00, p11, p10); }
      }
      var geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('aCen', new THREE.Float32BufferAttribute(cen, 3));
      geo.setAttribute('aRnd', new THREE.Float32BufferAttribute(rr, 4));
      geo.setAttribute('aBary', new THREE.Float32BufferAttribute(bary, 3));
      geo.setAttribute('aNorm', new THREE.Float32BufferAttribute(nrm, 3));
      geo.setAttribute('aSide', new THREE.Float32BufferAttribute(side, 1));

      function v3(c) { return new THREE.Vector3(c[0], c[1], c[2]); }
      var tex = new THREE.Texture(); tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false; tex.flipY = false;
      var U = {
        uT: { value: 0 }, uCut: { value: T.cut }, uOpen: { value: T.open }, uDur: { value: T.dur }, uCalm: { value: S.reduced() ? 1 : 0 },
        uP: { value: v3(C.primary) }, uA: { value: v3(C.accent) }, uA2: { value: v3(C.accent2) }, uBg: { value: v3(C.bg) },
        uTex: { value: tex }, uHasText: { value: 0 }
      };
      var mat = new THREE.ShaderMaterial({
        uniforms: U, transparent: true, depthWrite: true, side: THREE.DoubleSide,
        extensions: { derivatives: true },
        vertexShader: [
          'attribute vec3 aCen, aNorm; attribute vec4 aRnd; attribute vec3 aBary; attribute float aSide;',
          'uniform float uT, uCut, uOpen, uDur, uCalm;',
          'varying vec2 vUv; varying vec3 vN, vBary; varying float vA, vCrack, vMove, vSide;',
          'mat3 rot(vec3 ax, float an){ ax = normalize(ax); float s = sin(an), c = cos(an), o = 1.0 - c;',
          '  return mat3(o*ax.x*ax.x + c, o*ax.x*ax.y + ax.z*s, o*ax.z*ax.x - ax.y*s,',
          '              o*ax.x*ax.y - ax.z*s, o*ax.y*ax.y + c, o*ax.y*ax.z + ax.x*s,',
          '              o*ax.z*ax.x + ax.y*s, o*ax.y*ax.z - ax.x*s, o*ax.z*ax.z + c); }',
          'void main(){',
          '  vUv = position.xy / vec2(1920.0, 1080.0) + 0.5; vBary = aBary;',
          '  float d = clamp(length(aCen.xy / vec2(960.0, 540.0)) / 1.414, 0.0, 1.0);',
          '  vec2 dir = normalize(aCen.xy + vec2(0.01, 0.013));',
          // rein: von der Mitte nach außen gestaffelt, alle liegen bei cut - 0.1
          '  float win = uCut - 0.1;',
          '  float pIn = clamp((uT - (d*0.5 + aRnd.x*0.15)*win) / (0.35*win), 0.0, 1.0);',
          '  float eIn = 1.0 - pow(1.0 - pIn, 3.0);',
          // raus: Einschlag in der Mitte, Splitter fliegen nach außen, zur Kamera und fallen
          '  float pOut = clamp((uT - uOpen - d*0.22 - aRnd.y*0.06) / max(0.3, uDur - uOpen - 0.32), 0.0, 1.0);',
          '  float spin = 1.0 - uCalm;',
          // im Flug kräftig um alle Achsen taumeln
          '  float ang = ((1.0 - eIn)*(3.0 + aRnd.y*4.0) + pOut*(6.0 + aRnd.z*9.0)) * spin;',
          '  mat3 R = rot(vec3(aRnd.z - 0.5, aRnd.w - 0.5, aRnd.x - 0.5) + vec3(0.0, 0.0, 0.05), ang);',
          '  vec3 off = vec3(dir*(500.0 + aRnd.w*900.0), -2600.0 - aRnd.x*2200.0) * (1.0 - eIn);',
          // raus: Einschlag in der Mitte; Splitter fliegen nach außen, je nach Zufall zur Kamera oder in die Tiefe, und fallen
          '  float eo = 1.0 - (1.0 - pOut)*(1.0 - pOut);',
          '  off += vec3(dir*(380.0 + aRnd.z*900.0)*eo, mix(-1800.0, 1450.0, aRnd.w)*eo);',
          '  off.y -= 900.0*pOut*pOut;',
          '  vN = R * aNorm; vSide = aSide;',
          '  vA = smoothstep(0.0, 0.18, pIn) * (1.0 - smoothstep(0.45, 1.0, pOut));',
          '  vCrack = smoothstep(uOpen - 0.2 + d*0.12, uOpen + d*0.12, uT) * (1.0 - pOut);',
          '  vMove = clamp((1.0 - eIn)*1.6 + pOut*2.0, 0.0, 1.0);',
          '  vec3 l = position - aCen;',
          // liegt der Splitter, bleibt die Ecke exakt auf dem Gitterpunkt (keine Haarlinien zwischen Nachbarn)
          '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position + (R*l - l) + off, 1.0);',
          '}'
        ].join('\n'),
        fragmentShader: S.GLSL + '\n' + [
          'uniform float uT, uCut, uOpen, uHasText; uniform vec3 uP, uA, uA2, uBg; uniform sampler2D uTex;',
          'varying vec2 vUv; varying vec3 vN, vBary; varying float vA, vCrack, vMove, vSide;',
          'float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
          'float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);',
          '  return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }',
          'void main(){',
          '  if (vA <= 0.001) discard;',
          '  vec3 L0 = normalize(vec3(-0.45, 0.55, 0.75));',
          // Rückseite und Glaskanten: dunkles getöntes Glas mit hellem Glanz
          '  if (vSide > 0.5) { vec3 Ns = normalize(vN);',
          '    vec3 g = mix(uBg, uA2, vSide > 1.5 ? 0.55 : 0.25) * (0.45 + 0.55*max(dot(Ns, L0), 0.0));',
          '    g += mix(uA, vec3(1.0), 0.6) * pow(max(dot(reflect(-L0, Ns), vec3(0.0, 0.0, 1.0)), 0.0), 12.0) * 1.1;',
          '    gl_FragColor = vec4(g, vA); return; }',
          '  vec2 q = (vUv - 0.5) * vec2(1.778, 1.0);',
          '  float mar = n(vUv*vec2(7.0, 4.0) + uT*0.3)*0.6 + n(vUv*vec2(19.0, 11.0))*0.4;',
          '  vec3 c = mix(uBg, uP, 0.3 + 0.55*smoothstep(-0.2, 1.1, vUv.y + mar*0.3));',
          '  c = mix(c, uA2, smoothstep(0.55, 0.9, mar)*0.35);',
          '  c += mix(uA, vec3(1.0), 0.3) * exp(-length(q)*3.2) * 0.3;',
          '  c *= 0.7 + 0.3*smoothstep(1.2, 0.3, length(q));',
          // Name oder Logo liegt auf den Splittern (setzt sich mit ihnen zusammen)
          '  if (uHasText > 0.5) { vec2 tp = artUv(vUv); vec4 t = artAt(uTex, tp);',
          '    c += uA * glowAt(uTex, tp) * 0.45; c = mix(c, t.rgb, t.a); }',
          // Glanz beim Drehen + Lichtstreif über die fertige Wand
          '  vec3 N = normalize(vN), L = L0;',
          '  c *= 0.6 + 0.4*max(dot(N, L), 0.0) + 0.25*(N.z);',
          '  c += mix(uA, vec3(1.0), 0.6) * pow(max(dot(reflect(-L, N), vec3(0.0, 0.0, 1.0)), 0.0), 20.0) * 0.9;',
          '  float sw = clamp((uT - (uCut - 0.48)) / 0.4, 0.0, 1.0);',
          '  float band = vUv.x + vUv.y*0.35 - mix(-0.35, 1.7, sw);',
          '  c += vec3(1.0) * exp(-abs(band)*16.0) * 0.35 * step(0.001, sw) * (1.0 - step(1.0, sw));',
          // Kanten: sichtbar im Flug, als glühende Risse kurz vor dem Schnitt
          '  float e = min(min(vBary.x, vBary.y), vBary.z);',
          '  float line = 1.0 - smoothstep(0.0, fwidth(e)*1.6, e);',
          '  c += mix(uA, vec3(1.0), 0.45) * line * clamp(vMove*0.8 + vCrack*1.4, 0.0, 1.4);',
          '  gl_FragColor = vec4(c, vA);',
          '}'
        ].join('\n')
      });
      scene.add(new THREE.Mesh(geo, mat));

      S.artTexture(C, function (canvas) {
        tex.image = canvas; tex.needsUpdate = true; U.uHasText.value = 1;
      });
      (function frame() {
        var t = S.now();
        U.uT.value = t;
        renderer.render(scene, cam);
        if (t < T.dur + 0.1) requestAnimationFrame(frame);
        else renderer.clear();
      })();
    })();
  </script>
</body>
</html>
