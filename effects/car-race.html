<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Car Race</title>
  <!-- Theme-Tokens (--theme-*): der Server injiziert data-theme aufs <html> (sonst Entry-Default) -->
  <link rel="stylesheet" href="../widgets/_theme.css">
  <!-- Rangliste (Zeitenturm): Aussehen frei anpassbar, Vorschau tools/car-race-hud-preview.html -->
  <link rel="stylesheet" href="car-race-hud.css">
  <!-- Begrüßung vor dem Start („WELCOME TO …“, „START YOUR ENGINES“), auch in Car Drive -->
  <link rel="stylesheet" href="../widgets/components/car-race-welcome.css">
  <!-- Material Symbols: Controller-Symbol für selbst gesteuerte Autos (Namensschild + Rangliste) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,1,0">
  <style>
    /* Car Race (js/car-race.js): Chat-Autorennen mit echten 3D-Autos auf einer Spielzeug-Strecke.
       Fenster 16:9, Standard 640×360 (bis 960×540); die Größe ändert nur den Ausschnitt.
       Unsichtbar in Lobby/Leerlauf, blendet ab dem 3. Fahrer mit Startaufstellung + Countdown ein.
       ?preview=1 – lokale Testlobby ohne Server (im Dashboard „Preview with test racers“, in OBS aus)
       ?finish=<s> (nur Vorschau) – Nachlauf nach dem Sieger (5–40); echte Rennen: Server-Vorgabe 25 s
       ?track=<n> (nur Vorschau) – Strecke aus der Favoritenliste
       ?pilot=1 (nur Vorschau) – Testfahrer 1 steuert „selbst“ (künstlicher Live-Takt), Knopf „Drop pilot“ = KI übernimmt
       ?ws=<ws-url> – WS-Dienst für den Live-Takt woanders (lokal ohne nginx, z. B. ws://127.0.0.1:9010)
       ?layout=stage – Rennbühne als Vollbild-Hintergrund (1920×1080), das Spiel als Bild-im-Bild darüber;
       ?pip=x,y,w,h – Lage des Bild-im-Bild in Pixeln (Standard 24,24,640,360)
       ?sound=0 – ohne Klänge (Standard an) · ?volume=0..1 – Lautstärke (Standard 0,5)
       ?view=x,y,w,h – Rennen nur in diesem Rechteck (z. B. 688,24,1208,680), Rest durchsichtig, Goldrahmen */
    @font-face {
      font-family: 'DM Sans';
      src: url('../assets/DM-Sans.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }

    /* Bühne: blendet als Ganzes ein/aus; Rand-Fade über eine Maske, nichts endet hart am Fensterrand */
    .stage {
      position: fixed; inset: 0; opacity: 0; transition: opacity 0.6s ease;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 3%, #000 97%, transparent 100%),
                          linear-gradient(to bottom, transparent 0, #000 5%, #000 95%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image: linear-gradient(to right, transparent 0, #000 3%, #000 97%, transparent 100%),
                  linear-gradient(to bottom, transparent 0, #000 5%, #000 95%, transparent 100%);
      mask-composite: intersect;
    }
    .stage.is-on { opacity: 1; }
    /* Vollbild-Bühne: kein Rand-Fade (füllt den ganzen Bildschirm), 3D erst ab der Fahrervorstellung */
    .stage.is-stage { -webkit-mask-image: none; mask-image: none; }
    .stage.is-stage #gl { opacity: 0; transition: opacity 0.4s ease; }
    .stage.is-stage.is-3d #gl { opacity: 1; }
    .layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* Vollbild-Bühne: Begrüßung über dem freien Rennbereich rechts neben dem Bild-im-Bild */
    .stage.is-stage .race-welcome { left: 36%; }

    /* Vorschau-Knöpfe (nur ?preview=1), außerhalb der Maske */
    .preview-bar {
      position: fixed; left: 0; right: 0; bottom: 8px; z-index: 2;
      display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap;
      font: 600 13px/1.2 var(--theme-font-body, 'DM Sans', sans-serif);
    }
    .preview-bar[hidden] { display: none; }
    .preview-bar button {
      min-height: 28px; min-width: 24px; padding: 4px 12px; cursor: pointer;
      font: inherit; color: #fff; background: #5e2a79;
      border: 1px solid #f2b705; border-radius: 6px;
    }
    .preview-bar button:hover { background: #73359a; }
    .preview-bar button:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
    .preview-bar button:disabled { cursor: default; opacity: 0.55; }
    .preview-bar select { min-height: 28px; padding: 4px 8px; font: inherit; color: #fff; background: #5e2a79; border: 1px solid #f2b705; border-radius: 6px; }
    .preview-bar select:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
    .preview-track { color: #fff; background: rgba(20, 12, 30, 0.8); padding: 4px 8px; border-radius: 6px; }
    .preview-info {
      color: #fff; background: rgba(20, 12, 30, 0.8); padding: 4px 10px; border-radius: 6px;
    }

    /* Farb-Proben: das HUD (Canvas) liest hieraus die aufgelösten Theme-Farben */
    .tokens { display: none; }
    .tk-surface { color: var(--theme-surface, #1d1128); }
    .tk-text { color: var(--theme-text, #ffffff); }
    .tk-dim { color: var(--theme-text-dim, #c9bdd6); }
    .tk-accent { color: var(--theme-accent, #f2b705); }
    .tk-border { color: var(--theme-primary, #5e2a79); }
    .tk-font { font-family: var(--theme-font-display, 'DM Sans', sans-serif); }

    @media (prefers-reduced-motion: reduce) {
      .stage, .stage.is-stage #gl { transition-duration: 0.3s; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="gl" class="layer" aria-hidden="true"></canvas>
    <canvas id="hud" class="layer" aria-hidden="true"></canvas>
    <ol class="race-rank" id="race-rank" data-layout="window" aria-label="Race standings" hidden></ol>
    <div id="race-welcome"></div>
  </main>
  <div class="preview-bar" id="preview-bar" hidden>
    <button type="button" id="pv-add">Add test racer</button>
    <button type="button" id="pv-start">Start now</button>
    <button type="button" id="pv-nitro">Nitro</button>
    <button type="button" id="pv-bump">Bump</button>
    <button type="button" id="pv-drop" hidden>Drop pilot</button>
    <label class="preview-track" for="pv-track">Track</label>
    <select id="pv-track"><option value="">Change every race</option></select>
    <button type="button" id="pv-next">Next track</button>
    <p class="preview-info" id="pv-info" aria-live="polite"></p>
    <p class="preview-info" id="pv-track-now" aria-live="polite"></p>
  </div>
  <div class="tokens" aria-hidden="true">
    <i class="tk-surface"></i><i class="tk-text"></i><i class="tk-dim"></i>
    <i class="tk-accent"></i><i class="tk-border"></i><i class="tk-font"></i>
  </div>
  <script src="../js/vendor/three-r128.min.js"></script>
  <script src="../js/vendor/three-r128-GLTFLoader.js"></script>
  <script src="../js/vendor/three-r128-BufferGeometryUtils.js"></script>
  <script src="../js/vendor/three-r128-RoomEnvironment.js"></script>
  <script src="../js/glb-fix.js"></script>
  <script src="../js/car-stage.js"></script>
  <script src="../js/rubber-duck.js"></script>
  <script src="../js/rubber-duck-outfits.js"></script>
  <!-- Outfits der Zuschauer (!outfit); ohne Enten-Freischaltung nur ein Kommentar → gelbe Standard-Ente -->
  <script src="../api/fx/ducks/custom.js"></script>
  <script src="../js/toy-cars.js"></script>
  <script src="../api/fx/cars/custom.js"></script>
  <script src="../js/car-race-sim.js"></script>
  <script src="../js/car-track-themes.js"></script>
  <script src="../js/car-track-surface.js"></script>
  <script src="../js/car-track-scene.js"></script>
  <script src="../js/car-race-stats.js"></script>
  <script src="../js/car-race-sound.js"></script>
  <script src="../js/car-engine-audio.js"></script>
  <script src="../js/car-race-engines.js"></script>
  <script src="../js/car-drive-net.js"></script>
  <script src="../js/car-race-welcome.js"></script>
  <script src="../js/car-race.js"></script>
  <script>
    (function () {
      'use strict';
      var params = new URLSearchParams(location.search);
      var preview = /^(1|true|yes|on)$/i.test(params.get('preview') || '');
      var finish = parseFloat(params.get('finish'));
      var pip = (params.get('pip') || '').split(',').map(Number);
      var view = (params.get('view') || '').split(',').map(Number);
      var volume = parseFloat(params.get('volume'));
      var race = CarRace.start({
        canvas: document.getElementById('gl'),
        hud: document.getElementById('hud'),
        rank: document.getElementById('race-rank'),
        welcome: document.getElementById('race-welcome'),
        stage: document.getElementById('stage'),
        base: '../',
        preview: preview,
        pilot: preview && /^(1|true|yes|on)$/i.test(params.get('pilot') || ''),
        track: params.get('track'),
        layout: params.get('layout') === 'stage' ? 'stage' : null,
        sound: params.get('sound') !== '0',
        volume: isFinite(volume) ? Math.max(0, Math.min(1, volume)) : 0.5,
        pip: pip.length === 4 && pip.every(function (n) { return isFinite(n) && n >= 0; }) ? pip : null,
        view: view.length === 4 && view.every(function (n) { return isFinite(n) && n >= 0; }) && view[2] > 0 && view[3] > 0 ? view : null,
        finish: isFinite(finish) ? finish : null,
        reduceMotion: !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches),
        onPreviewTrack: function (idx, cycling) {
          var info = document.getElementById('pv-track-now');
          if (info) info.textContent = CarRaceSim.track(CarRaceSim.TRACKS[idx]).name + (cycling ? ' (changes every race)' : '');
        },
        onPreviewInfo: function (text, canAdd, canStart) {
          document.getElementById('pv-info').textContent = text;
          document.getElementById('pv-add').disabled = !canAdd;
          document.getElementById('pv-start').disabled = !canStart;
        }
      });
      if (preview) {
        document.getElementById('preview-bar').hidden = false;
        document.getElementById('pv-add').addEventListener('click', function () { race.addTestRacer(); });
        document.getElementById('pv-start').addEventListener('click', function () { race.startNow(); });
        document.getElementById('pv-nitro').addEventListener('click', function () { race.nitro(); });
        document.getElementById('pv-bump').addEventListener('click', function () { race.bump(); });
        if (/^(1|true|yes|on)$/i.test(params.get('pilot') || '')) {
          var drop = document.getElementById('pv-drop');
          drop.hidden = false;
          drop.addEventListener('click', function () { race.dropPilot(); });
        }
        var sel = document.getElementById('pv-track');
        CarRaceSim.TRACKS.forEach(function (seed, i) {
          var o = document.createElement('option'); o.value = String(i); o.textContent = CarRaceSim.track(seed).name; sel.appendChild(o);
        });
        sel.addEventListener('change', function () { race.setTrack(sel.value); });
        document.getElementById('pv-next').addEventListener('click', function () { sel.value = ''; race.nextTrack(); });
      }
    })();
  </script>
</body>
</html>
