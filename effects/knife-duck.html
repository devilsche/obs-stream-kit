<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Knife Duck</title>
  <style>
    /* Messer-Ente (js/knife-duck.js, 3D mit three.js r128), ~4,4 s mit Ton.
       ?x=&y= Mitte in px (Standard 960/700), ?height= Größe in px (430),
       ?volume=0..1 (0.6, 0 = stumm). Startet beim Laden – in OBS
       „Shutdown source when not visible“ an. */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
    canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  </style>
</head>
<body>
  <canvas id="gl" width="1920" height="1080" aria-hidden="true"></canvas>
  <script src="../js/vendor/three-r128.min.js"></script>
  <script src="../js/item-rain-3d.js"></script>
  <script src="../js/knife-duck.js"></script>
  <script>
    (function () {
      'use strict';
      var q = new URLSearchParams(location.search);
      function num(k, d) { var v = parseFloat(q.get(k)); return isNaN(v) ? d : v; }
      window.KnifeDuck.start({
        canvas: document.getElementById('gl'),
        x: num('x', 960), y: num('y', 700), height: num('height', 430),
        volume: Math.max(0, Math.min(1, num('volume', 0.6))),
        reduceMotion: !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches),
        // ?t=Sekunde hält den Ablauf an dieser Stelle an (zum Prüfen)
        freeze: q.get('t') !== null ? num('t', 0) : null
      });
    })();
  </script>
</body>
</html>
