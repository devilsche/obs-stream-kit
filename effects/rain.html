<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="../js/stinger-ready.js"></script>
  <title>Rain Overlay</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    :root {
      --rain-flash: 205, 220, 255;
      --edge-x: 70px;
      --edge-top: 60px;
      --edge-bottom: 24px;
    }

    /* Regen + Blitz: weicher Rand-Fade, damit nichts hart an den Kanten
       auftaucht oder verschwindet. -webkit-Variante fuer OBS-CEF. */
    .layer {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      -webkit-mask-image:
        linear-gradient(to right, transparent, #000 var(--edge-x), #000 calc(100% - var(--edge-x)), transparent),
        linear-gradient(to bottom, transparent, #000 var(--edge-top), #000 calc(100% - var(--edge-bottom)), transparent);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(to right, transparent, #000 var(--edge-x), #000 calc(100% - var(--edge-x)), transparent),
        linear-gradient(to bottom, transparent, #000 var(--edge-top), #000 calc(100% - var(--edge-bottom)), transparent);
      mask-composite: intersect;
    }

    /* Blitz-Aufhellung: Doppel-Flackern, max. 2 Flashes pro Einschlag
       (unter der WCAG-Schwelle von 3 Flashes/s). */
    .flash {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 70% 90% at 50% 0%,
        rgba(var(--rain-flash), 0.9), rgba(var(--rain-flash), 0.25) 55%, transparent 85%);
    }
    .flash[data-side="left"] {
      background: radial-gradient(ellipse 70% 90% at 25% 0%,
        rgba(var(--rain-flash), 0.9), rgba(var(--rain-flash), 0.25) 55%, transparent 85%);
    }
    .flash[data-side="right"] {
      background: radial-gradient(ellipse 70% 90% at 75% 0%,
        rgba(var(--rain-flash), 0.9), rgba(var(--rain-flash), 0.25) 55%, transparent 85%);
    }
    .flash.is-flashing { animation: lightningFlash 700ms ease-out forwards; }

    @keyframes lightningFlash {
      0%   { opacity: 0; }
      5%   { opacity: 0.34; }
      12%  { opacity: 0.05; }
      20%  { opacity: 0.24; }
      100% { opacity: 0; }
    }

    /* ── Tune-Panel ── */
    .tune-panel {
      position: fixed; top: 80px; right: 16px; width: 420px;
      background: rgba(20, 10, 30, 0.92);
      border: 2px solid #f2b705; padding: 16px; border-radius: 10px;
      color: #f2b705; font-family: 'Courier New', monospace; font-size: 13px;
      z-index: 1000; display: none;
      box-shadow: 0 0 30px rgba(242, 183, 5, 0.4);
    }
    .tune-panel.visible { display: block; }
    .tune-panel h2 { font-size: 16px; margin-bottom: 12px; letter-spacing: 2px; text-transform: uppercase; }
    .tune-info { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; }
    .tune-info dt { color: rgba(255, 220, 150, 0.7); }
    .tune-info dd { color: #fff3d0; }
    .tune-actions { display: flex; gap: 8px; margin-top: 12px; }
    .tune-btn {
      flex: 1; min-height: 32px; background: rgba(242, 183, 5, 0.15); border: 1px solid #f2b705;
      color: #f2b705; padding: 8px 10px; font-family: inherit; font-size: 12px;
      font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
      border-radius: 4px; cursor: pointer;
    }
    .tune-btn:hover { background: rgba(242, 183, 5, 0.3); }
    .tune-btn:focus-visible { outline: 2px solid #fff3d0; outline-offset: 2px; }
    .tune-hint { margin-top: 10px; font-size: 10px; color: rgba(255, 220, 150, 0.6); line-height: 1.4; }

    @media (prefers-reduced-motion: reduce) {
      .flash.is-flashing { animation: none; }
    }
  </style>
</head>
<body>

  <canvas class="layer" id="bolt" width="1920" height="1080" aria-hidden="true"></canvas>
  <div class="flash" id="flash" aria-hidden="true"></div>
  <canvas class="layer" id="rain" width="1920" height="1080" aria-hidden="true"></canvas>

  <section class="tune-panel" id="tunePanel" aria-label="Rain tune panel">
    <h2>Rain Tune Mode</h2>
    <dl class="tune-info">
      <dt>Intensity</dt><dd id="tiIntensity"></dd>
      <dt>Wind</dt><dd id="tiWind"></dd>
      <dt>Color</dt><dd id="tiColor"></dd>
      <dt>Lightning</dt><dd id="tiLightning"></dd>
      <dt>Splash</dt><dd id="tiSplash"></dd>
      <dt>Drops</dt><dd id="tiDrops"></dd>
    </dl>
    <div class="tune-actions">
      <button type="button" class="tune-btn" id="btnStrike">Lightning (L)</button>
      <button type="button" class="tune-btn" id="btnPause">Pause (Space)</button>
    </div>
    <p class="tune-hint">
      URL params: ?intensity=light|medium|heavy|storm · ?wind=-1…1 ·
      ?color=9fc4ff · ?lightning=0|1|2 · ?splash=0|1
    </p>
  </section>

  <script>
    (function () {
      'use strict';

      var W = 1920, H = 1080;
      var params = new URLSearchParams(window.location.search);
      var reduceMotion = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // ── Parameter ──
      // Tropfen pro Ebene [hinten, mitte, vorne]
      var INTENSITY = {
        light:  [70, 45, 20],
        medium: [160, 100, 45],
        heavy:  [300, 180, 80],
        storm:  [460, 280, 130]
      };
      var intensityKey = (params.get('intensity') || 'medium').toLowerCase();
      if (!INTENSITY[intensityKey]) intensityKey = 'medium';
      var speedBoost = intensityKey === 'storm' ? 1.15 : 1;

      var wind = parseFloat(params.get('wind'));
      if (isNaN(wind)) wind = 0;
      wind = Math.max(-1, Math.min(1, wind));

      function parseColor(raw) {
        if (!raw) return null;
        var hex = raw.replace(/^#/, '').trim();
        if (/^[0-9a-f]{3}$/i.test(hex)) {
          hex = hex.replace(/(.)/g, '$1$1');
        }
        if (!/^[0-9a-f]{6}$/i.test(hex)) return null;
        return {
          r: parseInt(hex.slice(0, 2), 16),
          g: parseInt(hex.slice(2, 4), 16),
          b: parseInt(hex.slice(4, 6), 16)
        };
      }
      var color = parseColor(params.get('color')) || { r: 174, g: 203, b: 235 };
      var rgb = color.r + ',' + color.g + ',' + color.b;

      // 0/off = aus, 1/rare = selten, 2/frequent = oft
      var LIGHTNING = { off: null, rare: [14, 32], frequent: [5, 12] };
      var lightningRaw = (params.get('lightning') || '0').toLowerCase();
      var lightningKey = { '0': 'off', '1': 'rare', '2': 'frequent' }[lightningRaw] || lightningRaw;
      if (!(lightningKey in LIGHTNING)) lightningKey = 'off';
      if (reduceMotion) lightningKey = 'off';

      var splashOn = params.get('splash') !== '0';

      // ── Ebenen ──
      var LAYERS = [
        { speed: 950,  len: [10, 18], width: 1.0, alpha: [0.16, 0.24, 0.32], drift: 0.8 },
        { speed: 1350, len: [18, 30], width: 1.3, alpha: [0.28, 0.38, 0.48], drift: 0.9 },
        { speed: 1850, len: [30, 52], width: 1.8, alpha: [0.42, 0.56, 0.70], drift: 1.0, ground: true }
      ];
      var MAX_TAN = 0.5;   // wind=1 → ~27° Neigung

      function rand(a, b) { return a + Math.random() * (b - a); }

      var drops = [];
      LAYERS.forEach(function (layer, li) {
        var n = INTENSITY[intensityKey][li];
        if (reduceMotion) n = Math.round(n / 2);
        for (var i = 0; i < n; i++) {
          var d = { layer: li };
          spawn(d, true);
          drops.push(d);
        }
      });

      function spawn(d, initial) {
        var layer = LAYERS[d.layer];
        d.v = layer.speed * speedBoost * rand(0.85, 1.15);
        d.len = rand(layer.len[0], layer.len[1]);
        d.bucket = (Math.random() * 3) | 0;
        // Seitlich ueber den Rand hinaus spawnen, damit Wind-Tropfen von
        // ausserhalb hereinkommen statt im Bild aufzutauchen.
        var margin = H * MAX_TAN + 40;
        d.x = rand(-margin, W + margin);
        d.y = initial ? rand(-H * 0.2, H) : -d.len - rand(0, 160);
        d.gy = layer.ground ? H - rand(10, 150) : Infinity;
      }

      // ── Spritzer ──
      var splashes = [];
      var MAX_SPLASHES = 500;
      function addSplash(x, y, vxWind) {
        var n = 2 + ((Math.random() * 2) | 0);
        for (var i = 0; i < n && splashes.length < MAX_SPLASHES; i++) {
          var life = rand(0.28, 0.45);
          splashes.push({
            x: x, y: y,
            vx: rand(-130, 130) + vxWind * 0.15,
            vy: rand(-260, -110),
            life: life, max: life
          });
        }
      }

      // ── Blitz ──
      var boltCanvas = document.getElementById('bolt');
      var bctx = boltCanvas.getContext('2d');
      var flashEl = document.getElementById('flash');
      var bolt = null;
      var nextStrike = Infinity;

      function scheduleStrike(now) {
        var range = LIGHTNING[lightningKey];
        nextStrike = range ? now + rand(range[0], range[1]) : Infinity;
      }

      // Zickzack per Mittelpunkt-Verschiebung
      function zigzag(x0, y0, x1, y1, spread, depth, out) {
        if (depth === 0) { out.push([x1, y1]); return; }
        var mx = (x0 + x1) / 2 + rand(-spread, spread);
        var my = (y0 + y1) / 2 + rand(-spread * 0.2, spread * 0.2);
        zigzag(x0, y0, mx, my, spread / 2, depth - 1, out);
        zigzag(mx, my, x1, y1, spread / 2, depth - 1, out);
      }

      function makeBolt() {
        var x0 = rand(W * 0.15, W * 0.85);
        var y1 = rand(H * 0.45, H * 0.8);
        var x1 = x0 + rand(-220, 220);
        var trunk = [[x0, -30]];
        zigzag(x0, -30, x1, y1, 160, 6, trunk);
        var paths = [{ pts: trunk, w: 3.2 }];
        var branches = 1 + ((Math.random() * 3) | 0);
        for (var b = 0; b < branches; b++) {
          var start = trunk[2 + ((Math.random() * (trunk.length - 6)) | 0)];
          var bx = start[0] + rand(-260, 260);
          var by = start[1] + rand(120, 300);
          var br = [[start[0], start[1]]];
          zigzag(start[0], start[1], bx, by, 70, 4, br);
          paths.push({ pts: br, w: 1.6 });
        }
        return { paths: paths, t: 0, side: x0 < W * 0.38 ? 'left' : (x0 > W * 0.62 ? 'right' : 'center') };
      }

      function strike() {
        bolt = makeBolt();
        flashEl.dataset.side = bolt.side;
        flashEl.classList.remove('is-flashing');
        void flashEl.offsetWidth;   // Animation neu starten
        flashEl.classList.add('is-flashing');
      }
      flashEl.addEventListener('animationend', function () {
        flashEl.classList.remove('is-flashing');
      });

      // Helligkeit des Blitzes ueber die Zeit (passt zum CSS-Flackern)
      function boltAlpha(t) {
        if (t < 0.04) return 1;
        if (t < 0.09) return 0.25;
        if (t < 0.16) return 0.9;
        if (t < 0.6) return 0.9 * (1 - (t - 0.16) / 0.44);
        return 0;
      }

      function drawBolt() {
        bctx.clearRect(0, 0, W, H);
        if (!bolt) return;
        var a = boltAlpha(bolt.t);
        if (a <= 0) { bolt = null; return; }
        bctx.lineCap = 'round';
        bctx.lineJoin = 'round';
        bolt.paths.forEach(function (p) {
          bctx.beginPath();
          bctx.moveTo(p.pts[0][0], p.pts[0][1]);
          for (var i = 1; i < p.pts.length; i++) bctx.lineTo(p.pts[i][0], p.pts[i][1]);
          // Glow
          bctx.shadowColor = 'rgba(' + rgb + ',' + a + ')';
          bctx.shadowBlur = 28;
          bctx.strokeStyle = 'rgba(' + rgb + ',' + (a * 0.55) + ')';
          bctx.lineWidth = p.w * 3;
          bctx.stroke();
          // Kern
          bctx.shadowBlur = 8;
          bctx.strokeStyle = 'rgba(255,255,255,' + a + ')';
          bctx.lineWidth = p.w;
          bctx.stroke();
        });
        bctx.shadowBlur = 0;
      }

      // ── Render-Loop ──
      var canvas = document.getElementById('rain');
      var ctx = canvas.getContext('2d');
      ctx.lineCap = 'round';

      var time = 0;
      var last = null;
      var paused = false;

      function frame(now) {
        var dt = last === null ? 0 : Math.min((now - last) / 1000, 0.05);
        last = now;
        if (paused) dt = 0;
        time += dt;

        if (nextStrike === Infinity && lightningKey !== 'off') scheduleStrike(time);
        if (time >= nextStrike) { strike(); scheduleStrike(time); }

        // Leichte Boeen, damit der Regen nicht starr wirkt
        var gust = reduceMotion ? 0 : 0.07 * Math.sin(time * 0.37) + 0.04 * Math.sin(time * 1.13);
        var tanA = (wind + gust) * MAX_TAN;

        ctx.clearRect(0, 0, W, H);

        for (var li = 0; li < LAYERS.length; li++) {
          var layer = LAYERS[li];
          var slant = tanA * layer.drift;
          ctx.lineWidth = layer.width;
          for (var bk = 0; bk < 3; bk++) {
            ctx.beginPath();
            for (var i = 0; i < drops.length; i++) {
              var d = drops[i];
              if (d.layer !== li || d.bucket !== bk) continue;
              ctx.moveTo(d.x, d.y);
              ctx.lineTo(d.x - d.len * slant, d.y - d.len);
            }
            ctx.strokeStyle = 'rgba(' + rgb + ',' + layer.alpha[bk] + ')';
            ctx.stroke();
          }
        }

        // Bewegung + Recycling
        for (var j = 0; j < drops.length; j++) {
          var dr = drops[j];
          var dl = LAYERS[dr.layer];
          var dy = dr.v * dt;
          dr.y += dy;
          dr.x += dy * tanA * dl.drift;
          if (dr.y >= dr.gy) {
            if (splashOn) addSplash(dr.x, dr.gy, dr.v * tanA);
            spawn(dr, false);
          } else if (dr.y - dr.len > H) {
            spawn(dr, false);
          }
        }

        // Spritzer
        if (splashes.length) {
          ctx.fillStyle = 'rgba(' + rgb + ',0.75)';
          for (var s = splashes.length - 1; s >= 0; s--) {
            var sp = splashes[s];
            sp.life -= dt;
            if (sp.life <= 0) { splashes.splice(s, 1); continue; }
            sp.vy += 1400 * dt;
            sp.x += sp.vx * dt;
            sp.y += sp.vy * dt;
            ctx.globalAlpha = sp.life / sp.max;
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, 1.4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        if (bolt) bolt.t += dt;
        drawBolt();

        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      // ── Tune-Modus ──
      if (params.get('tune') !== '1') return;

      document.getElementById('tunePanel').classList.add('visible');
      document.getElementById('tiIntensity').textContent = intensityKey;
      document.getElementById('tiWind').textContent = wind.toFixed(2);
      document.getElementById('tiColor').textContent = 'rgb(' + rgb + ')';
      document.getElementById('tiLightning').textContent = lightningKey;
      document.getElementById('tiSplash').textContent = splashOn ? 'on' : 'off';
      document.getElementById('tiDrops').textContent = String(drops.length);

      var btnPause = document.getElementById('btnPause');
      function togglePause() {
        paused = !paused;
        btnPause.textContent = paused ? 'Resume (Space)' : 'Pause (Space)';
      }
      document.getElementById('btnStrike').addEventListener('click', strike);
      btnPause.addEventListener('click', togglePause);
      document.addEventListener('keydown', function (e) {
        if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
        if (e.key === 'l' || e.key === 'L') strike();
        if (e.key === ' ') { e.preventDefault(); togglePause(); }
      });
    })();
  </script>

</body>
</html>
