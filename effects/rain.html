<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rain Overlay</title>
  <style>html, body { margin: 0; background: transparent; }</style>
  <script>
    // Rain ist in der Weather-Source aufgegangen. Alte URLs (OBS, Streamer.bot)
    // landen mit fester Lage dort; chan=rain hält /api/fx/rain-Befehle am Leben.
    (function () {
      var p = new URLSearchParams(window.location.search);
      var KIND = { light: 'drizzle', medium: 'rain', heavy: 'rain', storm: 'storm' };
      var q = new URLSearchParams();
      q.set('lock', KIND[(p.get('intensity') || 'medium').toLowerCase()] || 'rain');
      var w = (p.get('wind') || '').toLowerCase();
      if (w === 'random') q.set('wind', 'random');
      else if (!isNaN(parseFloat(w))) q.set('wind', String(Math.max(-1, Math.min(1, parseFloat(w)))));
      q.set('mood', '0');
      q.set('chan', 'rain');
      window.location.replace('weather.html?' + q.toString());
    })();
  </script>
</head>
<body></body>
</html>
