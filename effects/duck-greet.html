<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Duck Greeting</title>
  <style>
    /* Begrüßungs-Ente (js/duck-greet.js, three.js r128): Zuschauer mit !outfit bekommen bei der ersten
       Chat-Nachricht im Stream eine kleine Ente in ihrem Outfit (fällt herein, nickt, quakt, watschelt raus).
       Dauerhafte Browser-Source (1920×1080), holt die Begrüßungen selbst ab (Streamer.bot: „First Words“
       → /api/fx/ducks/greet?user=%user%).
       ?x= Mitte der ersten Ente in px (220; über 960 reihen sich weitere nach links), ?size= Höhe in px (180),
       ?volume=0..1 (0.5), ?test=Name:outfit,Name2:outfit2 spielt sofort ab, ?t= hält bei Sekunde t an. */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
    canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  </style>
</head>
<body>
  <canvas id="gl" width="1920" height="1080" role="img" aria-label="Duck greeting"></canvas>
  <script src="../js/vendor/three-r128.min.js"></script>
  <script src="../js/rubber-duck.js"></script>
  <script src="../js/rubber-duck-outfits.js"></script>
  <script src="../api/fx/ducks/custom.js"></script>
  <script src="../js/duck-stage.js"></script>
  <script src="../js/duck-greet.js"></script>
  <script>
    (function () {
      'use strict';
      var q = new URLSearchParams(location.search);
      function num(k, d) { var v = parseFloat(q.get(k)); return isNaN(v) ? d : v; }
      var test = (q.get('test') || '').split(',').map(function (s) { return s.split(':'); })
        .filter(function (p) { return p[0] && p[1] && window.RubberDuck.OUTFITS.indexOf(p[1]) >= 0; });
      window.DuckGreet.start({
        canvas: document.getElementById('gl'),
        x: num('x', 220), size: num('size', 180),
        volume: Math.max(0, Math.min(1, num('volume', 0.5))),
        reduceMotion: !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches),
        poll: location.protocol === 'file:' ? null : '../api/fx/duckgreet/poll',
        test: test,
        freeze: q.get('t') !== null ? num('t', 0) : null
      });
    })();
  </script>
</body>
</html>
