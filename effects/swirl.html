<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Swirl</title>
  <!-- Swirl: WebGL-Wirbel als Hintergrund UNTER einer Alert-Quelle (js/swirl.js), 1920×1080, durchsichtig.
       Die Bildmitte bleibt frei (dort steht die Alert-Box). Ausgelöst über Streamer.bot, zeitgleich mit dem Alert:
       /s/<token>/api/fx/swirl?cmd=play&preset=follow&duration=6
       URL-Parameter: preset (follow), duration (2–15 s, Standard 6 wie der Follow-Alert), density (0.5–2),
       flare (1/0, Lichtstreif hinter der Alert-Box), sound (Standard 0 = aus), volume (0–1), demo=1 (spielt dauernd, Dashboard-Vorschau).
       Theme-Wechsel greift ohne Neuladen (Event „themechange“ aus der Server-Injektion). -->
  <link rel="stylesheet" href="../widgets/_theme.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #swirl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="swirl" aria-hidden="true"></canvas>
  <script src="../js/vendor/three-r128.min.js"></script>
  <script src="../js/swirl.js"></script>
  <script>
    (function () {
      'use strict';
      var p = new URLSearchParams(location.search);
      function num(k, d, lo, hi) { var v = parseFloat(p.get(k)); return isNaN(v) ? d : Math.max(lo, Math.min(hi, v)); }
      function themeColor(k, d) { return getComputedStyle(document.documentElement).getPropertyValue(k).trim() || d; }
      var duration = num('duration', 6, 2, 15), preset = p.get('preset') || 'follow';
      var s = Swirl.create({
        canvas: document.getElementById('swirl'),
        accent: themeColor('--theme-accent', '#f2b705'), primary: themeColor('--theme-primary', '#5e2a79'),
        flare: p.get('flare') !== '0',
        density: num('density', 1, 0.2, 2), duration: duration,
        sound: p.get('sound') === '1', volume: num('volume', 0.6, 0, 1)
      });
      window.addEventListener('themechange', function () { s.setColors(themeColor('--theme-accent', '#f2b705'), themeColor('--theme-primary', '#5e2a79')); });
      if (p.get('demo') === '1') {
        (function demo() { if (!s.busy()) s.play({ preset: preset }); setTimeout(demo, 1000); })();
      }
      // Befehle von Streamer.bot / Dashboard: nur über die Token-URL
      var m = location.pathname.match(/^\/s\/([A-Za-z0-9_]+)\//);
      if (!m) return;
      var url = '/s/' + m[1] + '/api/fx/swirl/poll', seq = null, epoch = null;
      (function poll() {
        var delay = 500;
        fetch(url + (seq === null ? '' : '?since=' + seq), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
          .then(function (d) {
            if (epoch !== null && d.epoch !== epoch) { epoch = d.epoch; seq = 0; delay = 0; return; }   // Server neu gestartet
            epoch = d.epoch;
            if (seq !== null) (d.commands || []).forEach(function (c) {
              if (c.cmd === 'play') { var q = c.params || {}; s.play({ preset: q.preset || preset, duration: q.duration || duration, flare: q.flare }); }
            });
            seq = d.seq;
          })
          .catch(function () { delay = 3000; })
          .then(function () { setTimeout(poll, delay); });
      })();
    })();
  </script>
</body>
</html>
