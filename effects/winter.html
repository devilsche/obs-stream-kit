<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Winter Decor</title>
  <!--
    Winterdeko ohne Weihnachten als OBS-Source (1920×1080, transparent):
    Eiszapfen oben, Raureif aus den Ecken, Schneedecke, Schneemann (wächst mit
    Subs), Mini-Schneemänner der Follower, fallender Schnee.

    URL-Parameter (alle auch live per Streamer.bot: /s/<token>/api/fx/winter?cmd=set&…):
      icicles=1|0  frost=1|0  cover=1|0  minis=1|0
      falling=1|0  density=light|medium|heavy   ständig etwas Schneefall
      snowman=1|0  smpos=left|right  smx=0..1500 (Abstand zum Rand, px)
      tune=1       Statusanzeige; Testtasten siehe unten

    Befehle: cmd=mini&name=… (Follow) | cmd=build&name=… (Sub: nächstes Schneemann-Teil)
             cmd=snowmanreset | cmd=celebrate[&name=…] | cmd=snowball&name=…
             cmd=clear[&kind=minis|snow|snowman] | cmd=reset | cmd=set&…
    Schnee: cmd=snowtoggle bzw. cmd=snowfall[&secs=…] / cmd=snowstop; solange es
    schneit, wächst der Schnee um snowrate % pro Minute, der Raureif halb so schnell,
    die Eiszapfen mit dem Schnee. cmd=shovel / cmd=scrape / cmd=icicle (&name=…)
    räumen frei und zählen für „Top helpers“; cmd=shake&name=… — shakeneed Leute
    in shakewin s schütteln allen Schnee ab; cmd=melt taut alles; cmd=leaders.
      snowrate=1..300 (20)  shovel=1..50 (5)  scrape=1..50 (5)  shakeneed=1..20 (5)  shakewin=5..120 (20)
    Der Server speichert nur die Ereignisse (fx/season_db.py); Stände und
    Rangliste rechnet die Source beim Laden mit diesen Regeln nach.
  -->
  <link rel="stylesheet" href="../js/season-kit.css" />
  <style>
    .stage { --tag-big: #dff3ff; --spot: #9fdcff; --hud-bg: rgba(16, 30, 48, 0.82); --hud-line: rgba(200, 235, 255, 0.7); }

    .stage[data-icicles="0"] .icicles { display: none; }
    .ridge { fill: #f4f9ff; }
    .ridge-shade { fill: #cfe0f2; }
    .ice { fill: url(#iceG); stroke: rgba(255, 255, 255, 0.7); stroke-width: 1; }
    .stage[data-celebrate="1"] .ice { filter: url(#sparkle); }

    .stage[data-frost="0"] #frostCanvas { display: none; }
    .stage[data-cover="0"] .cover { display: none; }
    .cover__snow { fill: #f2f7fd; }
    .cover__shade { fill: #c9d9ec; }

    /* Schneemann */
    .stage[data-snowman="0"] .snowman { display: none; }
    .sm-ball { fill: url(#ballG); }
    .sm-coal { fill: #23262b; }
    .sm-nose { fill: #f07c1e; }
    .sm-arm { fill: none; stroke: #5a3a22; stroke-width: 5; stroke-linecap: round; }
    .sm-scarf { fill: #c4302b; }
    .sm-scarf2 { fill: #f2b705; }
    .sm-hat { fill: #1f1f26; }
    .sm-band { fill: #5e2a79; }
    .sm-part { display: none; transform-box: fill-box; transform-origin: 50% 100%; }
    .sm-part.is-on { display: inline; }
    .sm-part.is-new { animation: pop 0.6s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
    @keyframes pop { from { transform: scale(0.2); opacity: 0; } to { transform: none; opacity: 1; } }
    .sm-armr { transform-box: fill-box; transform-origin: 0% 100%; }
    .stage[data-celebrate="1"] .sm-armr { animation: wave 0.4s ease-in-out 5; }
    @keyframes wave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-28deg); } }
    .sm-hatg { transform-box: fill-box; transform-origin: 20% 100%; }
    .stage[data-celebrate="1"] .sm-hatg, .snowman.is-done .sm-hatg { animation: tip 1.2s ease-in-out; }
    @keyframes tip { 0%, 100% { transform: none; } 40%, 60% { transform: translate(-6px, -18px) rotate(-18deg); } }

    /* Mini-Schneemänner */
    .stage[data-minis="0"] .minis { display: none; }
    .mini { transform-box: fill-box; transform-origin: 50% 100%; }
    .mini--new { animation: pop 0.7s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
    .mini__ball { fill: url(#ballG); }
    .mini__hat1 { fill: #c4302b; } .mini__hat2 { fill: #2a64b8; } .mini__hat3 { fill: #2e9e5b; } .mini__hat4 { fill: #8e4bb8; }
    .mini__pom { fill: #ffffff; }
    .stage[data-celebrate="1"] .mini { animation: hop 0.35s ease-in-out 4; }
    @keyframes hop { 0%, 100% { transform: none; } 50% { transform: translateY(-12px); } }

    /* Schneeball */
    .splat { fill: #f7fbff; stroke: #c9d9ec; stroke-width: 2; }
    .splat-g { animation: splat 5s ease-in forwards; transform-box: fill-box; transform-origin: 50% 0; }
    @keyframes splat {
      0% { transform: scale(0.4); opacity: 1; }
      6% { transform: scale(1.08); }
      10%, 70% { transform: none; opacity: 1; }
      100% { transform: translateY(60px) scaleY(1.2); opacity: 0; }
    }
    .ball { fill: #f7fbff; stroke: #b8cde4; stroke-width: 2; }

    /* Eiskratzer */
    .scraper { display: none; }
    .scraper.is-on { display: inline; }
    .scraper__blade { fill: #7fc4ff; stroke: #2a64b8; stroke-width: 3; }
    .scraper__grip { fill: #2a64b8; }

    .stage.is-shakeoff .icicles, .stage.is-shakeoff .snowman, .stage.is-shakeoff .minis { animation: shake 1.1s ease-in-out; }
    @keyframes shake {
      0%, 100% { transform: none; } 10% { transform: translateX(-14px); } 25% { transform: translateX(14px); }
      40% { transform: translateX(-12px); } 55% { transform: translateX(10px); } 70% { transform: translateX(-6px); } 85% { transform: translateX(3px); }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage" aria-hidden="true">
    <svg width="0" height="0">
      <defs>
        <linearGradient id="iceG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".95" />
          <stop offset=".6" stop-color="#bfe6ff" stop-opacity=".85" />
          <stop offset="1" stop-color="#8ccfff" stop-opacity=".7" />
        </linearGradient>
        <radialGradient id="ballG" cx=".38" cy=".32"><stop offset="0" stop-color="#ffffff" /><stop offset=".7" stop-color="#eef4fb" /><stop offset="1" stop-color="#bccde2" /></radialGradient>
        <filter id="sparkle" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation="3" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
      </defs>
    </svg>

    <canvas class="layer" id="backCanvas" width="1920" height="1080"></canvas>
    <canvas class="layer" id="frostCanvas" width="1920" height="1080"></canvas>
    <svg class="layer icicles" viewBox="0 0 1920 1080"><g id="ice"></g><path class="ridge-shade" id="ridgeShade" /><path class="ridge" id="ridge" /></svg>
    <svg class="layer cover" viewBox="0 0 1920 1080"><path class="cover__shade" id="coverShade" /><path class="cover__snow" id="coverSnow" /></svg>
    <svg class="layer minis" viewBox="0 0 1920 1080"><g id="minis"></g></svg>
    <svg class="layer snowman" id="snowmanSvg" viewBox="0 0 1920 1080"><g id="snowman"></g></svg>
    <canvas class="layer" id="frontCanvas" width="1920" height="1080"></canvas>
    <svg class="layer" id="fxSvg" viewBox="0 0 1920 1080">
      <g id="splats"></g>
      <g class="scraper" id="scraper"><rect class="scraper__blade" x="-60" y="-14" width="120" height="28" rx="6" /><rect class="scraper__grip" x="-14" y="10" width="28" height="70" rx="10" /></g>
      <g id="tags"></g>
    </svg>
    <div class="hud">
      <div class="hud__box hud__group" id="groupBox"><span id="groupText"></span><div class="hud__bar"></div></div>
      <div class="hud__box" id="boardBox"><h2>Top helpers</h2><ol id="boardList"></ol></div>
    </div>
    <div class="tune" id="tune"></div>
  </div>

  <script src="../js/season-kit.js"></script>
  <script>
    (function () {
      'use strict';
      var K = SeasonKit, W = K.W, H = K.H, el = K.el, rnd = K.rnd, rand = K.rand, clamp01 = K.clamp01;
      var stage = document.getElementById('stage');
      var tags = document.getElementById('tags');
      var base = K.settings({
        icicles: [K.flag, true], frost: [K.flag, true], cover: [K.flag, true], minis: [K.flag, true],
        falling: [K.flag, true], density: [K.choice('light', 'medium', 'heavy'), 'medium'],
        snowman: [K.flag, true], smpos: [K.choice('left', 'right'), 'right'], smx: [K.num(0, 1500, true), 260],
        snowrate: [K.num(1, 300, true), 20], shovel: [K.num(1, 50, true), 5], scrape: [K.num(1, 50, true), 5],
        shakeneed: [K.num(1, 20, true), 5], shakewin: [K.num(5, 120, true), 20]
      });
      var cur = {};
      var DENSITY = { light: 12, medium: 25, heavy: 50 };   // Flocken pro Sekunde
      var css = K.styleSheet();
      var leaders = K.Leaders(document.getElementById('boardBox'), document.getElementById('boardList'));
      var shakers = K.Group(function () { return cur.shakeneed; }, function () { return cur.shakewin; });

      // ── Spielstand (wird aus den Ereignissen nachgerechnet) ──
      // snow/frost 0…100, smStage 0…8; snowing: von since bis until
      var ST = { snow: 0, frost: 0, sm: 0, snowing: false, since: 0, until: Infinity };
      function advance(t) {
        if (!ST.snowing) return;
        var end = Math.min(t, ST.until), d = end - ST.since;
        if (d > 0) {
          ST.snow = Math.min(100, ST.snow + cur.snowrate / 60 * d);
          ST.frost = Math.min(100, ST.frost + cur.snowrate / 120 * d);
        }
        ST.since = Math.max(ST.since, end);
        if (t >= ST.until) ST.snowing = false;
      }
      function resetState() {
        ST = { snow: 0, frost: 0, sm: 0, snowing: false, since: 0, until: Infinity };
        leaders.reset(); shakers.reset();
      }
      // Ein Ereignis anwenden; Rückgabe beschreibt es für die Animation
      function apply(k, name, t, secs) {
        advance(t);
        var r = { k: k, name: name };
        if (k === 'start') { ST.snowing = true; ST.since = t; ST.until = secs ? t + secs : Infinity; }
        else if (k === 'stop') ST.snowing = false;
        else if (k === 'shovel') { r.done = Math.min(cur.shovel, ST.snow); ST.snow -= r.done; }
        else if (k === 'scrape') { r.done = Math.min(cur.scrape, ST.frost); ST.frost -= r.done; }
        else if (k === 'icicle') { r.done = ST.snow >= 10 ? 1 : 0; }
        else if (k === 'shake') {
          if (ST.snow <= 0) { r.idle = true; return r; }
          var g = shakers.add(name, t);
          r.count = g.count; r.need = g.need;
          if (g.success) { r.success = true; ST.snow = 0; }
        }
        else if (k === 'melt') { ST.snow = 0; ST.frost = 0; }
        else if (k === 'build') { r.done = ST.sm < 8 ? 1 : 0; ST.sm = Math.min(8, ST.sm + 1); }
        else if (k === 'smreset') ST.sm = 0;
        if (r.done > 0 && (k === 'shovel' || k === 'scrape' || k === 'icicle')) leaders.add(name);
        return r;
      }

      // ── Schneedecke ──
      var shownSnow = 0, shownFrost = 0;
      function coverH(x, s) {
        var w = 620;
        function bump(d) { return d < w ? 0.5 + 0.5 * Math.cos(Math.PI * d / w) : 0; }
        var wav = 6 * Math.sin(x / 70) + 4 * Math.sin(x / 23);
        return 18 + 50 * s + wav * (0.4 + s) + Math.max(bump(x), bump(W - x)) * (30 + 140 * s);
      }
      function surface(x) { return H - coverH(x, shownSnow / 100); }
      function drawCover() {
        var d = 'M0 ' + H, ds = 'M0 ' + H;
        for (var x = 0; x <= W; x += 20) {
          var h = coverH(x, shownSnow / 100);
          d += ' L' + x + ' ' + (H - h).toFixed(1);
          ds += ' L' + x + ' ' + (H - h - 6).toFixed(1);
        }
        document.getElementById('coverSnow').setAttribute('d', d + ' L' + W + ' ' + H + ' Z');
        document.getElementById('coverShade').setAttribute('d', ds + ' L' + W + ' ' + H + ' Z');
      }

      // ── Eiszapfen ──
      var iceG = document.getElementById('ice');
      var icicles = [];
      for (var ix = 14; ix < W; ix += 34 + rnd() * 26) {
        icicles.push({ x: ix, w: 7 + rnd() * 8, max: 30 + rnd() * 110, grow: 1, node: el('path', { 'class': 'ice' }, iceG) });
      }
      function ridgeY(x, s) { return 6 + 12 * s + 4 * Math.sin(x / 40) + 3 * Math.sin(x / 13); }
      function drawIce() {
        var s = shownSnow / 100, d = 'M0 0', ds = 'M0 0';
        for (var x = 0; x <= W; x += 16) {
          d += ' L' + x + ' ' + ridgeY(x, s).toFixed(1);
          ds += ' L' + x + ' ' + (ridgeY(x, s) + 5).toFixed(1);
        }
        document.getElementById('ridge').setAttribute('d', d + ' L' + W + ' 0 Z');
        document.getElementById('ridgeShade').setAttribute('d', ds + ' L' + W + ' 0 Z');
        icicles.forEach(function (ic) {
          var len = ic.max * clamp01(s / 0.7) * ic.grow;     // bei 70 % Schnee voll
          var top = ridgeY(ic.x, s) - 2;
          ic.tip = top + len;
          ic.node.setAttribute('d', len < 2 ? '' :
            'M' + (ic.x - ic.w).toFixed(1) + ' ' + top.toFixed(1) +
            ' Q' + (ic.x - ic.w * 0.3).toFixed(1) + ' ' + (top + len * 0.5).toFixed(1) + ' ' + ic.x.toFixed(1) + ' ' + (top + len).toFixed(1) +
            ' Q' + (ic.x + ic.w * 0.3).toFixed(1) + ' ' + (top + len * 0.5).toFixed(1) + ' ' + (ic.x + ic.w).toFixed(1) + ' ' + top.toFixed(1) + ' Z');
        });
      }

      // ── Raureif: Eiskristall-Äste aus den Ecken ──
      var fctx = document.getElementById('frostCanvas').getContext('2d');
      var segs = [];
      [[0, 0, 1, 1], [W, 0, -1, 1], [0, H, 1, -1], [W, H, -1, -1]].forEach(function (c) {
        function branch(x, y, ang, len, depth, d0) {
          var steps = Math.round(len / 14);
          for (var i = 0; i < steps; i++) {
            var nx = x + Math.cos(ang) * 14, ny = y + Math.sin(ang) * 14, d = d0 + 14;
            segs.push([x, y, nx, ny, d, depth]);
            if (depth < 3 && rnd() < 0.22) branch(nx, ny, ang + (rnd() < 0.5 ? -1 : 1) * (0.5 + rnd() * 0.5), len * 0.45, depth + 1, d);
            x = nx; y = ny; d0 = d; ang += (rnd() - 0.5) * 0.25;
          }
        }
        for (var k = 0; k < 26; k++) branch(c[0], c[1], Math.atan2(c[3], c[2]) + (rnd() - 0.5) * 1.6, 260 + rnd() * 460, 0, 0);
      });
      function drawFrost() {
        fctx.clearRect(0, 0, W, H);
        var R = shownFrost / 100 * 720;
        if (R < 4) return;
        [[0, 0], [W, 0], [0, H], [W, H]].forEach(function (c) {
          var g = fctx.createRadialGradient(c[0], c[1], 0, c[0], c[1], R);
          g.addColorStop(0, 'rgba(235,246,255,.55)'); g.addColorStop(0.6, 'rgba(220,238,255,.18)'); g.addColorStop(1, 'rgba(220,238,255,0)');
          fctx.fillStyle = g;
          fctx.fillRect(0, 0, W, H);
        });
        fctx.lineCap = 'round';
        segs.forEach(function (s) {
          if (s[4] > R) return;
          fctx.strokeStyle = 'rgba(245,252,255,' + (0.85 * clamp01((R - s[4]) / 80)).toFixed(2) + ')';
          fctx.lineWidth = Math.max(0.8, 3.2 - s[5] * 0.8);
          fctx.beginPath(); fctx.moveTo(s[0], s[1]); fctx.lineTo(s[2], s[3]); fctx.stroke();
        });
      }

      // ── Schneemann: 8 Teile, eins pro Sub ──
      var smG = document.getElementById('snowman'), smSvg = document.getElementById('snowmanSvg');
      var smParts = [];
      function part(step, build) {
        var g = el('g', { 'class': 'sm-part', 'data-step': step }, smG);
        build(g);
        smParts.push(g);
      }
      part(1, function (g) { el('circle', { 'class': 'sm-ball', cx: 0, cy: -70, r: 74 }, g); });
      part(2, function (g) { el('circle', { 'class': 'sm-ball', cx: 0, cy: -180, r: 54 }, g); });
      part(3, function (g) { el('circle', { 'class': 'sm-ball', cx: 0, cy: -262, r: 40 }, g); });
      part(4, function (g) {
        el('circle', { 'class': 'sm-coal', cx: -14, cy: -272, r: 5 }, g);
        el('circle', { 'class': 'sm-coal', cx: 14, cy: -272, r: 5 }, g);
        [-16, -8, 0, 8, 16].forEach(function (dx, i) { el('circle', { 'class': 'sm-coal', cx: dx, cy: -246 - Math.abs(i - 2) * 3, r: 3 }, g); });
      });
      part(5, function (g) { el('path', { 'class': 'sm-nose', d: 'M-2 -266 L40 -258 L-2 -254 Z' }, g); });
      part(6, function (g) {
        [-200, -176, -152].forEach(function (y) { el('circle', { 'class': 'sm-coal', cx: 0, cy: y, r: 6 }, g); });
        el('path', { 'class': 'sm-arm', d: 'M-48 -190 L-118 -236 M-96 -222 L-112 -252' }, g);
        var r = el('g', { 'class': 'sm-armr' }, g);
        el('path', { 'class': 'sm-arm', d: 'M48 -190 L118 -236 M96 -222 L114 -250' }, r);
      });
      part(7, function (g) {
        el('path', { 'class': 'sm-scarf', d: 'M-42 -232 Q0 -214 42 -232 L44 -218 Q0 -200 -44 -218 Z' }, g);
        el('path', { 'class': 'sm-scarf', d: 'M18 -222 L32 -168 L16 -166 L8 -220 Z' }, g);
        el('rect', { 'class': 'sm-scarf2', x: 18, y: -190, width: 14, height: 6, transform: 'rotate(14 25 -187)' }, g);
      });
      part(8, function (g) {
        var h = el('g', { 'class': 'sm-hatg' }, g);
        el('rect', { 'class': 'sm-hat', x: -44, y: -300, width: 88, height: 10, rx: 4 }, h);
        el('rect', { 'class': 'sm-hat', x: -30, y: -362, width: 60, height: 64, rx: 6 }, h);
        el('rect', { 'class': 'sm-band', x: -30, y: -312, width: 60, height: 10 }, h);
      });
      var PART_NAMES = ['', 'the base', 'the belly', 'the head', 'eyes and a smile', 'a carrot nose', 'buttons and arms', 'a scarf', 'the top hat'];
      function showSnowman(animateStep) {
        smParts.forEach(function (g) {
          var st = +g.dataset.step;
          g.classList.toggle('is-on', st <= ST.sm);
          g.classList.toggle('is-new', st === animateStep);
        });
      }
      function smX() { return cur.smpos === 'left' ? cur.smx : W - cur.smx; }
      function placeSnowman() { smG.setAttribute('transform', 'translate(' + smX() + ' ' + (surface(smX()) + 30).toFixed(1) + ')'); }

      // ── Mini-Schneemänner: 30 Plätze von den Rändern nach innen ──
      var minisG = document.getElementById('minis');
      var MINI_X = [];
      for (var mi = 0; mi < 15; mi++) { MINI_X.push(80 + mi * 60); MINI_X.push(W - 80 - mi * 60); }
      var minis = [], miniNext = 0, miniTotal = 0;
      function addMini(name, animate) {
        var i = miniNext % MINI_X.length;
        if (minis[i]) minisG.removeChild(minis[i].node);
        // Position außen, Animation innen: CSS-transform würde das translate überschreiben
        var outer = el('g', {}, minisG);
        var g = el('g', { 'class': 'mini' + (animate ? ' mini--new' : '') }, outer);
        el('circle', { 'class': 'mini__ball', cx: 0, cy: -20, r: 22 }, g);
        el('circle', { 'class': 'mini__ball', cx: 0, cy: -54, r: 15 }, g);
        el('circle', { 'class': 'sm-coal', cx: -5, cy: -57, r: 2.4 }, g);
        el('circle', { 'class': 'sm-coal', cx: 5, cy: -57, r: 2.4 }, g);
        el('path', { 'class': 'sm-nose', d: 'M0 -53 L14 -50 L0 -48 Z' }, g);
        el('path', { 'class': 'mini__hat' + (1 + i % 4), d: 'M-16 -64 Q0 -98 16 -64 Z' }, g);
        el('circle', { 'class': 'mini__pom', cx: 0, cy: -96, r: 5 }, g);
        minis[i] = { node: outer, inner: g, x: MINI_X[i], label: name };
        miniNext++;
        placeMinis();
        if (animate) K.tag(tags, name, MINI_X[i], surface(MINI_X[i]) - 110, false);
      }
      function placeMinis() {
        minis.forEach(function (m) { if (m) m.node.setAttribute('transform', 'translate(' + m.x + ' ' + (surface(m.x) + 8).toFixed(1) + ')'); });
      }
      function clearMinis() {
        while (minisG.firstChild) minisG.removeChild(minisG.firstChild);
        minis = []; miniNext = 0; miniTotal = 0;
      }

      // ── Partikel ──
      var back = K.Particles(document.getElementById('backCanvas'));
      var front = K.Particles(document.getElementById('frontCanvas'));
      function flake(ctx, p, a) {
        ctx.globalAlpha = a * 0.9; ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
      }
      function shard(ctx, p, a) {
        ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = 'rgba(200,235,255,.95)';
        ctx.beginPath(); ctx.moveTo(-p.r, 0); ctx.lineTo(0, -p.r * 2.4); ctx.lineTo(p.r, 0); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      function drop(ctx, p, a) {
        ctx.globalAlpha = a; ctx.fillStyle = '#bfe6ff';
        ctx.beginPath(); ctx.ellipse(p.x, p.y, 2.2, 4, 0, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
      }

      // ── Animationen zu den Ereignissen ──
      function shovelAnim(r) {
        var left = Math.random() < 0.5, x = left ? rand(120, 420) : W - rand(120, 420);
        if (r.done > 0) for (var i = 0; i < 26; i++) front.add({ x: x + rand(-30, 30), y: surface(x), vx: (left ? 1 : -1) * rand(120, 380), vy: rand(-700, -350), term: 500, sway: 0, r: rand(4, 10), life: 1.6, draw: flake });
        K.tag(tags, r.done > 0 ? r.name + ' shoveled!' : r.name + ': nothing to shovel', x, surface(x) - 90, true);
      }
      var scraper = document.getElementById('scraper'), scraping = false;
      function scrapeAnim(r) {
        var c = [[0, 0], [W, 0], [0, H], [W, H]][Math.floor(Math.random() * 4)];
        var cx = c[0] ? W - 260 : 260, cy = c[1] ? H - 300 : 300;
        K.tag(tags, r.done > 0 ? r.name + ' scraped the frost!' : r.name + ': no frost yet', cx, cy - 70, true);
        if (K.reduced || scraping || !(r.done > 0)) return;
        scraping = true;
        scraper.classList.add('is-on');
        var t0 = performance.now();
        (function step(now) {
          var k = Math.min(1, (now - t0) / 1100);
          var x = cx + Math.sin(k * Math.PI * 4) * 110, y = cy + k * 60;
          scraper.setAttribute('transform', 'translate(' + x.toFixed(0) + ' ' + y.toFixed(0) + ') rotate(' + (Math.sin(k * Math.PI * 4) * 20).toFixed(0) + ')');
          if (Math.random() < 0.7) front.add({ x: x + rand(-50, 50), y: y - 10, vx: rand(-200, 200), vy: rand(-300, -100), term: 400, sway: 0, r: rand(2, 4), life: 1, draw: shard });
          if (k < 1) requestAnimationFrame(step); else { scraper.classList.remove('is-on'); scraping = false; }
        })(t0);
      }
      function icicleAnim(r) {
        var cand = icicles.filter(function (ic) { return ic.tip > 40; });
        if (!cand.length) { K.tag(tags, r.name + ': no icicles yet', W / 2, 420, true); return; }
        var ic = cand[Math.floor(Math.random() * cand.length)], len = ic.tip;
        for (var i = 0; i < 14; i++) front.add({ x: ic.x + rand(-ic.w, ic.w), y: rand(20, len), vx: rand(-60, 60), vy: rand(0, 120), g: 1400, term: 900, sway: 0, vr: rand(-6, 6), r: rand(3, ic.w), floor: surface, draw: shard });
        ic.grow = 0;
        K.tag(tags, r.name + ' broke an icicle!', ic.x, len + 60, true);
      }
      var groupBox = document.getElementById('groupBox'), groupText = document.getElementById('groupText');
      var groupTimer;
      function shakeAnim(r) {
        if (r.idle) return;
        groupBox.classList.add('is-on');
        clearTimeout(groupTimer);
        if (r.success) {
          groupText.textContent = 'Shaken off!';
          stage.classList.remove('is-shakeoff'); void stage.offsetWidth; stage.classList.add('is-shakeoff');
          setTimeout(function () { stage.classList.remove('is-shakeoff'); }, 1200);
          for (var i = 0; i < 90; i++) { var x = rand(0, W); front.add({ x: x, y: surface(x), vx: rand(-200, 200), vy: rand(-800, -300), term: 500, sway: 0, r: rand(4, 10), life: 1.8, draw: flake }); }
          groupTimer = setTimeout(function () { groupBox.classList.remove('is-on'); }, 3000);
        } else {
          groupTimer = setTimeout(function () { groupBox.classList.remove('is-on'); }, cur.shakewin * 1000);
        }
      }
      var splats = document.getElementById('splats');
      function snowball(name) {
        var tx = rand(500, 1420), ty = rand(300, 700), sx = rand(300, 1620), sy = H + 40;
        K.tag(tags, (name || 'Someone') + ' threw a snowball!', tx, ty - 110, true);
        var ball = el('circle', { 'class': 'ball', r: 10 }, splats);
        var t0 = performance.now(), dur = K.reduced ? 1 : 650;
        (function step(now) {
          var k = Math.min(1, (now - t0) / dur);
          ball.setAttribute('cx', (sx + (tx - sx) * k).toFixed(0));
          ball.setAttribute('cy', (sy + (ty - sy) * k - Math.sin(k * Math.PI) * 180).toFixed(0));
          ball.setAttribute('r', (10 + k * 34).toFixed(1));
          if (k < 1) return requestAnimationFrame(step);
          splats.removeChild(ball);
          var outer = el('g', { transform: 'translate(' + tx.toFixed(0) + ' ' + ty.toFixed(0) + ')' }, splats);
          var g = el('g', { 'class': 'splat-g' }, outer);
          var d = 'M0 -60';
          for (var a = 0; a <= 16; a++) {
            var ang = a / 16 * Math.PI * 2 - Math.PI / 2, rr = 46 + (a % 2 ? 14 : 30) * Math.random();
            d += ' L' + (Math.cos(ang) * rr).toFixed(0) + ' ' + (Math.sin(ang) * rr).toFixed(0);
          }
          el('path', { 'class': 'splat', d: d + ' Z' }, g);
          el('path', { 'class': 'splat', d: 'M-20 30 Q-18 90 -12 92 Q-6 90 -6 30 Z M14 34 Q16 70 20 72 Q26 70 26 34 Z' }, g);
          setTimeout(function () { splats.removeChild(outer); }, 5100);
          for (var i = 0; i < 16; i++) front.add({ x: tx, y: ty, vx: rand(-360, 360), vy: rand(-420, 120), term: 600, sway: 0, r: rand(3, 7), life: 0.9, draw: flake });
        })(t0);
      }
      function celebrate(name) {
        K.pulse(stage, 'celebrate', 4000);
        [[0, 1], [W, -1]].forEach(function (c) {
          for (var i = 0; i < 60; i++) front.add({ x: c[0] + c[1] * rand(0, 160), y: H - rand(20, 120), vx: c[1] * rand(250, 650), vy: rand(-1150, -650), term: 70, sway: rand(10, 30), r: rand(2, 6), life: 4, draw: flake });
        });
        if (name) K.tag(tags, 'Thank you, ' + name + '!', W / 2, 420, true);
      }
      function buildAnim(r) {
        showSnowman(r.done ? ST.sm : 0);
        if (!r.done) { K.tag(tags, 'Snowman is finished!', smX(), surface(smX()) - 420, true); return; }
        K.tag(tags, (r.name || 'Someone') + ' added ' + PART_NAMES[ST.sm] + '!', smX(), surface(smX()) - 420, true);
        if (ST.sm === 8) {
          smSvg.classList.remove('is-done'); void smSvg.getBoundingClientRect(); smSvg.classList.add('is-done');
          celebrate('');
        }
      }

      // ── Einstellungen ──
      function applySettings(changed) {
        for (var k in changed) cur[k] = changed[k];
        ['icicles', 'frost', 'cover', 'minis', 'snowman'].forEach(function (k) { stage.dataset[k] = cur[k] ? '1' : '0'; });
        dirty = true;
      }
      var dirty = true, frostDirty = true;
      applySettings(K.copy(base));

      // ── Hauptschleife ──
      var flakeAcc = 0, dripAcc = 0;
      K.loop(function (dt) {
        var now = K.serverNow();
        advance(now);
        var ns = shownSnow, nf = shownFrost;
        if (shownSnow < ST.snow || K.reduced) shownSnow = ST.snow;
        else if (shownSnow > ST.snow) shownSnow = Math.max(ST.snow, shownSnow - Math.max(15, (shownSnow - ST.snow) * 1.5) * dt);
        if (shownFrost < ST.frost || K.reduced) shownFrost = ST.frost;
        else if (shownFrost > ST.frost) shownFrost = Math.max(ST.frost, shownFrost - Math.max(15, (shownFrost - ST.frost) * 1.5) * dt);
        if (Math.abs(ns - shownSnow) > 0.05) dirty = true;
        if (Math.abs(nf - shownFrost) > 0.05) frostDirty = true;
        icicles.forEach(function (ic) { if (ic.grow < 1) { ic.grow = Math.min(1, ic.grow + dt / 30); dirty = true; } });
        if (dirty) { drawCover(); drawIce(); placeSnowman(); placeMinis(); dirty = false; }
        if (frostDirty) { drawFrost(); frostDirty = false; }

        var live = shakers.live(now);
        if (live) {
          groupText.textContent = 'Shake it off! ' + live.count + '/' + live.need;
          css('.stage{--hudp:' + live.left.toFixed(3) + '}');
        }

        var rate = (cur.falling ? DENSITY[cur.density] : 0) + (ST.snowing ? 70 : 0);
        flakeAcc += rate * dt;
        while (flakeAcc >= 1) {
          flakeAcc--;
          var r = rand(1.5, 4.5);
          (r > 3.6 ? front : back).add({ x: rand(-200, W + 200), y: -20, vy: 40 + r * 14, term: 40 + r * 16, sway: rand(10, 35), r: r, floor: surface, draw: flake });
        }
        if (cur.icicles && shownSnow > 20) {
          dripAcc += dt * 2;
          while (dripAcc >= 1) {
            dripAcc--;
            var ic = icicles[Math.floor(Math.random() * icicles.length)];
            if (ic.tip > 30) back.add({ x: ic.x, y: ic.tip, vy: 20, g: 900, term: 600, sway: 0, vr: 0, floor: surface, draw: drop });
          }
        }
        back.step(dt); front.step(dt);
      });

      // ── Spotlight: alle 8 s ein Mini-Schneemann, jedes 4. Mal der beste Helfer ──
      var spotRound = 0;
      setInterval(function () {
        spotRound++;
        var top = leaders.top()[0];
        if (top && spotRound % 4 === 0) { K.tag(tags, 'Top helper: ' + top[0] + ' · ' + top[1] + '×', W / 2, 420, false); return; }
        if (!cur.minis) return;
        var pool = minis.filter(function (m) { return m && m.label; });
        if (!pool.length) return;
        var m = pool[Math.floor(Math.random() * pool.length)];
        K.spot(m.inner);
        K.tag(tags, m.label, m.x, surface(m.x) - 110, false);
      }, 8000);

      // ── Befehle ──
      var EVENTS = { snowfall: 'start', snowstop: 'stop', shovel: 'shovel', shake: 'shake', scrape: 'scrape',
                     icicle: 'icicle', melt: 'melt', build: 'build', snowmanreset: 'smreset' };
      function command(c) {
        var p = c.params || {};
        switch (c.cmd) {
          case 'set':       applySettings(p); return;
          case 'reset':     applySettings(K.copy(base)); return;
          case 'celebrate': celebrate(p.name || ''); return;
          case 'mini':      addMini(p.name || '', true); miniTotal++; return;
          case 'snowball':  snowball(p.name || ''); return;
          case 'leaders':   leaders.show(); return;
          case 'clear':
            if (!p.kind || p.kind === 'minis') clearMinis();
            if (!p.kind || p.kind === 'snow') { ST.snow = 0; ST.frost = 0; ST.snowing = false; leaders.reset(); shakers.reset(); }
            if (!p.kind || p.kind === 'snowman') { ST.sm = 0; showSnowman(0); }
            return;
        }
        var cmd = c.cmd;
        // ohne Server-DB (oder lokal im Tune-Modus) schaltet das Overlay selbst um
        if (cmd === 'snowtoggle') cmd = ST.snowing ? 'snowstop' : 'snowfall';
        if (!EVENTS[cmd]) return;
        var r = apply(EVENTS[cmd], p.name || '', typeof c.ts === 'number' ? c.ts : K.serverNow(), p.secs);
        if (r.k === 'shovel') shovelAnim(r);
        else if (r.k === 'scrape') scrapeAnim(r);
        else if (r.k === 'icicle') icicleAnim(r);
        else if (r.k === 'shake') shakeAnim(r);
        else if (r.k === 'build') buildAnim(r);
        else if (r.k === 'smreset') showSnowman(0);
      }
      function state(s) {
        if (!s.items) return;
        resetState();
        (s.events || []).forEach(function (e) { apply(e.k, e.n || '', e.t, e.s); });
        advance(K.serverNow());
        shownSnow = ST.snow; shownFrost = ST.frost; dirty = frostDirty = true;
        showSnowman(0);
        clearMinis();
        s.items.forEach(function (it) { addMini(it.name, false); });
        miniTotal = s.item_total || 0;
      }

      var tn = K.testName;
      K.connect('winter', {
        state: state, command: command,
        status: function () {
          return 'minis: ' + miniTotal + ' | snow: ' + Math.round(ST.snow) + '%' + (ST.snowing ? ' (snowing)' : '') +
                 ' | frost: ' + Math.round(ST.frost) + '% | snowman: ' + ST.sm + '/8' +
                 ' | keys: C celebrate, M mini, B build, S snow on/off, V shovel, K shake, X scrape, I icicle, N snowball, L leaders';
        },
        keys: {
          c: function () { return { cmd: 'celebrate', params: { name: tn() } }; },
          m: function () { return { cmd: 'mini', params: { name: tn() + miniNext } }; },
          b: function () { return { cmd: 'build', params: { name: tn() } }; },
          s: function () { return { cmd: 'snowtoggle', params: {} }; },
          v: function () { return { cmd: 'shovel', params: { name: tn() } }; },
          k: function () { return { cmd: 'shake', params: { name: tn() } }; },
          x: function () { return { cmd: 'scrape', params: { name: tn() } }; },
          i: function () { return { cmd: 'icicle', params: { name: tn() } }; },
          n: function () { return { cmd: 'snowball', params: { name: tn() } }; },
          l: function () { return { cmd: 'leaders', params: {} }; }
        }
      });
      showSnowman(0);
    })();
  </script>
</body>
</html>
