<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Snow Overlay</title>
  <style>html, body { margin: 0; background: transparent; }</style>
  <script>
    // Schnee ist in der Weather-Source aufgegangen: alte URLs zeigen dort
    // dauerhaft Schnee, ohne K/D-Stimmung.
    (function () {
      var q = new URLSearchParams();
      q.set('lock', 'snow');
      q.set('mood', '0');
      window.location.replace('weather.html?' + q.toString());
    })();
  </script>
</head>
<body></body>
</html>
