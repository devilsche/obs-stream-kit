<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="../js/stinger-ready.js"></script>
  <title>Weather Overlay</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    :root {
      --edge-x: 70px;
      --edge-top: 60px;
      --edge-bottom: 24px;
      --flash: 205, 220, 255;
    }

    .stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Partikel und Blitze mit weichem Rand-Fade (-webkit- für OBS-CEF).
       Spektakel (wk-fx) bewusst ohne: Lawine, Welle, Nebelwand kommen von
       jenseits der Bildkante und müssen bis an den Rand reichen. */
    .wk-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .wk-particles, .wk-bolt {
      -webkit-mask-image:
        linear-gradient(to right, transparent, #000 var(--edge-x), #000 calc(100% - var(--edge-x)), transparent),
        linear-gradient(to bottom, transparent, #000 var(--edge-top), #000 calc(100% - var(--edge-bottom)), transparent);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(to right, transparent, #000 var(--edge-x), #000 calc(100% - var(--edge-x)), transparent),
        linear-gradient(to bottom, transparent, #000 var(--edge-top), #000 calc(100% - var(--edge-bottom)), transparent);
      mask-composite: intersect;
    }

    /* Blitz-Aufhellung: höchstens 2 Flashes pro Einschlag, nur oben */
    .wk-flash {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 70% 90% at 50% 0%,
        rgba(var(--flash), 0.9), rgba(var(--flash), 0.25) 55%, transparent 85%);
    }
    .wk-flash[data-side="left"] {
      background: radial-gradient(ellipse 70% 90% at 25% 0%,
        rgba(var(--flash), 0.9), rgba(var(--flash), 0.25) 55%, transparent 85%);
    }
    .wk-flash[data-side="right"] {
      background: radial-gradient(ellipse 70% 90% at 75% 0%,
        rgba(var(--flash), 0.9), rgba(var(--flash), 0.25) 55%, transparent 85%);
    }
    .wk-flash.is-flashing { animation: wkFlash 700ms ease-out forwards; }
    @keyframes wkFlash {
      0%   { opacity: 0; }
      5%   { opacity: 0.34; }
      12%  { opacity: 0.05; }
      20%  { opacity: 0.24; }
      100% { opacity: 0; }
    }

    /* Grauschleier über das ganze Bild bei mieser Stimmung (Schalter veil) */
    .wk-veil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: rgb(18, 22, 34);
      opacity: 0;
      transition: opacity 6s ease;
    }
    :root[data-testbg="on"] body {
      background: var(--wk-testbg) center / cover no-repeat;
    }

    :root[data-veil="on"] .wk-veil { opacity: calc(var(--wk-gloom, 0) * 0.1); }

    @media (prefers-reduced-motion: reduce) {
      .wk-flash.is-flashing { animation: none; }
      .wk-veil { transition: none; }
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">
    <div class="wk-veil" aria-hidden="true"></div>
  </div>

  <script src="../js/weather-kit.js"></script>
  <script>
    (function () {
      'use strict';

      // Weather-Source: Zustand kommt vom Server (/api/fx/weather/state —
      // echtes Wetter, K/D-Stimmung, Chat-Übersteuerung), Befehle aus der
      // fx-Warteschlange. lock=<lage> zeigt eine feste Lage ohne Server.
      var K = window.WeatherKit;
      var params = new URLSearchParams(window.location.search);
      var kit = K.create(document.getElementById('stage'));
      var rootEl = document.documentElement;

      var KEYS = ['place', 'testbg', 'mood', 'kdlow', 'kdhigh', 'kdtest', 'fallback', 'lock', 'wind', 'veil'];
      function fromUrl() {
        var out = {};
        KEYS.forEach(function (k) {
          var v = params.get(k);
          if (v !== null && v !== '') out[k] = v;
        });
        return out;
      }
      var settings = fromUrl();

      function flag(v) { return v === true || v === '1' || v === 'on' || v === 'true'; }
      function locked() {
        var l = settings.lock;
        return l && l !== 'off' && K.KINDS.indexOf(l) >= 0 ? l : null;
      }

      // ── Zustand anwenden (nur bei echter Änderung, sonst würde jeder Abruf
      //    den Übergang und den Blitz-Takt neu starten) ──
      var lastSig = null;
      var SIG_KEYS = ['kind', 'rain', 'drizzle', 'snow', 'clouds', 'sun', 'fog', 'heat', 'gloom', 'lightning', 'wind', 'windRandom'];
      // Wind aus dem Schalter: auto = Wind der Lage (live: echter Wind),
      // random = wechselt von selbst, Zahl = fest
      function withWind(state) {
        var st = {};
        for (var k in state) st[k] = state[k];
        var w = settings.wind;
        st.windRandom = w === 'random';
        var n = parseFloat(w);
        if (!isNaN(n)) st.wind = Math.max(-1, Math.min(1, n));
        return st;
      }
      function apply(state, secs) {
        state = withWind(state);
        var sig = SIG_KEYS.map(function (k) {
          return typeof state[k] === 'number' ? state[k].toFixed(2) : String(state[k]);
        }).join('|');
        // Grauschleier folgt nur der schlechten K/D, nicht der Grundtrübung bei Regen
        rootEl.style.setProperty('--wk-gloom', String(Math.max(0, -(state.mood || 0))));
        if (sig === lastSig) return;
        lastSig = sig;
        kit.setState(state, secs);
      }
      function applyVeil() {
        rootEl.dataset.veil = flag(settings.veil) ? 'on' : 'off';
      }

      // Testhintergrund nur außerhalb von OBS (dort liegt das echte Spiel dahinter)
      function applyTestBg() {
        var url = settings.testbg;
        var ok = !window.obsstudio && typeof url === 'string' && /^https?:\/\/[^\s"'()\\]+$/.test(url);
        rootEl.dataset.testbg = ok ? 'on' : 'off';
        if (ok) rootEl.style.setProperty('--wk-testbg', 'url("' + url + '")');
        else rootEl.style.removeProperty('--wk-testbg');
      }

      function applyLock() {
        apply(K.profile(locked()), lastSig === null ? 0 : 4);
      }

      var tokenMatch = window.location.pathname.match(/^\/s\/([A-Za-z0-9_]+)\//);
      var apiBase = tokenMatch ? '/s/' + tokenMatch[1] + '/api/fx/' : null;

      // ── Server-Zustand alle 15 s, sofort nach weather/auto/set ──
      // Eine Chat-Übersteuerung gewinnt auch gegen eine feste Lage (lock).
      // Nur die jüngste Antwort zählt, eine verspätete ältere wird verworfen.
      var stateTimer = null, stateReq = 0;
      // nach einer Änderung aus dem Dashboard schnell überblenden (sonst 25 s)
      var fastNext = false;
      function fetchState() {
        clearTimeout(stateTimer);
        var req = ++stateReq;
        if (!apiBase) {
          if (locked()) applyLock(); else apply(K.profile(settings.fallback || 'clear'), 0);
          return;
        }
        if (locked() && lastSig === null) applyLock();
        var q = new URLSearchParams();
        ['place', 'mood', 'kdlow', 'kdhigh', 'kdtest', 'fallback'].forEach(function (k) {
          if (settings[k] !== undefined) q.set(k, settings[k]);
        });
        fetch(apiBase + 'weather/state?' + q.toString(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
          .then(function (data) {
            if (req !== stateReq) return;
            var st = data.state;
            if (locked() && st.source !== 'override') applyLock();
            else apply(st, lastSig === null ? 0 : (fastNext ? 4 : st.transition));
            fastNext = false;
          })
          .catch(function () {
            if (req !== stateReq) return;
            // ohne Server: feste Lage bzw. Ersatz-Lage, nie einfrieren
            if (locked()) applyLock();
            else if (lastSig === null) apply(K.profile(settings.fallback || 'clear'), 0);
          })
          .then(function () {
            if (req === stateReq) stateTimer = setTimeout(fetchState, 15000);
          });
      }

      function randomShow() { return K.SPECTACLES[Math.floor(Math.random() * K.SPECTACLES.length)]; }

      // ── Befehle ──
      function applyCommand(c) {
        var p = c.params || {};
        switch (c.cmd) {
          case 'weather':
          case 'auto':
            fetchState();
            break;
          case 'strike':
            kit.strike(p.dist);
            break;
          case 'gust':
            kit.gust();
            break;
          case 'spectacle':
            kit.spectacle(p.type || randomShow());
            break;
          case 'set':
            Object.keys(p).forEach(function (k) { settings[k] = String(p[k]); });
            fastNext = true;
            applyVeil();
            applyTestBg();
            fetchState();
            break;
          case 'reset':
            settings = fromUrl();
            fastNext = true;
            applyVeil();
            applyTestBg();
            fetchState();
            break;
        }
      }

      // Alte rain.html-URLs leiten mit chan=rain hierher um: deren
      // Streamer.bot-Aktionen (/api/fx/rain) wirken weiter
      var RAIN_KIND = { light: 'drizzle', medium: 'rain', heavy: 'rain', storm: 'storm' };
      function applyRainCommand(c) {
        var p = c.params || {};
        switch (c.cmd) {
          case 'strike': kit.strike(p.dist); break;
          case 'gust': kit.gust(); break;
          case 'stop': settings.lock = 'clear'; fetchState(); break;
          case 'start':
            settings.lock = params.get('lock') || 'rain';
            fetchState();
            break;
          case 'set':
            if (p.intensity && RAIN_KIND[p.intensity]) settings.lock = RAIN_KIND[p.intensity];
            if (p.wind !== undefined) settings.wind = String(p.wind);
            fetchState();
            break;
          case 'reset':
            settings = fromUrl();
            fetchState();
            break;
        }
      }

      function listen(effect, handler) {
        var seq = null, epoch = null;
        function pollOnce() {
          var delay = 1000;
          fetch(apiBase + effect + '/poll' + (seq === null ? '' : '?since=' + seq), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
            .then(function (data) {
              if (epoch !== null && data.epoch !== epoch) {
                // Server neu gestartet: Zähler beginnt bei 0, alles ab dort holen
                epoch = data.epoch;
                seq = 0;
                delay = 0;
                return;
              }
              epoch = data.epoch;
              if (seq !== null) (data.commands || []).forEach(handler);
              seq = data.seq;
            })
            .catch(function () { delay = 3000; })
            .then(function () { setTimeout(pollOnce, delay); });
        }
        pollOnce();
      }

      applyVeil();
      applyTestBg();
      fetchState();
      if (apiBase) {
        listen('weather', applyCommand);
        if (params.get('chan') === 'rain') listen('rain', applyRainCommand);
      }
    })();
  </script>

</body>
</html>
