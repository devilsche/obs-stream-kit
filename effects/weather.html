<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="../js/stinger-ready.js"></script>
  <link rel="stylesheet" href="../js/season-kit.css" />
  <link rel="stylesheet" href="../js/theme-winter.css" />
  <link rel="stylesheet" href="../js/theme-seasons.css" />
  <title>Weather Overlay</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    :root {
      --edge-x: 70px;
      --edge-top: 60px;
      --edge-bottom: 24px;
      --flash: 205, 220, 255;
    }

    .stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Partikel und Blitze mit weichem Rand-Fade (-webkit- für OBS-CEF).
       Spektakel (wk-fx) bewusst ohne: Lawine, Welle, Nebelwand kommen von
       jenseits der Bildkante und müssen bis an den Rand reichen. */
    .wk-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .wk-particles, .wk-bolt {
      -webkit-mask-image:
        linear-gradient(to right, transparent, #000 var(--edge-x), #000 calc(100% - var(--edge-x)), transparent),
        linear-gradient(to bottom, transparent, #000 var(--edge-top), #000 calc(100% - var(--edge-bottom)), transparent);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(to right, transparent, #000 var(--edge-x), #000 calc(100% - var(--edge-x)), transparent),
        linear-gradient(to bottom, transparent, #000 var(--edge-top), #000 calc(100% - var(--edge-bottom)), transparent);
      mask-composite: intersect;
    }

    /* Blitz-Aufhellung: höchstens 2 Flashes pro Einschlag, nur oben */
    .wk-flash {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 70% 90% at 50% 0%,
        rgba(var(--flash), 0.9), rgba(var(--flash), 0.25) 55%, transparent 85%);
    }
    .wk-flash[data-side="left"] {
      background: radial-gradient(ellipse 70% 90% at 25% 0%,
        rgba(var(--flash), 0.9), rgba(var(--flash), 0.25) 55%, transparent 85%);
    }
    .wk-flash[data-side="right"] {
      background: radial-gradient(ellipse 70% 90% at 75% 0%,
        rgba(var(--flash), 0.9), rgba(var(--flash), 0.25) 55%, transparent 85%);
    }
    .wk-flash.is-flashing { animation: wkFlash 700ms ease-out forwards; }
    @keyframes wkFlash {
      0%   { opacity: 0; }
      5%   { opacity: 0.34; }
      12%  { opacity: 0.05; }
      20%  { opacity: 0.24; }
      100% { opacity: 0; }
    }

    /* Frost-Ebene liegt auf der „Scheibe“ über allem; frost=0 blendet sie aus */
    .wk-frost { pointer-events: none; }
    .stage { --tag-big: #dff3ff; --hud-bg: rgba(16, 30, 48, 0.82); --hud-line: rgba(200, 235, 255, 0.7); }
    .wk-tags { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }

    /* Hinweis nur im Browser-Tab, wenn der Ton noch blockiert ist */
    .wk-sound-unlock {
      position: absolute; right: 24px; bottom: 24px; z-index: 10;
      min-height: 40px; padding: 10px 18px; border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.8); background: rgba(16, 24, 40, 0.85);
      color: #fff; font: 600 16px 'DM Sans', sans-serif; cursor: pointer;
    }
    .wk-sound-unlock:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
    .wk-sound-unlock[hidden] { display: none; }

    /* Grauschleier über das ganze Bild bei mieser Stimmung (Schalter veil) */
    .wk-veil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: rgb(18, 22, 34);
      opacity: 0;
      transition: opacity 6s ease;
    }
    :root[data-testbg="on"] body {
      background: var(--wk-testbg) center / cover no-repeat;
    }

    :root[data-veil="on"] .wk-veil { opacity: calc(var(--wk-gloom, 0) * 0.1); }

    @media (prefers-reduced-motion: reduce) {
      .wk-flash.is-flashing { animation: none; }
      .wk-veil { transition: none; }
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">
    <div class="wk-veil" aria-hidden="true"></div>
  </div>
  <svg class="wk-tags" viewBox="0 0 1920 1080" aria-hidden="true"><g id="tags"></g></svg>
  <button type="button" class="wk-sound-unlock" id="soundUnlock" hidden>Click to enable sound</button>
  <div class="hud">
    <div class="hud__box" id="frostBoard"><h2>Top frost fighters</h2><ol></ol></div>
  </div>

  <script src="../js/season-kit.js"></script>
  <script src="../js/weather-kit.js"></script>
  <script src="../js/weather-frost.js"></script>
  <script src="../js/weather-audio.js"></script>
  <script src="../js/theme-winter.js"></script>
  <script src="../js/theme-seasons.js"></script>
  <script src="../js/theme-autumn.js"></script>
  <script src="../js/theme-spring.js"></script>
  <script src="../js/theme-summer.js"></script>
  <script>
    (function () {
      'use strict';

      // Weather-Source: Zustand kommt vom Server (/api/fx/weather/state —
      // echtes Wetter, K/D-Stimmung, Chat-Übersteuerung), Befehle aus der
      // fx-Warteschlange. lock=<lage> zeigt eine feste Lage ohne Server.
      var K = window.WeatherKit;
      var params = new URLSearchParams(window.location.search);
      var kit = K.create(document.getElementById('stage'));
      // Deko-Thema vor dem Frost anlegen: der Frost liegt als „Scheibe“ darüber
      var theme = window.ThemeWinter.create(document.getElementById('stage'), {
        tags: document.getElementById('tags'), hud: document.querySelector('.hud') });
      // Herbst, Frühling, Sommer: je ein Baustein, sichtbar nur im eigenen Thema
      var seasonOpts = { tags: document.getElementById('tags'), hud: document.querySelector('.hud'),
                         sky: function () { return kit.state(); } };
      var seasons = {
        autumn: window.ThemeAutumn.create(document.getElementById('stage'), seasonOpts),
        spring: window.ThemeSpring.create(document.getElementById('stage'), seasonOpts),
        summer: window.ThemeSummer.create(document.getElementById('stage'), seasonOpts)
      };
      var frost = window.WeatherFrost.create(document.getElementById('stage'), {
        tags: document.getElementById('tags'), board: document.getElementById('frostBoard') });
      var lastFrostTop = [];
      // Ton (optional): Regen/Wind folgen der Lage, Donner je Blitz, Rauschen je Böe
      var soundBtn = document.getElementById('soundUnlock');
      var audio = window.WeatherAudio.create('../assets/effects/', {
        thunderFile: '../assets/stingers/thunder-124463.mp3',
        // nur im Browser-Tab: Hinweis, dass ein Klick den Ton freigibt
        onBlocked: function (isBlocked) { soundBtn.hidden = !isBlocked || !!window.obsstudio; }
      });
      kit.on('strike', function (dist) { audio.thunder(dist); });
      kit.on('gust', function () { audio.gust(); });
      kit.on('pop', function () { audio.thunder(0.1); });
      setInterval(function () { audio.update(kit.state()); }, 250);
      var rootEl = document.documentElement;

      var KEYS = ['place', 'testbg', 'mood', 'kdlow', 'kdhigh', 'kdtest', 'fallback', 'lock', 'wind', 'veil',
                  'aurorakd', 'frost', 'frostrate', 'sound', 'volume', 'thunder',
                  'theme', 'xmasfrom', 'xmasto', 'snowrate', 'leafrate', 'shakeneed', 'shakewin',
                  'lights', 'tree', 'baubles', 'gifts', 'snowman', 'minis', 'icicles', 'cover',
                  'garland', 'branch', 'pile', 'pumpkins', 'meadow', 'bugs', 'beach', 'umbrella'];
      // Deko-Teile, die einzeln abschaltbar sind (fehlt = an); branch gilt
      // für den Herbst-Ast und den Kirschzweig im Frühling
      var PARTS = ['lights', 'tree', 'baubles', 'gifts', 'snowman', 'minis', 'icicles', 'cover',
                   'garland', 'branch', 'pile', 'pumpkins', 'meadow', 'bugs', 'beach', 'umbrella'];
      function fromUrl() {
        var out = {};
        KEYS.forEach(function (k) {
          var v = params.get(k);
          if (v !== null && v !== '') out[k] = v;
        });
        return out;
      }
      var settings = fromUrl();

      function flag(v) { return v === true || v === '1' || v === 'on' || v === 'true'; }
      function locked() {
        var l = settings.lock;
        return l && l !== 'off' && K.KINDS.indexOf(l) >= 0 ? l : null;
      }

      // ── Zustand anwenden (nur bei echter Änderung, sonst würde jeder Abruf
      //    den Übergang und den Blitz-Takt neu starten) ──
      var lastSig = null;
      // Felder, die sich ändern, ohne dass das Bild anders aussieht
      var SIG_SKIP = { until: 1, transition: 1, source: 1, temp: 1, freezing: 1,
                       frost: 1, frostTop: 1, frostOn: 1,
                       theme: 1, xmas: 1, snowCover: 1, snowTop: 1, seasonLevels: 1, seasonTop: 1 };
      // Wind aus dem Schalter: auto = Wind der Lage (live: echter Wind),
      // random = wechselt von selbst, Zahl = fest
      function withWind(state) {
        var st = {};
        for (var k in state) st[k] = state[k];
        var w = settings.wind;
        st.windRandom = w === 'random';
        var n = parseFloat(w);
        if (!isNaN(n)) st.wind = Math.max(-1, Math.min(1, n));
        return st;
      }
      function apply(state, secs) {
        state = withWind(state);
        // alle sichtbaren Felder vergleichen (auch Polarlicht, Mond, Sonnenstand)
        var sig = Object.keys(state).sort().filter(function (k) { return !SIG_SKIP[k]; }).map(function (k) {
          return k + '=' + (typeof state[k] === 'number' ? state[k].toFixed(2) : String(state[k]));
        }).join('|');
        // Frost läuft getrennt vom Wetter-Übergang
        if (typeof state.frost === 'number') {
          frost.update(state.frost, state.frostOn !== false && settings.frost !== '0' && settings.frost !== 'off');
          lastFrostTop = state.frostTop || [];
        }
        // Grauschleier folgt nur der schlechten K/D, nicht der Grundtrübung bei Regen
        rootEl.style.setProperty('--wk-gloom', String(Math.max(0, -(state.mood || 0))));
        applyTheme(state);
        if (sig === lastSig) return;
        lastSig = sig;
        kit.setState(state, secs);
      }
      // ── Deko-Thema (Winter mit Xmas-Zeit) ──
      function partOn(v) { return v === undefined || !(v === false || v === '0' || v === 'off' || v === 'false'); }
      function applyTheme(state) {
        var parts = {};
        PARTS.forEach(function (k) { parts[k] = partOn(settings[k]); });
        theme.update({ theme: state.theme || 'none', xmas: state.xmas || 'off',
                       snowCover: typeof state.snowCover === 'number' ? state.snowCover : 0,
                       snowTop: state.snowTop || [], heat: state.heat || 0, night: state.night || 0,
                       parts: parts });
        var ss = {};
        for (var k in state) ss[k] = state[k];
        ss.theme = state.theme || 'none';
        ss.parts = parts;
        Object.keys(seasons).forEach(function (n) { seasons[n].update(ss); });
        lastTheme = state.theme || 'none';
        wantStep(lastTheme === 'winter' ? state.xmas : null);
      }

      // Fälliger Aufbau/Abschied: in OBS erst, wenn die Source 2 min live im
      // Programm ist, im Browser-Tab sofort; danach meldet xmasdone den Schritt
      var lastTheme = 'none';
      var played = {}, pending = null, readySince = null;
      var obsActive = true;   // ohne Auskunft von OBS: als live annehmen
      window.addEventListener('obsSourceActiveChanged', function (e) {
        obsActive = !!(e.detail && e.detail.active);
        readySince = null;
        checkPending();
      });
      function wantStep(xmas) {
        var step = (xmas === 'setup' || xmas === 'farewell') && !played[xmas] ? xmas : null;
        if (step !== pending) { pending = step; readySince = null; }
        checkPending();
      }
      function checkPending() {
        if (!pending || theme.busy()) return;
        if (window.obsstudio) {
          if (!obsActive) { readySince = null; return; }
          if (readySince === null) readySince = Date.now();
          if (Date.now() - readySince < 120000) return;
        }
        var step = pending;
        pending = null;
        playStep(step, true);
      }
      setInterval(checkPending, 1000);
      function playStep(step, auto) {
        played[step] = true;
        if (pending === step) pending = null;
        var fn = step === 'setup' ? theme.playSetup : theme.playFarewell;
        fn(function () {
          if (!apiBase) return;
          var done = auto ? fetch(apiBase + 'weather?cmd=xmasdone&step=' + step, { cache: 'no-store' }) : Promise.resolve();
          done.catch(function () {}).then(function () { fetchState(); });
        });
      }

      function applyVeil() {
        rootEl.dataset.veil = flag(settings.veil) ? 'on' : 'off';
        audio.set({ on: flag(settings.sound),
                    volume: settings.volume !== undefined ? parseFloat(settings.volume) : 0.6,
                    thunder: settings.thunder !== undefined ? parseFloat(settings.thunder) : 1 });
      }

      // Testhintergrund nur außerhalb von OBS (dort liegt das echte Spiel dahinter)
      function applyTestBg() {
        var url = settings.testbg;
        var ok = !window.obsstudio && typeof url === 'string' && /^https?:\/\/[^\s"'()\\]+$/.test(url);
        rootEl.dataset.testbg = ok ? 'on' : 'off';
        if (ok) rootEl.style.setProperty('--wk-testbg', 'url("' + url + '")');
        else rootEl.style.removeProperty('--wk-testbg');
      }

      function applyLock() {
        apply(K.profile(locked()), lastSig === null ? 0 : 4);
      }

      var tokenMatch = window.location.pathname.match(/^\/s\/([A-Za-z0-9_]+)\//);
      var apiBase = tokenMatch ? '/s/' + tokenMatch[1] + '/api/fx/' : null;

      // ── Server-Zustand alle 15 s, sofort nach weather/auto/set ──
      // Die feste Lage (lock) rechnet der Server: sie ersetzt nur das echte
      // Wetter, Stimmung, Tageszeit und Chat wirken weiter darüber.
      // Nur die jüngste Antwort zählt, eine verspätete ältere wird verworfen.
      var stateTimer = null, stateReq = 0;
      // nach einer Änderung aus dem Dashboard schnell überblenden (sonst 25 s)
      var fastNext = false;
      function fetchState() {
        clearTimeout(stateTimer);
        var req = ++stateReq;
        if (!apiBase) {
          if (locked()) applyLock(); else apply(K.profile(settings.fallback || 'clear'), 0);
          return;
        }
        var q = new URLSearchParams();
        ['place', 'lock', 'mood', 'kdlow', 'kdhigh', 'kdtest', 'fallback', 'aurorakd', 'frost', 'frostrate',
         'theme', 'xmasfrom', 'xmasto', 'snowrate', 'leafrate'].forEach(function (k) {
          if (settings[k] !== undefined) q.set(k, settings[k]);
        });
        fetch(apiBase + 'weather/state?' + q.toString(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
          .then(function (data) {
            if (req !== stateReq) return;
            var st = data.state;
            apply(st, lastSig === null ? 0 : (fastNext ? 4 : st.transition));
            fastNext = false;
          })
          .catch(function () {
            if (req !== stateReq) return;
            // ohne Server: feste Lage bzw. Ersatz-Lage, nie einfrieren
            if (locked()) applyLock();
            else if (lastSig === null) apply(K.profile(settings.fallback || 'clear'), 0);
          })
          .then(function () {
            if (req === stateReq) stateTimer = setTimeout(fetchState, 15000);
          });
      }

      function randomShow() { return K.SPECTACLES[Math.floor(Math.random() * K.SPECTACLES.length)]; }

      // ── Befehle ──
      var SEASON_OF = { pumpkins: 'autumn', leaves: 'autumn', flowers: 'spring', garden: 'spring',
                        castles: 'summer', heat: 'summer' };
      var LEVEL_KINDS = { leaves: 1, garden: 1, heat: 1 };
      var SEASON_OF_CMD = { pumpkin: 'autumn', rake: 'autumn', jump: 'autumn', sweep: 'autumn',
                            flower: 'spring', water: 'spring', weed: 'spring', bee: 'spring',
                            castle: 'summer', splash: 'summer', ice: 'summer', cool: 'summer' };
      function applyCommand(c) {
        var p = c.params || {};
        switch (c.cmd) {
          case 'weather':
          case 'auto':
            fetchState();
            break;
          case 'strike':
            kit.strike(p.dist);
            break;
          case 'gust':
            kit.gust();
            if (seasons[lastTheme]) seasons[lastTheme].command('gust', p);
            break;
          case 'scrape':
            frost.scrape(p.name, p.done, p.level);
            break;
          case 'warm':
            frost.warm(p.name, p.done, p.level);
            break;
          case 'frostclear':
            frost.clearAll();
            fetchState();
            break;
          case 'frostreset':
            lastFrostTop = [];
            break;
          case 'leaders':
            frost.leaders(lastFrostTop);
            break;
          case 'spectacle':
            kit.spectacle(p.type || randomShow());
            break;
          // Winter-Thema
          case 'ornament':
          case 'gift':
          case 'mini':
          case 'build':
          case 'snowmanreset':
          case 'shovel':
          case 'icicle':
          case 'snowball':
          case 'snowboard':
            theme.command(c.cmd, p);
            break;
          // gemeinsam: an das aktive Thema
          case 'celebrate':
            (seasons[lastTheme] || theme).command('celebrate', p);
            break;
          case 'seasonboard':
            if (seasons[lastTheme]) seasons[lastTheme].command('seasonboard', p);
            else if (lastTheme === 'winter') theme.command('snowboard', p);
            break;
          case 'clear':
            // Art bestimmt das Thema; Stände holt der nächste Abruf vom Server
            if (SEASON_OF[p.kind]) {
              seasons[SEASON_OF[p.kind]].command('clear', p);
              if (LEVEL_KINDS[p.kind]) fetchState();
            } else theme.command('clear', p);
            break;
          // Herbst, Frühling, Sommer: Follower-Items immer (Stand bleibt
          // aktuell), Aktionen nur im aktiven Thema
          case 'pumpkin':
          case 'flower':
          case 'castle':
            seasons[SEASON_OF_CMD[c.cmd]].command(c.cmd, p);
            break;
          case 'rake':
          case 'jump':
          case 'sweep':
          case 'water':
          case 'weed':
          case 'bee':
          case 'splash':
          case 'ice':
          case 'cool':
            if (SEASON_OF_CMD[c.cmd] === lastTheme) seasons[lastTheme].command(c.cmd, p);
            break;
          case 'shake':
            theme.command('shake', Object.assign({ win: settings.shakewin }, p));
            break;
          case 'setup':
          case 'farewell':
            playStep(c.cmd, false);
            break;
          case 'set':
            Object.keys(p).forEach(function (k) { settings[k] = String(p[k]); });
            fastNext = true;
            applyVeil();
            applyTestBg();
            fetchState();
            break;
          case 'reset':
            settings = fromUrl();
            fastNext = true;
            applyVeil();
            applyTestBg();
            fetchState();
            break;
        }
      }

      // Alte rain.html-URLs leiten mit chan=rain hierher um: deren
      // Streamer.bot-Aktionen (/api/fx/rain) wirken weiter
      var RAIN_KIND = { light: 'drizzle', medium: 'rain', heavy: 'rain', storm: 'storm' };
      function applyRainCommand(c) {
        var p = c.params || {};
        switch (c.cmd) {
          case 'strike': kit.strike(p.dist); break;
          case 'gust': kit.gust(); break;
          case 'stop': settings.lock = 'clear'; fetchState(); break;
          case 'start':
            settings.lock = params.get('lock') || 'rain';
            fetchState();
            break;
          case 'set':
            if (p.intensity && RAIN_KIND[p.intensity]) settings.lock = RAIN_KIND[p.intensity];
            if (p.wind !== undefined) settings.wind = String(p.wind);
            fetchState();
            break;
          case 'reset':
            settings = fromUrl();
            fetchState();
            break;
        }
      }

      // onState: Deko-Stand aus dem ersten Poll (ohne since)
      function listen(effect, handler, onState) {
        var seq = null, epoch = null;
        function pollOnce() {
          var delay = 1000;
          fetch(apiBase + effect + '/poll' + (seq === null ? '' : '?since=' + seq), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
            .then(function (data) {
              if (epoch !== null && data.epoch !== epoch) {
                // Server neu gestartet: Zähler beginnt bei 0, alles ab dort holen
                epoch = data.epoch;
                seq = 0;
                delay = 0;
                return;
              }
              epoch = data.epoch;
              if (seq === null) { if (onState && data.state) onState(data.state); }
              else (data.commands || []).forEach(handler);
              seq = data.seq;
            })
            .catch(function () { delay = 3000; })
            .then(function () { setTimeout(pollOnce, delay); });
        }
        pollOnce();
      }

      applyVeil();
      applyTestBg();
      fetchState();
      if (apiBase) {
        listen('weather', applyCommand, function (st) {
          theme.load(st);
          Object.keys(seasons).forEach(function (n) { seasons[n].load(st); });
        });
        if (params.get('chan') === 'rain') listen('rain', applyRainCommand);
      }
    })();
  </script>

</body>
</html>
