<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Friend</title>
  <!-- Friend: animierter Hund (js/friend-dog.js) am unteren Bildrand, 1920×1080, durchsichtig, dauerhaft sichtbar.
       Läuft von sich aus herum, sitzt, schläft; reagiert auf jeden Alert (der Server reicht Alert-Ereignisse automatisch
       weiter), auf den Burnout und auf Befehle:
         /s/<token>/api/fx/friend?cmd=react&event=follow|sub|resub|giftsub|bits|raid|donation|welcome|burnout|pet
         /s/<token>/api/fx/friend?cmd=act&action=walk|run|stand|sit|lie|sleep|paw|roll|bark|wag|turn|come&face=1–12
       URL: size (Höhe in px, Standard 170), fur (pinscher|red|dark|natural), body (pinscher|jack), area (full|left|right|center),
       roam (1/0), sound (1/0, Standard 1), volume (0–1), on_<event>=happy|roll|zoomies|paw|bark|sit|pet|none, demo=1. -->
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #friend { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="friend" width="1920" height="1080" aria-hidden="true"></canvas>
  <script src="../js/vendor/three-r128.min.js"></script>
  <script src="../js/vendor/three-r128-GLTFLoader.js"></script>
  <script src="../js/friend-dog.js"></script>
  <script>
    (function () {
      'use strict';
      var p = new URLSearchParams(location.search);
      function num(k, d, lo, hi) { var v = parseFloat(p.get(k)); return isNaN(v) ? d : Math.max(lo, Math.min(hi, v)); }
      var reactions = {};
      FriendDog.REACTIONS.forEach(function (ev) { if (p.get('on_' + ev)) reactions[ev] = p.get('on_' + ev); });
      var f = FriendDog.create({
        // Heldentat: nach dem Pinkeln das Feuer wirklich löschen (zählt in der Feuerwehr-Rangliste als „Friend“)
        onExtinguish: function () { var mm = location.pathname.match(/^\/s\/([A-Za-z0-9_]+)\//); if (mm) fetch('/s/' + mm[1] + '/api/fx/weather?cmd=extinguish&name=Friend', { cache: 'no-store' }).catch(function () {}); },
        testPose: (p.get('pt') || '').split(',').filter(Boolean).map(function (e) { var q = e.split(':'); return [q[0], parseFloat(q[1]) || 0, q[2] || 'lat']; }),
        canvas: document.getElementById('friend'), model: '../assets/friend/dog.glb', barkSound: '../assets/friend/bark.mp3', growlSound: '../assets/friend/growl.mp3',
        sizePx: num('size', 170, 60, 500), fur: p.get('fur') || 'pinscher', body: p.get('body') || 'pinscher', ears: p.has('ears') ? num('ears', 85, 0, 100) / 100 : null,
        area: p.get('area') || 'full', roam: p.get('roam') !== '0', sound: p.get('sound') !== '0', volume: num('volume', 0.5, 0, 1),
        reactions: reactions
      });
      f.ready.then(function () {
        // ?try=beg|growl|shakeoff|roll|playdead … bzw. ?try=weather:tornado – zum Ausprobieren in der Vorschau
        var tr = p.get('try');
        if (tr) setTimeout(function () { if (/^weather:/.test(tr)) f.weather(tr.slice(8)); else if (/^fire:/.test(tr)) f.react('fire', { x: +tr.slice(5) }); else f.act(tr, { face: p.has('tryface') ? +p.get('tryface') : 6 }); }, 1500);
        if (p.get('demo') === '1') {
          var evs = ['follow', 'sub', 'raid', 'bits', 'welcome', 'pet'], i = 0;
          setInterval(function () { f.react(evs[i++ % evs.length]); }, 14000);
        }
        // Befehle von Streamer.bot / Dashboard / Server (Alerts): nur über die Token-URL
        var m = location.pathname.match(/^\/s\/([A-Za-z0-9_]+)\//);
        if (!m) return;
        var url = '/s/' + m[1] + '/api/fx/friend/poll', seq = null, epoch = null;
        // Wetter-Befehle mitlesen (dieselben wie weather.html): Regen, Blitz, Hagel, Tornado, Tsunami … wirken auf den Hund
        if (p.get('weather') !== '0') (function () {
          var wurl = '/s/' + m[1] + '/api/fx/weather/poll', wseq = null, wep = null;
          (function wpoll() {
            var delay = 1000;
            fetch(wurl + (wseq === null ? '' : '?since=' + wseq), { cache: 'no-store' })
              .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
              .then(function (d) {
                if (wep !== null && d.epoch !== wep) { wep = d.epoch; wseq = 0; delay = 0; return; }
                wep = d.epoch;
                if (wseq !== null) (d.commands || []).forEach(function (c) {
                  var q = c.params || {};
                  if (c.cmd === 'weather' && q.to) f.weather(q.to);
                  else if (c.cmd === 'strike') f.weather('strike');
                  else if (c.cmd === 'spectacle' && q.type) f.weather(q.type, q);
                });
                wseq = d.seq;
              })
              .catch(function () { delay = 4000; })
              .then(function () { setTimeout(wpoll, delay); });
          })();
        })();
        (function poll() {
          var delay = 600;
          fetch(url + (seq === null ? '' : '?since=' + seq), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
            .then(function (d) {
              if (epoch !== null && d.epoch !== epoch) { epoch = d.epoch; seq = 0; delay = 0; return; }   // Server neu gestartet
              epoch = d.epoch;
              if (seq !== null) (d.commands || []).forEach(function (c) {
                var q = c.params || {};
                if (c.cmd === 'react') f.react(q.event, q);
                else if (c.cmd === 'act') f.act(q.action, q);
              });
              seq = d.seq;
            })
            .catch(function () { delay = 3000; })
            .then(function () { setTimeout(poll, delay); });
        })();
      });
    })();
  </script>
</body>
</html>
