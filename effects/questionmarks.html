<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="../js/stinger-ready.js"></script>
  <title>Question Marks</title>
  <!-- Fragezeichen (!wtf): Fragezeichen steigen von unten auf, werden dichter, zum Schluss zieht ein großes durch die Mitte.
       Dazu die Akte-X-Musik. Schrift und Farben aus dem Theme (--theme-font-display, --theme-accent, --theme-text),
       Theme-Wechsel greift ohne Neuladen. Ersetzt das alte Greenscreen-Video.
       URL: duration (Sekunden bis zum Ausblenden, Standard 9), count (Dichte 0.3–2), sound (1/0), volume (0–1, Faktor). -->
  <link rel="stylesheet" href="../widgets/_theme.css">
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
    canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  </style>
</head>
<body>
  <canvas id="qm" width="1920" height="1080" aria-hidden="true"></canvas>
  <audio id="music" data-stinger-autoplay data-volume="0.12" preload="auto" src="../assets/stingers/xfiles.mp3"></audio>
  <script>
    (function () {
      'use strict';
      var p = new URLSearchParams(location.search);
      function num(k, d, lo, hi) { var v = parseFloat(p.get(k)); return isNaN(v) ? d : Math.max(lo, Math.min(hi, v)); }
      var DUR = num('duration', 9, 3, 14), DENS = num('count', 1, 0.3, 2), FADE = 0.6;
      var cv = document.getElementById('qm'), g = cv.getContext('2d'), W = cv.width, H = cv.height;
      var music = document.getElementById('music');

      // Theme: Schrift + Farben; bei Theme-Wechsel neu lesen
      var font, colors;
      function readTheme() {
        var cs = getComputedStyle(document.documentElement);
        var get = function (k, d) { return cs.getPropertyValue(k).trim() || d; };
        font = get('--theme-font-display', '"DM Sans", system-ui, sans-serif');
        colors = [get('--theme-accent', '#f2b705'), get('--theme-text', '#e8e0f0'), get('--theme-accent-2', get('--theme-accent', '#f2b705'))];
      }
      function loadFont() {   // Canvas lädt Webfonts nicht von selbst
        try { return document.fonts.load('800 80px ' + font, '?'); } catch (e) { return Promise.resolve(); }
      }
      readTheme();
      window.addEventListener('themechange', function () { readTheme(); loadFont(); });

      var marks = [], hero = null, spawnAcc = 0;
      function rnd(a, b) { return a + Math.random() * (b - a); }
      function spawn(t, big) {
        var depth = Math.pow(Math.random(), 1.6);                 // 0 = fern/klein, 1 = nah/groß
        var size = big ? 420 : 14 + depth * 92;
        marks.push({
          x: big ? W * rnd(0.42, 0.58) : rnd(-0.02, 1.02) * W, y: H + size * 0.7,
          size: size, speed: big ? 230 : 60 + depth * 260, born: t,
          sway: rnd(8, 26) * (0.4 + depth), phase: rnd(0, 6.28), spin: rnd(-0.25, 0.25), rot: rnd(-0.25, 0.25),
          col: big ? 0 : (Math.random() < 0.55 ? 1 : Math.random() < 0.5 ? 0 : 2),
          alpha: big ? 1 : 0.35 + depth * 0.65, depth: depth
        });
        marks.sort(function (a, b) { return a.size - b.size; });  // kleine (ferne) zuerst zeichnen
      }

      function rate(t) {   // Fragezeichen pro Sekunde: anschwellen, oben halten, zum Ende auslaufen
        var up = Math.min(1, t / 3), down = 1 - Math.max(0, (t - (DUR - 1.8)) / 1.8);
        return (8 + 52 * up) * Math.max(0, down) * DENS;
      }

      var start = null, last = 0;
      function frame(now) {
        if (start === null) start = now;
        var t = (now - start) / 1000, dt = Math.min(0.05, t - last); last = t;
        spawnAcc += rate(t) * dt;
        while (spawnAcc >= 1) { spawn(t, false); spawnAcc--; }
        if (!hero && t > DUR * 0.55) { spawn(t, true); hero = true; }

        var stage = t < DUR ? 1 : Math.max(0, 1 - (t - DUR) / FADE);
        g.clearRect(0, 0, W, H);
        g.textAlign = 'center'; g.textBaseline = 'middle';
        for (var i = marks.length - 1; i >= 0; i--) {
          var m = marks[i], age = t - m.born;
          m.y -= m.speed * dt; m.rot += m.spin * dt;
          if (m.y < -m.size) { marks.splice(i, 1); continue; }
        }
        for (var j = 0; j < marks.length; j++) {
          var q = marks[j], a = t - q.born;
          var pop = Math.min(1, a / 0.35), s = q.size * (0.4 + 0.6 * (1 - Math.pow(1 - pop, 3)) + 0.08 * Math.sin(Math.min(1, a / 0.35) * Math.PI));
          // weich ausblenden zum oberen Rand (nie hart abschneiden)
          var edge = Math.min(1, Math.max(0, (q.y + q.size * 0.5) / (H * 0.18)));
          g.save();
          g.translate(q.x + Math.sin(a * 1.7 + q.phase) * q.sway, q.y);
          g.rotate(q.rot + Math.sin(a * 2.1 + q.phase) * 0.12);
          g.globalAlpha = q.alpha * edge * stage * pop;
          g.font = '800 ' + Math.round(s) + 'px ' + font;
          g.shadowColor = colors[0]; g.shadowBlur = q.depth * 22 + (q.col === 0 ? 10 : 0);
          g.lineWidth = Math.max(1.5, s * 0.045); g.strokeStyle = 'rgba(0,0,0,0.55)';
          g.strokeText('?', 0, 0);
          g.fillStyle = colors[q.col];
          g.fillText('?', 0, 0);
          g.restore();
        }
        // Musik zum Ende weich ausblenden (Quelle wird danach ausgeblendet)
        if (music && t > DUR - 0.8 && !music.muted) {
          var base = parseFloat(music.getAttribute('data-volume')) || 1, f = parseFloat(p.get('volume'));
          base *= isNaN(f) ? 1 : f;
          if (typeof window.__SOUND_LEVEL__ === 'number') base *= window.__SOUND_LEVEL__;
          try { music.volume = Math.max(0, base * Math.min(1, (DUR + FADE - t) / (0.8 + FADE))); } catch (e) { /* egal */ }
        }
        if (t < DUR + FADE + 0.1) requestAnimationFrame(frame);
        else { g.clearRect(0, 0, W, H); try { music.pause(); } catch (e) { /* egal */ } }
      }

      // Start, sobald stinger-ready Schrift und Musik geladen hat (gleichzeitig mit dem Ton)
      function go() {
        if (document.documentElement.classList.contains('stinger-loading')) { setTimeout(go, 30); return; }
        requestAnimationFrame(frame);
      }
      if (document.fonts) Promise.race([loadFont(), new Promise(function (r) { setTimeout(r, 1500); })]).then(go, go); else go();
    })();
  </script>
</body>
</html>
