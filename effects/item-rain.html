<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Item Rain</title>
  <style>
    /* Party-Regen in 3D (js/item-rain-3d.js, three.js r128): ?kind=sushi|duck|balloon|car, ?outfit= (Enten: none|thw|police|fire|batman|superman|mix|random), ?by= Chat-Name (sein !outfit regnet zu einem Drittel mit),
       ?model= (Autos: mix = je Regen 6 zufällige echte Modelle aus dem Mix, oder ein Modell-Schlüssel aus tools/car-gallery),
       ?duration=Millisekunden (Standard 22000), ?count=Anzahl (Standard 120).
       Sushi: Fress-Ente nur, wenn der Admin sie für den Tenant freigeschaltet hat (window.__FEATURES__ enthält
       „sushi-eater“, /admin/users); ?eater=0 aus, ?eater=<Outfit> oder <Chat-Name> (dessen !outfit),
       sonst das !outfit des Auslösers (?by=), sonst des Kanalinhabers;
       ?eat=Stücke bis zum Platzen (Standard 25).
       Autos: Fahrer-Ente nur mit Freischaltung „bmw-driver“ (+ „ducks“); ?driver=0 aus, ?driver=<Outfit> oder <Chat-Name>.
       Saug-Ente nach jedem Regen (außer Ballons) mit Freischaltung „duck-vacuum“ (+ „ducks“); ?vacuum=0 aus, ?vacuum=<Outfit> oder <Chat-Name>.
       ?kind=mix: Sushi, Enten und Autos gemischt (für !saugen, braucht „ducks“).
       Startet beim Laden – in OBS „Shutdown source when not visible“ an. */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
    canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  </style>
</head>
<body>
  <canvas id="gl" width="1920" height="1080" aria-hidden="true"></canvas>
  <script src="../js/vendor/three-r128.min.js"></script>
  <script src="../js/rubber-duck.js"></script>
  <script src="../js/rubber-duck-outfits.js"></script>
  <script src="../api/fx/ducks/custom.js"></script>
  <script src="../js/vendor/three-r128-GLTFLoader.js"></script>
  <script src="../js/glb-fix.js"></script>
  <script src="../js/toy-cars.js"></script>
  <script src="../api/fx/cars/custom.js"></script>
  <script src="../js/item-rain-3d.js"></script>
  <script>
    (function () {
      'use strict';
      var params = new URLSearchParams(location.search);
      function hasFeat(k) { return (window.__FEATURES__ || []).indexOf(k) >= 0; }
      var reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
      // Autos (car, mix): erst echte Modelle laden (js/toy-cars.js), dann starten; ohne Modelle keine Autos
      var wantsCars = ['car', 'mix'].indexOf(params.get('kind')) >= 0 && window.ToyCars && ToyCars.ready;
      if (wantsCars) ToyCars.ready({ model: params.get('model'), count: params.get('kind') === 'mix' ? 3 : 4 }).then(go, go);
      else go();
      function go() {
      if (wantsCars && !ToyCars.MODELS.length && params.get('kind') === 'car') params.set('kind', 'sushi');
      window.ItemRain3D.start({
        // Enten nur mit Freischaltung „ducks“ (sonst Sushi statt Enten)
        kind: ['duck', 'balloon', 'car', 'mix'].indexOf(params.get('kind')) >= 0 && (['duck', 'mix'].indexOf(params.get('kind')) < 0 || hasFeat('ducks')) ? params.get('kind') : 'sushi',
        model: params.get('model') || 'mix',
        // Enten-Outfit: none, thw, police, fire, batman, superman oder mix (zufällig je Ente)
        outfit: params.get('outfit') || 'none',
        // ?by= wer den Regen ausgelöst hat: mit !outfit gewähltes Outfit regnet zu einem Drittel mit
        mine: window.RubberDuck && RubberDuck.viewerOutfit ? RubberDuck.viewerOutfit(params.get('by')) : null,
        canvas: document.getElementById('gl'),
        duration: Math.max(6000, parseInt(params.get('duration'), 10) || 22000),
        count: Math.max(5, parseInt(params.get('count'), 10) || (params.get('kind') === 'balloon' ? 60 : 120)) * (reduceMotion ? 0.4 : 1),
        // etwas größer als die hängenden Weihnachtskugeln (~64 px)
        size: 72,
        reduceMotion: reduceMotion,
        // Fress-Ente beim Sushi-Regen: sammelt ein, frisst sich voll, platzt
        eater: !hasFeat('ducks') || !hasFeat('sushi-eater') || params.get('eater') === '0' ? false
          : (params.get('eater') && params.get('eater') !== '1' ? params.get('eater') : true),
        // Fahrer-Ente beim BMW-Regen: springt in ein Auto und fährt weg (driver= wie eater=)
        driver: !hasFeat('ducks') || !hasFeat('bmw-driver') || params.get('driver') === '0' ? false
          : (params.get('driver') && params.get('driver') !== '1' ? params.get('driver') : true),
        // Saug-Ente: räumt nach dem Regen alles Liegengebliebene weg (vacuum= wie eater=)
        vacuum: !hasFeat('ducks') || !hasFeat('duck-vacuum') || params.get('vacuum') === '0' ? false
          : (params.get('vacuum') && params.get('vacuum') !== '1' ? params.get('vacuum') : true),
        owner: window.__TWITCH_CHANNEL__ || '',
        eat: parseInt(params.get('eat'), 10) || 25
      });
      }
    })();
  </script>
</body>
</html>
